ea es mantener el trabajo ruidoso fuera del contexto del padre. Una búsqueda amplia o una expedición larga de lectura de archivos produce páginas de tool results, la mayoría relevantes solo hasta encontrar la respuesta. Si corre dentro del padre, todo eso se queda en el contexto del padre por el resto de la sesión. Si corre dentro de un subagente, el ruido llena una ventana desechable en su lugar, y solo el reporte final llega al contexto del padre. Ese reporte es una fuente secundaria : el padre recibe el relato del subagente sobre lo que encontró, no los resultados en bruto, así que cualquier cosa que el reporte deje fuera queda invisible para el padre. Los subagentes además corren en paralelo: un padre puede lanzar varios a la vez sobre piezas de trabajo independientes. Uso Los resultados del grep me están reventando el contexto. Lanza un subagente para la búsqueda: va a quemar su propia ventana de contexto con el ruido y te va a reportar de vuelta los dos paths que en realidad necesitas.","salientes":["agent","tool-call","session","context-window","tool-result","handoff","context","secondary-source"],"entrantes":2},{"termino":"Human-in-the-loop","slug":"human-in-the-loop","seccion":"Sección 7 — Patrones de trabajo","descripcion":"Patrón en que uno o más humanos acompañan al agente durante la sesión: revisando, redirigiendo o colaborando en tiempo real.","html":"\u003cp>Patrón de trabajo en el que uno o más humanos acompañan al \u003ca class=\"x\" data-slug=\"agent\" href=\"?term=agent\">agente\u003c/a> durante la \u003ca class=\"x\" data-slug=\"session\" href=\"?term=session\">sesión\u003c/a>: revisando, redirigiendo o colaborando en tiempo real. El humano está presente y comprometido, no solo autorizando acciones puntuales.\u003c/p>\n\u003cp>El contraste es con el trabajo \u003ca class=\"x\" data-slug=\"afk\" href=\"?term=afk\">AFK\u003c/a>, donde el agente corre sin supervisión y tú evalúas el resultado después. El human-in-the-loop consiste en atajar los problemas mientras todavía son baratos: ves al agente tomar el archivo equivocado, malinterpretar el requerimiento o meterse en un camino sin salida, y lo corriges en una frase, en vez de descubrir veinte minutos de trabajo confiado construido sobre ese error. Los agentes no saben de forma confiable cuándo se desviaron; dejados solos, tienden a seguir adelante en vez de detenerse a preguntar.\u003c/p>\n\u003cp>Qué patrón conviene depende del trabajo. Las tareas bien especificadas, de bajo riesgo y fáciles de verificar calzan con AFK. Las tareas ambiguas, irreversibles, o donde te costaría revisar el resultado terminado (una migración de esquema, una decisión de diseño delicada, cualquier cosa que toque producción) calzan con quedarse en el loop. El criterio, en esencia: qué tan cara es una decisión equivocada, y qué tan tarde la detectarías.\u003c/p>\n\u003cp>Parte del trabajo es in-the-loop por naturaleza, porque tus reacciones son el insumo. El \u003ca class=\"x\" data-slug=\"grilling\" href=\"?term=grilling\">grilling\u003c/a> solo funciona contigo ahí para responder las preguntas; el \u003ca class=\"x\" data-slug=\"prototyping\" href=\"?term=prototyping\">prototipado\u003c/a> solo funciona contigo ahí para reaccionar al artefacto.\u003c/p>\n\u003cp>Quedarse en el loop cuesta tu atención, que es el recurso escaso. Parte de mejorar con agentes es sacar cada vez más trabajo del loop de forma segura: con planes, \u003ca class=\"x\" data-slug=\"automated-check\" href=\"?term=automated-check\">verificaciones automatizadas\u003c/a> y \u003ca class=\"x\" data-slug=\"human-review\" href=\"?term=human-review\">revisión humana\u003c/a> al final, en vez de supervisión durante todo el proceso.\u003c/p>\n\u003cdiv class=\"block\">\u003cp class=\"lbl\">Uso\u003c/p>\n\u003cp>&quot;¿Corro esto AFK durante la noche?&quot;\u003c/p>\n\u003cp>&quot;No, es una migración de esquema: mantenlo human-in-the-loop. Quiero ver cada paso y corregir el rumbo si elige la columna equivocada para el backfill.&quot;\u003c/p>\n\n\u003c/div>","texto":"Patrón en que uno o más humanos acompañan al agente durante la sesión: revisando, redirigiendo o colaborando en tiempo real. Patrón de trabajo en el que uno o más humanos acompañan al agente durante la sesión : revisando, redirigiendo o colaborando en tiempo real. El humano está presente y comprometido, no solo autorizando acciones puntuales. El contraste es con el trabajo AFK , donde el agente corre sin supervisión y tú evalúas el resultado después. El human-in-the-loop consiste en atajar los problemas mientras todavía son baratos: ves al agente tomar el archivo equivocado, malinterpretar el requerimiento o meterse en un camino sin salida, y lo corriges en una frase, en vez de descubrir veinte minutos de trabajo confiado construido sobre ese error. Los agentes no saben de forma confiable cuándo se desviaron; dejados solos, tienden a seguir adelante en vez de detenerse a preguntar. Qué patrón conviene depende del trabajo. Las tareas bien especificadas, de bajo riesgo y fáciles de verificar calzan con AFK. Las tareas ambiguas, irreversibles, o donde te costaría revisar el resultado terminado (una migración de esquema, una decisión de diseño delicada, cualquier cosa que toque producción) calzan con quedarse en el loop. El criterio, en esencia: qué tan cara es una decisión equivocada, y qué tan tarde la detectarías. Parte del trabajo es in-the-loop por naturaleza, porque tus reacciones son el insumo. El grilling solo funciona contigo ahí para responder las preguntas; el prototipado solo funciona contigo ahí para reaccionar al artefacto. Quedarse en el loop cuesta tu atención, que es el recurso escaso. Parte de mejorar con agentes es sacar cada vez más trabajo del loop de forma segura: con planes, verificaciones automatizadas y revisión humana al final, en vez de supervisión durante todo el proceso. Uso ¿Corro esto AFK durante la noche? No, es una migración de esquema: mantenlo human-in-the-loop. Quiero ver cada paso y corregir el rumbo si elige la columna equivocada para el backfill.","salientes":["agent","session","afk","grilling","prototyping","automated-check","human-review"],"entrantes":6},{"termino":"AFK","slug":"afk","seccion":"Sección 7 — Patrones de trabajo","descripcion":"Patrón en que el usuario inicia una sesión y deja al agente corriendo sin supervisión (lejos del teclado).","html":"\u003cp>Lejos del teclado. Patrón de trabajo en que el usuario inicia una \u003ca class=\"x\" data-slug=\"session\" href=\"?term=session\">sesión\u003c/a> y deja que el \u003ca class=\"x\" data-slug=\"agent\" href=\"?term=agent\">agente\u003c/a> corra sin supervisión. Es el multiplicador de throughput del \u003ca class=\"x\" data-slug=\"ai\" href=\"?term=ai\">AI coding\u003c/a>: muchas sesiones AFK pueden correr en paralelo mientras duermes, comes o trabajas en otra cosa. Para ser seguro, suele requerir un \u003ca class=\"x\" data-slug=\"permission-mode\" href=\"?term=permission-mode\">modo de permisos\u003c/a> permisivo más \u003ca class=\"x\" data-slug=\"sandbox\" href=\"?term=sandbox\">sandboxing\u003c/a>.\u003c/p>\n\u003cp>Cuando no estás ahí, el agente maneja la ambigüedad de otra forma. Mientras miras, una decisión ambigua aparece como pregunta y tú la respondes; una vez que te fuiste, el agente elige un default y sigue adelante, y cada decisión posterior se construye sobre esa suposición. La falla característica es volver y encontrar horas de trabajo terminado y confiado, construido sobre una decisión equivocada tomada en los primeros diez minutos. El trabajo no es descuidado: es coherente, solo que coherente sobre lo que no correspondía.\u003c/p>\n\u003cp>Como no puedes dar input durante la corrida, dalo antes y después. Antes: resuelve la ambigüedad de entrada (una sesión de \u003ca class=\"x\" data-slug=\"grilling\" href=\"?term=grilling\">grilling\u003c/a>, una \u003ca class=\"x\" data-slug=\"spec\" href=\"?term=spec\">spec\u003c/a> escrita) para dejarle al agente menos vacíos que llenar solo. Durante: las \u003ca class=\"x\" data-slug=\"automated-check\" href=\"?term=automated-check\">verificaciones automatizadas\u003c/a> y la \u003ca class=\"x\" data-slug=\"automated-review\" href=\"?term=automated-review\">revisión automatizada\u003c/a> reemplazan la atención que no le estás dando, fallando rápido en lo que se puede detectar de forma mecánica. Después: la corrida termina en algo revisable, un PR, no cambios ya mergeados. AFK no elimina la \u003ca class=\"x\" data-slug=\"human-review\" href=\"?term=human-review\">revisión humana\u003c/a>: la posterga entera hasta el final, y por eso lo que llega al final tiene que valer la pena revisarlo. Esto también explica por qué el \u003ca class=\"x\" data-slug=\"ax\" href=\"?term=ax\">AX\u003c/a> importa más en las corridas AFK: sin nadie mirando, el entorno es el único apoyo que tiene el agente.\u003c/p>\n\u003cdiv class=\"block avoid\">\u003cp class=\"lbl\">Evita\u003c/p>\u003cp>&quot;background agent&quot; (agente en segundo plano): centra la máquina (&quot;corriendo en segundo plano&quot;) en vez del patrón humano (&quot;el usuario se fue&quot;). AFK nombra el hecho que importa: que el usuario no está mirando.\u003c/p>\u003c/div>\n\u003cdiv class=\"block\">\u003cp class=\"lbl\">Uso\u003c/p>\n\u003cp>&quot;Estoy corriendo esto AFK: tres agentes en sandbox sobre el refactor, reviso los PR en la mañana.&quot;\u003c/p>\n\u003cp>&quot;¿\u003ca class=\"x\" data-slug=\"agent-mode\" href=\"?term=agent-mode\">Bypass permissions\u003c/a>?&quot;\u003c/p>\n\u003cp>&quot;Sí, \u003ca class=\"x\" data-slug=\"filesystem\" href=\"?term=filesystem\">sistema de archivos\u003c/a> de solo lectura, sin red.&quot;\u003c/p>\n\n\u003c/div>","texto":"Patrón en que el usuario inicia una sesión y deja al agente corriendo sin supervisión (lejos del teclado). Lejos del teclado. Patrón de trabajo en que el usuario inicia una sesión y deja que el agente corra sin supervisión. Es el multiplicador de throughput del AI coding : muchas sesiones AFK pueden correr en paralelo mientras duermes, comes o trabajas en otra cosa. Para ser seguro, suele requerir un modo de permisos permisivo más sandboxing . Cuando no estás ahí, el agente maneja la ambigüedad de otra forma. Mientras miras, una decisión ambigua aparece como pregunta y tú la respondes; una vez que te fuiste, el agente elige un default y sigue adelante, y cada decisión posterior se construye sobre esa suposición. La falla característica es volver y encontrar horas de trabajo terminado y confiado, construido sobre una decisión equivocada tomada en los primeros diez minutos. El trabajo no es descuidado: es coherente, solo que coherente sobre lo que no correspondía. Como no puedes dar input durante la corrida, dalo antes y después. Antes: resuelve la ambigüedad de entrada (una sesión de grilling , una spec escrita) para dejarle al agente menos vacíos que llenar solo. Durante: las verificaciones automatizadas y la revisión automatizada reemplazan la atención que no le estás dando, fallando rápido en lo que se puede detectar de forma mecánica. Después: la corrida termina en algo revisable, un PR, no cambios ya mergeados. AFK no elimina la revisión humana : la posterga entera hasta el final, y por eso lo que llega al final tiene que valer la pena revisarlo. Esto también explica por qué el AX importa más en las corridas AFK: sin nadie mirando, el entorno es el único apoyo que tiene el agente. Evita background agent (agente en segundo plano): centra la máquina ( corriendo en segundo plano ) en vez del patrón humano ( el usuario se fue ). AFK nombra el hecho que importa: que el usuario no está mirando. Uso Estoy corriendo esto AFK: tres agentes en sandbox sobre el refactor, reviso los PR en la mañana. ¿ Bypass permissions ? Sí, sistema de archivos de solo lectura, sin red.","salientes":["session","agent","ai","permission-mode","sandbox","grilling","spec","automated-check","automated-review","human-review","ax","agent-mode","filesystem"],"entrantes":10},{"termino":"Automated check","slug":"automated-check","seccion":"Sección 7 — Patrones de trabajo","descripcion":"Verificación determinista que corre en el entorno: tests, tipos, lints, build, hooks de pre-commit. Pasa o falla, sin juicio.","html":"\u003cp>Una verificación determinista que corre en el \u003ca class=\"x\" data-slug=\"environment\" href=\"?term=environment\">entorno\u003c/a>: tests, chequeos de tipos, lints, build, hooks de pre-commit. Pasa o falla, sin juicio. Es la señal desde la que un \u003ca class=\"x\" data-slug=\"agent\" href=\"?term=agent\">agente\u003c/a> puede autocorregirse sin involucrar a nadie más. Un test inestable (flaky) es una verificación rota, no una no-verificación; las verificaciones automatizadas son deterministas \u003cem>por diseño\u003c/em>.\u003c/p>\n\u003cp>La autocorrección funciona como un loop. El agente hace un cambio, corre la verificación como \u003ca class=\"x\" data-slug=\"tool-call\" href=\"?term=tool-call\">tool call\u003c/a>, y la salida de la falla llega a su \u003ca class=\"x\" data-slug=\"context-window\" href=\"?term=context-window\">ventana de contexto\u003c/a>: un error de tipos con archivo y línea, una aserción fallida con el valor esperado y el real. Eso le basta al agente para arreglar el problema y volver a correr la verificación, una y otra vez hasta que pase, sin ningún humano en el loop. El determinismo es lo que hace confiable el loop: el mismo código siempre produce el mismo veredicto, así que un pase significa algo. Una verificación inestable envenena esto: el agente &quot;arregla&quot; código que estaba bien, o reintenta pasando por encima de una falla real.\u003c/p>\n\u003cp>Por eso las buenas verificaciones son gran parte del \u003ca class=\"x\" data-slug=\"ax\" href=\"?term=ax\">AX\u003c/a> de un codebase. Un agente en un repo con tipos estrictos, una suite de tests rápida y un linter atrapa la mayoría de sus propios errores antes de que tú los veas; un agente en un repo sin nada de eso envía lo que sea que produzca. La diferencia importa más en las corridas \u003ca class=\"x\" data-slug=\"afk\" href=\"?term=afk\">AFK\u003c/a>, donde las verificaciones son la única comprobación que ocurre durante la corrida. Pero una verificación solo atrapa lo que afirma: verificaciones en verde significan que las propiedades afirmadas se cumplen, no que el código esté bien. Los vacíos con forma de juicio son para lo que existen la \u003ca class=\"x\" data-slug=\"automated-review\" href=\"?term=automated-review\">revisión automatizada\u003c/a> y la \u003ca class=\"x\" data-slug=\"human-review\" href=\"?term=human-review\">revisión humana\u003c/a>.\u003c/p>\n\u003cdiv class=\"block avoid\">\u003cp class=\"lbl\">Evita\u003c/p>\u003cp>&quot;feedback loop&quot; / &quot;backpressure&quot;: las dos mezclan las verificaciones con la revisión. \u003cem>Evita:\u003c/em> &quot;test&quot;: los tests son verificaciones automatizadas, pero no toda verificación automatizada es un test.\u003c/p>\u003c/div>\n\u003cdiv class=\"block\">\u003cp class=\"lbl\">Uso\u003c/p>\n\u003cp>&quot;El agente sigue enviando código roto en las corridas AFK.&quot;\u003c/p>\n\u003cp>&quot;¿Qué verificaciones automatizadas están conectadas al \u003ca class=\"x\" data-slug=\"sandbox\" href=\"?term=sandbox\">sandbox\u003c/a>?&quot;\u003c/p>\n\u003cp>&quot;Solo los tests unitarios.&quot;\u003c/p>\n\u003cp>&quot;Agrega typecheck y lint: se va a autocorregir con eso antes de que el PR siquiera llegue.&quot;\u003c/p>\n\n\u003c/div>","texto":"Verificación determinista que corre en el entorno: tests, tipos, lints, build, hooks de pre-commit. Pasa o falla, sin juicio. Una verificación determinista que corre en el entorno : tests, chequeos de tipos, lints, build, hooks de pre-commit. Pasa o falla, sin juicio. Es la señal desde la que un agente puede autocorregirse sin involucrar a nadie más. Un test inestable (flaky) es una verificación rota, no una no-verificación; las verificaciones automatizadas son deterministas por diseño . La autocorrección funciona como un loop. El agente hace un cambio, corre la verificación como tool call , y la salida de la falla llega a su ventana de contexto : un error de tipos con archivo y línea, una aserción fallida con el valor esperado y el real. Eso le basta al agente para arreglar el problema y volver a correr la verificación, una y otra vez hasta que pase, sin ningún humano en el loop. El determinismo es lo que hace confiable el loop: el mismo código siempre produce el mismo veredicto, así que un pase significa algo. Una verificación inestable envenena esto: el agente arregla código que estaba bien, o reintenta pasando por encima de una falla real. Por eso las buenas verificaciones son gran parte del AX de un codebase. Un agente en un repo con tipos estrictos, una suite de tests rápida y un linter atrapa la mayoría de sus propios errores antes de que tú los veas; un agente en un repo sin nada de eso envía lo que sea que produzca. La diferencia importa más en las corridas AFK , donde las verificaciones son la única comprobación que ocurre durante la corrida. Pero una verificación solo atrapa lo que afirma: verificaciones en verde significan que las propiedades afirmadas se cumplen, no que el código esté bien. Los vacíos con forma de juicio son para lo que existen la revisión automatizada y la revisión humana . Evita feedback loop / backpressure : las dos mezclan las verificaciones con la revisión. Evita: test : los tests son verificaciones automatizadas, pero no toda verificación automatizada es un test. Uso El agente sigue enviando código roto en las corridas AFK. ¿Qué verificaciones automatizadas están conectadas al sandbox ? Solo los tests unitarios. Agrega typecheck y lint: se va a autocorregir con eso antes de que el PR siquiera llegue.","salientes":["environment","agent","tool-call","context-window","ax","afk","automated-review","human-review","sandbox"],"entrantes":7},{"termino":"Automated review","slug":"automated-review","seccion":"Sección 7 — Patrones de trabajo","descripcion":"Un agente que revisa el trabajo de otro agente, a menudo con otro modelo o system prompt. No determinista: forma un juicio.","html":"\u003cp>Un \u003ca class=\"x\" data-slug=\"agent\" href=\"?term=agent\">agente\u003c/a> que revisa el trabajo de otro agente, muchas veces con otro \u003ca class=\"x\" data-slug=\"model\" href=\"?term=model\">modelo\u003c/a> o \u003ca class=\"x\" data-slug=\"system-prompt\" href=\"?term=system-prompt\">system prompt\u003c/a>. No determinista: forma un juicio. Corre en cualquier parte: antes de mergear un PR, después sobre el historial de commits, o a mitad de sesión como \u003ca class=\"x\" data-slug=\"subagent\" href=\"?term=subagent\">subagente\u003c/a>. Un LLM-as-judge en CI es revisión automatizada, no una \u003ca class=\"x\" data-slug=\"automated-check\" href=\"?term=automated-check\">verificación automatizada\u003c/a>; lo que decide la categoría es lo que la aserción \u003cem>hace\u003c/em>, no dónde corre.\u003c/p>\n\u003cp>Lo que hace que funcione es la separación del agente que hizo el trabajo. Pedirle al agente que escribió el código que revise su propio trabajo rinde muy poco: la \u003ca class=\"x\" data-slug=\"session\" href=\"?term=session\">sesión\u003c/a> que produjo el bug también contiene el razonamiento que lo produjo, y el agente lee sus propias conclusiones como si fueran confirmación. Un revisor con una \u003ca class=\"x\" data-slug=\"context-window\" href=\"?term=context-window\">ventana de contexto\u003c/a> nueva no tiene ese apego: ve el diff como lo vería un desconocido, que es de lo que depende la revisión. Un modelo distinto o un system prompt específico para revisar afinan esto aún más: puntos ciegos distintos, y un system prompt acotado a lo que de verdad te importa (seguridad, contratos de API, rendimiento) en vez de un vago &quot;busca problemas&quot;.\u003c/p>\n\u003cp>Encaja entre las otras capas de revisión. Las verificaciones automatizadas son deterministas y atrapan lo que se puede afirmar mecánicamente; la \u003ca class=\"x\" data-slug=\"human-review\" href=\"?term=human-review\">revisión humana\u003c/a> es cara y la que peor escala. La revisión automatizada queda en el medio: atrapa problemas con forma de juicio (un nombre de función engañoso, un caso borde que se escapó) a costo de máquina. Como no es determinista, puede pasar cosas por alto y marcar falsos problemas; trátala como un filtro que sube el piso antes de que la mire un humano, no como una puerta que lo reemplaza.\u003c/p>\n\u003cdiv class=\"block avoid\">\u003cp class=\"lbl\">Evita\u003c/p>\u003cp>&quot;AI review&quot; / &quot;agent review&quot;: demasiado vago para distinguirla del propio agente que hizo el trabajo.\u003c/p>\u003c/div>\n\u003cdiv class=\"block\">\u003cp class=\"lbl\">Uso\u003c/p>\n\u003cp>&quot;Nos están llegando demasiados PR malos desde las corridas \u003ca class=\"x\" data-slug=\"afk\" href=\"?term=afk\">AFK\u003c/a>.&quot;\u003c/p>\n\u003cp>&quot;Agrega un paso de revisión automatizada antes de mergear: otro modelo, system prompt aparte, acotado a seguridad y cambios de contrato.&quot;\u003c/p>\n\n\u003c/div>","texto":"Un agente que revisa el trabajo de otro agente, a menudo con otro modelo o system prompt. No determinista: forma un juicio. Un agente que revisa el trabajo de otro agente, muchas veces con otro modelo o system prompt . No determinista: forma un juicio. Corre en cualquier parte: antes de mergear un PR, después sobre el historial de commits, o a mitad de sesión como subagente . Un LLM-as-judge en CI es revisión automatizada, no una verificación automatizada ; lo que decide la categoría es lo que la aserción hace , no dónde corre. Lo que hace que funcione es la separación del agente que hizo el trabajo. Pedirle al agente que escribió el código que revise su propio trabajo rinde muy poco: la sesión que produjo el bug también contiene el razonamiento que lo produjo, y el agente lee sus propias conclusiones como si fueran confirmación. Un revisor con una ventana de contexto nueva no tiene ese apego: ve el diff como lo vería un desconocido, que es de lo que depende la revisión. Un modelo distinto o un system prompt específico para revisar afinan esto aún más: puntos ciegos distintos, y un system prompt acotado a lo que de verdad te importa (seguridad, contratos de API, rendimiento) en vez de un vago busca problemas . Encaja entre las otras capas de revisión. Las verificaciones automatizadas son deterministas y atrapan lo que se puede afirmar mecánicamente; la revisión humana es cara y la que peor escala. La revisión automatizada queda en el medio: atrapa problemas con forma de juicio (un nombre de función engañoso, un caso borde que se escapó) a costo de máquina. Como no es determinista, puede pasar cosas por alto y marcar falsos problemas; trátala como un filtro que sube el piso antes de que la mire un humano, no como una puerta que lo reemplaza. Evita AI review / agent review : demasiado vago para distinguirla del propio agente que hizo el trabajo. Uso Nos están llegando demasiados PR malos desde las corridas AFK . Agrega un paso de revisión automatizada antes de mergear: otro modelo, system prompt aparte, acotado a seguridad y cambios de contrato.","salientes":["agent","model","system-prompt","subagent","automated-check","session","context-window","human-review","afk"],"entrantes":4},{"termino":"Human review","slug":"human-review","seccion":"Sección 7 — Patrones de trabajo","descripcion":"El usuario lee el código que produjo el agente y forma un juicio sobre él. Leer el diff cuenta; leer el resumen no.","html":"\u003cp>El usuario lee el código que produjo el \u003ca class=\"x\" data-slug=\"agent\" href=\"?term=agent\">agente\u003c/a> y forma un juicio sobre él. Leer el diff o los archivos cambiados cuenta; leer la \u003cem>descripción\u003c/em> que el agente da de lo que hizo, no: la narración no es el artefacto. La descripción es una \u003ca class=\"x\" data-slug=\"secondary-source\" href=\"?term=secondary-source\">fuente secundaria\u003c/a>, escrita por la parte que está siendo revisada; el diff es la \u003ca class=\"x\" data-slug=\"primary-source\" href=\"?term=primary-source\">fuente primaria\u003c/a>, y revisar significa leerlo.\u003c/p>\n\u003cp>Los agentes suben el volumen de código producido, así que la revisión se vuelve el cuello de botella. Una idea útil es apilar distintas estrategias de revisión. Las \u003ca class=\"x\" data-slug=\"automated-check\" href=\"?term=automated-check\">verificaciones automatizadas\u003c/a> atrapan las fallas mecánicas, la \u003ca class=\"x\" data-slug=\"automated-review\" href=\"?term=automated-review\">revisión automatizada\u003c/a> atrapa las que se pueden describir, y la revisión humana queda reservada para lo que solo tú puedes juzgar: si el cambio es el cambio correcto, si el enfoque calza con el codebase, si esto debería existir siquiera.\u003c/p>\n\u003cp>Revisar también sale más barato temprano. Leer un plan antes de que empiece el trabajo, o un diff chico a mitad de camino, toma minutos; excavar una rama terminada después de una corrida \u003ca class=\"x\" data-slug=\"afk\" href=\"?term=afk\">AFK\u003c/a> toma más. Dónde ubicas el punto de control de revisión es una decisión de \u003ca class=\"x\" data-slug=\"human-in-the-loop\" href=\"?term=human-in-the-loop\">human-in-the-loop\u003c/a>, no una idea de último momento.\u003c/p>\n\u003cdiv class=\"block avoid\">\u003cp class=\"lbl\">Evita\u003c/p>\u003cp>&quot;code review&quot; a secas: es ambiguo entre humana y automatizada.\u003c/p>\u003c/div>\n\u003cdiv class=\"block\">\u003cp class=\"lbl\">Uso\u003c/p>\n\u003cp>&quot;Hice revisión humana de la salida del AFK.&quot;\u003c/p>\n\u003cp>&quot;¿Leíste el diff o solo el resumen?&quot;\u003c/p>\n\u003cp>&quot;El diff. El resumen decía que borró código muerto: resultó que la función se llamaba desde un archivo generado.&quot;\u003c/p>\n\n\u003c/div>","texto":"El usuario lee el código que produjo el agente y forma un juicio sobre él. Leer el diff cuenta; leer el resumen no. El usuario lee el código que produjo el agente y forma un juicio sobre él. Leer el diff o los archivos cambiados cuenta; leer la descripción que el agente da de lo que hizo, no: la narración no es el artefacto. La descripción es una fuente secundaria , escrita por la parte que está siendo revisada; el diff es la fuente primaria , y revisar significa leerlo. Los agentes suben el volumen de código producido, así que la revisión se vuelve el cuello de botella. Una idea útil es apilar distintas estrategias de revisión. Las verificaciones automatizadas atrapan las fallas mecánicas, la revisión automatizada atrapa las que se pueden describir, y la revisión humana queda reservada para lo que solo tú puedes juzgar: si el cambio es el cambio correcto, si el enfoque calza con el codebase, si esto debería existir siquiera. Revisar también sale más barato temprano. Leer un plan antes de que empiece el trabajo, o un diff chico a mitad de camino, toma minutos; excavar una rama terminada después de una corrida AFK toma más. Dónde ubicas el punto de control de revisión es una decisión de human-in-the-loop , no una idea de último momento. Evita code review a secas: es ambiguo entre humana y automatizada. Uso Hice revisión humana de la salida del AFK. ¿Leíste el diff o solo el resumen? El diff. El resumen decía que borró código muerto: resultó que la función se llamaba desde un archivo generado.","salientes":["agent","secondary-source","primary-source","automated-check","automated-review","afk","human-in-the-loop"],"entrantes":5},{"termino":"Vibe coding","slug":"vibe-coding","seccion":"Sección 7 — Patrones de trabajo","descripcion":"Patrón en que el usuario acepta el código del agente sin revisión humana. El diff se trata como una caja opaca.","html":"\u003cp>Patrón de trabajo en que el usuario acepta el código del \u003ca class=\"x\" data-slug=\"agent\" href=\"?term=agent\">agente\u003c/a> sin \u003ca class=\"x\" data-slug=\"human-review\" href=\"?term=human-review\">revisión humana\u003c/a>. El diff se trata como una caja opaca: lo que importa es si el programa se comporta bien, no qué hay adentro. La \u003ca class=\"x\" data-slug=\"automated-review\" href=\"?term=automated-review\">revisión automatizada\u003c/a> y las \u003ca class=\"x\" data-slug=\"automated-check\" href=\"?term=automated-check\">verificaciones automatizadas\u003c/a> pueden seguir corriendo; el vibe coding no dice nada sobre ninguna de las dos.\u003c/p>\n\u003cp>El término viene de Andrej Karpathy, que lo \u003ca href=\"https://x.com/karpathy/status/1886192184808149383\">acuñó a comienzos de 2025\u003c/a>: &quot;te entregas por completo a la vibra&quot; y &quot;te olvidas de que el código siquiera existe&quot;: describes lo que quieres, aceptas lo que vuelve, y lo juzgas corriéndolo.\u003c/p>\n\u003cp>El vibe coding cambia inspección por velocidad. Leer diffs suele ser el paso más lento del trabajo con agentes, así que sacarlo elimina el principal cuello de botella. Para código cuyas fallas son baratas (\u003ca class=\"x\" data-slug=\"prototyping\" href=\"?term=prototyping\">prototipos\u003c/a>, scripts de una sola vez, tools internas) es un intercambio razonable. El riesgo escala con la vida útil del código y lo que hay en juego.\u003c/p>\n\u003cp>El costo llega después. Los cambios hechos con vibe coding se acumulan en un codebase que nadie ha leído, y lo único que se revisó fue el comportamiento, así que todo lo que el comportamiento no deja ver (un secreto escrito en los logs, un caso borde que falta, un manejo de datos silenciosamente equivocado) se envía sin que nadie lo note. La primera vez que alguien depura el sistema es la primera vez que alguien lee el código. Sin revisión humana, la única puerta que atraviesa el código es la que dejen las verificaciones automatizadas que sigan corriendo: tests, tipos, revisión automatizada.\u003c/p>\n\u003cdiv class=\"block avoid\">\u003cp class=\"lbl\">Evita\u003c/p>\u003cp>usar &quot;vibe coding&quot; como sinónimo de &quot;AI coding de baja calidad&quot;: el término nombra la postura frente a la revisión, no el código resultante.\u003c/p>\u003c/div>\n\u003cdiv class=\"block\">\u003cp class=\"lbl\">Uso\u003c/p>\n\u003cp>&quot;¿Leíste qué cambió en el flujo de auth?&quot;\u003c/p>\n\u003cp>&quot;Lo hice con vibe coding: el login sigue funcionando, eso fue todo lo que revisé.&quot;\u003c/p>\n\u003cp>&quot;Lee el diff antes de hacer push: hacer vibe coding en auth es justo la forma en que se filtran secretos a los logs.&quot;\u003c/p>\n\n\u003c/div>","texto":"Patrón en que el usuario acepta el código del agente sin revisión humana. El diff se trata como una caja opaca. Patrón de trabajo en que el usuario acepta el código del agente sin revisión humana . El diff se trata como una caja opaca: lo que importa es si el programa se comporta bien, no qué hay adentro. La revisión automatizada y las verificaciones automatizadas pueden seguir corriendo; el vibe coding no dice nada sobre ninguna de las dos. El término viene de Andrej Karpathy, que lo acuñó a comienzos de 2025 : te entregas por completo a la vibra y te olvidas de que el código siquiera existe : describes lo que quieres, aceptas lo que vuelve, y lo juzgas corriéndolo. El vibe coding cambia inspección por velocidad. Leer diffs suele ser el paso más lento del trabajo con agentes, así que sacarlo elimina el principal cuello de botella. Para código cuyas fallas son baratas ( prototipos , scripts de una sola vez, tools internas) es un intercambio razonable. El riesgo escala con la vida útil del código y lo que hay en juego. El costo llega después. Los cambios hechos con vibe coding se acumulan en un codebase que nadie ha leído, y lo único que se revisó fue el comportamiento, así que todo lo que el comportamiento no deja ver (un secreto escrito en los logs, un caso borde que falta, un manejo de datos silenciosamente equivocado) se envía sin que nadie lo note. La primera vez que alguien depura el sistema es la primera vez que alguien lee el código. Sin revisión humana, la única puerta que atraviesa el código es la que dejen las verificaciones automatizadas que sigan corriendo: tests, tipos, revisión automatizada. Evita usar vibe coding como sinónimo de AI coding de baja calidad : el término nombra la postura frente a la revisión, no el código resultante. Uso ¿Leíste qué cambió en el flujo de auth? Lo hice con vibe coding: el login sigue funcionando, eso fue todo lo que revisé. Lee el diff antes de hacer push: hacer vibe coding en auth es justo la forma en que se filtran secretos a los logs.","salientes":["agent","human-review","automated-review","automated-check","prototyping"],"entrantes":0},{"termino":"Design concept","slug":"design-concept","seccion":"Sección 7 — Patrones de trabajo","descripcion":"La comprensión compartida de lo que se está construyendo, en común entre usuario y agente, pero separada de cualquier material.","html":"\u003cp>La comprensión compartida de lo que se está construyendo, en común entre el usuario y el \u003ca class=\"x\" data-slug=\"agent\" href=\"?term=agent\">agente\u003c/a>, pero separada de cualquier material. Es un término de Brooks (\u003cem>The Design of Design\u003c/em>): la conversación, los \u003ca class=\"x\" data-slug=\"handoff-artifact\" href=\"?term=handoff-artifact\">artefactos de handoff\u003c/a> y el código son todos materiales que intentan capturar o alcanzar el concepto de diseño, pero ninguno de ellos \u003cem>es\u003c/em> el concepto de diseño. La calidad del concepto de diseño se siente en la calidad de la conversación que lo construyó.\u003c/p>\n\u003cp>El término nombra la brecha detrás de una frustración conocida: el agente escribe exactamente lo que pediste y aun así está mal. La causa habitual es que tú no habías terminado de definir lo que querías. El concepto de diseño no estaba terminado en tu propia cabeza: tu prompt capturó las partes que ya tenías resueltas, y quedó en silencio sobre las que no. El agente llenó esos silencios con sus propios supuestos, porque no había nada con qué alinearse. Nada falló. No había un concepto de diseño compartido, porque todavía no existía uno completo para compartir.\u003c/p>\n\u003cp>Sabes que un concepto de diseño está compartido de la misma forma que con un colega: la otra parte empieza a responder preguntas que todavía no le has hecho, de la forma en que tú las responderías. Hasta ese punto, el trabajo es conversación (el \u003ca class=\"x\" data-slug=\"grilling\" href=\"?term=grilling\">grilling\u003c/a> es la versión deliberada), y escribir una \u003ca class=\"x\" data-slug=\"spec\" href=\"?term=spec\">spec\u003c/a> demasiado pronto solo captura el desalineamiento en un material más duradero. El concepto de diseño también se mueve a medida que aprendes; los materiales van atrás, y por eso una spec fiel al entendimiento de la semana pasada puede seguir descarrilando la sesión de esta semana.\u003c/p>\n\u003cdiv class=\"block\">\u003cp class=\"lbl\">Uso\u003c/p>\n\u003cp>&quot;Escribe exactamente lo que pedí y aun así está mal.&quot;\u003c/p>\n\u003cp>&quot;Todavía no comparten un concepto de diseño: está llenando los vacíos con supuestos. Sigan conversando hasta que cancelaciones, reembolsos y cumplimiento parcial queden alineados entre ustedes antes de dejar que escriba una spec.&quot;\u003c/p>\n\n\u003c/div>","texto":"La comprensión compartida de lo que se está construyendo, en común entre usuario y agente, pero separada de cualquier material. La comprensión compartida de lo que se está construyendo, en común entre el usuario y el agente , pero separada de cualquier material. Es un término de Brooks ( The Design of Design ): la conversación, los artefactos de handoff y el código son todos materiales que intentan capturar o alcanzar el concepto de diseño, pero ninguno de ellos es el concepto de diseño. La calidad del concepto de diseño se siente en la calidad de la conversación que lo construyó. El término nombra la brecha detrás de una frustración conocida: el agente escribe exactamente lo que pediste y aun así está mal. La causa habitual es que tú no habías terminado de definir lo que querías. El concepto de diseño no estaba terminado en tu propia cabeza: tu prompt capturó las partes que ya tenías resueltas, y quedó en silencio sobre las que no. El agente llenó esos silencios con sus propios supuestos, porque no había nada con qué alinearse. Nada falló. No había un concepto de diseño compartido, porque todavía no existía uno completo para compartir. Sabes que un concepto de diseño está compartido de la misma forma que con un colega: la otra parte empieza a responder preguntas que todavía no le has hecho, de la forma en que tú las responderías. Hasta ese punto, el trabajo es conversación (el grilling es la versión deliberada), y escribir una spec demasiado pronto solo captura el desalineamiento en un material más duradero. El concepto de diseño también se mueve a medida que aprendes; los materiales van atrás, y por eso una spec fiel al entendimiento de la semana pasada puede seguir descarrilando la sesión de esta semana. Uso Escribe exactamente lo que pedí y aun así está mal. Todavía no comparten un concepto de diseño: está llenando los vacíos con supuestos. Sigan conversando hasta que cancelaciones, reembolsos y cumplimiento parcial queden alineados entre ustedes antes de dejar que escriba una spec.","salientes":["agent","handoff-artifact","grilling","spec"],"entrantes":1},{"termino":"Grilling","slug":"grilling","seccion":"Sección 7 — Patrones de trabajo","descripcion":"Técnica para desarrollar un concepto de diseño: el agente entrevista al usuario a la manera socrática, una decisión a la vez.","html":"\u003cp>Técnica para desarrollar un \u003ca class=\"x\" data-slug=\"design-concept\" href=\"?term=design-concept\">concepto de diseño\u003c/a> con un \u003ca class=\"x\" data-slug=\"agent\" href=\"?term=agent\">agente\u003c/a>: el agente entrevista al usuario a la manera socrática, una decisión a la vez, proponiendo una respuesta recomendada para cada una. Frena el apuro por llegar a un plan terminado: no se escribe ningún \u003ca class=\"x\" data-slug=\"handoff-artifact\" href=\"?term=handoff-artifact\">artefacto de handoff\u003c/a> hasta que el concepto se estabiliza.\u003c/p>\n\u003cp>La técnica existe porque los agentes llenan los vacíos en silencio. Si le pides escribir una \u003ca class=\"x\" data-slug=\"spec\" href=\"?term=spec\">spec\u003c/a> a partir de un prompt de dos líneas, el agente no se detiene en las decisiones que no tomaste: elige defaults y los escribe igual. El resultado se ve completo, y las suposiciones son indistinguibles de las decisiones reales, así que las descubres tarde: en la revisión, o cuando la funcionalidad construida maneja un caso borde de una forma que tú nunca elegiste. El grilling invierte esto: en vez de suponer, el agente tiene que preguntar.\u003c/p>\n\u003cp>Es una técnica de \u003ca class=\"x\" data-slug=\"human-in-the-loop\" href=\"?term=human-in-the-loop\">human-in-the-loop\u003c/a>: tus respuestas son el insumo. Cuando una pregunta no se puede responder en conversación (tendrías que ver la cosa) cámbiate a \u003ca class=\"x\" data-slug=\"prototyping\" href=\"?term=prototyping\">prototipado\u003c/a>.\u003c/p>\n\u003cdiv class=\"block\">\u003cp class=\"lbl\">Uso\u003c/p>\n\u003cp>&quot;Se fue directo a escribir la spec y le erró a la lógica de cancelación.&quot;\u003c/p>\n\u003cp>&quot;Hazle grilling primero: que te pregunte por las cancelaciones parciales, los reembolsos y los tiempos antes de comprometer nada en el documento. Sale más barato resolverlo en la conversación que en el código.&quot;\u003c/p>\n\n\u003c/div>","texto":"Técnica para desarrollar un concepto de diseño: el agente entrevista al usuario a la manera socrática, una decisión a la vez. Técnica para desarrollar un concepto de diseño con un agente : el agente entrevista al usuario a la manera socrática, una decisión a la vez, proponiendo una respuesta recomendada para cada una. Frena el apuro por llegar a un plan terminado: no se escribe ningún artefacto de handoff hasta que el concepto se estabiliza. La técnica existe porque los agentes llenan los vacíos en silencio. Si le pides escribir una spec a partir de un prompt de dos líneas, el agente no se detiene en las decisiones que no tomaste: elige defaults y los escribe igual. El resultado se ve completo, y las suposiciones son indistinguibles de las decisiones reales, así que las descubres tarde: en la revisión, o cuando la funcionalidad construida maneja un caso borde de una forma que tú nunca elegiste. El grilling invierte esto: en vez de suponer, el agente tiene que preguntar. Es una técnica de human-in-the-loop : tus respuestas son el insumo. Cuando una pregunta no se puede responder en conversación (tendrías que ver la cosa) cámbiate a prototipado . Uso Se fue directo a escribir la spec y le erró a la lógica de cancelación. Hazle grilling primero: que te pregunte por las cancelaciones parciales, los reembolsos y los tiempos antes de comprometer nada en el documento. Sale más barato resolverlo en la conversación que en el código.","salientes":["design-concept","agent","handoff-artifact","spec","human-in-the-loop","prototyping"],"entrantes":4},{"termino":"Prototyping","slug":"prototyping","seccion":"Sección 7 — Patrones de trabajo","descripcion":"Hacer que el agente construya una versión rápida y tosca cuando la conversación no alcanza y hace falta un artefacto real.","html":"\u003cp>Hacer que el \u003ca class=\"x\" data-slug=\"agent\" href=\"?term=agent\">agente\u003c/a> construya una versión rápida y tosca de algo, para cuando la conversación es demasiado poco fiel y hace falta un artefacto real sobre el cual hablar.\u003c/p>\n\u003cp>El \u003ca class=\"x\" data-slug=\"grilling\" href=\"?term=grilling\">grilling\u003c/a> resuelve decisiones de diseño en la conversación. Conversar es barato, pero es de baja fidelidad: hay preguntas que no se pueden responder con palabras (cómo se siente una interacción, si la forma de una API es cómoda en código real que la llama, si el layout funciona con tamaños de datos reales). La entrevista llega a una pregunta y tu respuesta honesta es &quot;no sé, tendría que verlo&quot;. Pasado ese punto, la discusión da vueltas. En vez de eso, haz que el agente construya la cosa, míralo, y vuelve a la conversación con una respuesta.\u003c/p>\n\u003cp>Los agentes bajan el costo de construir, y eso es lo que hace esto práctico. Una versión tosca que antes tomaba un día armar ahora toma minutos, así que vale la pena hacerlo de rutina. Es una técnica de \u003ca class=\"x\" data-slug=\"human-in-the-loop\" href=\"?term=human-in-the-loop\">human-in-the-loop\u003c/a>: el prototipo está ahí para que tú reacciones.\u003c/p>\n\u003cp>Por lo general no te quedas en una sola mirada. Itera con el prototipo (reacciona, pide un cambio, reacciona de nuevo) para que cada ronda resuelva otra decisión contra el artefacto real, a una fidelidad más alta de la que permite la conversación.\u003c/p>\n\u003cp>Un prototipo no tiene que ser tosco de punta a punta. Puedes construir a calidad de producción las piezas que en realidad estás evaluando, para que cuando la decisión quede tomada, el componente o la API a la que reaccionaste se pueda trasladar al codebase real. Esto convierte al prototipado en material esencial para que la \u003ca class=\"x\" data-slug=\"spec\" href=\"?term=spec\">spec\u003c/a> lo referencie.\u003c/p>\n\u003cdiv class=\"block\">\u003cp class=\"lbl\">Uso\u003c/p>\n\u003cp>&quot;Llevamos media hora discutiendo si el wizard debería ser una página o tres pasos.&quot;\u003c/p>\n\u003cp>&quot;Las palabras no lo van a resolver: haz que el agente prototipe las dos. Las recorremos con clics y lo sabemos en cinco minutos.&quot;\u003c/p>\n\n\u003c/div>","texto":"Hacer que el agente construya una versión rápida y tosca cuando la conversación no alcanza y hace falta un artefacto real. Hacer que el agente construya una versión rápida y tosca de algo, para cuando la conversación es demasiado poco fiel y hace falta un artefacto real sobre el cual hablar. El grilling resuelve decisiones de diseño en la conversación. Conversar es barato, pero es de baja fidelidad: hay preguntas que no se pueden responder con palabras (cómo se siente una interacción, si la forma de una API es cómoda en código real que la llama, si el layout funciona con tamaños de datos reales). La entrevista llega a una pregunta y tu respuesta honesta es no sé, tendría que verlo . Pasado ese punto, la discusión da vueltas. En vez de eso, haz que el agente construya la cosa, míralo, y vuelve a la conversación con una respuesta. Los agentes bajan el costo de construir, y eso es lo que hace esto práctico. Una versión tosca que antes tomaba un día armar ahora toma minutos, así que vale la pena hacerlo de rutina. Es una técnica de human-in-the-loop : el prototipo está ahí para que tú reacciones. Por lo general no te quedas en una sola mirada. Itera con el prototipo (reacciona, pide un cambio, reacciona de nuevo) para que cada ronda resuelva otra decisión contra el artefacto real, a una fidelidad más alta de la que permite la conversación. Un prototipo no tiene que ser tosco de punta a punta. Puedes construir a calidad de producción las piezas que en realidad estás evaluando, para que cuando la decisión quede tomada, el componente o la API a la que reaccionaste se pueda trasladar al codebase real. Esto convierte al prototipado en material esencial para que la spec lo referencie. Uso Llevamos media hora discutiendo si el wizard debería ser una página o tres pasos. Las palabras no lo van a resolver: haz que el agente prototipe las dos. Las recorremos con clics y lo sabemos en cinco minutos.","salientes":["agent","grilling","human-in-the-loop","spec"],"entrantes":3},{"termino":"DX","slug":"dx","seccion":"Sección 7 — Patrones de trabajo","descripcion":"Developer experience: qué tan fácil el codebase y su toolchain le hacen a los humanos trabajar bien: docs, feedback, errores.","html":"\u003cp>Developer experience: qué tan fácil un codebase y su toolchain le hacen a los humanos hacer bien su trabajo. Un buen DX es feedback rápido, mensajes de error claros, documentación que responde la pregunta que de verdad tienes, y un setup que funciona a la primera. El término es muy anterior al AI coding; está en este diccionario sobre todo como contraste para el \u003ca class=\"x\" data-slug=\"ax\" href=\"?term=ax\">AX\u003c/a>.\u003c/p>\n\u003cp>El DX es la interacción entre el humano y el codebase, nada más. La diferencia principal entre las dos audiencias es que los humanos son \u003ca class=\"x\" data-slug=\"stateful\" href=\"?term=stateful\">con estado\u003c/a> y los agentes son \u003ca class=\"x\" data-slug=\"stateless\" href=\"?term=stateless\">sin estado\u003c/a>. Un humano aprende el codebase una vez y carga con ese conocimiento todos los días después, y por eso un DX malo se sobrevive: rodean un CI lento agrupando sus pushes, rodean la falta de docs preguntando una vez en Slack, rodean una estructura confusa memorizando dónde vive cada cosa. Los workarounds se acumulan, y un equipo termina siendo productivo en un codebase que se les resiste.\u003c/p>\n\u003cp>Los \u003ca class=\"x\" data-slug=\"agent\" href=\"?term=agent\">agentes\u003c/a> enfrentan el mismo codebase sin nada de esa acumulación. Sin estado entre \u003ca class=\"x\" data-slug=\"session\" href=\"?term=session\">sesiones\u003c/a>, un agente reaprende el codebase desde cero cada vez: se beneficia de la suite de tests rápida y de los mensajes de error claros, pero todo lo que descubrió ayer desaparece a menos que haya quedado escrito en el \u003ca class=\"x\" data-slug=\"environment\" href=\"?term=environment\">entorno\u003c/a>, que el agente solo percibe a través de los \u003ca class=\"x\" data-slug=\"tool-result\" href=\"?term=tool-result\">tool results\u003c/a>. Esa es la brecha que nombra el AX: las partes del DX que sobreviven cuando el desarrollador es un agente, más preocupaciones que los humanos no tienen, como mantener libre la \u003ca class=\"x\" data-slug=\"context-window\" href=\"?term=context-window\">ventana de contexto\u003c/a>.\u003c/p>\n\u003cp>La superposición significa que invertir en DX suele mejorar el AX gratis: tipos estrictos, tests rápidos y una estructura predecible ayudan a las dos audiencias. La divergencia significa que no siempre: un doc de onboarding hermoso ayuda a un humano durante una semana y a un agente nada, a menos que sea alcanzable desde \u003ca class=\"x\" data-slug=\"agentsmd\" href=\"?term=agentsmd\">AGENTS.md\u003c/a>.\u003c/p>\n\u003cdiv class=\"block\">\u003cp class=\"lbl\">Uso\u003c/p>\n\u003cp>&quot;Nuestro DX está bien: los nuevos ingresos son productivos en una semana.&quot;\u003c/p>\n\u003cp>&quot;Productivos porque alguien se sienta con ellos esa semana. El agente no tiene esa semana; revisa el AX por separado.&quot;\u003c/p>\n\n\u003c/div>","texto":"Developer experience: qué tan fácil el codebase y su toolchain le hacen a los humanos trabajar bien: docs, feedback, errores. Developer experience: qué tan fácil un codebase y su toolchain le hacen a los humanos hacer bien su trabajo. Un buen DX es feedback rápido, mensajes de error claros, documentación que responde la pregunta que de verdad tienes, y un setup que funciona a la primera. El término es muy anterior al AI coding; está en este diccionario sobre todo como contraste para el AX . El DX es la interacción entre el humano y el codebase, nada más. La diferencia principal entre las dos audiencias es que los humanos son con estado y los agentes son sin estado . Un humano aprende el codebase una vez y carga con ese conocimiento todos los días después, y por eso un DX malo se sobrevive: rodean un CI lento agrupando sus pushes, rodean la falta de docs preguntando una vez en Slack, rodean una estructura confusa memorizando dónde vive cada cosa. Los workarounds se acumulan, y un equipo termina siendo productivo en un codebase que se les resiste. Los agentes enfrentan el mismo codebase sin nada de esa acumulación. Sin estado entre sesiones , un agente reaprende el codebase desde cero cada vez: se beneficia de la suite de tests rápida y de los mensajes de error claros, pero todo lo que descubrió ayer desaparece a menos que haya quedado escrito en el entorno , que el agente solo percibe a través de los tool results . Esa es la brecha que nombra el AX: las partes del DX que sobreviven cuando el desarrollador es un agente, más preocupaciones que los humanos no tienen, como mantener libre la ventana de contexto . La superposición significa que invertir en DX suele mejorar el AX gratis: tipos estrictos, tests rápidos y una estructura predecible ayudan a las dos audiencias. La divergencia significa que no siempre: un doc de onboarding hermoso ayuda a un humano durante una semana y a un agente nada, a menos que sea alcanzable desde AGENTS.md . Uso Nuestro DX está bien: los nuevos ingresos son productivos en una semana. Productivos porque alguien se sienta con ellos esa semana. El agente no tiene esa semana; revisa el AX por separado.","salientes":["ax","stateful","stateless","agent","session","environment","tool-result","context-window","agentsmd"],"entrantes":1},{"termino":"AX","slug":"ax","seccion":"Sección 7 — Patrones de trabajo","descripcion":"Agent experience: qué tan bien está preparado el entorno para que un agente trabaje bien: verificaciones, arquitectura, contexto.","html":"\u003cp>Agent experience: qué tan bien está preparado el \u003ca class=\"x\" data-slug=\"environment\" href=\"?term=environment\">entorno\u003c/a> para que un \u003ca class=\"x\" data-slug=\"agent\" href=\"?term=agent\">agente\u003c/a> trabaje bien en un codebase. Es la contraparte del \u003ca class=\"x\" data-slug=\"dx\" href=\"?term=dx\">DX\u003c/a> del lado del agente. Cuando el mismo agente rinde bien en un repo y mal en otro (mismo \u003ca class=\"x\" data-slug=\"model\" href=\"?term=model\">modelo\u003c/a>, mismo \u003ca class=\"x\" data-slug=\"harness\" href=\"?term=harness\">harness\u003c/a>), la diferencia suele ser el AX. El instinto es culpar al modelo o reescribir el prompt; el arreglo está más seguido en el repo.\u003c/p>\n\u003cp>Un buen AX tiene tres dimensiones principales:\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Dimensión\u003c/th>\n\u003cth>Cómo se ve un buen AX\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Verificaciones automatizadas\u003c/td>\n\u003ctd>\u003ca class=\"x\" data-slug=\"automated-check\" href=\"?term=automated-check\">Verificaciones automatizadas\u003c/a> rápidas y deterministas (tipos, tests, lints) desde las que el agente puede autocorregirse sin un humano\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Arquitectura\u003c/td>\n\u003ctd>Un codebase que el agente puede recorrer sin leerlo todo: estructura predecible, mucho comportamiento detrás de interfaces chicas, nombres que dicen qué hace cada cosa\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Contexto libre\u003c/td>\n\u003ctd>\u003ca class=\"x\" data-slug=\"agentsmd\" href=\"?term=agentsmd\">AGENTS.md\u003c/a>, \u003ca class=\"x\" data-slug=\"skill\" href=\"?term=skill\">skills\u003c/a> y \u003ca class=\"x\" data-slug=\"tool\" href=\"?term=tool\">tools\u003c/a> mantenidos livianos, para que la mayor parte de la \u003ca class=\"x\" data-slug=\"context-window\" href=\"?term=context-window\">ventana de contexto\u003c/a> quede disponible para la tarea y el agente se mantenga en la \u003ca class=\"x\" data-slug=\"smart-zone\" href=\"?term=smart-zone\">smart zone\u003c/a> en vez de ahogarse\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>El AX y el DX se superponen (buenas verificaciones y una arquitectura limpia ayudan a las dos audiencias), pero divergen. Los humanos toleran el conocimiento tribal, un CI lento y &quot;pregúntale a Sarah sobre el módulo de facturación&quot;; los agentes no pueden. Los agentes no se benefician de los tooltips del IDE ni de dashboards bonitos; necesitan las fallas como texto en un \u003ca class=\"x\" data-slug=\"tool-result\" href=\"?term=tool-result\">tool result\u003c/a>. Un codebase puede tener buen DX y mal AX.\u003c/p>\n\u003cdiv class=\"block avoid\">\u003cp class=\"lbl\">Evita\u003c/p>\u003cp>tratar el AX como sinónimo de DX: las audiencias necesitan inversiones distintas.\u003c/p>\u003c/div>\n\u003cdiv class=\"block\">\u003cp class=\"lbl\">Uso\u003c/p>\n\u003cp>&quot;El agente escribe código excelente en el repo de la API y basura en el frontend.&quot;\u003c/p>\n\u003cp>&quot;El repo de la API tiene tipos estrictos y una suite de tests rápida; el frontend no tiene ninguna de las dos cosas y cuarenta skills siempre cargadas. Eso es una brecha de AX, no un problema de modelo.&quot;\u003c/p>\n\n\u003c/div>","texto":"Agent experience: qué tan bien está preparado el entorno para que un agente trabaje bien: verificaciones, arquitectura, contexto. Agent experience: qué tan bien está preparado el entorno para que un agente trabaje bien en un codebase. Es la contraparte del DX del lado del agente. Cuando el mismo agente rinde bien en un repo y mal en otro (mismo modelo , mismo harness ), la diferencia suele ser el AX. El instinto es culpar al modelo o reescribir el prompt; el arreglo está más seguido en el repo. Un buen AX tiene tres dimensiones principales: Dimensión Cómo se ve un buen AX Verificaciones automatizadas Verificaciones automatizadas rápidas y deterministas (tipos, tests, lints) desde las que el agente puede autocorregirse sin un humano Arquitectura Un codebase que el agente puede recorrer sin leerlo todo: estructura predecible, mucho comportamiento detrás de interfaces chicas, nombres que dicen qué hace cada cosa Contexto libre AGENTS.md , skills y tools mantenidos livianos, para que la mayor parte de la ventana de contexto quede disponible para la tarea y el agente se mantenga en la smart zone en vez de ahogarse El AX y el DX se superponen (buenas verificaciones y una arquitectura limpia ayudan a las dos audiencias), pero divergen. Los humanos toleran el conocimiento tribal, un CI lento y pregúntale a Sarah sobre el módulo de facturación ; los agentes no pueden. Los agentes no se benefician de los tooltips del IDE ni de dashboards bonitos; necesitan las fallas como texto en un tool result . Un codebase puede tener buen DX y mal AX. Evita tratar el AX como sinónimo de DX: las audiencias necesitan inversiones distintas. Uso El agente escribe código excelente en el repo de la API y basura en el frontend. El repo de la API tiene tipos estrictos y una suite de tests rápida; el frontend no tiene ninguna de las dos cosas y cuarenta skills siempre cargadas. Eso es una brecha de AX, no un problema de modelo.","salientes":["environment","agent","dx","model","harness","automated-check","agentsmd","skill","tool","context-window","smart-zone","tool-result"],"entrantes":4}]};

  const $ = (s) => document.querySelector(s);
  const list = $("#list"),
    main = $("#main"),
    q = $("#q"),
    tally = $("#tally");

  const plano = (s) =>
    s
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .toLowerCase();

  DATOS.entradas.forEach((e) => {
    e.k = plano(e.termino + " " + e.texto);
    e.kt = plano(e.termino);
  });
  const porSlug = new Map(DATOS.entradas.map((e) => [e.slug, e]));

  let activo = null,
    filtradas = DATOS.entradas,
    marcado = -1;

  $("#brandSub").textContent =
    DATOS.entradas.length +
    " términos · " +
    DATOS.secciones.length +
    " secciones";

  function pintarLista() {
    const vis = new Set(filtradas.map((e) => e.slug));
    list.innerHTML = "";
    if (!filtradas.length) {
      const d = document.createElement("p");
      d.className = "empty";
      d.textContent =
        "Sin resultados. Prueba con otra palabra, o con el término en inglés.";
      list.appendChild(d);
      return;
    }
    DATOS.secciones.forEach((sec) => {
      const suyos = sec.terminos
        .map((t) => porSlug.get(t))
        .filter((e) => e && vis.has(e.slug));
      if (!suyos.length) return;
      const g = document.createElement("div");
      g.className = "grp";
      const h = document.createElement("h2");
      h.textContent = sec.titulo;
      g.appendChild(h);
      suyos.forEach((e) => {
        const b = document.createElement("button");
        b.type = "button";
        b.dataset.slug = e.slug;
        if (activo && e.slug === activo.slug)
          b.setAttribute("aria-current", "true");
        const n = document.createElement("span");
        n.textContent = e.termino;
        const c = document.createElement("span");
        c.className = "n";
        c.textContent = e.entrantes || "";
        c.title = e.entrantes + " entradas la referencian";
        b.append(n, c);
        b.addEventListener("click", () => abrir(e.slug, true));
        g.appendChild(b);
      });
      list.appendChild(g);
    });
  }

  function buscar() {
    const t = plano(q.value.trim());
    marcado = -1;
    if (!t) {
      filtradas = DATOS.entradas;
      tally.textContent = "";
    } else {
      filtradas = DATOS.entradas.filter((e) => e.k.includes(t));
      filtradas.sort(
        (a, b) => (b.kt.includes(t) ? 1 : 0) - (a.kt.includes(t) ? 1 : 0)
      );
      const n = filtradas.length;
      tally.textContent =
        n === 0 ? "sin resultados" : n === 1 ? "1 término" : n + " términos";
    }
    pintarLista();
  }

  function portada() {
    activo = null;
    document.title = "Diccionario de AI Coding";
    $("#barTitle").textContent = "Diccionario de AI Coding";
    const top = [...DATOS.entradas]
      .sort((a, b) => b.entrantes - a.entrantes)
      .slice(0, 3)
      .map((e) => e.termino)
      .join(" · ");
    const filas = DATOS.secciones
      .map((s) => {
        const suyos = s.terminos.map((t) => porSlug.get(t)).filter(Boolean);
        const cab = [...suyos]
          .sort((a, b) => b.entrantes - a.entrantes)
          .slice(0, 3)
          .map((e) => e.termino)
          .join(" · ");
        return (
          '<div><span class="t">' +
          esc(s.titulo) +
          '</span><span class="top">' +
          esc(cab) +
          '</span><span class="c">' +
          suyos.length +
          "</span></div>"
        );
      })
      .join("");
    main.innerHTML =
      '<div class="home"><h2>El vocabulario del AI coding, en español</h2>' +
      "<p>Los títulos se mantienen en inglés a propósito: es la palabra que vas a encontrar en la documentación y en tu harness, así que es la llave con la que vas a buscar. El buscador mira también el cuerpo de las definiciones, así que escribir <em>ventana</em> encuentra <em>Context window</em>.</p>" +
      "<p>Los términos más referenciados por el resto del diccionario son " +
      esc(top) +
      ". Buen lugar para partir.</p>" +
      '<div class="secs">' +
      filas +
      "</div>" +
      '<p class="keys"><kbd>/</kbd> buscar · <kbd>↑</kbd><kbd>↓</kbd> recorrer · <kbd>Enter</kbd> abrir · <kbd>Esc</kbd> limpiar</p>' +
      pie() +
      "</div>";
  }

  function pie() {
    return (
      '<p class="foot">Traducción al español de <a href="https://github.com/mattpocock/dictionary-of-ai-coding" target="_blank" rel="noopener">dictionary-of-ai-coding</a>, de Matt Pocock. ' +
      "Los términos técnicos se mantienen en inglés según el glosario de la edición. Uso interno.</p>"
    );
  }

  function esc(s) {
    return String(s).replace(
      /[&<>"]/g,
      (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]
    );
  }

  function abrir(slug, cerrar) {
    const e = porSlug.get(slug);
    if (!e) return portada();
    activo = e;
    document.title = e.termino + " · Diccionario de AI Coding";
    $("#barTitle").textContent = e.termino;
    const chips = e.salientes.map((s) => porSlug.get(s)).filter(Boolean);
    main.innerHTML =
      '<article class="entry"><p class="eyebrow">' +
      esc(e.seccion) +
      "</p>" +
      "<h2>" +
      esc(e.termino) +
      "</h2>" +
      '<p class="lede">' +
      esc(e.descripcion) +
      "</p>" +
      '<div class="body">' +
      e.html +
      "</div>" +
      (chips.length
        ? '<div class="also"><h3>Ver también</h3><div class="chips">' +
          chips
            .map(
              (c) =>
                '<button type="button" data-slug="' +
                esc(c.slug) +
                '">' +
                esc(c.termino) +
                "</button>"
            )
            .join("") +
          "</div></div>"
        : "") +
      pie() +
      "</article>";
    main.querySelectorAll("[data-slug]").forEach((el) =>
      el.addEventListener("click", (ev) => {
        ev.preventDefault();
        abrir(el.dataset.slug, true);
      })
    );
    const u = new URL(location.href);
    u.searchParams.set("term", slug);
    history.replaceState(null, "", u);
    pintarLista();
    main.scrollIntoView({ block: "start" });
    if (cerrar) document.body.classList.remove("open");
  }

  q.addEventListener("input", buscar);

  document.addEventListener("keydown", (ev) => {
    if (ev.key === "/" && document.activeElement !== q) {
      ev.preventDefault();
      q.focus();
      q.select();
      return;
    }
    if (ev.key === "Escape") {
      q.value = "";
      buscar();
      q.blur();
      return;
    }
    if (document.activeElement !== q) return;
    if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
      ev.preventDefault();
      if (!filtradas.length) return;
      marcado =
        ev.key === "ArrowDown"
          ? Math.min(marcado + 1, filtradas.length - 1)
          : Math.max(marcado - 1, 0);
      const b = list.querySelector(
        '[data-slug="' + CSS.escape(filtradas[marcado].slug) + '"]'
      );
      if (b) {
        b.focus();
        b.scrollIntoView({ block: "nearest" });
      }
    }
    if (ev.key === "Enter" && filtradas.length) {
      ev.preventDefault();
      abrir(filtradas[marcado >= 0 ? marcado : 0].slug, true);
    }
  });

  $("#toggle").addEventListener("click", () =>
    document.body.classList.toggle("open")
  );

  buscar();
  const inicial = new URLSearchParams(location.search).get("term");
  if (inicial && porSlug.has(inicial)) abrir(inicial, false);
  else portada();
</script>

</body>
