dedor de los 125K-150K \u003ca class=\"x\" data-slug=\"token\" href=\"?term=token\">tokens\u003c/a>, aunque esto se debate. \u003ca class=\"x\" data-slug=\"clearing\" href=\"?term=clearing\">Limpia\u003c/a> o \u003ca class=\"x\" data-slug=\"compaction\" href=\"?term=compaction\">compacta\u003c/a> cuando la sesión se hincha; no sigas empujando.\u003c/p>\n\u003cp>La caída es gradual, y por eso es fácil pasarla por alto. No hay mensaje de error ni un límite visible: el agente simplemente empieza a rendir un poco peor, y después notablemente peor. Señales comunes: olvida una instrucción que le diste veinte turnos atrás, repite un error que ya había corregido, o afirma algo con total seguridad que el contexto contradice. Como la pendiente es suave, la respuesta habitual es seguir insistiendo y volver a explicar, lo que agrega más contexto y empeora el problema.\u003c/p>\n\u003cp>Las zonas no siguen el límite de la \u003ca class=\"x\" data-slug=\"context-window\" href=\"?term=context-window\">ventana de contexto\u003c/a>. Una sesión puede estar bien metida en la dumb zone con la mayor parte de la ventana todavía libre: el límite es el punto donde el harness se niega a seguir, pero la calidad cae mucho antes de eso. Planifica en función de la smart zone, no de la ventana: el presupuesto práctico para una tarea son los tokens dentro de los cuales el agente rinde bien, no los tokens que técnicamente puede sostener.\u003c/p>\n\u003cp>La smart zone es un presupuesto, y cualquier trabajo ajeno a la tarea lo gasta. Cada tarea que se hace en una sesión consume tokens, así que empezar una segunda tarea en la misma sesión significa empezarla más cerca de la dumb zone. Hacer una sola tarea por sesión le da a cada tarea la parte más aguda de la sesión. Cuando una tarea es más grande que una smart zone completa, divídela: haz \u003ca class=\"x\" data-slug=\"handoff\" href=\"?term=handoff\">handoff\u003c/a> o compacta en un punto de corte natural, y deja que una sesión nueva se encargue de la siguiente parte.\u003c/p>\n\u003cdiv class=\"block\">\u003cp class=\"lbl\">Uso\u003c/p>\n\u003cp>&quot;Resolvió perfecto los primeros tres componentes y destrozó el cuarto.&quot;\u003c/p>\n\u003cp>&quot;Se te acabó la smart zone: mismo modelo, pero ya bien metido en la dumb zone. Compacta y recarga el plan, el siguiente componente va a salir bien.&quot;\u003c/p>\n\n\u003c/div>","texto":"Al inicio de una sesión el agente está agudo y enfocado. Al crecer deriva a una dumb zone: más descuidado, olvidadizo, con más errores. Al inicio de una sesión , el agente está en una smart zone : agudo, enfocado, con buena capacidad de recordar. A medida que la sesión crece, deriva hacia una dumb zone : más descuidado, olvidadizo, con más errores, y más alucinaciones de fidelidad. Mismo modelo , mismo harness : solo hay más contexto . Es el efecto que se siente de la attention degradation . En los modelos de punta, la dumb zone suele empezar alrededor de los 125K-150K tokens , aunque esto se debate. Limpia o compacta cuando la sesión se hincha; no sigas empujando. La caída es gradual, y por eso es fácil pasarla por alto. No hay mensaje de error ni un límite visible: el agente simplemente empieza a rendir un poco peor, y después notablemente peor. Señales comunes: olvida una instrucción que le diste veinte turnos atrás, repite un error que ya había corregido, o afirma algo con total seguridad que el contexto contradice. Como la pendiente es suave, la respuesta habitual es seguir insistiendo y volver a explicar, lo que agrega más contexto y empeora el problema. Las zonas no siguen el límite de la ventana de contexto . Una sesión puede estar bien metida en la dumb zone con la mayor parte de la ventana todavía libre: el límite es el punto donde el harness se niega a seguir, pero la calidad cae mucho antes de eso. Planifica en función de la smart zone, no de la ventana: el presupuesto práctico para una tarea son los tokens dentro de los cuales el agente rinde bien, no los tokens que técnicamente puede sostener. La smart zone es un presupuesto, y cualquier trabajo ajeno a la tarea lo gasta. Cada tarea que se hace en una sesión consume tokens, así que empezar una segunda tarea en la misma sesión significa empezarla más cerca de la dumb zone. Hacer una sola tarea por sesión le da a cada tarea la parte más aguda de la sesión. Cuando una tarea es más grande que una smart zone completa, divídela: haz handoff o compacta en un punto de corte natural, y deja que una sesión nueva se encargue de la siguiente parte. Uso Resolvió perfecto los primeros tres componentes y destrozó el cuarto. Se te acabó la smart zone: mismo modelo, pero ya bien metido en la dumb zone. Compacta y recarga el plan, el siguiente componente va a salir bien.","salientes":["session","agent","hallucination","model","harness","context","attention-degradation","token","clearing","compaction","context-window","handoff"],"entrantes":8},{"termino":"Clearing","slug":"clearing","seccion":"Sección 5 — Handoffs","descripcion":"Terminar la sesión actual y empezar una nueva: el próximo mensaje arranca con una sesión y una ventana de contexto vacías.","html":"\u003cp>Terminar la \u003ca class=\"x\" data-slug=\"session\" href=\"?term=session\">sesión\u003c/a> actual y empezar una nueva. El próximo mensaje arranca con una sesión vacía y una \u003ca class=\"x\" data-slug=\"context-window\" href=\"?term=context-window\">ventana de contexto\u003c/a> vacía. Normalmente lo decide el usuario.\u003c/p>\n\u003cp>La limpieza es la cura para un contexto contaminado. Una sesión acumula de todo: intentos fallidos, caminos equivocados, \u003ca class=\"x\" data-slug=\"tool-result\" href=\"?term=tool-result\">tool results\u003c/a> vencidos, planes abandonados. El \u003ca class=\"x\" data-slug=\"model\" href=\"?term=model\">modelo\u003c/a> vuelve a leer todo eso en cada \u003ca class=\"x\" data-slug=\"turn\" href=\"?term=turn\">turno\u003c/a>, y el historial malo entorpece el trabajo nuevo. Bien avanzada una sesión larga, el \u003ca class=\"x\" data-slug=\"agent\" href=\"?term=agent\">agente\u003c/a> se vuelve más vago y menos obediente: instrucciones que diste con claridad se ignoran, la calidad cae, e insistirle para que mejore no ayuda, porque el ruido que tiene que atravesar sigue en su \u003ca class=\"x\" data-slug=\"context\" href=\"?term=context\">contexto\u003c/a>. Limpiar elimina ese ruido.\u003c/p>\n\u003cp>Limpiar no borra la conversación. La mayoría de los \u003ca class=\"x\" data-slug=\"harness\" href=\"?term=harness\">harnesses\u003c/a> guarda el historial de la sesión en tu computador, así que la transcripción sigue disponible para leerla o retomarla. Lo que desaparece es el estado de trabajo del agente: el modelo es \u003ca class=\"x\" data-slug=\"stateless\" href=\"?term=stateless\">sin estado\u003c/a>, así que la nueva sesión no sabe nada de lo que sabía la anterior. Si la sesión guarda decisiones o avances que la siguiente va a necesitar, haz que el agente escriba primero un \u003ca class=\"x\" data-slug=\"handoff-artifact\" href=\"?term=handoff-artifact\">artefacto de handoff\u003c/a>, y arranca la nueva sesión apuntando a él.\u003c/p>\n\u003cp>Compárala con la \u003ca class=\"x\" data-slug=\"compaction\" href=\"?term=compaction\">compactación\u003c/a>, que resume la sesión dentro del contexto nuevo en vez de empezar vacía. Limpiar es el método más brusco: no se traslada nada, ni siquiera la basura.\u003c/p>\n\u003cdiv class=\"block\">\u003cp class=\"lbl\">Uso\u003c/p>\n\u003cp>&quot;Se quedó dando vueltas en la misma prueba que falla.&quot;\u003c/p>\n\u003cp>&quot;Límpiala: arranca una sesión nueva con el documento del plan y el archivo de la prueba. No vale la pena pelear con el contexto que ya tiene.&quot;\u003c/p>\n\n\u003c/div>","texto":"Terminar la sesión actual y empezar una nueva: el próximo mensaje arranca con una sesión y una ventana de contexto vacías. Terminar la sesión actual y empezar una nueva. El próximo mensaje arranca con una sesión vacía y una ventana de contexto vacía. Normalmente lo decide el usuario. La limpieza es la cura para un contexto contaminado. Una sesión acumula de todo: intentos fallidos, caminos equivocados, tool results vencidos, planes abandonados. El modelo vuelve a leer todo eso en cada turno , y el historial malo entorpece el trabajo nuevo. Bien avanzada una sesión larga, el agente se vuelve más vago y menos obediente: instrucciones que diste con claridad se ignoran, la calidad cae, e insistirle para que mejore no ayuda, porque el ruido que tiene que atravesar sigue en su contexto . Limpiar elimina ese ruido. Limpiar no borra la conversación. La mayoría de los harnesses guarda el historial de la sesión en tu computador, así que la transcripción sigue disponible para leerla o retomarla. Lo que desaparece es el estado de trabajo del agente: el modelo es sin estado , así que la nueva sesión no sabe nada de lo que sabía la anterior. Si la sesión guarda decisiones o avances que la siguiente va a necesitar, haz que el agente escriba primero un artefacto de handoff , y arranca la nueva sesión apuntando a él. Compárala con la compactación , que resume la sesión dentro del contexto nuevo en vez de empezar vacía. Limpiar es el método más brusco: no se traslada nada, ni siquiera la basura. Uso Se quedó dando vueltas en la misma prueba que falla. Límpiala: arranca una sesión nueva con el documento del plan y el archivo de la prueba. No vale la pena pelear con el contexto que ya tiene.","salientes":["session","context-window","tool-result","model","turn","agent","context","harness","stateless","handoff-artifact","compaction"],"entrantes":15},{"termino":"Handoff","slug":"handoff","seccion":"Sección 5 — Handoffs","descripcion":"Trasladar el contexto de un agente de una sesión a otra, sin vuelta atrás. El mecanismo varía: artefacto, compactación, otros.","html":"\u003cp>Trasladar a un \u003ca class=\"x\" data-slug=\"agent\" href=\"?term=agent\">agente\u003c/a> y su \u003ca class=\"x\" data-slug=\"context\" href=\"?term=context\">contexto\u003c/a> de una \u003ca class=\"x\" data-slug=\"session\" href=\"?term=session\">sesión\u003c/a> a otra, sin vuelta atrás. El mecanismo de traslado varía: puede ser un \u003ca class=\"x\" data-slug=\"handoff-artifact\" href=\"?term=handoff-artifact\">artefacto de handoff\u003c/a> escrito, un resumen en memoria (\u003ca class=\"x\" data-slug=\"compaction\" href=\"?term=compaction\">compactación\u003c/a>), u otros. Se distingue de la \u003ca class=\"x\" data-slug=\"clearing\" href=\"?term=clearing\">limpieza\u003c/a>, que no traslada nada. Las razones varían: cambiar de rol (de quien planifica a quien implementa), lanzar una corrida \u003ca class=\"x\" data-slug=\"afk\" href=\"?term=afk\">AFK\u003c/a>, abrir varias sesiones en paralelo, o liberar espacio en la \u003ca class=\"x\" data-slug=\"context-window\" href=\"?term=context-window\">ventana de contexto\u003c/a>.\u003c/p>\n\u003cp>La sesión que recibe arranca con contexto cero: el \u003ca class=\"x\" data-slug=\"model\" href=\"?term=model\">modelo\u003c/a> es \u003ca class=\"x\" data-slug=\"stateless\" href=\"?term=stateless\">sin estado\u003c/a>, y nada de la sesión anterior es visible para la nueva. Lo que la siguiente sesión necesite hay que trasladarlo de forma explícita; todo lo demás se pierde. &quot;Sin vuelta atrás&quot; es la restricción que moldea el traslado: la sesión nueva no puede preguntarle a la vieja qué quiso decir, así que el material trasladado tiene que valerse por sí solo.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Mecanismo\u003c/th>\n\u003cth>Forma\u003c/th>\n\u003cth>Propiedades\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Artefacto de handoff\u003c/td>\n\u003ctd>Archivo en el \u003ca class=\"x\" data-slug=\"environment\" href=\"?term=environment\">entorno\u003c/a>\u003c/td>\n\u003ctd>Puedes leerlo y corregirlo antes de que algo dependa de él; se reutiliza en varias sesiones\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Compactación\u003c/td>\n\u003ctd>Resumen dentro de la ventana de contexto\u003c/td>\n\u003ctd>Automática y barata; más difícil de inspeccionar; alimenta a un solo sucesor\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>El síntoma visible de un handoff mal hecho es que la sesión nueva reabre decisiones que la anterior ya había cerrado, porque lo trasladado registró qué se decidió, pero no por qué. Evalúa un handoff por lo que una sesión con contexto cero podría hacer con él.\u003c/p>\n\u003cdiv class=\"block\">\u003cp class=\"lbl\">Uso\u003c/p>\n\u003cp>&quot;La sesión de planificación se está poniendo pesada. ¿Sigo no más?&quot;\u003c/p>\n\u003cp>&quot;Haz un handoff. Escribe las decisiones en un documento, límpiala, y arranca la implementación en una sesión nueva que lea desde ahí.&quot;\u003c/p>\n\n\u003c/div>","texto":"Trasladar el contexto de un agente de una sesión a otra, sin vuelta atrás. El mecanismo varía: artefacto, compactación, otros. Trasladar a un agente y su contexto de una sesión a otra, sin vuelta atrás. El mecanismo de traslado varía: puede ser un artefacto de handoff escrito, un resumen en memoria ( compactación ), u otros. Se distingue de la limpieza , que no traslada nada. Las razones varían: cambiar de rol (de quien planifica a quien implementa), lanzar una corrida AFK , abrir varias sesiones en paralelo, o liberar espacio en la ventana de contexto . La sesión que recibe arranca con contexto cero: el modelo es sin estado , y nada de la sesión anterior es visible para la nueva. Lo que la siguiente sesión necesite hay que trasladarlo de forma explícita; todo lo demás se pierde. Sin vuelta atrás es la restricción que moldea el traslado: la sesión nueva no puede preguntarle a la vieja qué quiso decir, así que el material trasladado tiene que valerse por sí solo. Mecanismo Forma Propiedades Artefacto de handoff Archivo en el entorno Puedes leerlo y corregirlo antes de que algo dependa de él; se reutiliza en varias sesiones Compactación Resumen dentro de la ventana de contexto Automática y barata; más difícil de inspeccionar; alimenta a un solo sucesor El síntoma visible de un handoff mal hecho es que la sesión nueva reabre decisiones que la anterior ya había cerrado, porque lo trasladado registró qué se decidió, pero no por qué. Evalúa un handoff por lo que una sesión con contexto cero podría hacer con él. Uso La sesión de planificación se está poniendo pesada. ¿Sigo no más? Haz un handoff. Escribe las decisiones en un documento, límpiala, y arranca la implementación en una sesión nueva que lea desde ahí.","salientes":["agent","context","session","handoff-artifact","compaction","clearing","afk","context-window","model","stateless","environment"],"entrantes":6},{"termino":"Primary source","slug":"primary-source","seccion":"Sección 5 — Handoffs","descripcion":"La cosa misma: el código, las transcripciones, los datos crudos. Completa y autorizada, pero cara de cargar en el contexto.","html":"\u003cp>Una fuente de verdad en su forma original: el código, la transcripción de la conversación, el log crudo, la respuesta real de la API. No es un relato de la cosa, es la cosa. Es la contraparte de la \u003ca class=\"x\" data-slug=\"secondary-source\" href=\"?term=secondary-source\">fuente secundaria\u003c/a>.\u003c/p>\n\u003cp>Si quieres saber qué hace tu base de código, el código es la fuente primaria. La documentación, el diagrama de arquitectura y el README son descripciones de él: precisas cuando se escribieron, y desde entonces envejecen cada una a su propio ritmo. Cuando un \u003ca class=\"x\" data-slug=\"agent\" href=\"?term=agent\">agente\u003c/a> afirma con seguridad algo equivocado sobre tu proyecto, la pregunta es de qué fuente estaba trabajando: un agente que leyó un documento hereda lo desactualizado que esté ese documento; uno que leyó el código está leyendo la verdad actual.\u003c/p>\n\u003cp>El costo es lo que impide que la fuente primaria sea la opción por defecto. Cargarla en la \u003ca class=\"x\" data-slug=\"context-window\" href=\"?term=context-window\">ventana de contexto\u003c/a> es cara: el archivo completo, la transcripción completa, cada \u003ca class=\"x\" data-slug=\"token\" href=\"?term=token\">token\u003c/a> facturado como \u003ca class=\"x\" data-slug=\"input-tokens\" href=\"?term=input-tokens\">tokens de entrada\u003c/a> y compitiendo por el \u003ca class=\"x\" data-slug=\"attention-budget\" href=\"?term=attention-budget\">attention budget\u003c/a>. Lo que obtienes a cambio de ese costo es completitud: nadie prefiltró antes según su propio criterio de qué importaba. Un resumen escrito el mes pasado no puede contener el detalle que hoy resultó importar; la fuente primaria sí lo tiene.\u003c/p>\n\u003cp>Recurre a la fuente primaria cuando la precisión importa: la firma exacta, el error real, la línea que lanza la excepción. Buena parte de gestionar el \u003ca class=\"x\" data-slug=\"context\" href=\"?term=context\">contexto\u003c/a> es decidir cuándo pagar por la fuente primaria y cuándo basta con una fuente secundaria.\u003c/p>\n\u003cdiv class=\"block\">\u003cp class=\"lbl\">Uso\u003c/p>\n\u003cp>&quot;El agente dice que la lógica de reintentos hace backoff exponencial, pero estoy viendo cómo golpea el endpoint sin parar.&quot;\u003c/p>\n\u003cp>&quot;Eso lo sacó del documento de diseño. Apúntalo al módulo de reintentos real: trabaja desde la fuente primaria cuando el comportamiento importa.&quot;\u003c/p>\n\n\u003c/div>","texto":"La cosa misma: el código, las transcripciones, los datos crudos. Completa y autorizada, pero cara de cargar en el contexto. Una fuente de verdad en su forma original: el código, la transcripción de la conversación, el log crudo, la respuesta real de la API. No es un relato de la cosa, es la cosa. Es la contraparte de la fuente secundaria . Si quieres saber qué hace tu base de código, el código es la fuente primaria. La documentación, el diagrama de arquitectura y el README son descripciones de él: precisas cuando se escribieron, y desde entonces envejecen cada una a su propio ritmo. Cuando un agente afirma con seguridad algo equivocado sobre tu proyecto, la pregunta es de qué fuente estaba trabajando: un agente que leyó un documento hereda lo desactualizado que esté ese documento; uno que leyó el código está leyendo la verdad actual. El costo es lo que impide que la fuente primaria sea la opción por defecto. Cargarla en la ventana de contexto es cara: el archivo completo, la transcripción completa, cada token facturado como tokens de entrada y compitiendo por el attention budget . Lo que obtienes a cambio de ese costo es completitud: nadie prefiltró antes según su propio criterio de qué importaba. Un resumen escrito el mes pasado no puede contener el detalle que hoy resultó importar; la fuente primaria sí lo tiene. Recurre a la fuente primaria cuando la precisión importa: la firma exacta, el error real, la línea que lanza la excepción. Buena parte de gestionar el contexto es decidir cuándo pagar por la fuente primaria y cuándo basta con una fuente secundaria. Uso El agente dice que la lógica de reintentos hace backoff exponencial, pero estoy viendo cómo golpea el endpoint sin parar. Eso lo sacó del documento de diseño. Apúntalo al módulo de reintentos real: trabaja desde la fuente primaria cuando el comportamiento importa.","salientes":["secondary-source","agent","context-window","token","input-tokens","attention-budget","context"],"entrantes":5},{"termino":"Secondary source","slug":"secondary-source","seccion":"Sección 5 — Handoffs","descripcion":"Un relato de una fuente primaria, un paso más allá: resúmenes, documentación, resúmenes de compactación. Barata y con pérdida por diseño.","html":"\u003cp>Un relato de una \u003ca class=\"x\" data-slug=\"primary-source\" href=\"?term=primary-source\">fuente primaria\u003c/a>, un paso más allá: documentación que describe código, un resumen que describe una transcripción, un informe que describe resultados de búsqueda. Más barata de cargar en la \u003ca class=\"x\" data-slug=\"context-window\" href=\"?term=context-window\">ventana de contexto\u003c/a> que la fuente que describe, y con pérdida de información por diseño: quien la escribió decidió qué importaba, y lo que descartó queda invisible para quien solo tiene el resumen.\u003c/p>\n\u003cp>Buena parte de la ingeniería de \u003ca class=\"x\" data-slug=\"context\" href=\"?term=context\">contexto\u003c/a> consiste en fabricar fuentes secundarias. La \u003ca class=\"x\" data-slug=\"compaction\" href=\"?term=compaction\">compactación\u003c/a> convierte el historial de la \u003ca class=\"x\" data-slug=\"session\" href=\"?term=session\">sesión\u003c/a> en un resumen que siembra la siguiente sesión. Un \u003ca class=\"x\" data-slug=\"subagent\" href=\"?term=subagent\">subagente\u003c/a> gasta su propio contexto en una búsqueda ruidosa y devuelve un informe corto. Un \u003ca class=\"x\" data-slug=\"handoff-artifact\" href=\"?term=handoff-artifact\">artefacto de handoff\u003c/a> condensa las decisiones de una sesión en un documento que la siguiente sesión lee. Los \u003ca class=\"x\" data-slug=\"memory-system\" href=\"?term=memory-system\">sistemas de memoria\u003c/a> destilan en notas lo que una sesión aprendió. Cada uno hace el mismo intercambio: fidelidad por espacio libre.\u003c/p>\n\u003cp>Las fuentes secundarias fallan de dos maneras. Pierden información: el resumen de compactación que perdió la decisión de esquema, el informe que no mencionó el caso límite. Y se desactualizan: la fuente primaria cambia y el relato no la sigue, así que la documentación describe la arquitectura del trimestre pasado con la confianza de este trimestre. Cuando un \u003ca class=\"x\" data-slug=\"agent\" href=\"?term=agent\">agente\u003c/a> actúa sobre una fuente secundaria que falló de cualquiera de las dos formas, trabaja con seguridad a partir de información equivocada; el arreglo es mandarlo de vuelta a la fuente primaria.\u003c/p>\n\u003cp>Ninguna de las dos fallas convierte a las fuentes secundarias en un error. La ventana de contexto es finita, y las fuentes primarias son caras; sin resúmenes, informes y documentos de handoff, nada grande cabe. El truco está en saber qué detalles pueden sobrevivir a la pérdida, y en verificar contra la fuente primaria cuando alguno no puede. Una fuente secundaria bien hecha lleva un \u003ca class=\"x\" data-slug=\"context-pointer\" href=\"?term=context-pointer\">puntero de contexto\u003c/a> de vuelta a su original: el resumen que nombra la transcripción de donde salió, la documentación que nombra el archivo que describe, así que cuando el relato no basta, el lector puede seguir el puntero en vez de trabajar con la pérdida.\u003c/p>\n\u003cdiv class=\"block\">\u003cp class=\"lbl\">Uso\u003c/p>\n\u003cp>&quot;El documento de handoff dice que la autenticación está lista, pero la sesión nueva sigue encontrando el refresco de tokens roto.&quot;\u003c/p>\n\u003cp>&quot;El documento es una fuente secundaria: la sesión anterior escribió lo que creía, no lo que es cierto. Haz que la sesión nueva corra las pruebas de autenticación y confíe en la fuente primaria.&quot;\u003c/p>\n\n\u003c/div>","texto":"Un relato de una fuente primaria, un paso más allá: resúmenes, documentación, resúmenes de compactación. Barata y con pérdida por diseño. Un relato de una fuente primaria , un paso más allá: documentación que describe código, un resumen que describe una transcripción, un informe que describe resultados de búsqueda. Más barata de cargar en la ventana de contexto que la fuente que describe, y con pérdida de información por diseño: quien la escribió decidió qué importaba, y lo que descartó queda invisible para quien solo tiene el resumen. Buena parte de la ingeniería de contexto consiste en fabricar fuentes secundarias. La compactación convierte el historial de la sesión en un resumen que siembra la siguiente sesión. Un subagente gasta su propio contexto en una búsqueda ruidosa y devuelve un informe corto. Un artefacto de handoff condensa las decisiones de una sesión en un documento que la siguiente sesión lee. Los sistemas de memoria destilan en notas lo que una sesión aprendió. Cada uno hace el mismo intercambio: fidelidad por espacio libre. Las fuentes secundarias fallan de dos maneras. Pierden información: el resumen de compactación que perdió la decisión de esquema, el informe que no mencionó el caso límite. Y se desactualizan: la fuente primaria cambia y el relato no la sigue, así que la documentación describe la arquitectura del trimestre pasado con la confianza de este trimestre. Cuando un agente actúa sobre una fuente secundaria que falló de cualquiera de las dos formas, trabaja con seguridad a partir de información equivocada; el arreglo es mandarlo de vuelta a la fuente primaria. Ninguna de las dos fallas convierte a las fuentes secundarias en un error. La ventana de contexto es finita, y las fuentes primarias son caras; sin resúmenes, informes y documentos de handoff, nada grande cabe. El truco está en saber qué detalles pueden sobrevivir a la pérdida, y en verificar contra la fuente primaria cuando alguno no puede. Una fuente secundaria bien hecha lleva un puntero de contexto de vuelta a su original: el resumen que nombra la transcripción de donde salió, la documentación que nombra el archivo que describe, así que cuando el relato no basta, el lector puede seguir el puntero en vez de trabajar con la pérdida. Uso El documento de handoff dice que la autenticación está lista, pero la sesión nueva sigue encontrando el refresco de tokens roto. El documento es una fuente secundaria: la sesión anterior escribió lo que creía, no lo que es cierto. Haz que la sesión nueva corra las pruebas de autenticación y confíe en la fuente primaria.","salientes":["primary-source","context-window","context","compaction","session","subagent","handoff-artifact","memory-system","agent","context-pointer"],"entrantes":7},{"termino":"Handoff artifact","slug":"handoff-artifact","seccion":"Sección 5 — Handoffs","descripcion":"Un documento que sirve de mecanismo de traslado para un handoff: lo escribe una sesión para que otra lo lea.","html":"\u003cp>Un documento que sirve de mecanismo de traslado para un \u003ca class=\"x\" data-slug=\"handoff\" href=\"?term=handoff\">handoff\u003c/a>: lo escribe una sesión en el \u003ca class=\"x\" data-slug=\"environment\" href=\"?term=environment\">entorno\u003c/a> para que otra \u003ca class=\"x\" data-slug=\"session\" href=\"?term=session\">sesión\u003c/a> lo lea. Los \u003ca class=\"x\" data-slug=\"spec\" href=\"?term=spec\">specs\u003c/a>, los \u003ca class=\"x\" data-slug=\"ticket\" href=\"?term=ticket\">tickets\u003c/a> y los documentos de plan son todos artefactos de handoff.\u003c/p>\n\u003cp>La razón para escribir uno: el \u003ca class=\"x\" data-slug=\"model\" href=\"?term=model\">modelo\u003c/a> es \u003ca class=\"x\" data-slug=\"stateless\" href=\"?term=stateless\">sin estado\u003c/a>, así que nada de una sesión sobrevive a \u003ca class=\"x\" data-slug=\"clearing\" href=\"?term=clearing\">limpiarla\u003c/a>. Decisiones, restricciones, planes a medio terminar: todo desaparece junto con el \u003ca class=\"x\" data-slug=\"context\" href=\"?term=context\">contexto\u003c/a> que los contenía. El entorno persiste. Escribir el estado importante en un archivo lo mueve a un lugar del que la siguiente sesión puede volver a leerlo.\u003c/p>\n\u003cp>El artefacto es una \u003ca class=\"x\" data-slug=\"secondary-source\" href=\"?term=secondary-source\">fuente secundaria\u003c/a>: un relato del trabajo de la sesión, no el trabajo mismo. Eso es lo que lo hace lo bastante chico como para poner al día a una sesión nueva, y también lo que puede llevarla por mal camino: registra lo que la sesión que lo escribió creía, y lo que dejó fuera o entendió mal queda invisible para quien lo lee. Donde una afirmación importe, la siguiente sesión debería verificarla contra la \u003ca class=\"x\" data-slug=\"primary-source\" href=\"?term=primary-source\">fuente primaria\u003c/a> (el código, las pruebas) en vez de heredarla.\u003c/p>\n\u003cp>Un buen artefacto se escribe para que lo lea una sesión con contexto cero. Rutas de archivo concretas en vez de &quot;el archivo que comentamos&quot;. Qué se decidió y por qué, para que la siguiente sesión no vuelva a discutirlo. Qué está hecho y qué falta. Ayuda decirle a la sesión que lo escribe hacia dónde va el artefacto: &quot;escribe un documento de handoff para una sesión nueva que no sabe nada de este trabajo&quot;.\u003c/p>\n\u003cp>El mecanismo de traslado alternativo es la \u003ca class=\"x\" data-slug=\"compaction\" href=\"?term=compaction\">compactación\u003c/a>, que resume en memoria. El artefacto tiene dos ventajas: vive en disco, donde puedes leerlo y corregirlo antes de que algo dependa de él, y se puede reutilizar (el mismo spec puede poner al día a cinco sesiones en paralelo).\u003c/p>\n\u003cdiv class=\"block\">\u003cp class=\"lbl\">Uso\u003c/p>\n\u003cp>&quot;¿Cómo divido esto entre el \u003ca class=\"x\" data-slug=\"agent\" href=\"?term=agent\">agente\u003c/a> que planifica y el que implementa?&quot;\u003c/p>\n\u003cp>&quot;Que el que planifica escriba un artefacto de handoff: rutas de archivo, decisiones, restricciones. La sesión del que implementa arranca con un puntero al artefacto y lo usa como su hoja de ruta.&quot;\u003c/p>\n\n\u003c/div>","texto":"Un documento que sirve de mecanismo de traslado para un handoff: lo escribe una sesión para que otra lo lea. Un documento que sirve de mecanismo de traslado para un handoff : lo escribe una sesión en el entorno para que otra sesión lo lea. Los specs , los tickets y los documentos de plan son todos artefactos de handoff. La razón para escribir uno: el modelo es sin estado , así que nada de una sesión sobrevive a limpiarla . Decisiones, restricciones, planes a medio terminar: todo desaparece junto con el contexto que los contenía. El entorno persiste. Escribir el estado importante en un archivo lo mueve a un lugar del que la siguiente sesión puede volver a leerlo. El artefacto es una fuente secundaria : un relato del trabajo de la sesión, no el trabajo mismo. Eso es lo que lo hace lo bastante chico como para poner al día a una sesión nueva, y también lo que puede llevarla por mal camino: registra lo que la sesión que lo escribió creía, y lo que dejó fuera o entendió mal queda invisible para quien lo lee. Donde una afirmación importe, la siguiente sesión debería verificarla contra la fuente primaria (el código, las pruebas) en vez de heredarla. Un buen artefacto se escribe para que lo lea una sesión con contexto cero. Rutas de archivo concretas en vez de el archivo que comentamos . Qué se decidió y por qué, para que la siguiente sesión no vuelva a discutirlo. Qué está hecho y qué falta. Ayuda decirle a la sesión que lo escribe hacia dónde va el artefacto: escribe un documento de handoff para una sesión nueva que no sabe nada de este trabajo . El mecanismo de traslado alternativo es la compactación , que resume en memoria. El artefacto tiene dos ventajas: vive en disco, donde puedes leerlo y corregirlo antes de que algo dependa de él, y se puede reutilizar (el mismo spec puede poner al día a cinco sesiones en paralelo). Uso ¿Cómo divido esto entre el agente que planifica y el que implementa? Que el que planifica escriba un artefacto de handoff: rutas de archivo, decisiones, restricciones. La sesión del que implementa arranca con un puntero al artefacto y lo usa como su hoja de ruta.","salientes":["handoff","environment","session","spec","ticket","model","stateless","clearing","context","secondary-source","primary-source","compaction","agent"],"entrantes":11},{"termino":"Spec","slug":"spec","seccion":"Sección 5 — Handoffs","descripcion":"Un artefacto de handoff que describe un trabajo de varias sesiones: qué se construye, no cómo aporta cada una. Hecho de tickets.","html":"\u003cp>Un \u003ca class=\"x\" data-slug=\"handoff-artifact\" href=\"?term=handoff-artifact\">artefacto de handoff\u003c/a> que describe un trabajo de varias \u003ca class=\"x\" data-slug=\"session\" href=\"?term=session\">sesiones\u003c/a>: qué se está construyendo, no cómo cada sesión aporta su parte. Cambia a medida que el trabajo avanza. Está hecho de \u003ca class=\"x\" data-slug=\"ticket\" href=\"?term=ticket\">tickets\u003c/a>.\u003c/p>\n\u003cp>El spec existe porque las sesiones son desechables y el trabajo grande no lo es. Cualquier cosa que tome más de una \u003ca class=\"x\" data-slug=\"context-window\" href=\"?term=context-window\">ventana de contexto\u003c/a> de esfuerzo necesita un lugar fuera del \u003ca class=\"x\" data-slug=\"context\" href=\"?term=context\">contexto\u003c/a>: en algún punto del \u003ca class=\"x\" data-slug=\"environment\" href=\"?term=environment\">entorno\u003c/a> del agente que sobreviva a la \u003ca class=\"x\" data-slug=\"clearing\" href=\"?term=clearing\">limpieza\u003c/a>, ya sea un archivo en el repositorio, un issue de GitHub, o un gestor de tickets al que el agente pueda llegar. El spec es ese lugar: el objetivo, las restricciones, las decisiones tomadas hasta ahora, y la lista de tickets con su estado. Cualquier sesión nueva puede leerlo y saber en qué punto está el trabajo sin heredar el ruido acumulado de la sesión anterior.\u003c/p>\n\u003cp>Los specs vienen en estilos reconocibles, casi todos heredados de cómo los equipos ya dejaban las cosas por escrito. Un \u003cem>product requirements document\u003c/em> (PRD) se inclina hacia el qué y el por qué de cara al usuario: funcionalidades, comportamiento, criterios de aceptación. Un \u003cem>design doc\u003c/em> o \u003cem>RFC\u003c/em> se inclina hacia lo técnico: el enfoque elegido, las alternativas descartadas, los trade-offs. En el extremo más chico, un simple \u003ccode>plan.md\u003c/code> con una lista de tickets cumple la misma función para una funcionalidad de varias sesiones. El estilo importa menos que el rol: para el \u003ca class=\"x\" data-slug=\"agent\" href=\"?term=agent\">agente\u003c/a>, todos estos son la misma cosa: la declaración de intención duradera que lee al empezar cada sesión.\u003c/p>\n\u003cdiv class=\"block\">\u003cp class=\"lbl\">Uso\u003c/p>\n\u003cp>&quot;¿Debería ser todo esto una sola sesión?&quot;\u003c/p>\n\u003cp>&quot;No, escríbelo como un spec: pártelo en tickets, corre cada uno en su propia sesión. Tratar de meter todo en un solo contexto va a chocar contra la \u003ca class=\"x\" data-slug=\"smart-zone\" href=\"?term=smart-zone\">dumb zone\u003c/a> antes de llegar a la mitad.&quot;\u003c/p>\n\n\u003c/div>","texto":"Un artefacto de handoff que describe un trabajo de varias sesiones: qué se construye, no cómo aporta cada una. Hecho de tickets. Un artefacto de handoff que describe un trabajo de varias sesiones : qué se está construyendo, no cómo cada sesión aporta su parte. Cambia a medida que el trabajo avanza. Está hecho de tickets . El spec existe porque las sesiones son desechables y el trabajo grande no lo es. Cualquier cosa que tome más de una ventana de contexto de esfuerzo necesita un lugar fuera del contexto : en algún punto del entorno del agente que sobreviva a la limpieza , ya sea un archivo en el repositorio, un issue de GitHub, o un gestor de tickets al que el agente pueda llegar. El spec es ese lugar: el objetivo, las restricciones, las decisiones tomadas hasta ahora, y la lista de tickets con su estado. Cualquier sesión nueva puede leerlo y saber en qué punto está el trabajo sin heredar el ruido acumulado de la sesión anterior. Los specs vienen en estilos reconocibles, casi todos heredados de cómo los equipos ya dejaban las cosas por escrito. Un product requirements document (PRD) se inclina hacia el qué y el por qué de cara al usuario: funcionalidades, comportamiento, criterios de aceptación. Un design doc o RFC se inclina hacia lo técnico: el enfoque elegido, las alternativas descartadas, los trade-offs. En el extremo más chico, un simple plan.md con una lista de tickets cumple la misma función para una funcionalidad de varias sesiones. El estilo importa menos que el rol: para el agente , todos estos son la misma cosa: la declaración de intención duradera que lee al empezar cada sesión. Uso ¿Debería ser todo esto una sola sesión? No, escríbelo como un spec: pártelo en tickets, corre cada uno en su propia sesión. Tratar de meter todo en un solo contexto va a chocar contra la dumb zone antes de llegar a la mitad.","salientes":["handoff-artifact","session","ticket","context-window","context","environment","clearing","agent","smart-zone"],"entrantes":6},{"termino":"Ticket","slug":"ticket","seccion":"Sección 5 — Handoffs","descripcion":"Un artefacto de handoff que delimita el trabajo de una sesión. Independiente o colgado de un spec. Puede bloquear a otros tickets.","html":"\u003cp>Un \u003ca class=\"x\" data-slug=\"handoff-artifact\" href=\"?term=handoff-artifact\">artefacto de handoff\u003c/a> que delimita el trabajo de una \u003ca class=\"x\" data-slug=\"session\" href=\"?term=session\">sesión\u003c/a>. Puede ser independiente, o colgar de un \u003ca class=\"x\" data-slug=\"spec\" href=\"?term=spec\">spec\u003c/a> como uno de sus hijos. Los tickets pueden bloquear o ser bloqueados por tickets hermanos, así que el orden del trabajo sale de su grafo de dependencias y no de un plan lineal.\u003c/p>\n\u003cp>La restricción que lo define es el tamaño: una sesión. Un ticket debería poder completarse antes de que la sesión se salga de la \u003ca class=\"x\" data-slug=\"smart-zone\" href=\"?term=smart-zone\">smart zone\u003c/a>, y esa restricción se puede comprobar. Si las sesiones sobre tus tickets se degradan de forma habitual antes de terminar el trabajo, los tickets son demasiado grandes: pártelos. Si cada sesión gasta la mayor parte de su \u003ca class=\"x\" data-slug=\"context\" href=\"?term=context\">contexto\u003c/a> en preparación antes de hacer cinco minutos de trabajo real, son demasiado chicos: fusiónalos.\u003c/p>\n\u003cp>Un buen ticket está escrito para alguien que no tiene ningún otro contexto. El objetivo, los criterios de aceptación, y \u003ca class=\"x\" data-slug=\"context-pointer\" href=\"?term=context-pointer\">punteros de contexto\u003c/a> a los archivos y decisiones relevantes: lo suficiente para que la sesión pueda empezar a trabajar sin tener que volver a deducir lo que la anterior ya sabía.\u003c/p>\n\u003cp>El grafo de dependencias es también lo que habilita el paralelismo. Los tickets independientes (las hojas del grafo) pueden correr cada uno en su propia sesión al mismo tiempo. Es una forma efectiva de correr varios agentes a la vez.\u003c/p>\n\u003cdiv class=\"block\">\u003cp class=\"lbl\">Uso\u003c/p>\n\u003cp>&quot;¿Por dónde empiezo con el spec de la migración?&quot;\u003c/p>\n\u003cp>&quot;Mira el grafo de tickets: el cambio de esquema bloquea el backfill, el backfill bloquea el cambio de API. Elige una hoja y corre una sesión sobre ella.&quot;\u003c/p>\n\n\u003c/div>","texto":"Un artefacto de handoff que delimita el trabajo de una sesión. Independiente o colgado de un spec. Puede bloquear a otros tickets. Un artefacto de handoff que delimita el trabajo de una sesión . Puede ser independiente, o colgar de un spec como uno de sus hijos. Los tickets pueden bloquear o ser bloqueados por tickets hermanos, así que el orden del trabajo sale de su grafo de dependencias y no de un plan lineal. La restricción que lo define es el tamaño: una sesión. Un ticket debería poder completarse antes de que la sesión se salga de la smart zone , y esa restricción se puede comprobar. Si las sesiones sobre tus tickets se degradan de forma habitual antes de terminar el trabajo, los tickets son demasiado grandes: pártelos. Si cada sesión gasta la mayor parte de su contexto en preparación antes de hacer cinco minutos de trabajo real, son demasiado chicos: fusiónalos. Un buen ticket está escrito para alguien que no tiene ningún otro contexto. El objetivo, los criterios de aceptación, y punteros de contexto a los archivos y decisiones relevantes: lo suficiente para que la sesión pueda empezar a trabajar sin tener que volver a deducir lo que la anterior ya sabía. El grafo de dependencias es también lo que habilita el paralelismo. Los tickets independientes (las hojas del grafo) pueden correr cada uno en su propia sesión al mismo tiempo. Es una forma efectiva de correr varios agentes a la vez. Uso ¿Por dónde empiezo con el spec de la migración? Mira el grafo de tickets: el cambio de esquema bloquea el backfill, el backfill bloquea el cambio de API. Elige una hoja y corre una sesión sobre ella.","salientes":["handoff-artifact","session","spec","smart-zone","context","context-pointer"],"entrantes":2},{"termino":"Compaction","slug":"compaction","seccion":"Sección 5 — Handoffs","descripcion":"Un handoff hecho en memoria: se resume el historial de la sesión anterior y ese resumen siembra una sesión nueva. Hay pérdida.","html":"\u003cp>Un \u003ca class=\"x\" data-slug=\"handoff\" href=\"?term=handoff\">handoff\u003c/a> hecho en memoria: se resume el historial de la \u003ca class=\"x\" data-slug=\"session\" href=\"?term=session\">sesión\u003c/a> anterior, y ese resumen siembra una sesión nueva. Con pérdida por diseño: la transcripción es una \u003ca class=\"x\" data-slug=\"primary-source\" href=\"?term=primary-source\">fuente primaria\u003c/a>, el resumen una \u003ca class=\"x\" data-slug=\"secondary-source\" href=\"?term=secondary-source\">fuente secundaria\u003c/a>; se cambia detalle por espacio libre. Se activa a mano, cuando lo pide el usuario, o de forma automática vía \u003ca class=\"x\" data-slug=\"autocompact\" href=\"?term=autocompact\">autocompactación\u003c/a>.\u003c/p>\n\u003cp>El mecanismo: la \u003ca class=\"x\" data-slug=\"context-window\" href=\"?term=context-window\">ventana de contexto\u003c/a> es finita, y una sesión larga la llena: cada \u003ca class=\"x\" data-slug=\"tool-result\" href=\"?term=tool-result\">tool result\u003c/a>, cada archivo leído, cada intento fallido queda en el historial. Cuando se pone pesada, el \u003ca class=\"x\" data-slug=\"harness\" href=\"?term=harness\">harness\u003c/a> le pide al \u003ca class=\"x\" data-slug=\"model\" href=\"?term=model\">modelo\u003c/a> que resuma la sesión, descarta el historial original, y siembra una sesión nueva con el resumen. Lo que no entró en el resumen desaparece del contexto. Algunos harnesses suavizan esto guardando la transcripción vieja en disco y dejando un \u003ca class=\"x\" data-slug=\"context-pointer\" href=\"?term=context-pointer\">puntero de contexto\u003c/a> hacia ella dentro del resumen: la fuente secundaria enlaza de vuelta a su fuente primaria, así que un detalle que el resumen perdió se puede recuperar releyendo el original.\u003c/p>\n\u003cp>El resumen lo escribe el modelo, así que se le puede dar instrucciones. &quot;Conserva las decisiones de esquema&quot; hace que el artefacto generado sea más cuidadoso. El momento también importa: compacta en un límite de fase, después de cerrar el plan, no a mitad de tarea.\u003c/p>\n\u003cp>Compárala con la \u003ca class=\"x\" data-slug=\"clearing\" href=\"?term=clearing\">limpieza\u003c/a>, que descarta todo y arranca en frío: la compactación intenta trasladar lo esencial, la limpieza apuesta a que eso ya está escrito en otra parte mejor.\u003c/p>\n\u003cdiv class=\"block\">\u003cp class=\"lbl\">Uso\u003c/p>\n\u003cp>&quot;El \u003ca class=\"x\" data-slug=\"context\" href=\"?term=context\">contexto\u003c/a> se está poniendo pesado y todavía me falta correr las pruebas.&quot;\u003c/p>\n\u003cp>&quot;Compacta antes de seguir: escribe en el prompt de resumen lo que tiene que sobrevivir, para que la sesión nueva conserve las decisiones de esquema y suelte la exploración.&quot;\u003c/p>\n\n\u003c/div>","texto":"Un handoff hecho en memoria: se resume el historial de la sesión anterior y ese resumen siembra una sesión nueva. Hay pérdida. Un handoff hecho en memoria: se resume el historial de la sesión anterior, y ese resumen siembra una sesión nueva. Con pérdida por diseño: la transcripción es una fuente primaria , el resumen una fuente secundaria ; se cambia detalle por espacio libre. Se activa a mano, cuando lo pide el usuario, o de forma automática vía autocompactación . El mecanismo: la ventana de contexto es finita, y una sesión larga la llena: cada tool result , cada archivo leído, cada intento fallido queda en el historial. Cuando se pone pesada, el harness le pide al modelo que resuma la sesión, descarta el historial original, y siembra una sesión nueva con el resumen. Lo que no entró en el resumen desaparece del contexto. Algunos harnesses suavizan esto guardando la transcripción vieja en disco y dejando un puntero de contexto hacia ella dentro del resumen: la fuente secundaria enlaza de vuelta a su fuente primaria, así que un detalle que el resumen perdió se puede recuperar releyendo el original. El resumen lo escribe el modelo, así que se le puede dar instrucciones. Conserva las decisiones de esquema hace que el artefacto generado sea más cuidadoso. El momento también importa: compacta en un límite de fase, después de cerrar el plan, no a mitad de tarea. Compárala con la limpieza , que descarta todo y arranca en frío: la compactación intenta trasladar lo esencial, la limpieza apuesta a que eso ya está escrito en otra parte mejor. Uso El contexto se está poniendo pesado y todavía me falta correr las pruebas. Compacta antes de seguir: escribe en el prompt de resumen lo que tiene que sobrevivir, para que la sesión nueva conserve las decisiones de esquema y suelte la exploración.","salientes":["handoff","session","primary-source","secondary-source","autocompact","context-window","tool-result","harness","model","context-pointer","clearing","context"],"entrantes":12},{"termino":"Autocompact","slug":"autocompact","seccion":"Sección 5 — Handoffs","descripcion":"Compactación que el harness dispara solo cuando la ventana de contexto está por llenarse.","html":"\u003cp>\u003ca class=\"x\" data-slug=\"compaction\" href=\"?term=compaction\">Compactación\u003c/a> que dispara automáticamente el \u003ca class=\"x\" data-slug=\"harness\" href=\"?term=harness\">harness\u003c/a> cuando la \u003ca class=\"x\" data-slug=\"context-window\" href=\"?term=context-window\">ventana de contexto\u003c/a> está por llenarse.\u003c/p>\n\u003cp>El harness vigila qué tan llena está la ventana de contexto. Cuando cruza un umbral (a menudo cerca del 80%), se detiene, le pide al \u003ca class=\"x\" data-slug=\"model\" href=\"?term=model\">modelo\u003c/a> que resuma la \u003ca class=\"x\" data-slug=\"session\" href=\"?term=session\">sesión\u003c/a> hasta ese punto, y siembra una sesión nueva con el resumen. El trabajo sigue después como si nada hubiera pasado.\u003c/p>\n\u003cp>Salvo que sí pasó algo. La compactación tiene pérdida, y la autocompactación tiene pérdida en un momento que tú no elegiste. Una compactación manual ocurre en un límite de fase, cuando puedes decirle al modelo qué conservar. La autocompactación se dispara a mitad de tarea, apenas se cruza el umbral, posiblemente a mitad de un refactor, con el resumen decidiendo por su cuenta cuáles de tus decisiones valía la pena conservar. El síntoma clásico: el \u003ca class=\"x\" data-slug=\"agent\" href=\"?term=agent\">agente\u003c/a> sigue adelante con seguridad, pero olvidó en silencio una restricción que estableciste hace una hora, y recién lo notas cuando su trabajo empieza a contradecirla.\u003c/p>\n\u003cp>La defensa es no dejar que se dispare. Vigila el indicador de contexto y compacta a mano en un límite natural, o escribe las decisiones en un documento de plan o en un \u003ca class=\"x\" data-slug=\"handoff-artifact\" href=\"?term=handoff-artifact\">artefacto de handoff\u003c/a> en disco, donde ningún resumen pueda perderlas. La mayoría de los harnesses también te dejan ajustar el margen (mover el umbral antes o después, o apagar la autocompactación del todo) para que calibres cuánto espacio libre te queda antes de que se dispare.\u003c/p>\n\u003cdiv class=\"block\">\u003cp class=\"lbl\">Uso\u003c/p>\n\u003cp>&quot;Parece que no se acuerda de lo que decidimos sobre el esquema hace rato.&quot;\u003c/p>\n\u003cp>&quot;Se disparó la autocompactación entre \u003ca class=\"x\" data-slug=\"turn\" href=\"?term=turn\">turnos\u003c/a>; las decisiones de antes se resumieron y seguro se perdió algo. Vuelve a cargar el documento del plan, o compacta a mano la próxima vez para controlar qué se conserva.&quot;\u003c/p>\n\n\u003c/div>","texto":"Compactación que el harness dispara solo cuando la ventana de contexto está por llenarse. Compactación que dispara automáticamente el harness cuando la ventana de contexto está por llenarse. El harness vigila qué tan llena está la ventana de contexto. Cuando cruza un umbral (a menudo cerca del 80%), se detiene, le pide al modelo que resuma la sesión hasta ese punto, y siembra una sesión nueva con el resumen. El trabajo sigue después como si nada hubiera pasado. Salvo que sí pasó algo. La compactación tiene pérdida, y la autocompactación tiene pérdida en un momento que tú no elegiste. Una compactación manual ocurre en un límite de fase, cuando puedes decirle al modelo qué conservar. La autocompactación se dispara a mitad de tarea, apenas se cruza el umbral, posiblemente a mitad de un refactor, con el resumen decidiendo por su cuenta cuáles de tus decisiones valía la pena conservar. El síntoma clásico: el agente sigue adelante con seguridad, pero olvidó en silencio una restricción que estableciste hace una hora, y recién lo notas cuando su trabajo empieza a contradecirla. La defensa es no dejar que se dispare. Vigila el indicador de contexto y compacta a mano en un límite natural, o escribe las decisiones en un documento de plan o en un artefacto de handoff en disco, donde ningún resumen pueda perderlas. La mayoría de los harnesses también te dejan ajustar el margen (mover el umbral antes o después, o apagar la autocompactación del todo) para que calibres cuánto espacio libre te queda antes de que se dispare. Uso Parece que no se acuerda de lo que decidimos sobre el esquema hace rato. Se disparó la autocompactación entre turnos ; las decisiones de antes se resumieron y seguro se perdió algo. Vuelve a cargar el documento del plan, o compacta a mano la próxima vez para controlar qué se conserva.","salientes":["compaction","harness","context-window","model","session","agent","handoff-artifact","turn"],"entrantes":1},{"termino":"Memory system","slug":"memory-system","seccion":"Sección 6 — Memoria y conducción","descripcion":"Sistema que intenta hacer a un agente con estado entre sesiones: persiste en el entorno y recarga al iniciar la sesión.","html":"\u003cp>Un sistema que intenta hacer que un \u003ca class=\"x\" data-slug=\"agent\" href=\"?term=agent\">agente\u003c/a> quede \u003ca class=\"x\" data-slug=\"stateful\" href=\"?term=stateful\">con estado\u003c/a> entre \u003ca class=\"x\" data-slug=\"session\" href=\"?term=session\">sesiones\u003c/a>. Persiste información en el \u003ca class=\"x\" data-slug=\"environment\" href=\"?term=environment\">entorno\u003c/a> durante una sesión y la recarga en la \u003ca class=\"x\" data-slug=\"context-window\" href=\"?term=context-window\">ventana de contexto\u003c/a> al comenzar las siguientes, de modo que el agente mantiene continuidad más allá de que el usuario haga una \u003ca class=\"x\" data-slug=\"clearing\" href=\"?term=clearing\">limpieza\u003c/a> de la sesión.\u003c/p>\n\u003cp>Un sistema de memoria tiene dos mitades. La ruta de escritura: durante una sesión, el agente registra lo que aprendió (una preferencia que declaraste, un dato del proyecto) como archivos en el entorno. La ruta de lectura: al iniciar la sesión, el \u003ca class=\"x\" data-slug=\"harness\" href=\"?term=harness\">harness\u003c/a> carga esos archivos, o un índice de ellos, de vuelta en la ventana de contexto. Muchos harness traen su propio sistema de memoria (el \u003ccode>/memory\u003c/code> de Claude Code es uno), pero también puedes construir el tuyo: un directorio de notas más una instrucción en \u003ca class=\"x\" data-slug=\"agentsmd\" href=\"?term=agentsmd\">AGENTS.md\u003c/a> que diga que hay que consultarlo.\u003c/p>\n\u003cp>Aplican las mismas contrapartidas que a cualquier contenido siempre cargado. Las memorias se acumulan, así que la mayoría de los sistemas carga un índice de una línea y deja los cuerpos detrás de \u003ca class=\"x\" data-slug=\"context-pointer\" href=\"?term=context-pointer\">punteros de contexto\u003c/a> en vez de incluirlo todo. Y las memorias son \u003ca class=\"x\" data-slug=\"secondary-source\" href=\"?term=secondary-source\">fuentes secundarias\u003c/a>, así que se desactualizan: un dato registrado en marzo se carga con la misma confianza en junio, cuando el proyecto ya avanzó. Un sistema de memoria necesita poda, igual que AGENTS.md.\u003c/p>\n\u003cdiv class=\"block\">\u003cp class=\"lbl\">Uso\u003c/p>\n\u003cp>&quot;Tengo que repetirle siempre que uso Postgres, no MySQL.&quot;\u003c/p>\n\u003cp>&quot;Arma un sistema de memoria: que escriba lo que aprende al \u003ca class=\"x\" data-slug=\"filesystem\" href=\"?term=filesystem\">sistema de archivos\u003c/a> en el primer \u003ca class=\"x\" data-slug=\"turn\" href=\"?term=turn\">turno\u003c/a>, y lo recargue al iniciar la sesión. El \u003ca class=\"x\" data-slug=\"model\" href=\"?term=model\">modelo\u003c/a> en sí es \u003ca class=\"x\" data-slug=\"stateless\" href=\"?term=stateless\">sin estado\u003c/a>; la capa de memoria simula continuidad.&quot;\u003c/p>\n\n\u003c/div>","texto":"Sistema que intenta hacer a un agente con estado entre sesiones: persiste en el entorno y recarga al iniciar la sesión. Un sistema que intenta hacer que un agente quede con estado entre sesiones . Persiste información en el entorno durante una sesión y la recarga en la ventana de contexto al comenzar las siguientes, de modo que el agente mantiene continuidad más allá de que el usuario haga una limpieza de la sesión. Un sistema de memoria tiene dos mitades. La ruta de escritura: durante una sesión, el agente registra lo que aprendió (una preferencia que declaraste, un dato del proyecto) como archivos en el entorno. La ruta de lectura: al iniciar la sesión, el harness carga esos archivos, o un índice de ellos, de vuelta en la ventana de contexto. Muchos harness traen su propio sistema de memoria (el /memory de Claude Code es uno), pero también puedes construir el tuyo: un directorio de notas más una instrucción en AGENTS.md que diga que hay que consultarlo. Aplican las mismas contrapartidas que a cualquier contenido siempre cargado. Las memorias se acumulan, así que la mayoría de los sistemas carga un índice de una línea y deja los cuerpos detrás de punteros de contexto en vez de incluirlo todo. Y las memorias son fuentes secundarias , así que se desactualizan: un dato registrado en marzo se carga con la misma confianza en junio, cuando el proyecto ya avanzó. Un sistema de memoria necesita poda, igual que AGENTS.md. Uso Tengo que repetirle siempre que uso Postgres, no MySQL. Arma un sistema de memoria: que escriba lo que aprende al sistema de archivos en el primer turno , y lo recargue al iniciar la sesión. El modelo en sí es sin estado ; la capa de memoria simula continuidad.","salientes":["agent","stateful","session","environment","context-window","clearing","harness","agentsmd","context-pointer","secondary-source","filesystem","turn","model","stateless"],"entrantes":8},{"termino":"AGENTS.md","slug":"agentsmd","seccion":"Sección 6 — Memoria y conducción","descripcion":"Archivo que el harness carga en la ventana de contexto al iniciar la sesión: el briefing permanente del proyecto para el agente.","html":"\u003cp>Un archivo en el \u003ca class=\"x\" data-slug=\"environment\" href=\"?term=environment\">entorno\u003c/a> que el \u003ca class=\"x\" data-slug=\"harness\" href=\"?term=harness\">harness\u003c/a> carga en la \u003ca class=\"x\" data-slug=\"context-window\" href=\"?term=context-window\">ventana de contexto\u003c/a> al iniciar la \u003ca class=\"x\" data-slug=\"session\" href=\"?term=session\">sesión\u003c/a>: el briefing permanente del proyecto para el \u003ca class=\"x\" data-slug=\"agent\" href=\"?term=agent\">agente\u003c/a>. Es una convención transversal a los harness; algunos además tienen su propia variante (la de Claude Code es CLAUDE.md).\u003c/p>\n\u003cp>Como se carga automáticamente, es una forma de no repetirte entre sesiones. El \u003ca class=\"x\" data-slug=\"model\" href=\"?term=model\">modelo\u003c/a> es \u003ca class=\"x\" data-slug=\"stateless\" href=\"?term=stateless\">sin estado\u003c/a>: una corrección que das en una sesión desaparece en la siguiente, y terminas contándole a cada sesión nueva que el proyecto usa pnpm, que los tests corren con tal flag, o que tal directorio es generado y no se toca. Cuando ya corregiste al agente dos veces por lo mismo, esa corrección es candidata a línea de AGENTS.md.\u003c/p>\n\u003cp>El contenido adecuado es lo que el agente no puede deducir del código: comandos de build y test, convenciones que el código no deja en evidencia, restricciones duras (&quot;nunca edites el cliente generado&quot;). Corto y declarativo: es un briefing, no documentación.\u003c/p>\n\u003cp>La contrapartida es que todo lo que contiene se carga siempre. Las instrucciones se acumulan, la mayoría irrelevantes para cualquier tarea puntual, y un AGENTS.md largo cuesta tokens y además se diluye a sí mismo: mientras más instrucciones hay en el contexto, con menos fiabilidad el modelo sigue cada una.\u003c/p>\n\u003cdiv class=\"block avoid\">\u003cp class=\"lbl\">Evita\u003c/p>\u003cp>usar AGENTS.md para contenido que debería estar en \u003ca class=\"x\" data-slug=\"progressive-disclosure\" href=\"?term=progressive-disclosure\">revelación progresiva\u003c/a>: todo lo que va ahí paga un costo de \u003ca class=\"x\" data-slug=\"token\" href=\"?term=token\">tokens\u003c/a> en cada \u003ca class=\"x\" data-slug=\"turn\" href=\"?term=turn\">turno\u003c/a>, en cada sesión, la necesite o no. Una guía de estilo puede ir detrás de una \u003ca class=\"x\" data-slug=\"skill\" href=\"?term=skill\">skill\u003c/a> o de un \u003ca class=\"x\" data-slug=\"context-pointer\" href=\"?term=context-pointer\">puntero de contexto\u003c/a>; deja AGENTS.md para las líneas que aplican en todas partes.\u003c/p>\u003c/div>\n\u003cdiv class=\"block\">\u003cp class=\"lbl\">Uso\u003c/p>\n\u003cp>&quot;¿Por qué cada sesión arranca ya con 4k tokens quemados?&quot;\u003c/p>\n\u003cp>&quot;Revisa AGENTS.md: alguien pegó ahí la guía de estilo completa en vez de ponerla detrás de una skill.&quot;\u003c/p>\n\n\u003c/div>","texto":"Archivo que el harness carga en la ventana de contexto al iniciar la sesión: el briefing permanente del proyecto para el agente. Un archivo en el entorno que el harness carga en la ventana de contexto al iniciar la sesión : el briefing permanente del proyecto para el agente . Es una convención transversal a los harness; algunos además tienen su propia variante (la de Claude Code es CLAUDE.md). Como se carga automáticamente, es una forma de no repetirte entre sesiones. El modelo es sin estado : una corrección que das en una sesión desaparece en la siguiente, y terminas contándole a cada sesión nueva que el proyecto usa pnpm, que los tests corren con tal flag, o que tal directorio es generado y no se toca. Cuando ya corregiste al agente dos veces por lo mismo, esa corrección es candidata a línea de AGENTS.md. El contenido adecuado es lo que el agente no puede deducir del código: comandos de build y test, convenciones que el código no deja en evidencia, restricciones duras ( nunca edites el cliente generado ). Corto y declarativo: es un briefing, no documentación. La contrapartida es que todo lo que contiene se carga siempre. Las instrucciones se acumulan, la mayoría irrelevantes para cualquier tarea puntual, y un AGENTS.md largo cuesta tokens y además se diluye a sí mismo: mientras más instrucciones hay en el contexto, con menos fiabilidad el modelo sigue cada una. Evita usar AGENTS.md para contenido que debería estar en revelación progresiva : todo lo que va ahí paga un costo de tokens en cada turno , en cada sesión, la necesite o no. Una guía de estilo puede ir detrás de una skill o de un puntero de contexto ; deja AGENTS.md para las líneas que aplican en todas partes. Uso ¿Por qué cada sesión arranca ya con 4k tokens quemados? Revisa AGENTS.md: alguien pegó ahí la guía de estilo completa en vez de ponerla detrás de una skill.","salientes":["environment","harness","context-window","session","agent","model","stateless","progressive-disclosure","token","turn","skill","context-pointer"],"entrantes":14},{"termino":"Progressive disclosure","slug":"progressive-disclosure","seccion":"Sección 6 — Memoria y conducción","descripcion":"Cargar solo el contexto que el agente necesita ahora, con punteros de contexto al resto. Tomado del diseño de interfaces.","html":"\u003cp>Cargar solo el \u003ca class=\"x\" data-slug=\"context\" href=\"?term=context\">contexto\u003c/a> que el \u003ca class=\"x\" data-slug=\"agent\" href=\"?term=agent\">agente\u003c/a> necesita ahora mismo, con \u003ca class=\"x\" data-slug=\"context-pointer\" href=\"?term=context-pointer\">punteros de contexto\u003c/a> hacia el resto. La idea viene del diseño de interfaces, donde significa mostrarle al usuario solo los controles relevantes a su tarea actual y esconder el resto detrás de un clic.\u003c/p>\n\u003cp>La técnica existe porque el contexto cuesta dos veces. Cada \u003ca class=\"x\" data-slug=\"token\" href=\"?term=token\">token\u003c/a> cargado de entrada se factura como \u003ca class=\"x\" data-slug=\"input-tokens\" href=\"?term=input-tokens\">tokens de entrada\u003c/a> en cada \u003ca class=\"x\" data-slug=\"turn\" href=\"?term=turn\">turno\u003c/a>, y cada token gasta \u003ca class=\"x\" data-slug=\"attention-budget\" href=\"?term=attention-budget\">attention budget\u003c/a>, lo necesite el agente o no. Un \u003ca class=\"x\" data-slug=\"agentsmd\" href=\"?term=agentsmd\">AGENTS.md\u003c/a> relleno con la guía de estilo completa, el runbook de despliegue y las convenciones de base de datos hace peor al agente en las tres cosas a la vez: las instrucciones que importan para la tarea actual quedan diluidas entre las que no. La señal es un agente que ignora reglas que sabes que están en su contexto: están ahí, pero enterradas.\u003c/p>\n\u003cp>La revelación progresiva invierte esto. Mantén chica la capa que se carga siempre (una frase por tema y un puntero a dónde vive el detalle). El agente lee la guía de estilo cuando está escribiendo un componente, el runbook de despliegue cuando está desplegando, y ninguno de los dos cuando está arreglando un test. Las \u003ca class=\"x\" data-slug=\"skill\" href=\"?term=skill\">skills\u003c/a> son este patrón incorporado al \u003ca class=\"x\" data-slug=\"harness\" href=\"?term=harness\">harness\u003c/a>: una descripción corta que se carga en cada \u003ca class=\"x\" data-slug=\"session\" href=\"?term=session\">sesión\u003c/a>, y las instrucciones completas solo cuando algo las dispara.\u003c/p>\n\u003cdiv class=\"block\">\u003cp class=\"lbl\">Uso\u003c/p>\n\u003cp>&quot;¿Vuelco toda la guía de estilo en AGENTS.md?&quot;\u003c/p>\n\u003cp>&quot;No, revelación progresiva. Referencia la guía de estilo como una skill que el agente carga cuando de verdad necesita escribir un componente. AGENTS.md paga el costo de tokens en cada turno.&quot;\u003c/p>\n\n\u003c/div>","texto":"Cargar solo el contexto que el agente necesita ahora, con punteros de contexto al resto. Tomado del diseño de interfaces. Cargar solo el contexto que el agente necesita ahora mismo, con punteros de contexto hacia el resto. La idea viene del diseño de interfaces, donde significa mostrarle al usuario solo los controles relevantes a su tarea actual y esconder el resto detrás de un clic. La técnica existe porque el contexto cuesta dos veces. Cada token cargado de entrada se factura como tokens de entrada en cada turno , y cada token gasta attention budget , lo necesite el agente o no. Un AGENTS.md relleno con la guía de estilo completa, el runbook de despliegue y las convenciones de base de datos hace peor al agente en las tres cosas a la vez: las instrucciones que importan para la tarea actual quedan diluidas entre las que no. La señal es un agente que ignora reglas que sabes que están en su contexto: están ahí, pero enterradas. La revelación progresiva invierte esto. Mantén chica la capa que se carga siempre (una frase por tema y un puntero a dónde vive el detalle). El agente lee la guía de estilo cuando está escribiendo un componente, el runbook de despliegue cuando está desplegando, y ninguno de los dos cuando está arreglando un test. Las skills son este patrón incorporado al harness : una descripción corta que se carga en cada sesión , y las instrucciones completas solo cuando algo las dispara. Uso ¿Vuelco toda la guía de estilo en AGENTS.md? No, revelación progresiva. Referencia la guía de estilo como una skill que el agente carga cuando de verdad necesita escribir un componente. AGENTS.md paga el costo de tokens en cada turno.","salientes":["context","agent","context-pointer","token","input-tokens","turn","attention-budget","agentsmd","skill","harness","session"],"entrantes":3},{"termino":"Context pointer","slug":"context-pointer","seccion":"Sección 6 — Memoria y conducción","descripcion":"Una mención en un documento que apunta a otro, para que el agente lo traiga al contexto solo cuando la tarea lo requiere.","html":"\u003cp>Una mención en un documento que apunta a otro, para que el \u003ca class=\"x\" data-slug=\"agent\" href=\"?term=agent\">agente\u003c/a> pueda traerlo a la \u003ca class=\"x\" data-slug=\"context-window\" href=\"?term=context-window\">ventana de contexto\u003c/a> solo cuando la tarea lo requiere. Es la unidad con la que se construye la \u003ca class=\"x\" data-slug=\"progressive-disclosure\" href=\"?term=progressive-disclosure\">revelación progresiva\u003c/a>.\u003c/p>\n\u003cp>La razón para usar un puntero, en vez de incluir el contenido directo, es el costo. Un puntero es una línea en la ventana de contexto. El documento detrás puede tener miles de \u003ca class=\"x\" data-slug=\"token\" href=\"?term=token\">tokens\u003c/a>, pero esos tokens no cuestan nada hasta que el agente de verdad sigue el puntero. Si incluyes un runbook de 2.000 tokens directo en \u003ca class=\"x\" data-slug=\"agentsmd\" href=\"?term=agentsmd\">AGENTS.md\u003c/a>, cada \u003ca class=\"x\" data-slug=\"session\" href=\"?term=session\">sesión\u003c/a> lo paga; si lo reemplazas por &quot;proceso de despliegue: ver \u003ccode>internal/deploy.md\u003c/code>&quot;, solo las sesiones que despliegan lo cargan. El agente sigue el puntero con un \u003ca class=\"x\" data-slug=\"tool-call\" href=\"?term=tool-call\">tool call\u003c/a> cuando la tarea calza.\u003c/p>\n\u003cp>Un puntero necesita dos partes para funcionar: una ruta estable, y suficiente descripción para que el agente sepa si vale la pena seguirlo. Una ruta pelada es un puntero que el agente no tiene motivo para seguir; &quot;ver \u003ccode>internal/deploy.md\u003c/code>&quot; sin ninguna pista de qué hay adentro se lo salta una sesión que sí lo necesitaba. Escribe la línea para que calce con cómo se presentan las tareas: &quot;release, deploy o rollback: lee primero \u003ccode>internal/deploy.md\u003c/code>&quot;.\u003c/p>\n\u003cp>Los punteros están en todas partes una vez que los notas: líneas en AGENTS.md, descripciones de \u003ca class=\"x\" data-slug=\"skill\" href=\"?term=skill\">skill\u003c/a> (el harness carga la descripción; el cuerpo de la skill espera detrás), nombres de archivo en el listado de un directorio, links entre documentos.\u003c/p>\n\u003cp>Un puntero también puede conectar una \u003ca class=\"x\" data-slug=\"secondary-source\" href=\"?term=secondary-source\">fuente secundaria\u003c/a> de vuelta a la \u003ca class=\"x\" data-slug=\"primary-source\" href=\"?term=primary-source\">fuente primaria\u003c/a> de la que salió: el resumen de compactación que nombra la transcripción original, el documento que nombra el archivo fuente que describe. Esto hace recuperable la pérdida de información de la fuente secundaria: cuando el resumen resulta insuficiente, el agente sigue el puntero y lee el original, en vez de trabajar con lo que el resumen alcanzó a conservar.\u003c/p>\n\u003cdiv class=\"block avoid\">\u003cp class=\"lbl\">Evita\u003c/p>\u003cp>&quot;referencia&quot; (demasiado seco, no transmite que seguirlo trae más contexto). &quot;Portal&quot; (demasiado rimbombante).\u003c/p>\u003c/div>\n\u003cdiv class=\"block\">\u003cp class=\"lbl\">Uso\u003c/p>\n\u003cp>&quot;AGENTS.md se está poniendo enorme.&quot;\u003c/p>\n\u003cp>&quot;La mayor parte debería ser punteros de contexto, no contenido. Deja las reglas siempre activas en línea; convierte el runbook de despliegue y la guía de estilo en skills, y deja un puntero de contexto en su lugar.&quot;\u003c/p>\n\n\u003c/div>","texto":"Una mención en un documento que apunta a otro, para que el agente lo traiga al contexto solo cuando la tarea lo requiere. Una mención en un documento que apunta a otro, para que el agente pueda traerlo a la ventana de contexto solo cuando la tarea lo requiere. Es la unidad con la que se construye la revelación progresiva . La razón para usar un puntero, en vez de incluir el contenido directo, es el costo. Un puntero es una línea en la ventana de contexto. El documento detrás puede tener miles de tokens , pero esos tokens no cuestan nada hasta que el agente de verdad sigue el puntero. Si incluyes un runbook de 2.000 tokens directo en AGENTS.md , cada sesión lo paga; si lo reemplazas por proceso de despliegue: ver internal/deploy.md , solo las sesiones que despliegan lo cargan. El agente sigue el puntero con un tool call cuando la tarea calza. Un puntero necesita dos partes para funcionar: una ruta estable, y suficiente descripción para que el agente sepa si vale la pena seguirlo. Una ruta pelada es un puntero que el agente no tiene motivo para seguir; ver internal/deploy.md sin ninguna pista de qué hay adentro se lo salta una sesión que sí lo necesitaba. Escribe la línea para que calce con cómo se presentan las tareas: release, deploy o rollback: lee primero internal/deploy.md . Los punteros están en todas partes una vez que los notas: líneas en AGENTS.md, descripciones de skill (el harness carga la descripción; el cuerpo de la skill espera detrás), nombres de archivo en el listado de un directorio, links entre documentos. Un puntero también puede conectar una fuente secundaria de vuelta a la fuente primaria de la que salió: el resumen de compactación que nombra la transcripción original, el documento que nombra el archivo fuente que describe. Esto hace recuperable la pérdida de información de la fuente secundaria: cuando el resumen resulta insuficiente, el agente sigue el puntero y lee el original, en vez de trabajar con lo que el resumen alcanzó a conservar. Evita referencia (demasiado seco, no transmite que seguirlo trae más contexto). Portal (demasiado rimbombante). Uso AGENTS.md se está poniendo enorme. La mayor parte debería ser punteros de contexto, no contenido. Deja las reglas siempre activas en línea; convierte el runbook de despliegue y la guía de estilo en skills, y deja un puntero de contexto en su lugar.","salientes":["agent","context-window","progressive-disclosure","token","agentsmd","session","tool-call","skill","secondary-source","primary-source"],"entrantes":9},{"termino":"Skill","slug":"skill","seccion":"Sección 6 — Memoria y conducción","descripcion":"Una capacidad enseñable empaquetada como unidad, fuera del contexto hasta que un puntero de contexto la trae para la tarea.","html":"\u003cp>Una capacidad enseñable empaquetada como unidad (instrucciones y recursos para hacer bien una tarea), que se mantiene en el \u003ca class=\"x\" data-slug=\"environment\" href=\"?term=environment\">entorno\u003c/a> hasta que un \u003ca class=\"x\" data-slug=\"context-pointer\" href=\"?term=context-pointer\">puntero de contexto\u003c/a> la trae a la \u003ca class=\"x\" data-slug=\"context-window\" href=\"?term=context-window\">ventana de contexto\u003c/a> para la tarea en curso. Es la unidad de \u003ca class=\"x\" data-slug=\"progressive-disclosure\" href=\"?term=progressive-disclosure\">revelación progresiva\u003c/a> dentro de un \u003ca class=\"x\" data-slug=\"harness\" href=\"?term=harness\">harness\u003c/a>.\u003c/p>\n\u003cp>Las skills son un estándar abierto, definido en \u003ca href=\"https://agentskills.io\">agentskills.io\u003c/a> (desarrollado originalmente por Anthropic y adoptado después por la mayoría de los harness grandes), así que una skill escrita una vez funciona en todos. El formato es una carpeta que contiene:\u003c/p>\n\u003cul>\n\u003cli>Un archivo \u003ccode>SKILL.md\u003c/code>: metadatos (mínimo un nombre y una descripción) más las instrucciones mismas\u003c/li>\n\u003cli>Opcionalmente, scripts que el \u003ca class=\"x\" data-slug=\"agent\" href=\"?term=agent\">agente\u003c/a> puede ejecutar\u003c/li>\n\u003cli>Opcionalmente, plantillas y material de referencia al que apuntan las instrucciones\u003c/li>\n\u003c/ul>\n\u003cp>Por defecto, solo el nombre y la descripción viven en el \u003ca class=\"x\" data-slug=\"context\" href=\"?term=context\">contexto\u003c/a>. Cuando la tarea del agente calza, carga el resto. Hasta entonces, la skill casi no ocupa espacio (una o dos frases de \u003ca class=\"x\" data-slug=\"token\" href=\"?term=token\">tokens\u003c/a>), sin importar cuán extensas sean sus instrucciones completas.\u003c/p>\n\u003cp>Esto distingue a las skills de \u003ca class=\"x\" data-slug=\"agentsmd\" href=\"?term=agentsmd\">AGENTS.md\u003c/a>, que se carga en cada \u003ca class=\"x\" data-slug=\"session\" href=\"?term=session\">sesión\u003c/a> sin importar la tarea. Una skill se lee cuando aparece cierto tipo de trabajo (publicar un release, armar el esqueleto de un servicio nuevo, escribir una migración) y se ignora el resto del tiempo.\u003c/p>\n\u003cdiv class=\"block avoid\">\u003cp class=\"lbl\">Evita\u003c/p>\u003cp>&quot;\u003ca class=\"x\" data-slug=\"tool\" href=\"?term=tool\">tool\u003c/a>&quot; (una tool es lo que el agente \u003cem>llama\u003c/em>; una skill es lo que \u003cem>lee\u003c/em>).\u003c/p>\u003c/div>\n\u003cdiv class=\"block\">\u003cp class=\"lbl\">Uso\u003c/p>\n\u003cp>&quot;¿Dónde pongo el runbook de despliegue?&quot;\u003c/p>\n\u003cp>&quot;Como skill: el agente la carga solo cuando la tarea involucra un despliegue. En AGENTS.md quemaría tokens en cada \u003ca class=\"x\" data-slug=\"turn\" href=\"?term=turn\">turno\u003c/a> por algo que usamos una vez por semana.&quot;\u003c/p>\n\n\u003c/div>","texto":"Una capacidad enseñable empaquetada como unidad, fuera del contexto hasta que un puntero de contexto la trae para la tarea. Una capacidad enseñable empaquetada como unidad (instrucciones y recursos para hacer bien una tarea), que se mantiene en el entorno hasta que un puntero de contexto la trae a la ventana de contexto para la tarea en curso. Es la unidad de revelación progresiva dentro de un harness . Las skills son un estándar abierto, definido en agentskills.io (desarrollado originalmente por Anthropic y adoptado después por la mayoría de los harness grandes), así que una skill escrita una vez funciona en todos. El formato es una carpeta que contiene: Un archivo SKILL.md : metadatos (mínimo un nombre y una descripción) más las instrucciones mismas Opcionalmente, scripts que el agente puede ejecutar Opcionalmente, plantillas y material de referencia al que apuntan las instrucciones Por defecto, solo el nombre y la descripción viven en el contexto . Cuando la tarea del agente calza, carga el resto. Hasta entonces, la skill casi no ocupa espacio (una o dos frases de tokens ), sin importar cuán extensas sean sus instrucciones completas. Esto distingue a las skills de AGENTS.md , que se carga en cada sesión sin importar la tarea. Una skill se lee cuando aparece cierto tipo de trabajo (publicar un release, armar el esqueleto de un servicio nuevo, escribir una migración) y se ignora el resto del tiempo. Evita tool (una tool es lo que el agente llama ; una skill es lo que lee ). Uso ¿Dónde pongo el runbook de despliegue? Como skill: el agente la carga solo cuando la tarea involucra un despliegue. En AGENTS.md quemaría tokens en cada turno por algo que usamos una vez por semana.","salientes":["environment","context-pointer","context-window","progressive-disclosure","harness","agent","context","token","agentsmd","session","tool","turn"],"entrantes":5},{"termino":"Subagent","slug":"subagent","seccion":"Sección 6 — Memoria y conducción","descripcion":"Agente que otro agente crea con un tool call. Corre en su propia sesión y devuelve un solo tool result; no puede crear subagentes.","html":"\u003cp>Un \u003ca class=\"x\" data-slug=\"agent\" href=\"?term=agent\">agente\u003c/a> que otro agente crea mediante un \u003ca class=\"x\" data-slug=\"tool-call\" href=\"?term=tool-call\">tool call\u003c/a>. Corre en su propia \u003ca class=\"x\" data-slug=\"session\" href=\"?term=session\">sesión\u003c/a> con su propia \u003ca class=\"x\" data-slug=\"context-window\" href=\"?term=context-window\">ventana de contexto\u003c/a>, y devuelve un solo \u003ca class=\"x\" data-slug=\"tool-result\" href=\"?term=tool-result\">tool result\u003c/a> al agente padre. Es distinto de un \u003ca class=\"x\" data-slug=\"handoff\" href=\"?term=handoff\">handoff\u003c/a>: el padre específicamente espera un retorno, mientras que un handoff no tiene vuelta. \u003cstrong>No puede crear más subagentes\u003c/strong>: el árbol tiene un solo nivel de profundidad. Los subagentes existen para aislar \u003ca class=\"x\" data-slug=\"context\" href=\"?term=context\">contexto\u003c/a>, no para componer jerarquías.\u003c/p>\n\u003cp>La idea es mantener el trabajo ruidoso fuera del contexto del padre. Una búsqueda amplia o una expedición larga de lectura de archivos produce páginas de tool results, la mayoría relevantes solo hasta encontrar la respuesta. Si corre dentro del padre, todo eso se queda en el contexto del padre por el resto de la sesión. Si corre dentro de un subagente, el ruido llena una ventana desechable en su lugar, y solo el reporte final llega al contexto del padre. Ese reporte es una \u003ca class=\"x\" data-slug=\"secondary-source\" href=\"?term=secondary-source\">fuente secundaria\u003c/a>: el padre recibe el relato del subagente sobre lo que encontró, no los resultados en bruto, así que cualquier cosa que el reporte deje fuera queda invisible para el padre.\u003c/p>\n\u003cp>Los subagentes además corren en paralelo: un padre puede lanzar varios a la vez sobre piezas de trabajo independientes.\u003c/p>\n\u003cdiv class=\"block\">\u003cp class=\"lbl\">Uso\u003c/p>\n\u003cp>&quot;Los resultados del grep me están reventando el contexto.&quot;\u003c/p>\n\u003cp>&quot;Lanza un subagente para la búsqueda: va a quemar su propia ventana de contexto con el ruido y te va a reportar de vuelta los dos paths que en realidad necesitas.&quot;\u003c/p>\n\n\u003c/div>","texto":"Agente que otro agente crea con un tool call. Corre en su propia sesión y devuelve un solo tool result; no puede crear subagentes. Un agente que otro agente crea mediante un tool call . Corre en su propia sesión con su propia ventana de contexto , y devuelve un solo tool result al agente padre. Es distinto de un handoff : el padre específicamente espera un retorno, mientras que un handoff no tiene vuelta. No puede crear más subagentes : el árbol tiene un solo nivel de profundidad. Los subagentes existen para aislar contexto , no para componer jerarquías. La id
