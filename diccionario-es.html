<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<title>Diccionario de AI Coding</title>
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap"
/>
<style>
  :root {
    --ground: #f7f8f8;
    --surface: #ffffff;
    --surface-sunk: #eef1f1;
    --ink: #1b2327;
    --ink-soft: #5a686e;
    --ink-faint: #8d9a9f;
    --line: #dfe4e5;
    --line-soft: #ebeeee;
    --accent: #38484e;
    --accent-on: #ffffff;
    --mark: #c12637;
    --hit: #fbe6c9;
    --shadow:
      0 1px 2px rgba(27, 35, 39, 0.06), 0 8px 24px rgba(27, 35, 39, 0.06);

    --sans: "IBM Plex Sans", -apple-system, "Segoe UI", system-ui, sans-serif;
    --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
    --mono: "IBM Plex Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #14191c;
      --surface: #1b2226;
      --surface-sunk: #101517;
      --ink: #e6ebec;
      --ink-soft: #a3b0b5;
      --ink-faint: #74838a;
      --line: #2c363b;
      --line-soft: #232c30;
      --accent: #8fa8b2;
      --accent-on: #101517;
      --mark: #e4586a;
      --hit: #4a3a1c;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.3);
    }
  }

  :root[data-theme="dark"] {
    --ground: #14191c;
    --surface: #1b2226;
    --surface-sunk: #101517;
    --ink: #e6ebec;
    --ink-soft: #a3b0b5;
    --ink-faint: #74838a;
    --line: #2c363b;
    --line-soft: #232c30;
    --accent: #8fa8b2;
    --accent-on: #101517;
    --mark: #e4586a;
    --hit: #4a3a1c;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.3);
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    display: grid;
    grid-template-columns: 300px minmax(0, 1fr);
    min-height: 100vh;
  }

  /* ---------- barra lateral ---------- */

  .side {
    display: flex;
    flex-direction: column;
    gap: 0;
    background: var(--surface);
    border-right: 1px solid var(--line);
    height: 100vh;
    position: sticky;
    top: 0;
  }

  .brand {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 20px 20px 14px;
  }

  .brand h1 {
    margin: 0;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .brand p {
    margin: 0;
    font-size: 11.5px;
    color: var(--ink-faint);
    letter-spacing: 0.02em;
    font-variant-numeric: tabular-nums;
  }

  .find {
    padding: 0 20px 12px;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  .find input {
    width: 100%;
    font: inherit;
    font-size: 14px;
    color: var(--ink);
    background: var(--surface-sunk);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 8px 10px 8px 30px;
  }

  .find input::placeholder {
    color: var(--ink-faint);
  }

  .find input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  .find svg {
    position: absolute;
    left: 29px;
    top: 9px;
    width: 14px;
    height: 14px;
    color: var(--ink-faint);
    pointer-events: none;
  }

  .find .tally {
    font-size: 11px;
    color: var(--ink-faint);
    padding: 6px 2px 0;
    font-variant-numeric: tabular-nums;
    min-height: 17px;
  }

  .list {
    overflow-y: auto;
    padding: 0 12px 24px;
    flex: 1;
  }

  .grp {
    margin-bottom: 14px;
  }

  .grp > h2 {
    margin: 0;
    padding: 8px 8px 6px;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }

  .list button {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
    width: 100%;
    text-align: left;
    font: inherit;
    font-size: 13.5px;
    color: var(--ink-soft);
    background: none;
    border: 0;
    border-left: 2px solid transparent;
    border-radius: 0 5px 5px 0;
    padding: 5px 8px;
    cursor: pointer;
  }

  .list button:hover {
    background: var(--surface-sunk);
    color: var(--ink);
  }

  .list button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: -2px;
  }

  .list button[aria-current="true"] {
    background: var(--surface-sunk);
    border-left-color: var(--mark);
    color: var(--ink);
    font-weight: 500;
  }

  .list button .n {
    font-size: 10.5px;
    color: var(--ink-faint);
    font-variant-numeric: tabular-nums;
    flex: none;
  }

  .empty {
    padding: 10px 8px;
    font-size: 13px;
    color: var(--ink-faint);
  }

  /* ---------- lectura ---------- */

  .main {
    padding: 0 40px 96px;
    min-width: 0;
  }

  .entry {
    max-width: 68ch;
    margin-inline: auto;
    padding-top: 44px;
  }

  .eyebrow {
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin: 0 0 8px;
  }

  .entry > h2 {
    font-size: 34px;
    line-height: 1.12;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin: 0;
    text-wrap: balance;
  }

  .lede {
    font-family: var(--serif);
    font-size: 17px;
    line-height: 1.5;
    color: var(--ink-soft);
    margin: 10px 0 0;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--line);
  }

  .body {
    font-family: var(--serif);
    font-size: 16.5px;
    line-height: 1.62;
  }
  .body p {
    margin: 18px 0;
  }
  .body strong {
    font-weight: 600;
  }
  .body code {
    font-family: var(--mono);
    font-size: 0.86em;
    background: var(--surface-sunk);
    border: 1px solid var(--line-soft);
    border-radius: 4px;
    padding: 1px 4px;
  }

  .body .tw {
    overflow-x: auto;
    margin: 22px 0;
  }
  .body table {
    border-collapse: collapse;
    font-family: var(--sans);
    font-size: 13.5px;
    width: 100%;
  }
  .body th,
  .body td {
    text-align: left;
    vertical-align: top;
    padding: 8px 14px 8px 0;
    border-bottom: 1px solid var(--line-soft);
  }
  .body th {
    font-weight: 600;
    color: var(--ink-faint);
    font-size: 11px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    border-bottom-color: var(--line);
  }

  a.x {
    color: var(--ink);
    text-decoration: underline;
    text-decoration-color: var(--line);
    text-underline-offset: 3px;
    text-decoration-thickness: 1.5px;
    cursor: pointer;
  }
  a.x:hover {
    text-decoration-color: var(--accent);
  }
  a.x:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 2px;
  }

  .block {
    margin: 24px 0;
    padding: 16px 18px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
  }
  .block > .lbl {
    font-family: var(--sans);
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin: 0 0 8px;
  }
  .block p {
    margin: 8px 0;
  }
  .block p:last-child {
    margin-bottom: 0;
  }
  .avoid {
    font-family: var(--serif);
  }
  .avoid em {
    font-style: normal;
    font-weight: 600;
    font-family: var(--sans);
    font-size: 0.82em;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--mark);
  }

  .also {
    margin-top: 34px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
  }
  .also h3 {
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin: 0 0 10px;
  }
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .chips button {
    font: inherit;
    font-size: 12.5px;
    color: var(--ink-soft);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 3px 11px;
    cursor: pointer;
  }
  .chips button:hover {
    border-color: var(--accent);
    color: var(--ink);
  }
  .chips button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  /* ---------- portada ---------- */

  .home {
    max-width: 72ch;
    margin-inline: auto;
    padding-top: 44px;
  }
  .home > h2 {
    font-size: 30px;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin: 0 0 10px;
    text-wrap: balance;
  }
  .home > p {
    font-family: var(--serif);
    font-size: 16.5px;
    line-height: 1.6;
    color: var(--ink-soft);
    margin: 0 0 8px;
    max-width: 62ch;
  }
  .home .keys {
    font-family: var(--sans);
    font-size: 13px;
    color: var(--ink-faint);
    margin-top: 18px;
  }
  kbd {
    font-family: var(--mono);
    font-size: 11.5px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-bottom-width: 2px;
    border-radius: 4px;
    padding: 1px 5px;
    color: var(--ink-soft);
  }
  .secs {
    display: grid;
    gap: 1px;
    background: var(--line-soft);
    border: 1px solid var(--line-soft);
    border-radius: 8px;
    overflow: hidden;
    margin-top: 26px;
  }
  .secs > div {
    background: var(--surface);
    padding: 13px 16px;
    display: flex;
    align-items: baseline;
    gap: 12px;
  }
  .secs .t {
    font-size: 13.5px;
    font-weight: 500;
    flex: 1;
  }
  .secs .c {
    font-size: 11.5px;
    color: var(--ink-faint);
    font-variant-numeric: tabular-nums;
  }
  .secs .top {
    font-size: 12px;
    color: var(--ink-faint);
  }

  /* ---------- pie ---------- */

  .foot {
    max-width: 68ch;
    margin-top: 56px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    font-size: 11.5px;
    line-height: 1.6;
    color: var(--ink-faint);
  }
  .foot a {
    color: var(--ink-soft);
  }

  mark {
    background: var(--hit);
    color: inherit;
    border-radius: 2px;
  }

  .bar {
    display: none;
  }

  /* ---------- angosto ---------- */

  @media (max-width: 900px) {
    .app {
      grid-template-columns: 1fr;
    }
    .bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 3;
    }
    .bar button {
      font: inherit;
      font-size: 13px;
      color: var(--ink);
      background: var(--surface-sunk);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 5px 11px;
      cursor: pointer;
    }
    .bar span {
      font-size: 13px;
      font-weight: 500;
    }
    .side {
      position: fixed;
      inset: 0;
      z-index: 4;
      height: 100dvh;
      border-right: 0;
    }
    body:not(.open) .side {
      display: none;
    }
    .main {
      padding: 0 20px 80px;
    }
    .entry,
    .home {
      padding-top: 26px;
    }
    .entry > h2 {
      font-size: 27px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    * {
      animation: none !important;
      transition: none !important;
    }
  }
</style>

<div class="bar">
  <button id="toggle" type="button">Términos</button>
  <span id="barTitle">Diccionario de AI Coding</span>
</div>

<div class="app">
  <aside class="side" id="side">
    <div class="brand">
      <h1>Diccionario de AI Coding</h1>
      <p id="brandSub"></p>
    </div>
    <div class="find">
      <svg
        viewBox="0 0 16 16"
        fill="none"
        stroke="currentColor"
        stroke-width="1.6"

      >
        <circle cx="7" cy="7" r="4.5"></circle>

      <input
        id="q"

        aria-label="Buscar"
      />
      <div class="tally" id="tally"></div>
    </div>
    <nav class="list" id="list" aria-label="Términos"></nav>
  </aside>

  <main class="main" id="main"></main>
</div>

<script>
  const DATOS = {"secciones":[{"titulo":"Sección 1 — El modelo","terminos":["ai","model","parameters","training","inference","effort","token","next-token-prediction","non-determinism","model-provider","harness","model-provider-request","input-tokens","output-tokens","prefix-cache","cache-tokens"]},{"titulo":"Sección 2 — Sesiones, ventanas de contexto y turnos","terminos":["stateless","context","context-window","stateful","agent","system-prompt","session","turn"]},{"titulo":"Sección 3 — Tools y entorno","terminos":["environment","filesystem","tool","tool-call","tool-result","mcp","permission-request","permission-mode","agent-mode","sandbox"]},{"titulo":"Sección 4 — Modos de falla","terminos":["sycophancy","hallucination","parametric-knowledge","knowledge-cutoff","contextual-knowledge","attention-relationship","attention-budget","attention-degradation","smart-zone"]},{"titulo":"Sección 5 — Handoffs","terminos":["clearing","handoff","primary-source","secondary-source","handoff-artifact","spec","ticket","compaction","autocompact"]},{"titulo":"Sección 6 — Memoria y conducción","terminos":["memory-system","agentsmd","progressive-disclosure","context-pointer","skill","subagent"]},{"titulo":"Sección 7 — Patrones de trabajo","terminos":["human-in-the-loop","afk","automated-check","automated-review","human-review","vibe-coding","design-concept","grilling","prototyping","dx","ax"]}],"entradas":[{"termino":"AI","slug":"ai","seccion":"Sección 1 — El modelo","descripcion":"Una etiqueta móvil, no una tecnología. Apunta a lo que los computadores recién logran hacer de forma impresionante: hoy, los LLM.","html":"\u003cp>Una etiqueta móvil, no una tecnología. &quot;IA&quot; no nombra una cosa fija como sí lo hacen \u003ca class=\"x\" data-slug=\"model\" href=\"?term=model\">modelo\u003c/a> o \u003ca class=\"x\" data-slug=\"token\" href=\"?term=token\">token\u003c/a>: apunta a lo que los computadores recién logran hacer de manera impresionante. Ahora mismo apunta a los grandes modelos de lenguaje. Antes apuntó a cosas muy distintas:\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Época\u003c/th>\n\u003cth>Qué significaba &quot;IA&quot;\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Años 50\u003c/td>\n\u003ctd>Razonamiento simbólico: demostradores de teoremas, programas de damas.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Años 60 y 70\u003c/td>\n\u003ctd>Programas simbólicos basados en reglas: ELIZA, SHRDLU.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Años 80\u003c/td>\n\u003ctd>Sistemas expertos: miles de reglas si-entonces escritas a mano que codificaban la pericia humana.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Años 90\u003c/td>\n\u003ctd>Búsqueda en árboles de juego: Deep Blue le gana a Kasparov (1997). Los investigadores evitaban la palabra &quot;IA&quot;\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Años 2000\u003c/td>\n\u003ctd>Aprendizaje automático estadístico: filtros de spam, recomendadores. Se vendía como &quot;machine learning&quot;\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Años 2010\u003c/td>\n\u003ctd>Aprendizaje profundo: reconocimiento de imágenes (AlexNet, 2012), AlphaGo (2016).\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Años 2020\u003c/td>\n\u003ctd>Grandes modelos de lenguaje: ChatGPT (2022) hizo que &quot;IA&quot; significara chatbots\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>El puntero se mueve por un mecanismo conocido, que a veces se llama el efecto IA: una vez que una técnica funciona de forma confiable se la rebautiza (es &quot;solo&quot; búsqueda, &quot;solo&quot; estadística) y la palabra &quot;IA&quot; se corre hacia el siguiente problema sin resolver. La observación es vieja. Bertram Raphael lo puso así en 1971: &quot;IA es un nombre colectivo para los problemas que todavía no sabemos resolver bien con un computador&quot;. La versión de Larry Tesler, de alrededor de 1979: &quot;Inteligencia es todo lo que las máquinas aún no han hecho&quot;.\u003c/p>\n\u003cp>Por esto las conversaciones sobre IA tan seguido pasan de largo una al lado de la otra. Una afirmación como &quot;la IA no puede razonar&quot; o &quot;la IA está sobrevalorada&quot; lleva una fecha oculta: puede estar hablando de sistemas expertos, de clasificadores de imágenes de la década de 2010 o del LLM del mes pasado, y cada referente sostiene una conclusión distinta. Cuando una discusión sobre IA se traba, el arreglo suele ser cambiar la palabra por el término preciso que en realidad se quiere decir: el modelo, el \u003ca class=\"x\" data-slug=\"harness\" href=\"?term=harness\">harness\u003c/a>, el \u003ca class=\"x\" data-slug=\"agent\" href=\"?term=agent\">agente\u003c/a>, el \u003ca class=\"x\" data-slug=\"context\" href=\"?term=context\">contexto\u003c/a> que se le dio.\u003c/p>\n\u003cdiv class=\"block avoid\">\u003cp class=\"lbl\">Evita\u003c/p>\u003cp>&quot;IA&quot; en cualquier afirmación técnica. Nombra la parte a la que te refieres. &quot;AI coding&quot; como etiqueta de la práctica está bien; &quot;la IA está alucinando&quot; no.\u003c/p>\u003c/div>\n\u003cdiv class=\"block\">\u003cp class=\"lbl\">Uso\u003c/p>\n\u003cp>&quot;El CTO quiere saber si la IA podría hacerse cargo de la cola de triaje.&quot;\u003c/p>\n\u003cp>&quot;Traduce eso antes de dimensionarlo: se refiere a un LLM dentro de un harness con acceso al sistema de tickets. &#39;IA&#39; a secas no es una spec.&quot;\u003c/p>\n\n\u003c/div>","texto":"Una etiqueta móvil, no una tecnología. Apunta a lo que los computadores recién logran hacer de forma impresionante: hoy, los LLM. Una etiqueta móvil, no una tecnología. IA no nombra una cosa fija como sí lo hacen modelo o token : apunta a lo que los computadores recién logran hacer de manera impresionante. Ahora mismo apunta a los grandes modelos de lenguaje. Antes apuntó a cosas muy distintas: Época Qué significaba IA Años 50 Razonamiento simbólico: demostradores de teoremas, programas de damas. Años 60 y 70 Programas simbólicos basados en reglas: ELIZA, SHRDLU. Años 80 Sistemas expertos: miles de reglas si-entonces escritas a mano que codificaban la pericia humana. Años 90 Búsqueda en árboles de juego: Deep Blue le gana a Kasparov (1997). Los investigadores evitaban la palabra IA Años 2000 Aprendizaje automático estadístico: filtros de spam, recomendadores. Se vendía como machine learning Años 2010 Aprendizaje profundo: reconocimiento de imágenes (AlexNet, 2012), AlphaGo (2016). Años 2020 Grandes modelos de lenguaje: ChatGPT (2022) hizo que IA significara chatbots El puntero se mueve por un mecanismo conocido, que a veces se llama el efecto IA: una vez que una técnica funciona de forma confiable se la rebautiza (es solo búsqueda, solo estadística) y la palabra IA se corre hacia el siguiente problema sin resolver. La observación es vieja. Bertram Raphael lo puso así en 1971: IA es un nombre colectivo para los problemas que todavía no sabemos resolver bien con un computador . La versión de Larry Tesler, de alrededor de 1979: Inteligencia es todo lo que las máquinas aún no han hecho . Por esto las conversaciones sobre IA tan seguido pasan de largo una al lado de la otra. Una afirmación como la IA no puede razonar o la IA está sobrevalorada lleva una fecha oculta: puede estar hablando de sistemas expertos, de clasificadores de imágenes de la década de 2010 o del LLM del mes pasado, y cada referente sostiene una conclusión distinta. Cuando una discusión sobre IA se traba, el arreglo suele ser cambiar la palabra por el término preciso que en realidad se quiere decir: el modelo, el harness , el agente , el contexto que se le dio. Evita IA en cualquier afirmación técnica. Nombra la parte a la que te refieres. AI coding como etiqueta de la práctica está bien; la IA está alucinando no. Uso El CTO quiere saber si la IA podría hacerse cargo de la cola de triaje. Traduce eso antes de dimensionarlo: se refiere a un LLM dentro de un harness con acceso al sistema de tickets. &#39;IA&#39; a secas no es una spec.","salientes":["model","token","harness","agent","context"],"entrantes":4},{"termino":"Model","slug":"model","seccion":"Sección 1 — El modelo","descripcion":"Los parámetros. Sin estado: hace predicción del siguiente token y nada más. No puede actuar como agente por sí solo.","html":"\u003cp>Los \u003ca class=\"x\" data-slug=\"parameters\" href=\"?term=parameters\">parámetros\u003c/a>. \u003ca class=\"x\" data-slug=\"stateless\" href=\"?term=stateless\">Sin estado\u003c/a>: solo hace \u003ca class=\"x\" data-slug=\"next-token-prediction\" href=\"?term=next-token-prediction\">predicción del siguiente token\u003c/a> y nada más. &quot;Claude Opus 4.x&quot; y &quot;GPT-5.x&quot; son modelos. Por sí solo, un modelo no puede hacer nada agéntico: necesita un \u003ca class=\"x\" data-slug=\"harness\" href=\"?term=harness\">harness\u003c/a>.\u003c/p>\n\u003cp>Un modelo no puede leer archivos, ejecutar comandos, navegar la web ni recordar lo de ayer: recibe \u003ca class=\"x\" data-slug=\"token\" href=\"?term=token\">tokens\u003c/a> y predice tokens de salida, una vez por cada \u003ca class=\"x\" data-slug=\"model-provider-request\" href=\"?term=model-provider-request\">petición al proveedor del modelo\u003c/a>. Todo lo que parece un \u003ca class=\"x\" data-slug=\"agent\" href=\"?term=agent\">agente\u003c/a> trabajando (elegir \u003ca class=\"x\" data-slug=\"tool\" href=\"?term=tool\">tools\u003c/a>, leer resultados, repetir el ciclo hasta terminar la tarea) es el harness orquestando muchas de esas predicciones seguidas.\u003c/p>\n\u003cp>Los \u003ca class=\"x\" data-slug=\"model-provider\" href=\"?term=model-provider\">proveedores del modelo\u003c/a> ofrecen los modelos en niveles: uno grande, el más inteligente pero lento y caro, y otros más chicos, más rápidos y baratos pero menos capaces. Elegir el nivel es una decisión real (pesado para planificar y depurar casos difíciles, liviano para cambios mecánicos), y los harness permiten cambiarlo a mitad de \u003ca class=\"x\" data-slug=\"session\" href=\"?term=session\">sesión\u003c/a>.\u003c/p>\n\u003cp>Ser estricto con la palabra también afila el diagnóstico. &quot;El modelo es malo para esto&quot; es una afirmación específica: el mismo modelo en otro harness, o con otro \u003ca class=\"x\" data-slug=\"context\" href=\"?term=context\">contexto\u003c/a>, suele comportarse completamente distinto. Antes de culpar al modelo, revisa qué se le dio: la mayoría de las salidas decepcionantes se explican por el contexto o el harness, no por los parámetros.\u003c/p>\n\u003cdiv class=\"block\">\u003cp class=\"lbl\">Uso\u003c/p>\n\u003cp>&quot;¿Cambiamos el modelo de Sonnet a Opus para el paso de planificación?&quot;\u003c/p>\n\u003cp>&quot;Pruébalo, pero el harness es lo que hace casi todo el trabajo en esta tarea. Cambiar el modelo no sirve de nada si el \u003ca class=\"x\" data-slug=\"system-prompt\" href=\"?term=system-prompt\">system prompt\u003c/a> y las tools están mal.&quot;\n\u003c/content>\u003c/p>\n\n\u003c/div>","texto":"Los parámetros. Sin estado: hace predicción del siguiente token y nada más. No puede actuar como agente por sí solo. Los parámetros . Sin estado : solo hace predicción del siguiente token y nada más. Claude Opus 4.x y GPT-5.x son modelos. Por sí solo, un modelo no puede hacer nada agéntico: necesita un harness . Un modelo no puede leer archivos, ejecutar comandos, navegar la web ni recordar lo de ayer: recibe tokens y predice tokens de salida, una vez por cada petición al proveedor del modelo . Todo lo que parece un agente trabajando (elegir tools , leer resultados, repetir el ciclo hasta terminar la tarea) es el harness orquestando muchas de esas predicciones seguidas. Los proveedores del modelo ofrecen los modelos en niveles: uno grande, el más inteligente pero lento y caro, y otros más chicos, más rápidos y baratos pero menos capaces. Elegir el nivel es una decisión real (pesado para planificar y depurar casos difíciles, liviano para cambios mecánicos), y los harness permiten cambiarlo a mitad de sesión . Ser estricto con la palabra también afila el diagnóstico. El modelo es malo para esto es una afirmación específica: el mismo modelo en otro harness, o con otro contexto , suele comportarse completamente distinto. Antes de culpar al modelo, revisa qué se le dio: la mayoría de las salidas decepcionantes se explican por el contexto o el harness, no por los parámetros. Uso ¿Cambiamos el modelo de Sonnet a Opus para el paso de planificación? Pruébalo, pero el harness es lo que hace casi todo el trabajo en esta tarea. Cambiar el modelo no sirve de nada si el system prompt y las tools están mal.","salientes":["parameters","stateless","next-token-prediction","harness","token","model-provider-request","agent","tool","model-provider","session","context","system-prompt"],"entrantes":42},{"termino":"Parameters","slug":"parameters","seccion":"Sección 1 — El modelo","descripcion":"Los números dentro de un modelo, a veces miles de millones, ajustados en el entrenamiento. Todo lo que sabe vive ahí. También: pesos.","html":"\u003cp>Los números dentro de un \u003ca class=\"x\" data-slug=\"model\" href=\"?term=model\">modelo\u003c/a> (a veces miles de millones de ellos), ajustados durante el \u003ca class=\"x\" data-slug=\"training\" href=\"?term=training\">entrenamiento\u003c/a>. Todo lo que el modelo &quot;sabe&quot; vive en ellos. El entrenamiento los fija; la \u003ca class=\"x\" data-slug=\"inference\" href=\"?term=inference\">inferencia\u003c/a> los usa sin tocarlos. También se los llama \u003cem>pesos\u003c/em>.\u003c/p>\n\u003cp>En términos mecánicos, los parámetros son lo que convierte la entrada en salida. La \u003ca class=\"x\" data-slug=\"next-token-prediction\" href=\"?term=next-token-prediction\">predicción del siguiente token\u003c/a> es un cálculo gigantesco: los \u003ca class=\"x\" data-slug=\"token\" href=\"?term=token\">tokens\u003c/a> de la \u003ca class=\"x\" data-slug=\"context-window\" href=\"?term=context-window\">ventana de contexto\u003c/a> entran, se multiplican a través de los parámetros, y sale una predicción para el siguiente token. No hay una base de datos de hechos dentro del modelo, ni una tabla de consulta de código: solo estos números, dispuestos para que el cálculo tienda a producir una salida útil. Los hechos que el modelo puede recitar desde el entrenamiento, como una API de librería estándar, son \u003ca class=\"x\" data-slug=\"parametric-knowledge\" href=\"?term=parametric-knowledge\">conocimiento paramétrico\u003c/a>: están guardados en los parámetros, no se recuperan de ninguna parte.\u003c/p>\n\u003cp>El detalle que vale la pena internalizar es que los parámetros quedan congelados después del entrenamiento. Nada de lo que hagas en una \u003ca class=\"x\" data-slug=\"session\" href=\"?term=session\">sesión\u003c/a> los cambia: ninguna corrección que hagas, ningún código que le muestres, ningún error del que aprenda. Cada sesión corre sobre los mismos números. Por eso el modelo es \u003ca class=\"x\" data-slug=\"stateless\" href=\"?term=stateless\">sin estado\u003c/a>, por eso su conocimiento incorporado se detiene en la \u003ca class=\"x\" data-slug=\"knowledge-cutoff\" href=\"?term=knowledge-cutoff\">fecha de corte del conocimiento\u003c/a>, y por eso cualquier cosa específica de un proyecto tiene que llegar vía \u003ca class=\"x\" data-slug=\"context\" href=\"?term=context\">contexto\u003c/a> en su lugar. La única forma de cambiar los parámetros es más entrenamiento, lo que produce, en la práctica, un modelo distinto.\u003c/p>\n\u003cdiv class=\"block\">\u003cp class=\"lbl\">Uso\u003c/p>\n\u003cp>&quot;¿Podemos afinarlo con nuestro código?&quot;\u003c/p>\n\u003cp>&quot;Eso actualizaría los parámetros: sería un modelo distinto después. Para un solo proyecto casi siempre sale más barato cargar el código como contexto que reentrenar.&quot;\n\u003c/content>\u003c/p>\n\n\u003c/div>","texto":"Los números dentro de un modelo, a veces miles de millones, ajustados en el entrenamiento. Todo lo que sabe vive ahí. También: pesos. Los números dentro de un modelo (a veces miles de millones de ellos), ajustados durante el entrenamiento . Todo lo que el modelo sabe vive en ellos. El entrenamiento los fija; la inferencia los usa sin tocarlos. También se los llama pesos . En términos mecánicos, los parámetros son lo que convierte la entrada en salida. La predicción del siguiente token es un cálculo gigantesco: los tokens de la ventana de contexto entran, se multiplican a través de los parámetros, y sale una predicción para el siguiente token. No hay una base de datos de hechos dentro del modelo, ni una tabla de consulta de código: solo estos números, dispuestos para que el cálculo tienda a producir una salida útil. Los hechos que el modelo puede recitar desde el entrenamiento, como una API de librería estándar, son conocimiento paramétrico : están guardados en los parámetros, no se recuperan de ninguna parte. El detalle que vale la pena internalizar es que los parámetros quedan congelados después del entrenamiento. Nada de lo que hagas en una sesión los cambia: ninguna corrección que hagas, ningún código que le muestres, ningún error del que aprenda. Cada sesión corre sobre los mismos números. Por eso el modelo es sin estado , por eso su conocimiento incorporado se detiene en la fecha de corte del conocimiento , y por eso cualquier cosa específica de un proyecto tiene que llegar vía contexto en su lugar. La única forma de cambiar los parámetros es más entrenamiento, lo que produce, en la práctica, un modelo distinto. Uso ¿Podemos afinarlo con nuestro código? Eso actualizaría los parámetros: sería un modelo distinto después. Para un solo proyecto casi siempre sale más barato cargar el código como contexto que reentrenar.","salientes":["model","training","inference","next-token-prediction","token","context-window","parametric-knowledge","session","stateless","knowledge-cutoff","context"],"entrantes":11},{"termino":"Training","slug":"training","seccion":"Sección 1 — El modelo","descripcion":"El proceso que fija los parámetros de un modelo, exponiéndolo a mucho texto y ajustándolo para predecir mejor el siguiente token.","html":"\u003cp>El proceso que fija los parámetros de un \u003ca class=\"x\" data-slug=\"model\" href=\"?term=model\">modelo\u003c/a>: sus \u003ca class=\"x\" data-slug=\"parameters\" href=\"?term=parameters\">parámetros\u003c/a> se ajustan exponiéndolo a enormes volúmenes de texto para mejorar la \u003ca class=\"x\" data-slug=\"next-token-prediction\" href=\"?term=next-token-prediction\">predicción del siguiente token\u003c/a>. Es un proceso único y caro que hace el \u003ca class=\"x\" data-slug=\"model-provider\" href=\"?term=model-provider\">proveedor del modelo\u003c/a>. Incluye tanto el pre-entrenamiento (la corrida masiva) como el post-entrenamiento (ajustes posteriores como seguir instrucciones y seguridad); la distinción no importa al nivel de este glosario.\u003c/p>\n\u003cp>El mecanismo es repetición a escala: mostrarle al modelo un fragmento de texto, hacer que prediga el siguiente \u003ca class=\"x\" data-slug=\"token\" href=\"?term=token\">token\u003c/a>, empujar los parámetros hacia lo que de verdad fue el siguiente token, y repetir a través de billones de tokens. Nada queda guardado como hechos o reglas: todo lo que el modelo &quot;sabe&quot; es un efecto secundario de volverse mejor prediciendo, comprimido en los parámetros como \u003ca class=\"x\" data-slug=\"parametric-knowledge\" href=\"?term=parametric-knowledge\">conocimiento paramétrico\u003c/a>.\u003c/p>\n\u003cp>Dos consecuencias importan en el día a día. El entrenamiento termina en un punto del tiempo, así que el modelo tiene una \u003ca class=\"x\" data-slug=\"knowledge-cutoff\" href=\"?term=knowledge-cutoff\">fecha de corte del conocimiento\u003c/a>: no vio la versión de la librería a la que actualizaste el mes pasado. Y el entrenamiento no es algo que tú puedas hacer: cuando el modelo no conoce tu código, tus convenciones o tus APIs internas, la solución nunca es &quot;enséñale al modelo&quot;, sino poner ese material en el \u003ca class=\"x\" data-slug=\"context\" href=\"?term=context\">contexto\u003c/a>, la única entrada que controlas.\u003c/p>\n\u003cdiv class=\"block\">\u003cp class=\"lbl\">Uso\u003c/p>\n\u003cp>&quot;¿Podemos lograr que conozca nuestra API interna?&quot;\u003c/p>\n\u003cp>&quot;No con entrenamiento: eso es un proceso de meses que hace el proveedor del modelo. Mejor carga la documentación de la API al contexto, esa es la palanca que sí tienes.&quot;\n\u003c/content>\u003c/p>\n\n\u003c/div>","texto":"El proceso que fija los parámetros de un modelo, exponiéndolo a mucho texto y ajustándolo para predecir mejor el siguiente token. El proceso que fija los parámetros de un modelo : sus parámetros se ajustan exponiéndolo a enormes volúmenes de texto para mejorar la predicción del siguiente token . Es un proceso único y caro que hace el proveedor del modelo . Incluye tanto el pre-entrenamiento (la corrida masiva) como el post-entrenamiento (ajustes posteriores como seguir instrucciones y seguridad); la distinción no importa al nivel de este glosario. El mecanismo es repetición a escala: mostrarle al modelo un fragmento de texto, hacer que prediga el siguiente token , empujar los parámetros hacia lo que de verdad fue el siguiente token, y repetir a través de billones de tokens. Nada queda guardado como hechos o reglas: todo lo que el modelo sabe es un efecto secundario de volverse mejor prediciendo, comprimido en los parámetros como conocimiento paramétrico . Dos consecuencias importan en el día a día. El entrenamiento termina en un punto del tiempo, así que el modelo tiene una fecha de corte del conocimiento : no vio la versión de la librería a la que actualizaste el mes pasado. Y el entrenamiento no es algo que tú puedas hacer: cuando el modelo no conoce tu código, tus convenciones o tus APIs internas, la solución nunca es enséñale al modelo , sino poner ese material en el contexto , la única entrada que controlas. Uso ¿Podemos lograr que conozca nuestra API interna? No con entrenamiento: eso es un proceso de meses que hace el proveedor del modelo. Mejor carga la documentación de la API al contexto, esa es la palanca que sí tienes.","salientes":["model","parameters","next-token-prediction","model-provider","token","parametric-knowledge","knowledge-cutoff","context"],"entrantes":7},{"termino":"Inference","slug":"inference","seccion":"Sección 1 — El modelo","descripcion":"Correr un modelo entrenado para generar salida: lo que pasa en cada petición al proveedor. Los parámetros quedan fijos.","html":"\u003cp>Correr un \u003ca class=\"x\" data-slug=\"model\" href=\"?term=model\">modelo\u003c/a> ya entrenado para generar salida: lo que pasa en cada \u003ca class=\"x\" data-slug=\"model-provider-request\" href=\"?term=model-provider-request\">petición al proveedor del modelo\u003c/a>. Los \u003ca class=\"x\" data-slug=\"parameters\" href=\"?term=parameters\">parámetros\u003c/a> quedan fijos; el modelo solo hace \u003ca class=\"x\" data-slug=\"next-token-prediction\" href=\"?term=next-token-prediction\">predicción del siguiente token\u003c/a> sobre el \u003ca class=\"x\" data-slug=\"context\" href=\"?term=context\">contexto\u003c/a> que se le da. Es barata en comparación con el \u003ca class=\"x\" data-slug=\"training\" href=\"?term=training\">entrenamiento\u003c/a>, pero se cobra por \u003ca class=\"x\" data-slug=\"token\" href=\"?term=token\">token\u003c/a> y es el costo dominante de usar un modelo.\u003c/p>\n\u003cp>La vida de un modelo se divide en dos fases:\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Fase\u003c/th>\n\u003cth>Cuándo ocurre\u003c/th>\n\u003cth>Qué hace\u003c/th>\n\u003cth>Parámetros\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Entrenamiento\u003c/td>\n\u003ctd>Una vez, antes del lanzamiento\u003c/td>\n\u003ctd>Produce los parámetros a partir de un corpus de entrenamiento\u003c/td>\n\u003ctd>Se están escribiendo\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Inferencia\u003c/td>\n\u003ctd>Cada vez que alguien usa el modelo\u003c/td>\n\u003ctd>Corre los parámetros congelados sobre tu contexto para generar tokens\u003c/td>\n\u003ctd>Solo lectura\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Nada de lo que hagas en tiempo de inferencia se escribe de vuelta en los parámetros: por eso una corrección que haces hoy no se mantiene mañana. El modelo que comete el mismo error en la siguiente \u003ca class=\"x\" data-slug=\"session\" href=\"?term=session\">sesión\u003c/a>, después de que le explicaste el arreglo con cuidado, no te ignoró: es incapaz de aprender del intercambio. El modelo es \u003ca class=\"x\" data-slug=\"stateless\" href=\"?term=stateless\">sin estado\u003c/a>; la continuidad tiene que venir de afuera, desde la \u003ca class=\"x\" data-slug=\"context-window\" href=\"?term=context-window\">ventana de contexto\u003c/a> o un \u003ca class=\"x\" data-slug=\"memory-system\" href=\"?term=memory-system\">sistema de memoria\u003c/a>.\u003c/p>\n\u003cp>Este mecanismo también explica cómo se cobra. Cada petición corre el modelo sobre el contexto completo, así que el costo escala con los \u003ca class=\"x\" data-slug=\"input-tokens\" href=\"?term=input-tokens\">tokens de entrada\u003c/a> y los \u003ca class=\"x\" data-slug=\"output-tokens\" href=\"?term=output-tokens\">tokens de salida\u003c/a>, y un agente que hace docenas de llamadas a \u003ca class=\"x\" data-slug=\"tool\" href=\"?term=tool\">tools\u003c/a> paga inferencia en cada ida y vuelta. Por eso el tamaño del contexto es tanto una cuestión de costo como de calidad.\u003c/p>\n\u003cdiv class=\"block\">\u003cp class=\"lbl\">Uso\u003c/p>\n\u003cp>&quot;¿Por qué la cuenta escala con el uso en vez de ser una licencia plana?&quot;\u003c/p>\n\u003cp>&quot;Estás pagando la inferencia: cada petición al proveedor del modelo corre el modelo en el hardware del proveedor. El entrenamiento ya pasó, pero el costo de la inferencia se acumula por petición, y un solo \u003ca class=\"x\" data-slug=\"turn\" href=\"?term=turn\">turno\u003c/a> puede convertirse en muchas peticiones cuando se llaman tools.&quot;\n\u003c/content>\u003c/p>\n\n\u003c/div>","texto":"Correr un modelo entrenado para generar salida: lo que pasa en cada petición al proveedor. Los parámetros quedan fijos. Correr un modelo ya entrenado para generar salida: lo que pasa en cada petición al proveedor del modelo . Los parámetros quedan fijos; el modelo solo hace predicción del siguiente token sobre el contexto que se le da. Es barata en comparación con el entrenamiento , pero se cobra por token y es el costo dominante de usar un modelo. La vida de un modelo se divide en dos fases: Fase Cuándo ocurre Qué hace Parámetros Entrenamiento Una vez, antes del lanzamiento Produce los parámetros a partir de un corpus de entrenamiento Se están escribiendo Inferencia Cada vez que alguien usa el modelo Corre los parámetros congelados sobre tu contexto para generar tokens Solo lectura Nada de lo que hagas en tiempo de inferencia se escribe de vuelta en los parámetros: por eso una corrección que haces hoy no se mantiene mañana. El modelo que comete el mismo error en la siguiente sesión , después de que le explicaste el arreglo con cuidado, no te ignoró: es incapaz de aprender del intercambio. El modelo es sin estado ; la continuidad tiene que venir de afuera, desde la ventana de contexto o un sistema de memoria . Este mecanismo también explica cómo se cobra. Cada petición corre el modelo sobre el contexto completo, así que el costo escala con los tokens de entrada y los tokens de salida , y un agente que hace docenas de llamadas a tools paga inferencia en cada ida y vuelta. Por eso el tamaño del contexto es tanto una cuestión de costo como de calidad. Uso ¿Por qué la cuenta escala con el uso en vez de ser una licencia plana? Estás pagando la inferencia: cada petición al proveedor del modelo corre el modelo en el hardware del proveedor. El entrenamiento ya pasó, pero el costo de la inferencia se acumula por petición, y un solo turno puede convertirse en muchas peticiones cuando se llaman tools.","salientes":["model","model-provider-request","parameters","next-token-prediction","context","training","token","session","stateless","context-window","memory-system","input-tokens","output-tokens","tool","turn"],"entrantes":5},{"termino":"Effort","slug":"effort","seccion":"Sección 1 — El modelo","descripcion":"Un dial para cuánto razona el modelo antes de responder. Más esfuerzo gasta más tokens de salida por mejor puntería en problemas difíciles.","html":"\u003cp>El esfuerzo es un dial para cuánto razona un \u003ca class=\"x\" data-slug=\"model\" href=\"?term=model\">modelo\u003c/a> antes de responder. Se fija por \u003ca class=\"x\" data-slug=\"model-provider-request\" href=\"?term=model-provider-request\">petición al proveedor del modelo\u003c/a> y controla cuánto piensa el modelo antes de empezar a escribir la respuesta que ves. Ese pensamiento se genera en tiempo de \u003ca class=\"x\" data-slug=\"inference\" href=\"?term=inference\">inferencia\u003c/a> como todo lo demás; el \u003ca class=\"x\" data-slug=\"harness\" href=\"?term=harness\">harness\u003c/a> muchas veces lo oculta, pero es trabajo real que el modelo está haciendo.\u003c/p>\n\u003cp>Más esfuerzo cuesta más y corre más lento. El razonamiento se emite como \u003ca class=\"x\" data-slug=\"token\" href=\"?term=token\">tokens\u003c/a>, se cobra como \u003ca class=\"x\" data-slug=\"output-tokens\" href=\"?term=output-tokens\">tokens de salida\u003c/a> aunque nunca los veas, y se produce de a uno por vez: así que subir el esfuerzo alarga la espera antes de que llegue la respuesta y aumenta la cuenta. El trade-off es más deliberación a cambio de velocidad y costo.\u003c/p>\n\u003cp>La mayoría de los harness exponen el esfuerzo como una escalera corta:\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Nivel\u003c/th>\n\u003cth>Para qué sirve\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Bajo\u003c/td>\n\u003ctd>Ediciones mecánicas, búsquedas, cambios bien especificados con un solo camino claro.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Medio\u003c/td>\n\u003ctd>Programación del día a día: el default habitual.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Alto\u003c/td>\n\u003ctd>Bugs difíciles, decisiones de diseño, planes de varios pasos.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Máximo\u003c/td>\n\u003ctd>Los problemas más duros, donde una respuesta equivocada sale cara de deshacer.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>El síntoma de equivocarse corta para los dos lados. Si fijas el esfuerzo demasiado bajo en un problema difícil, obtienes una respuesta confiada y superficial que se saltó el razonamiento que el problema necesitaba: se lee bien y está mal de una forma que te cuesta después. Si lo pones en máximo para renombrar una línea, te sientas a esperar un pensamiento largo que no produce nada que el nivel más bajo no hubiera dado.\u003c/p>\n\u003cp>Ajusta el esfuerzo a la tarea, no a la \u003ca class=\"x\" data-slug=\"session\" href=\"?term=session\">sesión\u003c/a>. Súbelo para la parte que de verdad es difícil de razonar, y bájalo para el trabajo mecánico alrededor.\u003c/p>\n\u003cdiv class=\"block\">\u003cp class=\"lbl\">Uso\u003c/p>\n\u003cp>&quot;Sigue arruinando este fix de concurrencia: se lo he explicado tres veces.&quot;\u003c/p>\n\u003cp>&quot;Sube el esfuerzo. Es un bug que exige mucho razonamiento, y en el nivel default no está pensando lo suficiente antes de comprometerse con un enfoque.&quot;\n\u003c/content>\u003c/p>\n\n\u003c/div>","texto":"Un dial para cuánto razona el modelo antes de responder. Más esfuerzo gasta más tokens de salida por mejor puntería en problemas difíciles. El esfuerzo es un dial para cuánto razona un modelo antes de responder. Se fija por petición al proveedor del modelo y controla cuánto piensa el modelo antes de empezar a escribir la respuesta que ves. Ese pensamiento se genera en tiempo de inferencia como todo lo demás; el harness muchas veces lo oculta, pero es trabajo real que el modelo está haciendo. Más esfuerzo cuesta más y corre más lento. El razonamiento se emite como tokens , se cobra como tokens de salida aunque nunca los veas, y se produce de a uno por vez: así que subir el esfuerzo alarga la espera antes de que llegue la respuesta y aumenta la cuenta. El trade-off es más deliberación a cambio de velocidad y costo. La mayoría de los harness exponen el esfuerzo como una escalera corta: Nivel Para qué sirve Bajo Ediciones mecánicas, búsquedas, cambios bien especificados con un solo camino claro. Medio Programación del día a día: el default habitual. Alto Bugs difíciles, decisiones de diseño, planes de varios pasos. Máximo Los problemas más duros, donde una respuesta equivocada sale cara de deshacer. El síntoma de equivocarse corta para los dos lados. Si fijas el esfuerzo demasiado bajo en un problema difícil, obtienes una respuesta confiada y superficial que se saltó el razonamiento que el problema necesitaba: se lee bien y está mal de una forma que te cuesta después. Si lo pones en máximo para renombrar una línea, te sientas a esperar un pensamiento largo que no produce nada que el nivel más bajo no hubiera dado. Ajusta el esfuerzo a la tarea, no a la sesión . Súbelo para la parte que de verdad es difícil de razonar, y bájalo para el trabajo mecánico alrededor. Uso Sigue arruinando este fix de concurrencia: se lo he explicado tres veces. Sube el esfuerzo. Es un bug que exige mucho razonamiento, y en el nivel default no está pensando lo suficiente antes de comprometerse con un enfoque.","salientes":["model","model-provider-request","inference","harness","token","output-tokens","session"],"entrantes":1},{"termino":"Token","slug":"token","seccion":"Sección 1 — El modelo","descripcion":"La unidad atómica que el modelo lee y escribe. Casi del tamaño de una palabra. El contexto, el costo y la latencia se miden en tokens.","html":"\u003cp>La unidad atómica que un \u003ca class=\"x\" data-slug=\"model\" href=\"?term=model\">modelo\u003c/a> lee y escribe. Aproximadamente del tamaño de una palabra, pero no exactamente: las palabras comunes son un token, y las raras o largas se parten en varios. El tamaño de la \u003ca class=\"x\" data-slug=\"context-window\" href=\"?term=context-window\">ventana de contexto\u003c/a>, el costo y la latencia se cuentan todos en tokens.\u003c/p>\n\u003cp>El texto se convierte en tokens mediante un tokenizador: un vocabulario fijo de decenas de miles de fragmentos, aprendido antes del \u003ca class=\"x\" data-slug=\"training\" href=\"?term=training\">entrenamiento\u003c/a>, que parte cualquier entrada en una secuencia de elementos de ese vocabulario. El modelo nunca ve caracteres ni palabras. Todo texto se convierte a tokens al entrar, y la \u003ca class=\"x\" data-slug=\"next-token-prediction\" href=\"?term=next-token-prediction\">predicción del siguiente token\u003c/a> produce la salida de a un token por vez.\u003c/p>\n\u003cp>Como regla gruesa, un token equivale a unas tres cuartas partes de una palabra en inglés, así que mil tokens son unas 750 palabras. El código es menos predecible: las palabras clave y los modismos comunes se tokenizan de forma compacta, mientras que los identificadores generados, los hashes, los blobs en base64 y la salida minificada se parten en muchos tokens por &quot;palabra&quot;. El patrón es este: el texto que aparecía seguido en el material de origen del tokenizador recibe codificaciones cortas y eficientes, y el que no aparecía queda picado en muchos pedazos chicos. Un hash como \u003ccode>a3f9c2e1\u003c/code> no apareció nunca en ninguna parte, así que se parte en varios tokens, mientras que \u003ccode>function\u003c/code> es uno solo. Por eso un archivo de apariencia pequeña, pero lleno de cadenas inusuales, puede ocupar una porción sorprendente de la ventana de contexto.\u003c/p>\n\u003cp>Los tokens son la unidad en la que se mide todo lo demás. El costo es por token: los proveedores facturan por separado los \u003ca class=\"x\" data-slug=\"input-tokens\" href=\"?term=input-tokens\">tokens de entrada\u003c/a> y los \u003ca class=\"x\" data-slug=\"output-tokens\" href=\"?term=output-tokens\">tokens de salida\u003c/a>. La velocidad son tokens por segundo, porque la salida se genera de a un token por vez. Y la ventana de contexto es un número fijo de tokens, así que la cantidad de tokens de tus archivos decide cuánto cabe.\u003c/p>\n\u003cdiv class=\"block avoid\">\u003cp class=\"lbl\">Evita\u003c/p>\u003cp>&quot;palabra&quot;. Los límites de un token no coinciden con los de una palabra, y las unidades que de verdad importan son tokens por segundo y tokens por dólar.\u003c/p>\u003c/div>\n\u003cdiv class=\"block\">\u003cp class=\"lbl\">Uso\u003c/p>\n\u003cp>&quot;¿De qué tamaño va a salir este prompt?&quot;\u003c/p>\n\u003cp>&quot;Pásalo por el tokenizador. El schema es compacto, pero las claves del JSON son raras, así que se van a partir en más tokens de los que crees.&quot;\u003c/p>\n\n\u003c/div>","texto":"La unidad atómica que el modelo lee y escribe. Casi del tamaño de una palabra. El contexto, el costo y la latencia se miden en tokens. La unidad atómica que un modelo lee y escribe. Aproximadamente del tamaño de una palabra, pero no exactamente: las palabras comunes son un token, y las raras o largas se parten en varios. El tamaño de la ventana de contexto , el costo y la latencia se cuentan todos en tokens. El texto se convierte en tokens mediante un tokenizador: un vocabulario fijo de decenas de miles de fragmentos, aprendido antes del entrenamiento , que parte cualquier entrada en una secuencia de elementos de ese vocabulario. El modelo nunca ve caracteres ni palabras. Todo texto se convierte a tokens al entrar, y la predicción del siguiente token produce la salida de a un token por vez. Como regla gruesa, un token equivale a unas tres cuartas partes de una palabra en inglés, así que mil tokens son unas 750 palabras. El código es menos predecible: las palabras clave y los modismos comunes se tokenizan de forma compacta, mientras que los identificadores generados, los hashes, los blobs en base64 y la salida minificada se parten en muchos tokens por palabra . El patrón es este: el texto que aparecía seguido en el material de origen del tokenizador recibe codificaciones cortas y eficientes, y el que no aparecía queda picado en muchos pedazos chicos. Un hash como a3f9c2e1 no apareció nunca en ninguna parte, así que se parte en varios tokens, mientras que function es uno solo. Por eso un archivo de apariencia pequeña, pero lleno de cadenas inusuales, puede ocupar una porción sorprendente de la ventana de contexto. Los tokens son la unidad en la que se mide todo lo demás. El costo es por token: los proveedores facturan por separado los tokens de entrada y los tokens de salida . La velocidad son tokens por segundo, porque la salida se genera de a un token por vez. Y la ventana de contexto es un número fijo de tokens, así que la cantidad de tokens de tus archivos decide cuánto cabe. Evita palabra . Los límites de un token no coinciden con los de una palabra, y las unidades que de verdad importan son tokens por segundo y tokens por dólar. Uso ¿De qué tamaño va a salir este prompt? Pásalo por el tokenizador. El schema es compacto, pero las claves del JSON son raras, así que se van a partir en más tokens de los que crees.","salientes":["model","context-window","training","next-token-prediction","input-tokens","output-tokens"],"entrantes":29},{"termino":"Next-token prediction","slug":"next-token-prediction","seccion":"Sección 1 — El modelo","descripcion":"Lo que el modelo realmente hace. Toma un token del contexto, lo agrega y vuelve a correr. Su único modo de operar.","html":"\u003cp>Lo que el \u003ca class=\"x\" data-slug=\"model\" href=\"?term=model\">modelo\u003c/a> realmente hace. Dado un \u003ca class=\"x\" data-slug=\"context\" href=\"?term=context\">contexto\u003c/a>, toma una muestra de un \u003ca class=\"x\" data-slug=\"token\" href=\"?term=token\">token\u003c/a> siguiente, lo agrega, y vuelve a correr. Toda salida (una frase, un \u003ca class=\"x\" data-slug=\"tool-call\" href=\"?term=tool-call\">tool call\u003c/a>, un archivo de mil líneas) se construye de a un token por vez. El modelo no tiene otro modo de operar.\u003c/p>\n\u003cp>Cada paso funciona igual: los tokens de la \u003ca class=\"x\" data-slug=\"context-window\" href=\"?term=context-window\">ventana de contexto\u003c/a> pasan por los \u003ca class=\"x\" data-slug=\"parameters\" href=\"?term=parameters\">parámetros\u003c/a>, que producen una probabilidad para cada token del vocabulario (este es muy probable que siga, aquel menos). Se toma una muestra de un token a partir de esas probabilidades, se agrega, y el ciclo vuelve a correr con el contexto un poco más largo. Ese paso de muestreo es la razón por la que el mismo prompt produce salidas distintas en corridas distintas: el \u003ca class=\"x\" data-slug=\"non-determinism\" href=\"?term=non-determinism\">no determinismo\u003c/a> está incorporado al mecanismo, no es un bug agregado encima.\u003c/p>\n\u003cp>Tener presente este mecanismo explica comportamientos que de otro modo parecen extraños. El modelo nunca revisa si un token es \u003cem>verdadero\u003c/em> antes de emitirlo, solo si es \u003cem>probable\u003c/em>, y ahí está la raíz de la \u003ca class=\"x\" data-slug=\"hallucination\" href=\"?term=hallucination\">alucinación\u003c/a>. Se compromete con cada token a medida que avanza, así que una primera frase que suena segura puede desviar el resto de la respuesta. Y como los \u003ca class=\"x\" data-slug=\"output-tokens\" href=\"?term=output-tokens\">tokens de salida\u003c/a> se producen estrictamente de a uno por vez, la velocidad de generación pone un piso a qué tan rápido puede trabajar cualquier \u003ca class=\"x\" data-slug=\"agent\" href=\"?term=agent\">agente\u003c/a>.\u003c/p>\n\u003cdiv class=\"block\">\u003cp class=\"lbl\">Uso\u003c/p>\n\u003cp>&quot;¿Cómo &#39;decide&#39; el agente llamar a una tool?&quot;\u003c/p>\n\u003cp>&quot;No decide: es predicción del siguiente token de principio a fin. El tool call es solo una cadena estructurada que el \u003ca class=\"x\" data-slug=\"harness\" href=\"?term=harness\">harness\u003c/a> extrae del flujo de salida.&quot;\n\u003c/content>\u003c/p>\n\n\u003c/div>","texto":"Lo que el modelo realmente hace. Toma un token del contexto, lo agrega y vuelve a correr. Su único modo de operar. Lo que el modelo realmente hace. Dado un contexto , toma una muestra de un token siguiente, lo agrega, y vuelve a correr. Toda salida (una frase, un tool call , un archivo de mil líneas) se construye de a un token por vez. El modelo no tiene otro modo de operar. Cada paso funciona igual: los tokens de la ventana de contexto pasan por los parámetros , que producen una probabilidad para cada token del vocabulario (este es muy probable que siga, aquel menos). Se toma una muestra de un token a partir de esas probabilidades, se agrega, y el ciclo vuelve a correr con el contexto un poco más largo. Ese paso de muestreo es la razón por la que el mismo prompt produce salidas distintas en corridas distintas: el no determinismo está incorporado al mecanismo, no es un bug agregado encima. Tener presente este mecanismo explica comportamientos que de otro modo parecen extraños. El modelo nunca revisa si un token es verdadero antes de emitirlo, solo si es probable , y ahí está la raíz de la alucinación . Se compromete con cada token a medida que avanza, así que una primera frase que suena segura puede desviar el resto de la respuesta. Y como los tokens de salida se producen estrictamente de a uno por vez, la velocidad de generación pone un piso a qué tan rápido puede trabajar cualquier agente . Uso ¿Cómo &#39;decide&#39; el agente llamar a una tool? No decide: es predicción del siguiente token de principio a fin. El tool call es solo una cadena estructurada que el harness extrae del flujo de salida.","salientes":["model","context","token","tool-call","context-window","parameters","non-determinism","hallucination","output-tokens","agent","harness"],"entrantes":7},{"termino":"Non-determinism","slug":"non-determinism","seccion":"Sección 1 — El modelo","descripcion":"La misma entrada puede producir salidas distintas. Es propio de cómo los modelos generan texto y de cómo los proveedores sirven peticiones.","html":"\u003cp>La misma entrada puede producir salidas distintas. Corre un \u003ca class=\"x\" data-slug=\"model\" href=\"?term=model\">modelo\u003c/a> dos veces con el mismo \u003ca class=\"x\" data-slug=\"context\" href=\"?term=context\">contexto\u003c/a> y puedes obtener dos respuestas diferentes: a veces una palabra, a veces un enfoque completamente distinto. No hace falta que cambie nada en tu código para que esto pase.\u003c/p>\n\u003cp>Es una propiedad de cómo los modelos generan texto, y de cómo los \u003ca class=\"x\" data-slug=\"model-provider\" href=\"?term=model-provider\">proveedores del modelo\u003c/a> sirven las \u003ca class=\"x\" data-slug=\"model-provider-request\" href=\"?term=model-provider-request\">peticiones\u003c/a>. Durante la \u003ca class=\"x\" data-slug=\"inference\" href=\"?term=inference\">inferencia\u003c/a>, el modelo produce una distribución de probabilidad sobre los posibles \u003ca class=\"x\" data-slug=\"token\" href=\"?term=token\">tokens\u003c/a> siguientes y se toma una muestra de ahí, normalmente con algo de aleatoriedad a propósito, porque elegir siempre el token más probable produce texto repetitivo y de peor calidad. Un token muestreado distinto al principio de una respuesta cambia todos los tokens que vienen después, y así es como una sola palabra distinta se convierte en un enfoque completamente distinto. El servicio del lado del proveedor agrega más variación encima: las peticiones se agrupan en lotes sobre hardware compartido, y diferencias mínimas de punto flotante entre lotes pueden inclinar una decisión reñida entre dos tokens. No hay ningún ajuste que puedas activar para que esto desaparezca del todo.\u003c/p>\n\u003cp>Espera un rango de resultados de un \u003ca class=\"x\" data-slug=\"agent\" href=\"?term=agent\">agente\u003c/a> en la misma tarea. La mayoría de las respuestas caen dentro de una curva de campana razonable de calidad (por eso el no determinismo es tolerable), pero las colas son reales: algunos días el modelo se va a sentir agudo, otros va a parecer que perdió el hilo. Misma tarea, tiradas de dados distintas. Esto tiene dos consecuencias prácticas. Reintentar es una estrategia legítima: un intento fallido es una sola extracción de la distribución, y un intento nuevo sobre la misma tarea puede simplemente salir mejor. Y la verificación importa más de lo que importaría con tools deterministas: no puedes probar el comportamiento de un agente una vez y confiar en que se va a repetir, así que las \u003ca class=\"x\" data-slug=\"automated-check\" href=\"?term=automated-check\">verificaciones automatizadas\u003c/a> tienen que atrapar las malas tiradas.\u003c/p>\n\u003cp>Cuidado con sobre-narrar esto. Los humanos son máquinas de encontrar patrones, y una racha de corridas malas puede sentirse como prueba de que &quot;el modelo empeoró esta semana&quot;. Casi siempre es solo la distribución.\u003c/p>\n\u003cdiv class=\"block\">\u003cp class=\"lbl\">Uso\u003c/p>\n\u003cp>&quot;Claude ha estado pésimo hoy. ¿Sacaron una versión peor?&quot;\u003c/p>\n\u003cp>&quot;Probablemente no: la salida del modelo es no determinista. Vas a tener días buenos y días malos con la misma tarea. Intenta de nuevo mañana antes de salir a buscar una causa.&quot;\n\u003c/content>\u003c/p>\n\n\u003c/div>","texto":"La misma entrada puede producir salidas distintas. Es propio de cómo los modelos generan texto y de cómo los proveedores sirven peticiones. La misma entrada puede producir salidas distintas. Corre un modelo dos veces con el mismo contexto y puedes obtener dos respuestas diferentes: a veces una palabra, a veces un enfoque completamente distinto. No hace falta que cambie nada en tu código para que esto pase. Es una propiedad de cómo los modelos generan texto, y de cómo los proveedores del modelo sirven las peticiones . Durante la inferencia , el modelo produce una distribución de probabilidad sobre los posibles tokens siguientes y se toma una muestra de ahí, normalmente con algo de aleatoriedad a propósito, porque elegir siempre el token más probable produce texto repetitivo y de peor calidad. Un token muestreado distinto al principio de una respuesta cambia todos los tokens que vienen después, y así es como una sola palabra distinta se convierte en un enfoque completamente distinto. El servicio del lado del proveedor agrega más variación encima: las peticiones se agrupan en lotes sobre hardware compartido, y diferencias mínimas de punto flotante entre lotes pueden inclinar una decisión reñida entre dos tokens. No hay ningún ajuste que puedas activar para que esto desaparezca del todo. Espera un rango de resultados de un agente en la misma tarea. La mayoría de las respuestas caen dentro de una curva de campana razonable de calidad (por eso el no determinismo es tolerable), pero las colas son reales: algunos días el modelo se va a sentir agudo, otros va a parecer que perdió el hilo. Misma tarea, tiradas de dados distintas. Esto tiene dos consecuencias prácticas. Reintentar es una estrategia legítima: un intento fallido es una sola extracción de la distribución, y un intento nuevo sobre la misma tarea puede simplemente salir mejor. Y la verificación importa más de lo que importaría con tools deterministas: no puedes probar el comportamiento de un agente una vez y confiar en que se va a repetir, así que las verificaciones automatizadas tienen que atrapar las malas tiradas. Cuidado con sobre-narrar esto. Los humanos son máquinas de encontrar patrones, y una racha de corridas malas puede sentirse como prueba de que el modelo empeoró esta semana . Casi siempre es solo la distribución. Uso Claude ha estado pésimo hoy. ¿Sacaron una versión peor? Probablemente no: la salida del modelo es no determinista. Vas a tener días buenos y días malos con la misma tarea. Intenta de nuevo mañana antes de salir a buscar una causa.","salientes":["model","context","model-provider","model-provider-request","inference","token","agent","automated-check"],"entrantes":1},{"termino":"Model provider","slug":"model-provider","seccion":"Sección 1 — El modelo","descripcion":"Lo que sirve un modelo para inferencia. Suele ser remoto (Anthropic, OpenAI, Google), pero también puede ser local (Ollama, llama.cpp).","html":"\u003cp>Lo que sirve un \u003ca class=\"x\" data-slug=\"model\" href=\"?term=model\">modelo\u003c/a> para \u003ca class=\"x\" data-slug=\"inference\" href=\"?term=inference\">inferencia\u003c/a>. Normalmente es un servicio remoto (Anthropic, OpenAI, Google), pero también puede ser local: Ollama, LM Studio, llama.cpp corriendo en tu propia máquina. El \u003ca class=\"x\" data-slug=\"harness\" href=\"?term=harness\">harness\u003c/a> no corre el modelo por sí mismo, se lo pide a un proveedor.\u003c/p>\n\u003cp>El proveedor es dueño de la maquinaria: los \u003ca class=\"x\" data-slug=\"parameters\" href=\"?term=parameters\">parámetros\u003c/a> viven en su hardware, y cada \u003ca class=\"x\" data-slug=\"model-provider-request\" href=\"?term=model-provider-request\">petición al proveedor del modelo\u003c/a> es el harness mandando \u003ca class=\"x\" data-slug=\"token\" href=\"?term=token\">tokens\u003c/a> por la red y recibiendo predicciones de vuelta. Eso convierte al proveedor en la fuente de toda una categoría de problemas que se le achacan por error al modelo o al harness: los límites de tasa, la capacidad degradada y las caídas de servicio viven ahí. Cuando el \u003ca class=\"x\" data-slug=\"agent\" href=\"?term=agent\">agente\u003c/a> se traba a mitad de \u003ca class=\"x\" data-slug=\"session\" href=\"?term=session\">sesión\u003c/a> o falla en cada \u003ca class=\"x\" data-slug=\"turn\" href=\"?term=turn\">turno\u003c/a>, la página de estado del proveedor es lo primero que vale la pena revisar.\u003c/p>\n\u003cp>El proveedor también fija las condiciones comerciales: el precio por token para \u003ca class=\"x\" data-slug=\"input-tokens\" href=\"?term=input-tokens\">tokens de entrada\u003c/a> y \u003ca class=\"x\" data-slug=\"output-tokens\" href=\"?term=output-tokens\">tokens de salida\u003c/a>, los descuentos de \u003ca class=\"x\" data-slug=\"prefix-cache\" href=\"?term=prefix-cache\">caché de prefijo\u003c/a>, y qué modelos están disponibles en absoluto. Nota que el proveedor y quien fabrica el modelo pueden ser empresas distintas: Bedrock, Vertex y OpenRouter sirven modelos de otros.\u003c/p>\n\u003cp>Los proveedores locales cambian capacidad por control: los modelos que caben en tu propio hardware son mucho más chicos que los de punta, pero nada sale de la máquina y no hay cuenta por token.\u003c/p>\n\u003cdiv class=\"block\">\u003cp class=\"lbl\">Uso\u003c/p>\n\u003cp>&quot;¿Podemos correr esto sin conexión para el cliente aislado de red?&quot;\u003c/p>\n\u003cp>&quot;Cambia el proveedor del modelo por uno local: Ollama o llama.cpp en su máquina. Al harness no le importa, solo pega contra otro endpoint.&quot;\n\u003c/content>\u003c/p>\n\n\u003c/div>","texto":"Lo que sirve un modelo para inferencia. Suele ser remoto (Anthropic, OpenAI, Google), pero también puede ser local (Ollama, llama.cpp). Lo que sirve un modelo para inferencia . Normalmente es un servicio remoto (Anthropic, OpenAI, Google), pero también puede ser local: Ollama, LM Studio, llama.cpp corriendo en tu propia máquina. El harness no corre el modelo por sí mismo, se lo pide a un proveedor. El proveedor es dueño de la maquinaria: los parámetros viven en su hardware, y cada petición al proveedor del modelo es el harness mandando tokens por la red y recibiendo predicciones de vuelta. Eso convierte al proveedor en la fuente de toda una categoría de problemas que se le achacan por error al modelo o al harness: los límites de tasa, la capacidad degradada y las caídas de servicio viven ahí. Cuando el agente se traba a mitad de sesión o falla en cada turno , la página de estado del proveedor es lo primero que vale la pena revisar. El proveedor también fija las condiciones comerciales: el precio por token para tokens de entrada y tokens de salida , los descuentos de caché de prefijo , y qué modelos están disponibles en absoluto. Nota que el proveedor y quien fabrica el modelo pueden ser empresas distintas: Bedrock, Vertex y OpenRouter sirven modelos de otros. Los proveedores locales cambian capacidad por control: los modelos que caben en tu propio hardware son mucho más chicos que los de punta, pero nada sale de la máquina y no hay cuenta por token. Uso ¿Podemos correr esto sin conexión para el cliente aislado de red? Cambia el proveedor del modelo por uno local: Ollama o llama.cpp en su máquina. Al harness no le importa, solo pega contra otro endpoint.","salientes":["model","inference","harness","parameters","model-provider-request","token","agent","session","turn","input-tokens","output-tokens","prefix-cache"],"entrantes":6},{"termino":"Harness","slug":"harness","seccion":"Sección 1 — El modelo","descripcion":"Todo lo que rodea al modelo y lo convierte en agente: tools, system prompt, gestión de la ventana de contexto, permisos y hooks.","html":"\u003cp>Todo lo que rodea al \u003ca class=\"x\" data-slug=\"model\" href=\"?term=model\">modelo\u003c/a> y lo convierte en un \u003ca class=\"x\" data-slug=\"agent\" href=\"?term=agent\">agente\u003c/a>: \u003ca class=\"x\" data-slug=\"tool\" href=\"?term=tool\">tools\u003c/a>, \u003ca class=\"x\" data-slug=\"system-prompt\" href=\"?term=system-prompt\">system prompt\u003c/a>, \u003ca class=\"x\" data-slug=\"context-window\" href=\"?term=context-window\">gestión de la ventana de contexto\u003c/a>, permisos y hooks. \u003cstrong>Claude.ai\u003c/strong> y \u003cstrong>Claude Code\u003c/strong> corren sobre el mismo modelo y se comportan distinto porque sus harnesses difieren.\u003c/p>\n\u003cp>El modelo por sí solo hace una sola cosa: recibe texto y produce texto. No puede leer un archivo, ejecutar un comando ni recordar el \u003ca class=\"x\" data-slug=\"turn\" href=\"?term=turn\">turno\u003c/a> anterior. Todo eso lo aporta el harness. Él arma el \u003ca class=\"x\" data-slug=\"context\" href=\"?term=context\">contexto\u003c/a> de cada \u003ca class=\"x\" data-slug=\"model-provider-request\" href=\"?term=model-provider-request\">petición al proveedor del modelo\u003c/a>, ejecuta los \u003ca class=\"x\" data-slug=\"tool-call\" href=\"?term=tool-call\">tool calls\u003c/a> que el modelo pide, le devuelve los \u003ca class=\"x\" data-slug=\"tool-result\" href=\"?term=tool-result\">tool results\u003c/a>, guarda el historial de la \u003ca class=\"x\" data-slug=\"session\" href=\"?term=session\">sesión\u003c/a>, te pide permiso antes de acciones riesgosas y decide cuándo \u003ca class=\"x\" data-slug=\"compaction\" href=\"?term=compaction\">compactar\u003c/a>. El bucle del agente (el modelo propone, el harness ejecuta, y vuelta a empezar) lo corre el harness.\u003c/p>\n\u003cp>Esto importa para diagnosticar. Cuando el comportamiento cambia entre dos productos, o entre ayer y hoy, la variable no suele ser el modelo: es el harness. Un system prompt distinto, otro conjunto de tools, un permiso con el default cambiado o una nueva estrategia de gestión del contexto alteran el comportamiento sin que el modelo haya cambiado en nada. También significa que el harness es donde vive casi toda tu configuración: los archivos \u003ca class=\"x\" data-slug=\"agentsmd\" href=\"?term=agentsmd\">AGENTS.md\u003c/a>, los ajustes de permisos y los hooks son instrucciones para el harness, no para el modelo.\u003c/p>\n\u003cp>Ejemplos: Claude Code, Cursor, Codex CLI, y también Claude.ai, que es un harness de chat y no uno de programación.\u003c/p>\n\u003cdiv class=\"block\">\u003cp class=\"lbl\">Uso\u003c/p>\n\u003cp>&quot;Mismo modelo, ¿por qué Claude Code edita archivos y Claude.ai solo responde preguntas?&quot;\u003c/p>\n\u003cp>&quot;Harnesses distintos. Claude Code tiene tools de \u003ca class=\"x\" data-slug=\"filesystem\" href=\"?term=filesystem\">sistema de archivos\u003c/a>, otro system prompt y una capa de permisos. Acá el modelo no es la variable.&quot;\u003c/p>\n\n\u003c/div>","texto":"Todo lo que rodea al modelo y lo convierte en agente: tools, system prompt, gestión de la ventana de contexto, permisos y hooks. Todo lo que rodea al modelo y lo convierte en un agente : tools , system prompt , gestión de la ventana de contexto , permisos y hooks. Claude.ai y Claude Code corren sobre el mismo modelo y se comportan distinto porque sus harnesses difieren. El modelo por sí solo hace una sola cosa: recibe texto y produce texto. No puede leer un archivo, ejecutar un comando ni recordar el turno anterior. Todo eso lo aporta el harness. Él arma el contexto de cada petición al proveedor del modelo , ejecuta los tool calls que el modelo pide, le devuelve los tool results , guarda el historial de la sesión , te pide permiso antes de acciones riesgosas y decide cuándo compactar . El bucle del agente (el modelo propone, el harness ejecuta, y vuelta a empezar) lo corre el harness. Esto importa para diagnosticar. Cuando el comportamiento cambia entre dos productos, o entre ayer y hoy, la variable no suele ser el modelo: es el harness. Un system prompt distinto, otro conjunto de tools, un permiso con el default cambiado o una nueva estrategia de gestión del contexto alteran el comportamiento sin que el modelo haya cambiado en nada. También significa que el harness es donde vive casi toda tu configuración: los archivos AGENTS.md , los ajustes de permisos y los hooks son instrucciones para el harness, no para el modelo. Ejemplos: Claude Code, Cursor, Codex CLI, y también Claude.ai, que es un harness de chat y no uno de programación. Uso Mismo modelo, ¿por qué Claude Code edita archivos y Claude.ai solo responde preguntas? Harnesses distintos. Claude Code tiene tools de sistema de archivos , otro system prompt y una capa de permisos. Acá el modelo no es la variable.","salientes":["model","agent","tool","system-prompt","context-window","turn","context","model-provider-request","tool-call","tool-result","session","compaction","agentsmd","filesystem"],"entrantes":34},{"termino":"Model provider request","slug":"model-provider-request","seccion":"Sección 1 — El modelo","descripcion":"Una ida y vuelta del harness al proveedor del modelo. El harness manda el contexto; el proveedor devuelve una respuesta.","html":"\u003cp>Una ida y vuelta del \u003ca class=\"x\" data-slug=\"harness\" href=\"?term=harness\">harness\u003c/a> al \u003ca class=\"x\" data-slug=\"model-provider\" href=\"?term=model-provider\">proveedor del modelo\u003c/a>. El harness manda el \u003ca class=\"x\" data-slug=\"context\" href=\"?term=context\">contexto\u003c/a> actual; el proveedor devuelve una respuesta (un \u003ca class=\"x\" data-slug=\"tool-call\" href=\"?term=tool-call\">tool call\u003c/a> o una respuesta final). Un solo mensaje del usuario puede generar muchas peticiones al proveedor del modelo si el \u003ca class=\"x\" data-slug=\"agent\" href=\"?term=agent\">agente\u003c/a> llama \u003ca class=\"x\" data-slug=\"tool\" href=\"?term=tool\">tools\u003c/a>: cada \u003ca class=\"x\" data-slug=\"tool-result\" href=\"?term=tool-result\">tool result\u003c/a> dispara otra petición.\u003c/p>\n\u003cp>Cada petición carga con todo: el \u003ca class=\"x\" data-slug=\"system-prompt\" href=\"?term=system-prompt\">system prompt\u003c/a>, toda la conversación hasta ese punto, cada tool result. El \u003ca class=\"x\" data-slug=\"model\" href=\"?term=model\">modelo\u003c/a> es \u003ca class=\"x\" data-slug=\"stateless\" href=\"?term=stateless\">sin estado\u003c/a>, así que el proveedor no guarda nada entre peticiones: la petición cuarenta reenvía lo que mandó la treinta y nueve, más un tool result adicional. La \u003ca class=\"x\" data-slug=\"prefix-cache\" href=\"?term=prefix-cache\">caché de prefijo\u003c/a> existe para que esta repetición salga a cuenta.\u003c/p>\n\u003cp>La petición es también la unidad de cobro. Los \u003ca class=\"x\" data-slug=\"input-tokens\" href=\"?term=input-tokens\">tokens de entrada\u003c/a>, los \u003ca class=\"x\" data-slug=\"output-tokens\" href=\"?term=output-tokens\">tokens de salida\u003c/a> y los descuentos de caché se cuentan todos por petición, por eso una pregunta de aspecto inocente puede costar una cantidad sorprendente: el costo no es proporcional a tu mensaje, es proporcional al número de peticiones multiplicado por el tamaño del contexto que carga cada una.\u003c/p>\n\u003cp>Vale la pena distinguir la petición del \u003ca class=\"x\" data-slug=\"turn\" href=\"?term=turn\">turno\u003c/a>. Un turno es un intercambio contigo, y un solo turno (&quot;arregla el test que falla&quot;) se despliega como una cadena de peticiones:\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Petición\u003c/th>\n\u003cth>El modelo devuelve\u003c/th>\n\u003cth>El harness entonces\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>Tool call: correr los tests\u003c/td>\n\u003ctd>Los corre, agrega la salida del fallo\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>Tool call: leer el archivo de test\u003c/td>\n\u003ctd>Agrega el contenido del archivo\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>Tool call: leer el archivo fuente\u003c/td>\n\u003ctd>Agrega el contenido del archivo\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>Tool call: editar el archivo fuente\u003c/td>\n\u003ctd>Aplica la edición, agrega el resultado\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>Tool call: correr los tests otra vez\u003c/td>\n\u003ctd>Los corre, agrega la salida del éxito\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>Respuesta final: &quot;arreglado, los tests pasan&quot;\u003c/td>\n\u003ctd>Te la muestra\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Seis peticiones para un turno, cada una reenviando todo el contexto de nuevo. Cuando te preguntes a dónde se fueron los \u003ca class=\"x\" data-slug=\"token\" href=\"?term=token\">tokens\u003c/a>, cuenta las peticiones, no los turnos.\u003c/p>\n\u003cdiv class=\"block\">\u003cp class=\"lbl\">Uso\u003c/p>\n\u003cp>&quot;¿Una pregunta gastó cuarenta mil tokens?&quot;\u003c/p>\n\u003cp>&quot;Mira los tool calls: doce grep, ocho read, cuatro edits. Cada tool result dispara otra petición al proveedor del modelo, y el prefijo de toda la \u003ca class=\"x\" data-slug=\"session\" href=\"?term=session\">sesión\u003c/a> se reenvía cada vez.&quot;\n\u003c/content>\u003c/p>\n\n\u003c/div>","texto":"Una ida y vuelta del harness al proveedor del modelo. El harness manda el contexto; el proveedor devuelve una respuesta. Una ida y vuelta del harness al proveedor del modelo . El harness manda el contexto actual; el proveedor devuelve una respuesta (un tool call o una respuesta final). Un solo mensaje del usuario puede generar muchas peticiones al proveedor del modelo si el agente llama tools : cada tool result dispara otra petición. Cada petición carga con todo: el system prompt , toda la conversación hasta ese punto, cada tool result. El modelo es sin estado , así que el proveedor no guarda nada entre peticiones: la petición cuarenta reenvía lo que mandó la treinta y nueve, más un tool result adicional. La caché de prefijo existe para que esta repetición salga a cuenta. La petición es también la unidad de cobro. Los tokens de entrada , los tokens de salida y los descuentos de caché se cuentan todos por petición, por eso una pregunta de aspecto inocente puede costar una cantidad sorprendente: el costo no es proporcional a tu mensaje, es proporcional al número de peticiones multiplicado por el tamaño del contexto que carga cada una. Vale la pena distinguir la petición del turno . Un turno es un intercambio contigo, y un solo turno ( arregla el test que falla ) se despliega como una cadena de peticiones: Petición El modelo devuelve El harness entonces 1 Tool call: correr los tests Los corre, agrega la salida del fallo 2 Tool call: leer el archivo de test Agrega el contenido del archivo 3 Tool call: leer el archivo fuente Agrega el contenido del archivo 4 Tool call: editar el archivo fuente Aplica la edición, agrega el resultado 5 Tool call: correr los tests otra vez Los corre, agrega la salida del éxito 6 Respuesta final: arreglado, los tests pasan Te la muestra Seis peticiones para un turno, cada una reenviando todo el contexto de nuevo. Cuando te preguntes a dónde se fueron los tokens , cuenta las peticiones, no los turnos. Uso ¿Una pregunta gastó cuarenta mil tokens? Mira los tool calls: doce grep, ocho read, cuatro edits. Cada tool result dispara otra petición al proveedor del modelo, y el prefijo de toda la sesión se reenvía cada vez.","salientes":["harness","model-provider","context","tool-call","agent","tool","tool-result","system-prompt","model","stateless","prefix-cache","input-tokens","output-tokens","turn","token","session"],"entrantes":18},{"termino":"Input tokens","slug":"input-tokens","seccion":"Sección 1 — El modelo","descripcion":"Tokens que el harness manda en cada petición al proveedor del modelo. Se cobran a una tarifa más baja que los tokens de salida.","html":"\u003cp>\u003ca class=\"x\" data-slug=\"token\" href=\"?term=token\">Tokens\u003c/a> que el \u003ca class=\"x\" data-slug=\"harness\" href=\"?term=harn
