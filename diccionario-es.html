ess\">harness\u003c/a> manda en cada \u003ca class=\"x\" data-slug=\"model-provider-request\" href=\"?term=model-provider-request\">petición al proveedor del modelo\u003c/a>: el \u003ca class=\"x\" data-slug=\"system-prompt\" href=\"?term=system-prompt\">system prompt\u003c/a>, el historial de la conversación, los \u003ca class=\"x\" data-slug=\"tool-result\" href=\"?term=tool-result\">tool results\u003c/a>, todo lo que el \u003ca class=\"x\" data-slug=\"model\" href=\"?term=model\">modelo\u003c/a> lee antes de escribir. Se cobran a una tarifa más baja que los \u003ca class=\"x\" data-slug=\"output-tokens\" href=\"?term=output-tokens\">tokens de salida\u003c/a>, porque cuestan menos de procesar.\u003c/p>\n\u003cp>Al hacer \u003ca class=\"x\" data-slug=\"ai\" href=\"?term=ai\">AI\u003c/a> coding, los tokens de entrada son la mayor parte de tu cuenta. El modelo es \u003ca class=\"x\" data-slug=\"stateless\" href=\"?term=stateless\">sin estado\u003c/a>, así que cada \u003ca class=\"x\" data-slug=\"turn\" href=\"?term=turn\">turno\u003c/a> reenvía toda la \u003ca class=\"x\" data-slug=\"session\" href=\"?term=session\">sesión\u003c/a> como entrada: tu primer mensaje, cada respuesta, cada tool result desde entonces. La entrada del turno cincuenta contiene los cuarenta y nueve turnos anteriores. Una sola petición al proveedor del modelo puede producir unos cientos de tokens de salida, pero reenviar cien mil tokens de entrada de historial acumulado.\u003c/p>\n\u003cp>La \u003ca class=\"x\" data-slug=\"prefix-cache\" href=\"?term=prefix-cache\">caché de prefijo\u003c/a> reduce el costo: el historial que coincide exactamente con una petición anterior se cobra como \u003ca class=\"x\" data-slug=\"cache-tokens\" href=\"?term=cache-tokens\">tokens de caché\u003c/a> baratos en vez de entrada a precio completo. Cuando el costo de entrada sigue doliendo, la solución es achicar lo que se reenvía: \u003ca class=\"x\" data-slug=\"clearing\" href=\"?term=clearing\">limpiar\u003c/a> o \u003ca class=\"x\" data-slug=\"compaction\" href=\"?term=compaction\">compactar\u003c/a> entre tareas.\u003c/p>\n\u003cdiv class=\"block\">\u003cp class=\"lbl\">Uso\u003c/p>\n\u003cp>&quot;La cuenta está alta pero el \u003ca class=\"x\" data-slug=\"agent\" href=\"?term=agent\">agente\u003c/a> casi no está escribiendo nada.&quot;\u003c/p>\n\u003cp>&quot;Son los tokens de entrada: cada turno reenvía toda la sesión. Sin la caché de prefijo vuelves a pagar el historial en cada petición.&quot;\n\u003c/content>\u003c/p>\n\n\u003c/div>","texto":"Tokens que el harness manda en cada petición al proveedor del modelo. Se cobran a una tarifa más baja que los tokens de salida. Tokens que el harness manda en cada petición al proveedor del modelo : el system prompt , el historial de la conversación, los tool results , todo lo que el modelo lee antes de escribir. Se cobran a una tarifa más baja que los tokens de salida , porque cuestan menos de procesar. Al hacer AI coding, los tokens de entrada son la mayor parte de tu cuenta. El modelo es sin estado , así que cada turno reenvía toda la sesión como entrada: tu primer mensaje, cada respuesta, cada tool result desde entonces. La entrada del turno cincuenta contiene los cuarenta y nueve turnos anteriores. Una sola petición al proveedor del modelo puede producir unos cientos de tokens de salida, pero reenviar cien mil tokens de entrada de historial acumulado. La caché de prefijo reduce el costo: el historial que coincide exactamente con una petición anterior se cobra como tokens de caché baratos en vez de entrada a precio completo. Cuando el costo de entrada sigue doliendo, la solución es achicar lo que se reenvía: limpiar o compactar entre tareas. Uso La cuenta está alta pero el agente casi no está escribiendo nada. Son los tokens de entrada: cada turno reenvía toda la sesión. Sin la caché de prefijo vuelves a pagar el historial en cada petición.","salientes":["token","harness","model-provider-request","system-prompt","tool-result","model","output-tokens","ai","stateless","turn","session","prefix-cache","cache-tokens","clearing","compaction","agent"],"entrantes":10},{"termino":"Output tokens","slug":"output-tokens","seccion":"Sección 1 — El modelo","descripcion":"Tokens que el modelo genera de vuelta. Se cobran a una tarifa más alta que los de entrada, porque cuestan más cómputo producirlos.","html":"\u003cp>\u003ca class=\"x\" data-slug=\"token\" href=\"?term=token\">Tokens\u003c/a> que el \u003ca class=\"x\" data-slug=\"model\" href=\"?term=model\">modelo\u003c/a> genera de vuelta. Se cobran a una tarifa más alta que los \u003ca class=\"x\" data-slug=\"input-tokens\" href=\"?term=input-tokens\">tokens de entrada\u003c/a>, normalmente unas cinco veces más, porque cuestan más cómputo producirlos.\u003c/p>\n\u003cp>Cuenta todo lo que el modelo escribe: la prosa que lees, el código que emite, los \u003ca class=\"x\" data-slug=\"tool-call\" href=\"?term=tool-call\">tool calls\u003c/a>, y cualquier pensamiento extendido que el modelo haga antes de responder. Esto último sorprende a la gente: los tokens de razonamiento se cobran como salida aunque el \u003ca class=\"x\" data-slug=\"harness\" href=\"?term=harness\">harness\u003c/a> muchas veces no te los muestre, y subir el \u003ca class=\"x\" data-slug=\"effort\" href=\"?term=effort\">esfuerzo\u003c/a> gasta más de ellos.\u003c/p>\n\u003cp>Los tokens de salida también marcan el ritmo de una \u003ca class=\"x\" data-slug=\"session\" href=\"?term=session\">sesión\u003c/a>. El modelo lee la entrada rápido, pero genera la salida de a un token por vez, así que cuando un \u003ca class=\"x\" data-slug=\"turn\" href=\"?term=turn\">turno\u003c/a> se siente lento, casi siempre es la salida que se está escribiendo, no la entrada que se está leyendo. Una espera larga casi siempre significa que viene una respuesta larga.\u003c/p>\n\u003cdiv class=\"block\">\u003cp class=\"lbl\">Uso\u003c/p>\n\u003cp>&quot;La sesión de refactor está gastando crédito aunque las entradas son chicas.&quot;\u003c/p>\n\u003cp>&quot;El agente está reescribiendo archivos enteros en vez de parchar. Los tokens de salida cuestan más o menos cinco veces la tarifa de entrada: haz que emita ediciones y la cuenta baja.&quot;\n\u003c/content>\u003c/p>\n\n\u003c/div>","texto":"Tokens que el modelo genera de vuelta. Se cobran a una tarifa más alta que los de entrada, porque cuestan más cómputo producirlos. Tokens que el modelo genera de vuelta. Se cobran a una tarifa más alta que los tokens de entrada , normalmente unas cinco veces más, porque cuestan más cómputo producirlos. Cuenta todo lo que el modelo escribe: la prosa que lees, el código que emite, los tool calls , y cualquier pensamiento extendido que el modelo haga antes de responder. Esto último sorprende a la gente: los tokens de razonamiento se cobran como salida aunque el harness muchas veces no te los muestre, y subir el esfuerzo gasta más de ellos. Los tokens de salida también marcan el ritmo de una sesión . El modelo lee la entrada rápido, pero genera la salida de a un token por vez, así que cuando un turno se siente lento, casi siempre es la salida que se está escribiendo, no la entrada que se está leyendo. Una espera larga casi siempre significa que viene una respuesta larga. Uso La sesión de refactor está gastando crédito aunque las entradas son chicas. El agente está reescribiendo archivos enteros en vez de parchar. Los tokens de salida cuestan más o menos cinco veces la tarifa de entrada: haz que emita ediciones y la cuenta baja.","salientes":["token","model","input-tokens","tool-call","harness","effort","session","turn"],"entrantes":7},{"termino":"Prefix cache","slug":"prefix-cache","seccion":"Sección 1 — El modelo","descripcion":"El almacén del proveedor que permite a peticiones consecutivas saltarse el reproceso de un prefijo compartido, a tarifa más baja.","html":"\u003cp>El almacén del lado del \u003ca class=\"x\" data-slug=\"model-provider\" href=\"?term=model-provider\">proveedor\u003c/a> que permite a \u003ca class=\"x\" data-slug=\"model-provider-request\" href=\"?term=model-provider-request\">peticiones al proveedor del modelo\u003c/a> consecutivas saltarse el reproceso de un prefijo compartido. Cuando el comienzo de una petición coincide con el comienzo de una reciente (mismo \u003ca class=\"x\" data-slug=\"system-prompt\" href=\"?term=system-prompt\">system prompt\u003c/a>, mismo historial hasta cierto punto), el proveedor reutiliza su trabajo previo y cobra esos \u003ca class=\"x\" data-slug=\"token\" href=\"?term=token\">tokens\u003c/a> como \u003ca class=\"x\" data-slug=\"cache-tokens\" href=\"?term=cache-tokens\">tokens de caché\u003c/a> a una tarifa mucho más baja.\u003c/p>\n\u003cp>La caché vale la pena porque las sesiones crecen solo agregando al final. Cada petición reenvía todo el historial como \u003ca class=\"x\" data-slug=\"input-tokens\" href=\"?term=input-tokens\">tokens de entrada\u003c/a> (ver esa entrada para el porqué), y en una \u003ca class=\"x\" data-slug=\"session\" href=\"?term=session\">sesión\u003c/a> normal el historial solo cambia al final: cada petición es la anterior más unos mensajes nuevos. El proveedor procesa una sola vez el largo comienzo compartido, guarda el resultado, y retoma desde donde termina el prefijo. Sin la caché, una sesión de 50 \u003ca class=\"x\" data-slug=\"turn\" href=\"?term=turn\">turnos\u003c/a> pagaría por reprocesar el turno uno cincuenta veces.\u003c/p>\n\u003cp>Las cachés también expiran. Cuánto tiempo se mantiene caliente una entrada varía según el proveedor del modelo, típicamente minutos, no horas. Deja una sesión inactiva más allá de esa ventana y la siguiente petición reconstruye el prefijo a precio completo una vez, antes de que el cacheo se reanude. Esto es sobre todo un problema de quien construye el \u003ca class=\"x\" data-slug=\"harness\" href=\"?term=harness\">harness\u003c/a>; como usuario, el efecto visible es que las peticiones después de una pausa larga cuestan más que las de antes.\u003c/p>\n\u003cdiv class=\"block\">\u003cp class=\"lbl\">Uso\u003c/p>\n\u003cp>&quot;¿Por qué se disparó la cuenta a mitad de la sesión?&quot;\u003c/p>\n\u003cp>&quot;El harness empezó a inyectar la hora actual en el system prompt en cada turno. La caché de prefijo se rompe en el primer token que cambia, así que cada petición después de eso se cobró a tarifa completa.&quot;\n\u003c/content>\u003c/p>\n\n\u003c/div>","texto":"El almacén del proveedor que permite a peticiones consecutivas saltarse el reproceso de un prefijo compartido, a tarifa más baja. El almacén del lado del proveedor que permite a peticiones al proveedor del modelo consecutivas saltarse el reproceso de un prefijo compartido. Cuando el comienzo de una petición coincide con el comienzo de una reciente (mismo system prompt , mismo historial hasta cierto punto), el proveedor reutiliza su trabajo previo y cobra esos tokens como tokens de caché a una tarifa mucho más baja. La caché vale la pena porque las sesiones crecen solo agregando al final. Cada petición reenvía todo el historial como tokens de entrada (ver esa entrada para el porqué), y en una sesión normal el historial solo cambia al final: cada petición es la anterior más unos mensajes nuevos. El proveedor procesa una sola vez el largo comienzo compartido, guarda el resultado, y retoma desde donde termina el prefijo. Sin la caché, una sesión de 50 turnos pagaría por reprocesar el turno uno cincuenta veces. Las cachés también expiran. Cuánto tiempo se mantiene caliente una entrada varía según el proveedor del modelo, típicamente minutos, no horas. Deja una sesión inactiva más allá de esa ventana y la siguiente petición reconstruye el prefijo a precio completo una vez, antes de que el cacheo se reanude. Esto es sobre todo un problema de quien construye el harness ; como usuario, el efecto visible es que las peticiones después de una pausa larga cuestan más que las de antes. Uso ¿Por qué se disparó la cuenta a mitad de la sesión? El harness empezó a inyectar la hora actual en el system prompt en cada turno. La caché de prefijo se rompe en el primer token que cambia, así que cada petición después de eso se cobró a tarifa completa.","salientes":["model-provider","model-provider-request","system-prompt","token","cache-tokens","input-tokens","session","turn","harness"],"entrantes":5},{"termino":"Cache tokens","slug":"cache-tokens","seccion":"Sección 1 — El modelo","descripcion":"Tokens de entrada que el proveedor tiene cacheados de una petición anterior vía su caché de prefijo, cobrados a tarifa mucho más baja.","html":"\u003cp>\u003ca class=\"x\" data-slug=\"input-tokens\" href=\"?term=input-tokens\">Tokens de entrada\u003c/a> que el \u003ca class=\"x\" data-slug=\"model-provider\" href=\"?term=model-provider\">proveedor\u003c/a> tiene cacheados de una \u003ca class=\"x\" data-slug=\"model-provider-request\" href=\"?term=model-provider-request\">petición al proveedor del modelo\u003c/a> anterior, así no tiene que reprocesarlos. Cuando peticiones consecutivas comparten un prefijo, el proveedor reutiliza el trabajo mediante su \u003ca class=\"x\" data-slug=\"prefix-cache\" href=\"?term=prefix-cache\">caché de prefijo\u003c/a> y cobra la porción cacheada a una tarifa mucho más baja. Es la palanca que hace que las \u003ca class=\"x\" data-slug=\"session\" href=\"?term=session\">sesiones\u003c/a> largas sean costeables: sin ella, cada \u003ca class=\"x\" data-slug=\"turn\" href=\"?term=turn\">turno\u003c/a> vuelve a pagar todo el historial.\u003c/p>\n\u003cp>La razón por la que esto importa es cómo se cobran las sesiones. El \u003ca class=\"x\" data-slug=\"model\" href=\"?term=model\">modelo\u003c/a> es \u003ca class=\"x\" data-slug=\"stateless\" href=\"?term=stateless\">sin estado\u003c/a>, así que cada petición reenvía toda la conversación (el \u003ca class=\"x\" data-slug=\"system-prompt\" href=\"?term=system-prompt\">system prompt\u003c/a>, cada mensaje, cada \u003ca class=\"x\" data-slug=\"tool-result\" href=\"?term=tool-result\">tool result\u003c/a>) como tokens de entrada. Para el turno cincuenta, cada petición carga cincuenta turnos de historial, y pagarías tarifa completa por todo eso, cada vez. La caché cambia la cuenta: los tokens que el proveedor ya procesó en un prefijo idéntico se cobran como tokens de caché, muchas veces a una décima parte de la tarifa de entrada o menos. En una sesión larga, la mayor parte de lo que envías son tokens de caché, y la cuenta se mantiene razonable.\u003c/p>\n\u003cp>Un ejemplo muestra cuándo los tokens se cachean y cuándo no. Cada letra representa un bloque de contenido de la conversación; cada petición manda la conversación hasta ese punto:\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>La petición manda\u003c/th>\n\u003cth>Cacheado\u003c/th>\n\u003cth>Cobrado a tarifa completa\u003c/th>\n\u003cth>Por qué\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>AB\u003c/code>\u003c/td>\n\u003ctd>nada\u003c/td>\n\u003ctd>\u003ccode>AB\u003c/code>\u003c/td>\n\u003ctd>Primera petición: no hay nada contra qué comparar\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>ABC\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>AB\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>C\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>AB\u003c/code> es un prefijo exacto de la petición anterior\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>ABCD\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>ABC\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>D\u003c/code>\u003c/td>\n\u003ctd>El prefijo sigue intacto\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>AXCD\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>A\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>XCD\u003c/code>\u003c/td>\n\u003ctd>Una edición cambió \u003ccode>B\u003c/code> por \u003ccode>X\u003c/code>; la coincidencia falla ahí\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>La caché es frágil de una forma específica: hace coincidir prefijos exactos. Si algo cambia más temprano en la conversación (el \u003ca class=\"x\" data-slug=\"harness\" href=\"?term=harness\">harness\u003c/a> reordena contenido, se actualiza una marca de tiempo, cambia la representación de un archivo), la caché falla desde ese punto en adelante y todo lo que sigue se cobra a tarifa completa de entrada. Las cachés también expiran después de unos minutos de inactividad, así que una sesión retomada tras una pausa larga vuelve a pagar su historial una vez. Cuando el costo de una sesión salta sin una causa obvia, compara los tokens de caché contra los tokens de entrada en el reporte de uso: una caché rota aparece ahí primero.\u003c/p>\n\u003cdiv class=\"block\">\u003cp class=\"lbl\">Uso\u003c/p>\n\u003cp>&quot;El costo en sesiones largas es brutal: ocho dólares por un refactor.&quot;\u003c/p>\n\u003cp>&quot;Revisa los tokens de caché. Si el harness está reordenando el system prompt o los archivos entre turnos, el prefijo se rompe y vuelves a pagar tarifa completa de entrada en cada petición.&quot;\n\u003c/content>\u003c/p>\n\n\u003c/div>","texto":"Tokens de entrada que el proveedor tiene cacheados de una petición anterior vía su caché de prefijo, cobrados a tarifa mucho más baja. Tokens de entrada que el proveedor tiene cacheados de una petición al proveedor del modelo anterior, así no tiene que reprocesarlos. Cuando peticiones consecutivas comparten un prefijo, el proveedor reutiliza el trabajo mediante su caché de prefijo y cobra la porción cacheada a una tarifa mucho más baja. Es la palanca que hace que las sesiones largas sean costeables: sin ella, cada turno vuelve a pagar todo el historial. La razón por la que esto importa es cómo se cobran las sesiones. El modelo es sin estado , así que cada petición reenvía toda la conversación (el system prompt , cada mensaje, cada tool result ) como tokens de entrada. Para el turno cincuenta, cada petición carga cincuenta turnos de historial, y pagarías tarifa completa por todo eso, cada vez. La caché cambia la cuenta: los tokens que el proveedor ya procesó en un prefijo idéntico se cobran como tokens de caché, muchas veces a una décima parte de la tarifa de entrada o menos. En una sesión larga, la mayor parte de lo que envías son tokens de caché, y la cuenta se mantiene razonable. Un ejemplo muestra cuándo los tokens se cachean y cuándo no. Cada letra representa un bloque de contenido de la conversación; cada petición manda la conversación hasta ese punto: La petición manda Cacheado Cobrado a tarifa completa Por qué AB nada AB Primera petición: no hay nada contra qué comparar ABC AB C AB es un prefijo exacto de la petición anterior ABCD ABC D El prefijo sigue intacto AXCD A XCD Una edición cambió B por X ; la coincidencia falla ahí La caché es frágil de una forma específica: hace coincidir prefijos exactos. Si algo cambia más temprano en la conversación (el harness reordena contenido, se actualiza una marca de tiempo, cambia la representación de un archivo), la caché falla desde ese punto en adelante y todo lo que sigue se cobra a tarifa completa de entrada. Las cachés también expiran después de unos minutos de inactividad, así que una sesión retomada tras una pausa larga vuelve a pagar su historial una vez. Cuando el costo de una sesión salta sin una causa obvia, compara los tokens de caché contra los tokens de entrada en el reporte de uso: una caché rota aparece ahí primero. Uso El costo en sesiones largas es brutal: ocho dólares por un refactor. Revisa los tokens de caché. Si el harness está reordenando el system prompt o los archivos entre turnos, el prefijo se rompe y vuelves a pagar tarifa completa de entrada en cada petición.","salientes":["input-tokens","model-provider","model-provider-request","prefix-cache","session","turn","model","stateless","system-prompt","tool-result","harness"],"entrantes":2},{"termino":"Stateless","slug":"stateless","seccion":"Sección 2 — Sesiones, ventanas de contexto y turnos","descripcion":"No conserva nada entre peticiones. El modelo no tiene estado entre peticiones; un agente tampoco lo tiene entre sesiones, por defecto.","html":"\u003cp>No conserva nada de una petición a otra. El \u003ca class=\"x\" data-slug=\"model\" href=\"?term=model\">modelo\u003c/a> no tiene estado entre \u003ca class=\"x\" data-slug=\"model-provider-request\" href=\"?term=model-provider-request\">peticiones al proveedor del modelo\u003c/a>: cada petición reenvía la \u003ca class=\"x\" data-slug=\"context-window\" href=\"?term=context-window\">ventana de contexto\u003c/a> completa, porque el modelo no tiene otra forma de ver algo más. Un \u003ca class=\"x\" data-slug=\"agent\" href=\"?term=agent\">agente\u003c/a> no tiene estado entre \u003ca class=\"x\" data-slug=\"session\" href=\"?term=session\">sesiones\u003c/a> por defecto: una sesión nueva arranca vacía, sin rastro de las anteriores. Es la contraparte de \u003ca class=\"x\" data-slug=\"stateful\" href=\"?term=stateful\">con estado\u003c/a>.\u003c/p>\n\u003cp>El modelo en sí es permanentemente sin estado: sus \u003ca class=\"x\" data-slug=\"parameters\" href=\"?term=parameters\">parámetros\u003c/a> quedan congelados después del \u003ca class=\"x\" data-slug=\"training\" href=\"?term=training\">entrenamiento\u003c/a>, y nada de lo que hagas en la \u003ca class=\"x\" data-slug=\"inference\" href=\"?term=inference\">inferencia\u003c/a> los cambia. El modelo no aprende de tus correcciones, no recuerda que le dijiste lo mismo ayer, y no te está conociendo, por mucho que la conversación se sienta así. La sensación de continuidad dentro de una sesión la fabrica el \u003ca class=\"x\" data-slug=\"harness\" href=\"?term=harness\">harness\u003c/a>, que guarda la transcripción y la reenvía con cada petición. El modelo no recuerda la conversación: la vuelve a leer.\u003c/p>\n\u003cp>La consecuencia práctica: si quieres que algo se recuerde entre sesiones, tienes que escribirlo en algún lugar que el agente vuelva a leer. Para eso existen los archivos \u003ca class=\"x\" data-slug=\"agentsmd\" href=\"?term=agentsmd\">AGENTS.md\u003c/a>, los \u003ca class=\"x\" data-slug=\"memory-system\" href=\"?term=memory-system\">sistemas de memoria\u003c/a> y los \u003ca class=\"x\" data-slug=\"handoff-artifact\" href=\"?term=handoff-artifact\">artefactos de handoff\u003c/a>: archivos que se cargan en el \u003ca class=\"x\" data-slug=\"context\" href=\"?term=context\">contexto\u003c/a> de las sesiones futuras, haciendo de memoria donde el modelo no tiene ninguna. Cuando el agente sigue cometiendo un error que ya le corregiste antes, la pregunta no es por qué no aprendió (no puede), sino dónde debería quedar escrita esa corrección para que cada sesión futura la lea.\u003c/p>\n\u003cdiv class=\"block\">\u003cp class=\"lbl\">Uso\u003c/p>\n\u003cp>&quot;¿Por qué olvida la convención cada vez que \u003ca class=\"x\" data-slug=\"clearing\" href=\"?term=clearing\">limpio el contexto\u003c/a>?&quot;\u003c/p>\n\u003cp>&quot;El modelo no tiene estado: la sesión nueva arranca vacía. Si quieres que se conserve, escríbelo en AGENTS.md o en un archivo de memoria que el harness cargue al empezar la sesión.&quot;\u003c/p>\n\n\u003c/div>","texto":"No conserva nada entre peticiones. El modelo no tiene estado entre peticiones; un agente tampoco lo tiene entre sesiones, por defecto. No conserva nada de una petición a otra. El modelo no tiene estado entre peticiones al proveedor del modelo : cada petición reenvía la ventana de contexto completa, porque el modelo no tiene otra forma de ver algo más. Un agente no tiene estado entre sesiones por defecto: una sesión nueva arranca vacía, sin rastro de las anteriores. Es la contraparte de con estado . El modelo en sí es permanentemente sin estado: sus parámetros quedan congelados después del entrenamiento , y nada de lo que hagas en la inferencia los cambia. El modelo no aprende de tus correcciones, no recuerda que le dijiste lo mismo ayer, y no te está conociendo, por mucho que la conversación se sienta así. La sensación de continuidad dentro de una sesión la fabrica el harness , que guarda la transcripción y la reenvía con cada petición. El modelo no recuerda la conversación: la vuelve a leer. La consecuencia práctica: si quieres que algo se recuerde entre sesiones, tienes que escribirlo en algún lugar que el agente vuelva a leer. Para eso existen los archivos AGENTS.md , los sistemas de memoria y los artefactos de handoff : archivos que se cargan en el contexto de las sesiones futuras, haciendo de memoria donde el modelo no tiene ninguna. Cuando el agente sigue cometiendo un error que ya le corregiste antes, la pregunta no es por qué no aprendió (no puede), sino dónde debería quedar escrita esa corrección para que cada sesión futura la lea. Uso ¿Por qué olvida la convención cada vez que limpio el contexto ? El modelo no tiene estado: la sesión nueva arranca vacía. Si quieres que se conserve, escríbelo en AGENTS.md o en un archivo de memoria que el harness cargue al empezar la sesión.","salientes":["model","model-provider-request","context-window","agent","session","stateful","parameters","training","inference","harness","agentsmd","memory-system","handoff-artifact","context","clearing"],"entrantes":14},{"termino":"Context","slug":"context","seccion":"Sección 2 — Sesiones, ventanas de contexto y turnos","descripcion":"La información relevante que el agente tiene a mano ahora mismo: lo que sabe y le sirve para la tarea.","html":"\u003cp>La información relevante que el \u003ca class=\"x\" data-slug=\"agent\" href=\"?term=agent\">agente\u003c/a> tiene a mano ahora mismo. Es el sustantivo abstracto: no es la entrada cruda que ve el modelo (eso es la \u003ca class=\"x\" data-slug=\"context-window\" href=\"?term=context-window\">ventana de contexto\u003c/a>), ni el historial corrido (eso es la \u003ca class=\"x\" data-slug=\"session\" href=\"?term=session\">sesión\u003c/a>), sino \u003cem>lo que el agente sabe que es pertinente para la tarea\u003c/em>. &quot;Cargar algo al contexto&quot; significa hacerlo parte de ese conjunto; &quot;ingeniería de contexto&quot; es la disciplina de curarlo.\u003c/p>\n\u003cp>Los tres términos se separan con claridad:\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Término\u003c/th>\n\u003cth>Qué nombra\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Contexto\u003c/td>\n\u003ctd>La información relevante para la tarea que el agente tiene ahora mismo\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Ventana de contexto\u003c/td>\n\u003ctd>La secuencia literal de \u003ca class=\"x\" data-slug=\"token\" href=\"?term=token\">tokens\u003c/a> que el modelo ve en cada petición\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Sesión\u003c/td>\n\u003ctd>La conversación en curso que guarda el \u003ca class=\"x\" data-slug=\"harness\" href=\"?term=harness\">harness\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>La separación importa porque el contexto mide calidad, no cantidad. Una ventana de contexto puede estar casi llena y el contexto seguir siendo pobre: miles de tokens de resultados de tools obsoletos, ninguno relacionado con la tarea. También puede estar casi vacía y el contexto ser excelente: la única definición de tipo de la que depende la tarea.\u003c/p>\n\u003cp>La mayoría de las fallas del día a día se rastrean hasta el contexto. Cuando el agente inventa una API, contradice una decisión o adivina un schema, la primera pregunta es qué había en el contexto cuando lo hizo: casi siempre el dato relevante nunca se cargó, o quedó enterrado bajo la \u003ca class=\"x\" data-slug=\"attention-degradation\" href=\"?term=attention-degradation\">attention degradation\u003c/a>. El arreglo es curar: cargar lo que la tarea necesita y dejar fuera lo que no.\u003c/p>\n\u003cdiv class=\"block\">\u003cp class=\"lbl\">Uso\u003c/p>\n\u003cp>&quot;Sigue inventando campos que no están en el tipo.&quot;\u003c/p>\n\u003cp>&quot;El archivo del tipo no está en contexto: está leyendo los call sites y adivinando. Cárgale la definición primero.&quot;\u003c/p>\n\n\u003c/div>","texto":"La información relevante que el agente tiene a mano ahora mismo: lo que sabe y le sirve para la tarea. La información relevante que el agente tiene a mano ahora mismo. Es el sustantivo abstracto: no es la entrada cruda que ve el modelo (eso es la ventana de contexto ), ni el historial corrido (eso es la sesión ), sino lo que el agente sabe que es pertinente para la tarea . Cargar algo al contexto significa hacerlo parte de ese conjunto; ingeniería de contexto es la disciplina de curarlo. Los tres términos se separan con claridad: Término Qué nombra Contexto La información relevante para la tarea que el agente tiene ahora mismo Ventana de contexto La secuencia literal de tokens que el modelo ve en cada petición Sesión La conversación en curso que guarda el harness La separación importa porque el contexto mide calidad, no cantidad. Una ventana de contexto puede estar casi llena y el contexto seguir siendo pobre: miles de tokens de resultados de tools obsoletos, ninguno relacionado con la tarea. También puede estar casi vacía y el contexto ser excelente: la única definición de tipo de la que depende la tarea. La mayoría de las fallas del día a día se rastrean hasta el contexto. Cuando el agente inventa una API, contradice una decisión o adivina un schema, la primera pregunta es qué había en el contexto cuando lo hizo: casi siempre el dato relevante nunca se cargó, o quedó enterrado bajo la attention degradation . El arreglo es curar: cargar lo que la tarea necesita y dejar fuera lo que no. Uso Sigue inventando campos que no están en el tipo. El archivo del tipo no está en contexto: está leyendo los call sites y adivinando. Cárgale la definición primero.","salientes":["agent","context-window","session","token","harness","attention-degradation"],"entrantes":32},{"termino":"Context window","slug":"context-window","seccion":"Sección 2 — Sesiones, ventanas de contexto y turnos","descripcion":"Todo lo que el modelo ve en cada petición al proveedor. Finita, específica de cada modelo: la única superficie por la que el modelo percibe.","html":"\u003cp>Todo lo que el \u003ca class=\"x\" data-slug=\"model\" href=\"?term=model\">modelo\u003c/a> ve en cada \u003ca class=\"x\" data-slug=\"model-provider-request\" href=\"?term=model-provider-request\">petición al proveedor del modelo\u003c/a>. Es finita, específica de cada modelo, y la \u003cem>única\u003c/em> superficie por la que el modelo percibe algo.\u003c/p>\n\u003cp>Es una única secuencia de \u003ca class=\"x\" data-slug=\"token\" href=\"?term=token\">tokens\u003c/a>: el \u003ca class=\"x\" data-slug=\"system-prompt\" href=\"?term=system-prompt\">system prompt\u003c/a>, la conversación hasta ese punto, y cada \u003ca class=\"x\" data-slug=\"tool-result\" href=\"?term=tool-result\">tool result\u003c/a> que el \u003ca class=\"x\" data-slug=\"harness\" href=\"?term=harness\">harness\u003c/a> haya vuelto a meter. Si algo está en esa secuencia, el modelo puede usarlo; si no está, el modelo no sabe que existe: ni tu código base, ni el archivo que editaste ayer, ni la instrucción que diste hace tres sesiones. Cualquier cosa fuera de la ventana tiene que traerse, casi siempre con un \u003ca class=\"x\" data-slug=\"tool-call\" href=\"?term=tool-call\">tool call\u003c/a>, antes de que pueda afectar algo.\u003c/p>\n\u003cp>Que sea finita significa que se llena. Cada turno agrega más (tus mensajes, las respuestas del modelo, los tool results), y una \u003ca class=\"x\" data-slug=\"session\" href=\"?term=session\">sesión\u003c/a> larga termina topando el límite, lo que obliga a \u003ca class=\"x\" data-slug=\"compaction\" href=\"?term=compaction\">compactar\u003c/a> o a \u003ca class=\"x\" data-slug=\"clearing\" href=\"?term=clearing\">limpiar\u003c/a>. También significa que todo lo que hay en la ventana compite entre sí: cada token que cargas es uno menos disponible para el resto, y el contenido que no necesitabas igual ocupa el \u003ca class=\"x\" data-slug=\"attention-budget\" href=\"?term=attention-budget\">attention budget\u003c/a> del modelo. La postura práctica es tratar la ventana como un presupuesto: cargar lo que la tarea necesita y dejar el resto afuera.\u003c/p>\n\u003cdiv class=\"block avoid\">\u003cp class=\"lbl\">Evita\u003c/p>\u003cp>&quot;memoria&quot;. La ventana de contexto es estado de trabajo y no persiste entre sesiones. La \u003ca class=\"x\" data-slug=\"memory-system\" href=\"?term=memory-system\">memoria\u003c/a> es un concepto aparte que se monta encima.\u003c/p>\u003c/div>\n\u003cdiv class=\"block\">\u003cp class=\"lbl\">Uso\u003c/p>\n\u003cp>&quot;¿Puedo simplemente pegar todo el monorepo en el prompt?&quot;\u003c/p>\n\u003cp>&quot;La ventana de contexto tiene 200k tokens: eso es como un quinto del repo. Elige los archivos que la tarea toca y deja el resto detrás de un tool call.&quot;\u003c/p>\n\n\u003c/div>","texto":"Todo lo que el modelo ve en cada petición al proveedor. Finita, específica de cada modelo: la única superficie por la que el modelo percibe. Todo lo que el modelo ve en cada petición al proveedor del modelo . Es finita, específica de cada modelo, y la única superficie por la que el modelo percibe algo. Es una única secuencia de tokens : el system prompt , la conversación hasta ese punto, y cada tool result que el harness haya vuelto a meter. Si algo está en esa secuencia, el modelo puede usarlo; si no está, el modelo no sabe que existe: ni tu código base, ni el archivo que editaste ayer, ni la instrucción que diste hace tres sesiones. Cualquier cosa fuera de la ventana tiene que traerse, casi siempre con un tool call , antes de que pueda afectar algo. Que sea finita significa que se llena. Cada turno agrega más (tus mensajes, las respuestas del modelo, los tool results), y una sesión larga termina topando el límite, lo que obliga a compactar o a limpiar . También significa que todo lo que hay en la ventana compite entre sí: cada token que cargas es uno menos disponible para el resto, y el contenido que no necesitabas igual ocupa el attention budget del modelo. La postura práctica es tratar la ventana como un presupuesto: cargar lo que la tarea necesita y dejar el resto afuera. Evita memoria . La ventana de contexto es estado de trabajo y no persiste entre sesiones. La memoria es un concepto aparte que se monta encima. Uso ¿Puedo simplemente pegar todo el monorepo en el prompt? La ventana de contexto tiene 200k tokens: eso es como un quinto del repo. Elige los archivos que la tarea toca y deja el resto detrás de un tool call.","salientes":["model","model-provider-request","token","system-prompt","tool-result","harness","tool-call","session","compaction","clearing","attention-budget","memory-system"],"entrantes":32},{"termino":"Stateful","slug":"stateful","seccion":"Sección 2 — Sesiones, ventanas de contexto y turnos","descripcion":"Conserva información de un turno a otro. La sesión tiene estado entre turnos; el agente, entre sesiones, con un sistema de memoria.","html":"\u003cp>Conserva información de un momento a otro. Una \u003ca class=\"x\" data-slug=\"session\" href=\"?term=session\">sesión\u003c/a> tiene estado entre \u003ca class=\"x\" data-slug=\"turn\" href=\"?term=turn\">turnos\u003c/a>: el \u003ca class=\"x\" data-slug=\"context\" href=\"?term=context\">contexto\u003c/a> se acumula a medida que la sesión avanza, y por eso las sesiones largas derivan hacia la \u003ca class=\"x\" data-slug=\"smart-zone\" href=\"?term=smart-zone\">dumb zone\u003c/a>. Un \u003ca class=\"x\" data-slug=\"agent\" href=\"?term=agent\">agente\u003c/a> puede volverse con estado entre \u003cstrong>sesiones\u003c/strong> si se le agrega un \u003ca class=\"x\" data-slug=\"memory-system\" href=\"?term=memory-system\">sistema de memoria\u003c/a> que persista información en el \u003ca class=\"x\" data-slug=\"environment\" href=\"?term=environment\">entorno\u003c/a> y la recargue al empezar sesiones futuras. El \u003ca class=\"x\" data-slug=\"model\" href=\"?term=model\">modelo\u003c/a> nunca tiene estado; cualquier continuidad aparente es el \u003ca class=\"x\" data-slug=\"harness\" href=\"?term=harness\">harness\u003c/a> reinyectando contexto. Es la contraparte de \u003ca class=\"x\" data-slug=\"stateless\" href=\"?term=stateless\">sin estado\u003c/a>.\u003c/p>\n\u003cp>Dónde vive el estado en cada capa:\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Capa\u003c/th>\n\u003cth>¿Tiene estado?\u003c/th>\n\u003cth>Cómo\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Modelo\u003c/td>\n\u003ctd>Nunca\u003c/td>\n\u003ctd>Los \u003ca class=\"x\" data-slug=\"parameters\" href=\"?term=parameters\">parámetros\u003c/a> están congelados; solo ve lo que llega en cada petición\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Sesión\u003c/td>\n\u003ctd>Entre turnos\u003c/td>\n\u003ctd>El harness agrega cada mensaje y cada \u003ca class=\"x\" data-slug=\"tool-result\" href=\"?term=tool-result\">tool result\u003c/a> al contexto\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Harness\u003c/td>\n\u003ctd>Entre sesiones\u003c/td>\n\u003ctd>Archivos de memoria, \u003ca class=\"x\" data-slug=\"agentsmd\" href=\"?term=agentsmd\">AGENTS.md\u003c/a>, \u003ca class=\"x\" data-slug=\"handoff-artifact\" href=\"?term=handoff-artifact\">artefactos de handoff\u003c/a>: quedan escritos y se recargan después\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Entorno\u003c/td>\n\u003ctd>Siempre\u003c/td>\n\u003ctd>Los archivos persisten esté o no corriendo una sesión\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>El estado de cada capa se construye releyendo algo que quedó guardado en la capa de abajo: la sesión se siente continua porque el harness reenvía el historial de mensajes al modelo sin estado, y el agente recuerda entre sesiones porque el harness recarga archivos desde el entorno. El modelo mismo nunca guarda ningún estado.\u003c/p>\n\u003cp>El estado no siempre es deseable. Todo lo que se arrastra influye en lo que viene después, así que un supuesto equivocado hecho al principio de una sesión también se arrastra. \u003ca class=\"x\" data-slug=\"clearing\" href=\"?term=clearing\">Limpiar el contexto\u003c/a> es el acto deliberado de descartar el estado de la sesión y partir de nuevo desde lo que quedó escrito.\u003c/p>\n\u003cdiv class=\"block\">\u003cp class=\"lbl\">Uso\u003c/p>\n\u003cp>&quot;Recordó mis preferencias de ayer. ¿Eso significa que el modelo las aprendió?&quot;\u003c/p>\n\u003cp>&quot;No, el agente tiene estado porque el harness las escribió en un archivo de memoria y las recargó al empezar la sesión. El modelo en sí no vio nada de ayer.&quot;\u003c/p>\n\n\u003c/div>","texto":"Conserva información de un turno a otro. La sesión tiene estado entre turnos; el agente, entre sesiones, con un sistema de memoria. Conserva información de un momento a otro. Una sesión tiene estado entre turnos : el contexto se acumula a medida que la sesión avanza, y por eso las sesiones largas derivan hacia la dumb zone . Un agente puede volverse con estado entre sesiones si se le agrega un sistema de memoria que persista información en el entorno y la recargue al empezar sesiones futuras. El modelo nunca tiene estado; cualquier continuidad aparente es el harness reinyectando contexto. Es la contraparte de sin estado . Dónde vive el estado en cada capa: Capa ¿Tiene estado? Cómo Modelo Nunca Los parámetros están congelados; solo ve lo que llega en cada petición Sesión Entre turnos El harness agrega cada mensaje y cada tool result al contexto Harness Entre sesiones Archivos de memoria, AGENTS.md , artefactos de handoff : quedan escritos y se recargan después Entorno Siempre Los archivos persisten esté o no corriendo una sesión El estado de cada capa se construye releyendo algo que quedó guardado en la capa de abajo: la sesión se siente continua porque el harness reenvía el historial de mensajes al modelo sin estado, y el agente recuerda entre sesiones porque el harness recarga archivos desde el entorno. El modelo mismo nunca guarda ningún estado. El estado no siempre es deseable. Todo lo que se arrastra influye en lo que viene después, así que un supuesto equivocado hecho al principio de una sesión también se arrastra. Limpiar el contexto es el acto deliberado de descartar el estado de la sesión y partir de nuevo desde lo que quedó escrito. Uso Recordó mis preferencias de ayer. ¿Eso significa que el modelo las aprendió? No, el agente tiene estado porque el harness las escribió en un archivo de memoria y las recargó al empezar la sesión. El modelo en sí no vio nada de ayer.","salientes":["session","turn","context","smart-zone","agent","memory-system","environment","model","harness","stateless","parameters","tool-result","agentsmd","handoff-artifact","clearing"],"entrantes":4},{"termino":"Agent","slug":"agent","seccion":"Sección 2 — Sesiones, ventanas de contexto y turnos","descripcion":"Un modelo con harness: tools, system prompt y ventana de contexto, que toma turnos con un usuario. El modelo en movimiento.","html":"\u003cp>Un \u003ca class=\"x\" data-slug=\"model\" href=\"?term=model\">modelo\u003c/a> puesto en un \u003ca class=\"x\" data-slug=\"harness\" href=\"?term=harness\">harness\u003c/a> con \u003ca class=\"x\" data-slug=\"tool\" href=\"?term=tool\">tools\u003c/a>, un \u003ca class=\"x\" data-slug=\"system-prompt\" href=\"?term=system-prompt\">system prompt\u003c/a> y una \u003ca class=\"x\" data-slug=\"context-window\" href=\"?term=context-window\">ventana de contexto\u003c/a>, que toma \u003ca class=\"x\" data-slug=\"turn\" href=\"?term=turn\">turnos\u003c/a> con un usuario. \u003cem>Claude Code es un agente. Cursor es un agente. Claude.ai es un agente.\u003c/em> Un agente es con lo que en realidad hablas: es el modelo en movimiento, configurado para un propósito.\u003c/p>\n\u003cp>A diferencia de la mayoría de los términos de este diccionario, &quot;agente&quot; no nombra una parte mecánica. El modelo es un archivo de \u003ca class=\"x\" data-slug=\"parameters\" href=\"?term=parameters\">parámetros\u003c/a>; el harness es software al que puedes apuntar. El agente no es ninguna de las dos cosas: es la unidad a la que le hablas. La gente antropomorfiza la \u003ca class=\"x\" data-slug=\"ai\" href=\"?term=ai\">IA\u003c/a> todo el tiempo, y el agente es la unidad antropomorfizada: aquello a lo que le delegas, lo que lee tu mensaje y responde, el &quot;él&quot; de &quot;él rompió el build otra vez&quot;. Cuando dices que el agente hizo algo, quieres decir que lo hizo el modelo más el harness, pero te diriges a la combinación como si fuera un solo actor.\u003c/p>\n\u003cp>La idea es más vieja que esta ola de IA. Los agentes de software (programas a los que delegas un objetivo y que actúan en tu nombre) llevan siendo un concepto desde que existe la IA.\u003c/p>\n\u003cdiv class=\"block avoid\">\u003cp class=\"lbl\">Evita\u003c/p>\u003cp>&quot;la IA&quot;, &quot;el bot&quot; (son demasiado vagos: ocultan si te refieres a los parámetros o a la cosa con harness).\u003c/p>\u003c/div>\n\u003cdiv class=\"block\">\u003cp class=\"lbl\">Uso\u003c/p>\n\u003cp>&quot;¿Qué agente estás usando para la migración?&quot;\u003c/p>\n\u003cp>&quot;Claude Code en local, Cursor para el trabajo de UI: mismo modelo por debajo, harnesses distintos.&quot;\u003c/p>\n\n\u003c/div>","texto":"Un modelo con harness: tools, system prompt y ventana de contexto, que toma turnos con un usuario. El modelo en movimiento. Un modelo puesto en un harness con tools , un system prompt y una ventana de contexto , que toma turnos con un usuario. Claude Code es un agente. Cursor es un agente. Claude.ai es un agente. Un agente es con lo que en realidad hablas: es el modelo en movimiento, configurado para un propósito. A diferencia de la mayoría de los términos de este diccionario, agente no nombra una parte mecánica. El modelo es un archivo de parámetros ; el harness es software al que puedes apuntar. El agente no es ninguna de las dos cosas: es la unidad a la que le hablas. La gente antropomorfiza la IA todo el tiempo, y el agente es la unidad antropomorfizada: aquello a lo que le delegas, lo que lee tu mensaje y responde, el él de él rompió el build otra vez . Cuando dices que el agente hizo algo, quieres decir que lo hizo el modelo más el harness, pero te diriges a la combinación como si fuera un solo actor. La idea es más vieja que esta ola de IA. Los agentes de software (programas a los que delegas un objetivo y que actúan en tu nombre) llevan siendo un concepto desde que existe la IA. Evita la IA , el bot (son demasiado vagos: ocultan si te refieres a los parámetros o a la cosa con harness). Uso ¿Qué agente estás usando para la migración? Claude Code en local, Cursor para el trabajo de UI: mismo modelo por debajo, harnesses distintos.","salientes":["model","harness","tool","system-prompt","context-window","turn","parameters","ai"],"entrantes":50},{"termino":"System prompt","slug":"system-prompt","seccion":"Sección 2 — Sesiones, ventanas de contexto y turnos","descripcion":"Las instrucciones que el harness antepone a cada petición al proveedor: el brief permanente del agente. Suele ser estable en la sesión.","html":"\u003cp>Las instrucciones que el \u003ca class=\"x\" data-slug=\"harness\" href=\"?term=harness\">harness\u003c/a> antepone a cada \u003ca class=\"x\" data-slug=\"model-provider-request\" href=\"?term=model-provider-request\">petición al proveedor del modelo\u003c/a>: el brief permanente del \u003ca class=\"x\" data-slug=\"agent\" href=\"?term=agent\">agente\u003c/a>, quién es, cómo comportarse, qué \u003ca class=\"x\" data-slug=\"tool\" href=\"?term=tool\">tools\u003c/a> puede llamar, qué convenciones seguir. Suele mantenerse estable durante toda la \u003ca class=\"x\" data-slug=\"session\" href=\"?term=session\">sesión\u003c/a>.\u003c/p>\n\u003cp>El system prompt lo escribe el proveedor del harness, no tú, y en los harnesses de código suele ser grande: a menudo decenas de miles de \u003ca class=\"x\" data-slug=\"token\" href=\"?term=token\">tokens\u003c/a> de reglas de comportamiento, descripciones de tools y manejo de casos borde, todo pagado como \u003ca class=\"x\" data-slug=\"input-tokens\" href=\"?term=input-tokens\">tokens de entrada\u003c/a> en cada \u003ca class=\"x\" data-slug=\"turn\" href=\"?term=turn\">turno\u003c/a>. Tus propias instrucciones permanentes viajan junto a él: archivos como \u003ca class=\"x\" data-slug=\"agentsmd\" href=\"?term=agentsmd\">AGENTS.md\u003c/a> se cargan al lado del system prompt al empezar la sesión, así que el \u003ca class=\"x\" data-slug=\"model\" href=\"?term=model\">modelo\u003c/a> lee el brief del proveedor y el tuyo juntos antes de ver tu mensaje.\u003c/p>\n\u003cp>Como es idéntico en cada petición, forma el inicio de la \u003ca class=\"x\" data-slug=\"prefix-cache\" href=\"?term=prefix-cache\">caché de prefijo\u003c/a>, y esa es parte de la razón por la que los harnesses lo mantienen fijo durante toda la sesión en lugar de irlo editando sobre la marcha.\u003c/p>\n\u003cp>Los modelos están entrenados para priorizar el system prompt por sobre los mensajes del usuario. Por eso, cuando un agente insiste en una convención que nunca pediste, o formatea la salida de una forma que no logras cambiar, casi siempre está obedeciendo a su system prompt, y tu mensaje está perdiendo la discusión. Algunos harnesses son personalizables: te dan acceso completo al system prompt, así que puedes leer qué se le está diciendo de verdad al agente y cambiarlo.\u003c/p>\n\u003cdiv class=\"block\">\u003cp class=\"lbl\">Uso\u003c/p>\n\u003cp>&quot;Dos harnesses, mismo modelo, comportamiento totalmente distinto con el mismo prompt.&quot;\u003c/p>\n\u003cp>&quot;System prompts distintos. Uno está ajustado para ediciones de código breves, el otro para explicar: ahí vive la divergencia, antes de que tu mensaje siquiera llegue.&quot;\u003c/p>\n\n\u003c/div>","texto":"Las instrucciones que el harness antepone a cada petición al proveedor: el brief permanente del agente. Suele ser estable en la sesión. Las instrucciones que el harness antepone a cada petición al proveedor del modelo : el brief permanente del agente , quién es, cómo comportarse, qué tools puede llamar, qué convenciones seguir. Suele mantenerse estable durante toda la sesión . El system prompt lo escribe el proveedor del harness, no tú, y en los harnesses de código suele ser grande: a menudo decenas de miles de tokens de reglas de comportamiento, descripciones de tools y manejo de casos borde, todo pagado como tokens de entrada en cada turno . Tus propias instrucciones permanentes viajan junto a él: archivos como AGENTS.md se cargan al lado del system prompt al empezar la sesión, así que el modelo lee el brief del proveedor y el tuyo juntos antes de ver tu mensaje. Como es idéntico en cada petición, forma el inicio de la caché de prefijo , y esa es parte de la razón por la que los harnesses lo mantienen fijo durante toda la sesión en lugar de irlo editando sobre la marcha. Los modelos están entrenados para priorizar el system prompt por sobre los mensajes del usuario. Por eso, cuando un agente insiste en una convención que nunca pediste, o formatea la salida de una forma que no logras cambiar, casi siempre está obedeciendo a su system prompt, y tu mensaje está perdiendo la discusión. Algunos harnesses son personalizables: te dan acceso completo al system prompt, así que puedes leer qué se le está diciendo de verdad al agente y cambiarlo. Uso Dos harnesses, mismo modelo, comportamiento totalmente distinto con el mismo prompt. System prompts distintos. Uno está ajustado para ediciones de código breves, el otro para explicar: ahí vive la divergencia, antes de que tu mensaje siquiera llegue.","salientes":["harness","model-provider-request","agent","tool","session","token","input-tokens","turn","agentsmd","model","prefix-cache"],"entrantes":11},{"termino":"Session","slug":"session","seccion":"Sección 2 — Sesiones, ventanas de contexto y turnos","descripcion":"Una interacción acotada con un agente. Arranca vacía, se acumula, y termina al limpiarla, cerrarla o compactarla en una sesión nueva.","html":"\u003cp>Una interacción acotada con un \u003ca class=\"x\" data-slug=\"agent\" href=\"?term=agent\">agente\u003c/a>. Arranca vacía, acumula mensajes, \u003ca class=\"x\" data-slug=\"tool-result\" href=\"?term=tool-result\">tool results\u003c/a> y archivos leídos, y termina cuando se \u003ca class=\"x\" data-slug=\"clearing\" href=\"?term=clearing\">limpia\u003c/a>, se cierra o se \u003ca class=\"x\" data-slug=\"compaction\" href=\"?term=compaction\">compacta\u003c/a> en una sesión nueva. La sesión es lo que \u003cem>llena\u003c/em> la \u003ca class=\"x\" data-slug=\"context-window\" href=\"?term=context-window\">ventana de contexto\u003c/a>: si la ventana de contexto es la caja, la sesión es lo que la va llenando de a poco. El trabajo demasiado grande para una sola ventana de contexto hay que repartirlo entre varias sesiones.\u003c/p>\n\u003cp>El historial de mensajes de la sesión es la memoria de trabajo del agente. El \u003ca class=\"x\" data-slug=\"model\" href=\"?term=model\">modelo\u003c/a> es \u003ca class=\"x\" data-slug=\"stateless\" href=\"?term=stateless\">sin estado\u003c/a>, así que todo lo que parece recordar (lo que pediste, lo que dijeron los tests, lo que decidió hace tres turnos) está en el historial de mensajes, que se reenvía completo con cada \u003ca class=\"x\" data-slug=\"model-provider-request\" href=\"?term=model-provider-request\">petición al proveedor del modelo\u003c/a>. Lo que no está en la sesión no existe para el agente.\u003c/p>\n\u003cp>Esa memoria termina con la sesión. Una sesión nueva arranca de cero: el agente que conocía bien tu código base al final de la sesión de ayer no sabe nada de eso esta mañana. Lo que sobrevive es el \u003ca class=\"x\" data-slug=\"filesystem\" href=\"?term=filesystem\">sistema de archivos\u003c/a>: los archivos escritos durante una sesión los puede leer la siguiente, y en eso se apoyan los \u003ca class=\"x\" data-slug=\"handoff\" href=\"?term=handoff\">handoffs\u003c/a>, los \u003ca class=\"x\" data-slug=\"memory-system\" href=\"?term=memory-system\">sistemas de memoria\u003c/a> y los \u003ca class=\"x\" data-slug=\"agentsmd\" href=\"?term=agentsmd\">AGENTS.md\u003c/a>.\u003c/p>\n\u003cp>Tú eliges dónde termina una sesión. Todo lo que hay en una sesión influye en cada \u003ca class=\"x\" data-slug=\"turn\" href=\"?term=turn\">turno\u003c/a> posterior, así que tareas sin relación hechas en la misma sesión dejan residuos que tiñen la siguiente respuesta. Una tarea por sesión mantiene el contexto relevante; terminar una tarea es un buen momento natural para limpiar.\u003c/p>\n\u003cdiv class=\"block\">\u003cp class=\"lbl\">Uso\u003c/p>\n\u003cp>&quot;¿Cuánto puede durar una sesión antes de que se desarme?&quot;\u003c/p>\n\u003cp>&quot;Depende del trabajo: una refactorización acotada aguanta más nítida que una investigación abierta. Cuando la sesión se hincha, hazle handoff o compáctala, no sigas insistiendo.&quot;\u003c/p>\n\n\u003c/div>","texto":"Una interacción acotada con un agente. Arranca vacía, se acumula, y termina al limpiarla, cerrarla o compactarla en una sesión nueva. Una interacción acotada con un agente . Arranca vacía, acumula mensajes, tool results y archivos leídos, y termina cuando se limpia , se cierra o se compacta en una sesión nueva. La sesión es lo que llena la ventana de contexto : si la ventana de contexto es la caja, la sesión es lo que la va llenando de a poco. El trabajo demasiado grande para una sola ventana de contexto hay que repartirlo entre varias sesiones. El historial de mensajes de la sesión es la memoria de trabajo del agente. El modelo es sin estado , así que todo lo que parece recordar (lo que pediste, lo que dijeron los tests, lo que decidió hace tres turnos) está en el historial de mensajes, que se reenvía completo con cada petición al proveedor del modelo . Lo que no está en la sesión no existe para el agente. Esa memoria termina con la sesión. Una sesión nueva arranca de cero: el agente que conocía bien tu código base al final de la sesión de ayer no sabe nada de eso esta mañana. Lo que sobrevive es el sistema de archivos : los archivos escritos durante una sesión los puede leer la siguiente, y en eso se apoyan los handoffs , los sistemas de memoria y los AGENTS.md . Tú eliges dónde termina una sesión. Todo lo que hay en una sesión influye en cada turno posterior, así que tareas sin relación hechas en la misma sesión dejan residuos que tiñen la siguiente respuesta. Una tarea por sesión mantiene el contexto relevante; terminar una tarea es un buen momento natural para limpiar. Uso ¿Cuánto puede durar una sesión antes de que se desarme? Depende del trabajo: una refactorización acotada aguanta más nítida que una investigación abierta. Cuando la sesión se hincha, hazle handoff o compáctala, no sigas insistiendo.","salientes":["agent","tool-result","clearing","compaction","context-window","model","stateless","model-provider-request","filesystem","handoff","memory-system","agentsmd","turn"],"entrantes":45},{"termino":"Turn","slug":"turn","seccion":"Sección 2 — Sesiones, ventanas de contexto y turnos","descripcion":"Un mensaje del usuario más todo lo que hace el agente en respuesta, hasta devolver el turno. Contiene una o más peticiones al proveedor.","html":"\u003cp>Un mensaje del usuario más todo lo que el \u003ca class=\"x\" data-slug=\"agent\" href=\"?term=agent\">agente\u003c/a> hace en respuesta, hasta que le devuelve el turno al usuario. Contiene una o más \u003ca class=\"x\" data-slug=\"model-provider-request\" href=\"?term=model-provider-request\">peticiones al proveedor del modelo\u003c/a>: varias, si el agente llama \u003ca class=\"x\" data-slug=\"tool\" href=\"?term=tool\">tools\u003c/a>. Una pregunta aclaratoria cierra el turno; tu respuesta abre el siguiente. La jerarquía es \u003ca class=\"x\" data-slug=\"session\" href=\"?term=session\">sesión\u003c/a> \u003cstrong>&gt; Turno &gt; Petición al proveedor del modelo\u003c/strong>.\u003c/p>\n\u003cp>Lo que hace que valga la pena nombrar el turno es que su duración la decide el agente, no tú. Tú entregas un mensaje; el agente decide cuántos tool calls encadenar antes de devolver el turno. Un turno puede ser una respuesta de una frase o veinte minutos leyendo, editando y corriendo tests. Es la misma propiedad vista desde dos ángulos: los turnos largos son lo que hace posible trabajar en modo \u003ca class=\"x\" data-slug=\"afk\" href=\"?term=afk\">AFK\u003c/a>, y los turnos largos son también donde las cosas salen mal sin supervisión: para cuando el agente devuelve el turno, puede haberse alejado bastante de lo que querías decir.\u003c/p>\n\u003cp>El turno es además la unidad natural para dirigir al agente. Todo lo que pasa dentro de un turno ocurre sin ti; los espacios entre turnos son donde tú rediriges. La mayoría de los \u003ca class=\"x\" data-slug=\"harness\" href=\"?term=harness\">harnesses\u003c/a> suaviza esto: puedes interrumpir a mitad de turno para detener al agente y redirigirlo, o escribir un mensaje mientras trabaja, que se lee cuando el turno termina. Si notas que sigues insatisfecho con dónde terminan los turnos, el arreglo suele ser pedir turnos más chicos (un plan primero, un paso a la vez), sacrificando autonomía a cambio de espacios más frecuentes para dirigir.\u003c/p>\n\u003cdiv class=\"block\">\u003cp class=\"lbl\">Uso\u003c/p>\n\u003cp>&quot;¿Un turno tomó dos minutos?&quot;\u003c/p>\n\u003cp>&quot;Hizo catorce \u003ca class=\"x\" data-slug=\"tool-call\" href=\"?term=tool-call\">tool calls\u003c/a> dentro de ese turno: cada uno es una petición al proveedor del modelo separada. La latencia se acumula antes de que el agente por fin te devuelva el turno.&quot;\u003c/p>\n\n\u003c/div>","texto":"Un mensaje del usuario más todo lo que hace el agente en respuesta, hasta devolver el turno. Contiene una o más peticiones al proveedor. Un mensaje del usuario más todo lo que el agente hace en respuesta, hasta que le devuelve el turno al usuario. Contiene una o más peticiones al proveedor del modelo : varias, si el agente llama tools . Una pregunta aclaratoria cierra el turno; tu respuesta abre el siguiente. La jerarquía es sesión Turno Petición al proveedor del modelo . Lo que hace que valga la pena nombrar el turno es que su duración la decide el agente, no tú. Tú entregas un mensaje; el agente decide cuántos tool calls encadenar antes de devolver el turno. Un turno puede ser una respuesta de una frase o veinte minutos leyendo, editando y corriendo tests. Es la misma propiedad vista desde dos ángulos: los turnos largos son lo que hace posible trabajar en modo AFK , y los turnos largos son también donde las cosas salen mal sin supervisión: para cuando el agente devuelve el turno, puede haberse alejado bastante de lo que querías decir. El turno es además la unidad natural para dirigir al agente. Todo lo que pasa dentro de un turno ocurre sin ti; los espacios entre turnos son donde tú rediriges. La mayoría de los harnesses suaviza esto: puedes interrumpir a mitad de turno para detener al agente y redirigirlo, o escribir un mensaje mientras trabaja, que se lee cuando el turno termina. Si notas que sigues insatisfecho con dónde terminan los turnos, el arreglo suele ser pedir turnos más chicos (un plan primero, un paso a la vez), sacrificando autonomía a cambio de espacios más frecuentes para dirigir. Uso ¿Un turno tomó dos minutos? Hizo catorce tool calls dentro de ese turno: cada uno es una petición al proveedor del modelo separada. La latencia se acumula antes de que el agente por fin te devuelva el turno.","salientes":["agent","model-provider-request","tool","session","afk","harness","tool-call"],"entrantes":22},{"termino":"Environment","slug":"environment","seccion":"Sección 3 — Tools y entorno","descripcion":"El mundo sobre el que actúa el agente: todo lo que está fuera del harness y que percibe con tool results y cambia con tool calls.","html":"\u003cp>El mundo sobre el que actúa el \u003ca class=\"x\" data-slug=\"agent\" href=\"?term=agent\">agente\u003c/a>: todo lo que queda fuera del \u003ca class=\"x\" data-slug=\"harness\" href=\"?term=harness\">harness\u003c/a> y que el agente percibe mediante \u003ca class=\"x\" data-slug=\"tool-result\" href=\"?term=tool-result\">tool results\u003c/a> y cambia mediante \u003ca class=\"x\" data-slug=\"tool-call\" href=\"?term=tool-call\">tool calls\u003c/a>. El harness \u003cem>corre\u003c/em> al agente; el entorno es donde el agente \u003cem>trabaja\u003c/em>. Un archivo como \u003ca class=\"x\" data-slug=\"agentsmd\" href=\"?term=agentsmd\">\u003ccode>AGENTS.md\u003c/code>\u003c/a> vive en el entorno; el harness es quien lo carga en la \u003ca class=\"x\" data-slug=\"context-window\" href=\"?term=context-window\">ventana de contexto\u003c/a>. Un \u003ca class=\"x\" data-slug=\"filesystem\" href=\"?term=filesystem\">sistema de archivos\u003c/a> es el tipo de entorno más común, pero no el único (una base de datos, una API remota o una sesión de navegador también pueden ser entornos).\u003c/p>\n\u003cp>El agente solo ve el entorno cuando mira. Todo lo que sabe de él le llegó a través de un tool result, así que su imagen es una colección de instantáneas, cada una correcta en el momento en que se tomó. Si un archivo cambia después de que el agente lo leyó (lo editas a mano, un paso de build lo regenera), el agente sigue razonando sobre la copia vieja hasta que algo lo empuja a releerlo. Un agente que describe con seguridad un archivo que ya no es así suele ser esto: el entorno se movió, la instantánea no.\u003c/p>\n\u003cp>El entorno es además la capa que persiste: la única que siempre tiene \u003ca class=\"x\" data-slug=\"stateful\" href=\"?term=stateful\">estado\u003c/a>. El contexto de una \u003ca class=\"x\" data-slug=\"session\" href=\"?term=session\">sesión\u003c/a> desaparece cuando la sesión termina, pero los archivos escritos en el entorno quedan ahí para que la próxima sesión los lea, que es justo de lo que dependen los \u003ca class=\"x\" data-slug=\"memory-system\" href=\"?term=memory-system\">sistemas de memoria\u003c/a>, los \u003ca class=\"x\" data-slug=\"handoff-artifact\" href=\"?term=handoff-artifact\">artefactos de handoff\u003c/a> y \u003ccode>AGENTS.md\u003c/code>. Todo lo que el agente deba seguir sabiendo mañana tiene que terminar en el entorno.\u003c/p>\n\u003cp>Tú decides qué tan grande es el entorno. Un \u003ca class=\"x\" data-slug=\"sandbox\" href=\"?term=sandbox\">sandbox\u003c/a> lo achica, limitando lo que el agente puede alcanzar; agregar una \u003ca class=\"x\" data-slug=\"tool\" href=\"?term=tool\">tool\u003c/a> lo extiende, poniendo a su alcance una base de datos o una API. Lo que queda dentro del límite es lo que el agente puede percibir y cambiar; todo lo que queda afuera no existe para el agente. Qué tan bien está armado el entorno para sostener el trabajo del agente es el \u003ca class=\"x\" data-slug=\"ax\" href=\"?term=ax\">AX\u003c/a> del código base.\u003c/p>\n\u003cdiv class=\"block avoid\">\u003cp class=\"lbl\">Evita\u003c/p>\u003cp>usar &quot;entorno&quot; para el runtime o el harness mismo: el harness es el envoltorio, el entorno es el espacio de trabajo.\u003c/p>\u003c/div>\n\u003cdiv class=\"block\">\u003cp class=\"lbl\">Uso\u003c/p>\n\u003cp>&quot;El agente no puede ver el schema de la base de staging.&quot;\u003c/p>\n\u003cp>&quot;Conéctalo al entorno: dale una tool de \u003ccode>psql\u003c/code> acotada a solo lectura en staging. El harness está bien, simplemente no tiene nada sobre qué actuar.&quot;\u003c/p>\n\n\u003c/div>","texto":"El mundo sobre el que actúa el agente: todo lo que está fuera del harness y que percibe con tool results y cambia con tool calls. El mundo sobre el que actúa el agente : todo lo que queda fuera del harness y que el agente percibe mediante tool results y cambia mediante tool calls . El harness corre al agente; el entorno es donde el agente trabaja . Un archivo como AGENTS.md vive en el entorno; el harness es quien lo carga en la ventana de contexto . Un sistema de archivos es el tipo de entorno más común, pero no el único (una base de datos, una API remota o una sesión de navegador también pueden ser entornos). El agente solo ve el entorno cuando mira. Todo lo que sabe de él le llegó a través de un tool result, así que su imagen es una colección de instantáneas, cada una correcta en el momento en que se tomó. Si un archivo cambia después de que el agente lo leyó (lo editas a mano, un paso de build lo regenera), el agente sigue razonando sobre la copia vieja hasta que algo lo empuja a releerlo. Un agente que describe con seguridad un archivo que ya no es así suele ser esto: el entorno se movió, la instantánea no. El entorno es además la capa que persiste: la única que siempre tiene estado . El contexto de una sesión desaparece cuando la sesión termina, pero los archivos escritos en el entorno quedan ahí para que la próxima sesión los lea, que es justo de lo que dependen los sistemas de memoria , los artefactos de handoff y AGENTS.md . Todo lo que el agente deba seguir sabiendo mañana tiene que terminar en el entorno. Tú decides qué tan grande es el entorno. Un sandbox lo achica, limitando lo que el agente puede alcanzar; agregar una tool lo extiende, poniendo a su alcance una base de datos o una API. Lo que queda dentro del límite es lo que el agente puede percibir y cambiar; todo lo que queda afuera no existe para el agente. Qué tan bien está armado el entorno para sostener el trabajo del agente es el AX del código base. Evita usar entorno para el runtime o el harness mismo: el harness es el envoltorio, el entorno es el espacio de trabajo. Uso El agente no puede ver el schema de la base de staging. Conéctalo al entorno: dale una tool de psql acotada a solo lectura en staging. El harness está bien, simplemente no tiene nada sobre qué actuar.","salientes":["agent","harness","tool-result","tool-call","agentsmd","context-window","filesystem","stateful","session","memory-system","handoff-artifact","sandbox","tool","ax"],"entrantes":14},{"termino":"Filesystem","slug":"filesystem","seccion":"Sección 3 — Tools y entorno","descripcion":"Un árbol de archivos y carpetas donde el agente lee, escribe y ejecuta: el entorno por defecto de un agente de código.","html":"\u003cp>Un árbol de archivos y carpetas donde el \u003ca class=\"x\" data-slug=\"agent\" href=\"?term=agent\">agente\u003c/a> lee, escribe y ejecuta: el tipo de \u003ca class=\"x\" data-slug=\"environment\" href=\"?term=environment\">entorno\u003c/a> por defecto de un agente de código. \u003ca class=\"x\" data-slug=\"agentsmd\" href=\"?term=agentsmd\">\u003ccode>AGENTS.md\u003c/code>\u003c/a>, las \u003ca class=\"x\" data-slug=\"skill\" href=\"?term=skill\">skills\u003c/a>, el código fuente, los scripts de build y las configuraciones de \u003ca class=\"x\" data-slug=\"tool\" href=\"?term=tool\">tools\u003c/a> viven todos en un sistema de archivos. Cuando un \u003ca class=\"x\" data-slug=\"harness\" href=\"?term=harness\">harness\u003c/a> &quot;arranca en tu proyecto&quot;, está apuntando al agente hacia un sistema de archivos.\u003c/p>\n\u003cp>El agente lo toca solo a través de \u003ca class=\"x\" data-slug=\"tool-call\" href=\"?term=tool-call\">tool calls\u003c/a>: leer un archivo, escribir uno, correr un comando de shell. Nada en disco está en la \u003ca class=\"x\" data-slug=\"context-window\" href=\"?term=context-window\">ventana de contexto\u003c/a> hasta que un tool call lo carga, y eso es justo lo que le permite al agente trabajar en un repositorio mucho más grande que la ventana: el sistema de archivos guarda todo, el contexto guarda solo lo que la tarea actual leyó. Algunos harnesses cargan por defecto los nombres de archivo del directorio actual en la ventana de contexto (no el contenido, solo el árbol), que funcionan como \u003ca class=\"x\" data-slug=\"context-pointer\" href=\"?term=context-pointer\">punteros de contexto\u003c/a>: el agente ve qué existe y lee los archivos que necesita.\u003c/p>\n\u003cp>Y es compartido contigo. Los archivos que el agente edita son los mismos que abres en tu editor y comparas en git: el sistema de archivos es el espacio de trabajo común donde revisas lo que hizo el agente.\u003c/p>\n\u003cdiv class=\"block\">\u003cp class=\"lbl\">Uso\u003c/p>\n\u003cp>&quot;¿Por qué no está leyendo mi AGENTS.md?&quot;\u003c/p>\n\u003cp>&quot;Está corriendo contra otro sistema de archivos: el \u003ca class=\"x\" data-slug=\"sandbox\" href=\"?term=sandbox\">sandbox\u003c/a> montó el directorio padre, no la raíz del proyecto. Reapunta el harness.&quot;\u003c/p>\n\n\u003c/div>","texto":"Un árbol de archivos y carpetas donde el agente lee, escribe y ejecuta: el entorno por defecto de un agente de código. Un árbol de archivos y carpetas donde el agente lee, escribe y ejecuta: el tipo de entorno por defecto de un agente de código. AGENTS.md , las skills , el código fuente, los scripts de build y las configuraciones de tools viven todos en un sistema de archivos. Cuando un harness arranca en tu proyecto , está apuntando al agente hacia un sistema de archivos. El agente lo toca solo a través de tool calls : leer un archivo, escribir uno, correr un comando de shell. Nada en disco está en la ventana de contexto hasta que un tool call lo carga, y eso es justo lo que le permite al agente trabajar en un repositorio mucho más grande que la ventana: el sistema de archivos guarda todo, el contexto guarda solo lo que la tarea actual leyó. Algunos harnesses cargan por defecto los nombres de archivo del directorio actual en la ventana de contexto (no el contenido, solo el árbol), que funcionan como punteros de contexto : el agente ve qué existe y lee los archivos que necesita. Y es compartido contigo. Los archivos que el agente edita son los mismos que abres en tu editor y comparas en git: el sistema de archivos es el espacio de trabajo común donde revisas lo que hizo el agente. Uso ¿Por qué no está leyendo mi AGENTS.md? Está corriendo contra otro sistema de archivos: el sandbox montó el directorio padre, no la raíz del proyecto. Reapunta el harness.","salientes":["agent","environment","agentsmd","skill","tool","harness","tool-call","context-window","context-pointer","sandbox"],"entrantes":7},{"termino":"Tool","slug":"tool","seccion":"Sección 3 — Tools y entorno","descripcion":"Una función que el harness expone para que el agente la llame: Read, Write, Bash, Search. Así percibe y actúa sobre el entorno.","html":"\u003cp>Una función que el \u003ca class=\"x\" data-slug=\"harness\" href=\"?term=harness\">harness\u003c/a> expone para que el \u003ca class=\"x\" data-slug=\"agent\" href=\"?term=agent\">agente\u003c/a> la llame: Read, Write, Bash, Search. Las tools son la forma en que un agente percibe y actúa sobre el \u003ca class=\"x\" data-slug=\"environment\" href=\"?term=environment\">entorno\u003c/a>: no puede ver el entorno salvo a través de \u003ca class=\"x\" data-slug=\"tool-result\" href=\"?term=tool-result\">tool results\u003c/a>, ni cambiarlo salvo a través de \u003ca class=\"x\" data-slug=\"tool-call\" href=\"?term=tool-call\">tool calls\u003c/a>. Cada tool call cuesta una \u003ca class=\"x\" data-slug=\"model-provider-request\" href=\"?term=model-provider-request\">petición al proveedor del modelo\u003c/a> extra, porque el resultado tiene que volver al modelo antes de que decida qué hacer después.\u003c/p>\n\u003cp>Tools con las que viene casi cualquier agente de código:\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Tool\u003c/th>\n\u003cth>Qué hace\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Read\u003c/td>\n\u003ctd>Devuelve el contenido de un archivo como tool result\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Write\u003c/td>\n\u003ctd>Crea o edita un archivo en el \u003ca class=\"x\" data-slug=\"filesystem\" href=\"?term=filesystem\">sistema de archivos\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Bash\u003c/td>\n\u003ctd>Corre un comando de shell y devuelve su salida\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Search\u003c/td>\n\u003ctd>Encuentra archivos o texto que calzan con un patrón en el código base\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Una tool queda definida por tres cosas: un nombre, una descripción de lo que hace y un schema para sus parámetros. El harness manda estas definiciones al \u003ca class=\"x\" data-slug=\"model\" href=\"?term=model\">modelo\u003c/a> en cada petición, y el modelo elige una tool de la misma forma en que produce todo lo demás: escribiendo \u003ca class=\"x\" data-slug=\"token\" href=\"?term=token\">tokens\u003c/a>, en este caso un llamado estructurado con argumentos. El modelo nunca ejecuta nada él mismo; el harness lee el llamado, corre la función y devuelve el resultado.\u003c/p>\n\u003cp>La lista de tools define qué puede hacer el agente. Un modelo capaz con un set de tools angosto es un agente angosto: va a encauzar todo por lo que tenga a mano, que es por lo que los agentes se apoyan tanto en Bash: un shell es una sola tool que alcanza casi todo el sistema. Para darle a un agente una capacidad de forma limpia, se le agrega una tool; el \u003ca class=\"x\" data-slug=\"mcp\" href=\"?term=mcp\">MCP\u003c/a> es el estándar para conectar tools desde fuera del harness.\u003c/p>\n\u003cp>Las definiciones de tools ocupan \u003ca class=\"x\" data-slug=\"context\" href=\"?term=context\">contexto\u003c/a> en cada petición, así que un set de tools grande tiene un costo fijo antes de que se llame a ninguna, y tener muchas tools descritas de forma parecida hace que al modelo le cueste más elegir la correcta.\u003c/p>\n\u003cdiv class=\"block\">\u003cp class=\"lbl\">Uso\u003c/p>\n\u003cp>&quot;¿Puede el agente consultar staging directamente?&quot;\u003c/p>\n\u003cp>&quot;Agrega una tool de \u003ccode>psql\u003c/code> al harness, acotada a solo lectura en staging. Sin una tool para eso, el agente queda ciego a todo lo que esté fuera del sistema de archivos.&quot;\u003c/p>\n\n\u003c/div>","texto":"Una función que el harness expone para que el agente la llame: Read, Write, Bash, Search. Así percibe y actúa sobre el entorno. Una función que el harness expone para que el agente la llame: Read, Write, Bash, Search. Las tools son la forma en que un agente percibe y actúa sobre el entorno : no puede ver el entorno salvo a través de tool results , ni cambiarlo salvo a través de tool calls . Cada tool call cuesta una petición al proveedor del modelo extra, porque el resultado tiene que volver al modelo antes de que decida qué hacer después. Tools con las que viene casi cualquier agente de código: Tool Qué hace Read Devuelve el contenido de un archivo como tool result Write Crea o edita un archivo en el sistema de archivos Bash Corre un comando de shell y devuelve su salida Search Encuentra archivos o texto que calzan con un patrón en el código base Una tool queda definida por tres cosas: un nombre, una descripción de lo que hace y un schema para sus parámetros. El harness manda estas definiciones al modelo en cada petición, y el modelo elige una tool de la misma forma en que produce todo lo demás: escribiendo tokens , en este caso un llamado estructurado con argumentos. El modelo nunca ejecuta nada él mismo; el harness lee el llamado, corre la función y devuelve el resultado. La lista de tools define qué puede hacer el agente. Un modelo capaz con un set de tools angosto es un agente angosto: va a encauzar todo por lo que tenga a mano, que es por lo que los agentes se apoyan tanto en Bash: un shell es una sola tool que alcanza casi todo el sistema. Para darle a un agente una capacidad de forma limpia, se le agrega una tool; el MCP es el estándar para conectar tools desde fuera del harness. Las definiciones de tools ocupan contexto en cada petición, así que un set de tools grande tiene un costo fijo antes de que se llame a ninguna, y tener muchas tools descritas de forma parecida hace que al modelo le cueste más elegir la correcta. Uso ¿Puede el agente consultar staging directamente? Agrega una tool de psql al harness, acotada a solo lectura en staging. Sin una tool para eso, el agente queda ciego a todo lo que esté fuera del sistema de archivos.","salientes":["harness","agent","environment","tool-result","tool-call","model-provider-request","filesystem","model","token","mcp","context"],"entrantes":15},{"termino":"Tool call","slug":"tool-call","seccion":"Sección 3 — Tools y entorno","descripcion":"La salida del modelo que nombra una tool y sus argumentos: puro texto estructurado. El harness tiene que leerla y ejecutarla.","html":"\u003cp>La salida del \u003ca class=\"x\" data-slug=\"model\" href=\"?term=model\">modelo\u003c/a> que nombra una \u003ca class=\"x\" data-slug=\"tool\" href=\"?term=tool\">tool\u003c/a> y sus argumentos: puro texto estructurado. No hace nada por sí sola; el \u003ca class=\"x\" data-slug=\"harness\" href=\"?term=harness\">harness\u003c/a> tiene que leerla y ejecutarla. La produce el modelo en una sola \u003ca class=\"x\" data-slug=\"model-provider-request\" href=\"?term=model-provider-request\">petición al proveedor del modelo\u003c/a>.\u003c/p>\n\u003cp>El ciclo de vida de un tool call:\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Paso\u003c/th>\n\u003cth>Quién\u003c/th>\n\u003cth>Qué pasa\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>Modelo\u003c/td>\n\u003ctd>Se entera de qué tools existen por las descripciones del \u003ca class=\"x\" data-slug=\"system-prompt\" href=\"?term=system-prompt\">system prompt\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>Modelo\u003c/td>\n\u003ctd>Emite un llamado (nombre de la tool más argumentos, normalmente JSON) y se detiene\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>Harness\u003c/td>\n\u003ctd>Interpreta el llamado y lo revisa contra el \u003ca class=\"x\" data-slug=\"permission-mode\" href=\"?term=permission-mode\">modo de permisos\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>Harness\u003c/td>\n\u003ctd>Lo ejecuta si está permitido\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>Harness\u003c/td>\n\u003ctd>Devuelve el resultado como \u003ca class=\"x\" data-slug=\"tool-result\" href=\"?term=tool-result\">tool result\u003c/a> en la próxima petición\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Un \u003ca class=\"x\" data-slug=\"turn\" href=\"?term=turn\">turno\u003c/a> de trabajo del \u003ca class=\"x\" data-slug=\"agent\" href=\"?term=agent\">agente\u003c/a> suele ser muchas de estas idas y vueltas encadenadas.\u003c/p>\n\u003cp>Como el llamado se genera por \u003ca class=\"x\" data-slug=\"next-token-prediction\" href=\"?term=next-token-prediction\">predicción del siguiente token\u003c/a> igual que todo lo demás, puede estar mal de la misma forma en que puede estar mal cualquier salida del modelo: una ruta que no existe, un flag que el comando no tiene, argumentos que parecen plausibles pero no son correctos. El harness ejecuta lo que se escribió, no lo que se quiso decir: una ruta mal tipeada no falla con gracia, edita el archivo equivocado.\u003c/p>\n\u003cdiv class=\"block\">\u003cp class=\"lbl\">Uso\u003c/p>\n\u003cp>&quot;Dijo que corrió los tests, pero los timestamps de los archivos no cambiaron.&quot;\u003c/p>\n\u003cp>&quot;Mira la transcripción: ¿de verdad emitió un tool call, o solo describió que los corría? El modelo produce el llamado, pero si el harness no lo ejecutó, no pasó nada.&quot;\u003c/p>\n\n\u003c/div>","texto":"La salida del modelo que nombra una tool y sus argumentos: puro texto
