 estructurado. El harness tiene que leerla y ejecutarla. La salida del modelo que nombra una tool y sus argumentos: puro texto estructurado. No hace nada por sí sola; el harness tiene que leerla y ejecutarla. La produce el modelo en una sola petición al proveedor del modelo . El ciclo de vida de un tool call: Paso Quién Qué pasa 1 Modelo Se entera de qué tools existen por las descripciones del system prompt 2 Modelo Emite un llamado (nombre de la tool más argumentos, normalmente JSON) y se detiene 3 Harness Interpreta el llamado y lo revisa contra el modo de permisos 4 Harness Lo ejecuta si está permitido 5 Harness Devuelve el resultado como tool result en la próxima petición Un turno de trabajo del agente suele ser muchas de estas idas y vueltas encadenadas. Como el llamado se genera por predicción del siguiente token igual que todo lo demás, puede estar mal de la misma forma en que puede estar mal cualquier salida del modelo: una ruta que no existe, un flag que el comando no tiene, argumentos que parecen plausibles pero no son correctos. El harness ejecuta lo que se escribió, no lo que se quiso decir: una ruta mal tipeada no falla con gracia, edita el archivo equivocado. Uso Dijo que corrió los tests, pero los timestamps de los archivos no cambiaron. Mira la transcripción: ¿de verdad emitió un tool call, o solo describió que los corría? El modelo produce el llamado, pero si el harness no lo ejecutó, no pasó nada.","salientes":["model","tool","harness","model-provider-request","system-prompt","permission-mode","tool-result","turn","agent","next-token-prediction"],"entrantes":16},{"termino":"Tool result","slug":"tool-result","seccion":"Sección 3 — Tools y entorno","descripcion":"Lo que el harness devuelve tras ejecutar un tool call: contenido, salida o error. La única vista que el agente tiene del entorno.","html":"\u003cp>Lo que el \u003ca class=\"x\" data-slug=\"harness\" href=\"?term=harness\">harness\u003c/a> devuelve después de ejecutar un \u003ca class=\"x\" data-slug=\"tool-call\" href=\"?term=tool-call\">tool call\u003c/a>: el contenido del archivo, la salida del comando, el error. La única vista que tiene el \u003ca class=\"x\" data-slug=\"agent\" href=\"?term=agent\">agente\u003c/a> del \u003ca class=\"x\" data-slug=\"environment\" href=\"?term=environment\">entorno\u003c/a>. Viaja de vuelta al \u003ca class=\"x\" data-slug=\"model\" href=\"?term=model\">modelo\u003c/a> en la \u003cem>siguiente\u003c/em> \u003ca class=\"x\" data-slug=\"model-provider-request\" href=\"?term=model-provider-request\">petición al proveedor del modelo\u003c/a>, donde el modelo decide qué hacer con eso. Tool call y tool result son las dos puntas del mismo intercambio, ambas dentro de un \u003ca class=\"x\" data-slug=\"turn\" href=\"?term=turn\">turno\u003c/a>.\u003c/p>\n\u003cp>El ciclo de vida de un tool result:\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Paso\u003c/th>\n\u003cth>Quién\u003c/th>\n\u003cth>Qué pasa\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>Harness\u003c/td>\n\u003ctd>Ejecuta el tool call: corre el comando, lee el archivo\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>Harness\u003c/td>\n\u003ctd>Captura el resultado: salida, contenido o error\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>Harness\u003c/td>\n\u003ctd>Lo agrega al \u003ca class=\"x\" data-slug=\"context\" href=\"?term=context\">contexto\u003c/a> como un mensaje\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>Harness\u003c/td>\n\u003ctd>Manda todo el contexto al proveedor en la próxima petición al proveedor del modelo\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>Modelo\u003c/td>\n\u003ctd>Lee el resultado y decide: otro tool call, o una respuesta final\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>El resultado se queda en el contexto por el resto de la \u003ca class=\"x\" data-slug=\"session\" href=\"?term=session\">sesión\u003c/a>. Los tool results suelen ser el grueso del contexto de una sesión de código: cada archivo leído, cada test corrido, cada búsqueda entra completa y sigue ocupando \u003ca class=\"x\" data-slug=\"token\" href=\"?term=token\">tokens\u003c/a> mucho después de dejar de ser útil. Unos pocos resultados grandes (un log de tests verboso, un archivo generado leído entero) pueden empujar a una sesión hacia el borde de la \u003ca class=\"x\" data-slug=\"context-window\" href=\"?term=context-window\">ventana de contexto\u003c/a> más rápido que la conversación misma.\u003c/p>\n\u003cp>Como el resultado es todo lo que el modelo ve, el modelo no tiene forma de comprobar el entorno detrás de él. Si la salida se truncó, el comando falló en silencio, o el harness devolvió un error en vez del contenido, el modelo razona sobre lo que le llegó. Cuando la imagen que tiene el agente de tu sistema parece equivocada, ahí es donde hay que mirar: en algún lugar de la transcripción hay un resultado que dice algo distinto de lo que tú sabes que es cierto.\u003c/p>\n\u003cdiv class=\"block\">\u003cp class=\"lbl\">Uso\u003c/p>\n\u003cp>&quot;Está razonando sobre el archivo como si estuviera vacío.&quot;\u003c/p>\n\u003cp>&quot;El tool result volvió como un rechazo de permiso, no como el contenido. El modelo solo vio el string de error: no tiene otra forma de ver el archivo.&quot;\u003c/p>\n\n\u003c/div>","texto":"Lo que el harness devuelve tras ejecutar un tool call: contenido, salida o error. La única vista que el agente tiene del entorno. Lo que el harness devuelve después de ejecutar un tool call : el contenido del archivo, la salida del comando, el error. La única vista que tiene el agente del entorno . Viaja de vuelta al modelo en la siguiente petición al proveedor del modelo , donde el modelo decide qué hacer con eso. Tool call y tool result son las dos puntas del mismo intercambio, ambas dentro de un turno . El ciclo de vida de un tool result: Paso Quién Qué pasa 1 Harness Ejecuta el tool call: corre el comando, lee el archivo 2 Harness Captura el resultado: salida, contenido o error 3 Harness Lo agrega al contexto como un mensaje 4 Harness Manda todo el contexto al proveedor en la próxima petición al proveedor del modelo 5 Modelo Lee el resultado y decide: otro tool call, o una respuesta final El resultado se queda en el contexto por el resto de la sesión . Los tool results suelen ser el grueso del contexto de una sesión de código: cada archivo leído, cada test corrido, cada búsqueda entra completa y sigue ocupando tokens mucho después de dejar de ser útil. Unos pocos resultados grandes (un log de tests verboso, un archivo generado leído entero) pueden empujar a una sesión hacia el borde de la ventana de contexto más rápido que la conversación misma. Como el resultado es todo lo que el modelo ve, el modelo no tiene forma de comprobar el entorno detrás de él. Si la salida se truncó, el comando falló en silencio, o el harness devolvió un error en vez del contenido, el modelo razona sobre lo que le llegó. Cuando la imagen que tiene el agente de tu sistema parece equivocada, ahí es donde hay que mirar: en algún lugar de la transcripción hay un resultado que dice algo distinto de lo que tú sabes que es cierto. Uso Está razonando sobre el archivo como si estuviera vacío. El tool result volvió como un rechazo de permiso, no como el contenido. El modelo solo vio el string de error: no tiene otra forma de ver el archivo.","salientes":["harness","tool-call","agent","environment","model","model-provider-request","turn","context","session","token","context-window"],"entrantes":17},{"termino":"MCP","slug":"mcp","seccion":"Sección 3 — Tools y entorno","descripcion":"Un protocolo para conectar servidores externos de tools a un harness: así un agente consigue tools más allá de las que trae el harness.","html":"\u003cp>\u003cstrong>Model Context Protocol.\u003c/strong> Un protocolo para conectar servidores externos de tools a un \u003ca class=\"x\" data-slug=\"harness\" href=\"?term=harness\">harness\u003c/a>: así es como un \u003ca class=\"x\" data-slug=\"agent\" href=\"?term=agent\">agente\u003c/a> consigue \u003ca class=\"x\" data-slug=\"tool\" href=\"?term=tool\">tools\u003c/a> más allá de las que trae el harness de fábrica. El agente nunca &quot;llama al MCP&quot;; llama a una tool, y da la casualidad de que el harness consiguió esa tool desde un servidor MCP. También expone resources (datos de solo lectura) y prompts (plantillas reusables), pero proveer tools es el uso principal.\u003c/p>\n\u003cp>El protocolo resuelve un problema de integración. Sin un estándar, cada harness necesitaría su propia integración con Linear, su propia integración con Slack, su propia integración con la base de datos, escritas y mantenidas por separado para cada una. Con MCP, la integración se escribe una sola vez como servidor, y cualquier harness compatible con MCP puede usarla. El harness se conecta al servidor, el servidor anuncia qué tools ofrece, y esas tools quedan disponibles para el agente junto a las que ya traía.\u003c/p>\n\u003cp>El costo se paga en \u003ca class=\"x\" data-slug=\"context\" href=\"?term=context\">contexto\u003c/a>. Cada tool que anuncia un servidor llega como una definición (nombre, descripción, schema de parámetros), y el \u003ca class=\"x\" data-slug=\"model\" href=\"?term=model\">modelo\u003c/a> solo puede llamar a las tools que conoce. El enfoque ingenuo carga todas las definiciones en la \u003ca class=\"x\" data-slug=\"context-window\" href=\"?term=context-window\">ventana de contexto\u003c/a> de entrada: instalas unos pocos servidores generosos y una \u003ca class=\"x\" data-slug=\"session\" href=\"?term=session\">sesión\u003c/a> arranca con miles de \u003ca class=\"x\" data-slug=\"token\" href=\"?term=token\">tokens\u003c/a> de schemas de tools antes de que hayas escrito nada, gastando \u003ca class=\"x\" data-slug=\"attention-budget\" href=\"?term=attention-budget\">attention budget\u003c/a> en tools que la tarea nunca va a usar.\u003c/p>\n\u003cp>Muchos harnesses hoy mitigan esto con búsqueda de tools: en vez de las definiciones completas, el contexto guarda un \u003ca class=\"x\" data-slug=\"context-pointer\" href=\"?term=context-pointer\">puntero de contexto\u003c/a> hacia las tools disponibles, y el agente busca una tool por nombre o propósito y carga su definición recién cuando la necesita. Si tu harness no hace esto, el costo de entrada sigue aplicando, y conviene habilitar solo los servidores que el proyecto realmente necesita.\u003c/p>\n\u003cdiv class=\"block\">\u003cp class=\"lbl\">Uso\u003c/p>\n\u003cp>&quot;El agente necesita leer tickets de Linear.&quot;\u003c/p>\n\u003cp>&quot;Configura el harness para usar el servidor MCP de Linear: expone la API de Linear como tools que el agente puede llamar. Te ahorras escribir wrappers de tools a mano.&quot;\u003c/p>\n\n\u003c/div>","texto":"Un protocolo para conectar servidores externos de tools a un harness: así un agente consigue tools más allá de las que trae el harness. Model Context Protocol. Un protocolo para conectar servidores externos de tools a un harness : así es como un agente consigue tools más allá de las que trae el harness de fábrica. El agente nunca llama al MCP ; llama a una tool, y da la casualidad de que el harness consiguió esa tool desde un servidor MCP. También expone resources (datos de solo lectura) y prompts (plantillas reusables), pero proveer tools es el uso principal. El protocolo resuelve un problema de integración. Sin un estándar, cada harness necesitaría su propia integración con Linear, su propia integración con Slack, su propia integración con la base de datos, escritas y mantenidas por separado para cada una. Con MCP, la integración se escribe una sola vez como servidor, y cualquier harness compatible con MCP puede usarla. El harness se conecta al servidor, el servidor anuncia qué tools ofrece, y esas tools quedan disponibles para el agente junto a las que ya traía. El costo se paga en contexto . Cada tool que anuncia un servidor llega como una definición (nombre, descripción, schema de parámetros), y el modelo solo puede llamar a las tools que conoce. El enfoque ingenuo carga todas las definiciones en la ventana de contexto de entrada: instalas unos pocos servidores generosos y una sesión arranca con miles de tokens de schemas de tools antes de que hayas escrito nada, gastando attention budget en tools que la tarea nunca va a usar. Muchos harnesses hoy mitigan esto con búsqueda de tools: en vez de las definiciones completas, el contexto guarda un puntero de contexto hacia las tools disponibles, y el agente busca una tool por nombre o propósito y carga su definición recién cuando la necesita. Si tu harness no hace esto, el costo de entrada sigue aplicando, y conviene habilitar solo los servidores que el proyecto realmente necesita. Uso El agente necesita leer tickets de Linear. Configura el harness para usar el servidor MCP de Linear: expone la API de Linear como tools que el agente puede llamar. Te ahorras escribir wrappers de tools a mano.","salientes":["harness","agent","tool","context","model","context-window","session","token","attention-budget","context-pointer"],"entrantes":1},{"termino":"Permission request","slug":"permission-request","seccion":"Sección 3 — Tools y entorno","descripcion":"Lo que el harness le muestra al usuario antes de ejecutar un tool call no pre-aprobado. El mecanismo para meter a un humano en el loop.","html":"\u003cp>Lo que el \u003ca class=\"x\" data-slug=\"harness\" href=\"?term=harness\">harness\u003c/a> le muestra al usuario antes de ejecutar un \u003ca class=\"x\" data-slug=\"tool-call\" href=\"?term=tool-call\">tool call\u003c/a> que no está pre-aprobado. El \u003ca class=\"x\" data-slug=\"model\" href=\"?term=model\">modelo\u003c/a> produce un tool call; en vez de correrlo de inmediato, el harness se detiene y pregunta. Si apruebas, corre; si rechazas, el harness le informa el rechazo al modelo como un \u003ca class=\"x\" data-slug=\"tool-result\" href=\"?term=tool-result\">tool result\u003c/a>. Es el mecanismo con el que un harness mete a un humano en el \u003ca class=\"x\" data-slug=\"human-in-the-loop\" href=\"?term=human-in-the-loop\">loop\u003c/a> para acciones riesgosas o sensibles.\u003c/p>\n\u003cp>El ciclo de vida de una solicitud de permiso:\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Paso\u003c/th>\n\u003cth>Quién\u003c/th>\n\u003cth>Qué pasa\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>Modelo\u003c/td>\n\u003ctd>Produce un tool call\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>Harness\u003c/td>\n\u003ctd>Lo revisa contra el \u003ca class=\"x\" data-slug=\"permission-mode\" href=\"?term=permission-mode\">modo de permisos\u003c/a> y cualquier aprobación guardada\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>Harness\u003c/td>\n\u003ctd>Si está pre-aprobado: lo ejecuta de inmediato. Si no: se detiene y muestra la solicitud\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>Usuario\u003c/td>\n\u003ctd>Aprueba una vez, aprueba para el resto de la \u003ca class=\"x\" data-slug=\"session\" href=\"?term=session\">sesión\u003c/a>, o rechaza\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>Harness\u003c/td>\n\u003ctd>Ejecuta el llamado, o devuelve el rechazo como un tool result\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Rechazar una solicitud dirige al agente. El modelo lee el rechazo como cualquier otro tool result y reacciona: prueba otro enfoque, o pregunta qué prefieres. La mayoría de los harnesses te dejan agregar un mensaje al rechazo, lo que convierte la solicitud en un punto de dirección: &quot;así no, usa el script de migración&quot; cae justo cuando el modelo está decidiendo qué hacer después.\u003c/p>\n\u003cp>El costo es que cada solicitud es una espera sincrónica sobre ti. El \u003ca class=\"x\" data-slug=\"agent\" href=\"?term=agent\">agente\u003c/a> queda bloqueado hasta que respondes, lo cual está bien mientras estás mirando y es un problema cuando no lo estás: un agente que dispara solicitudes todo el rato no se puede dejar trabajando \u003ca class=\"x\" data-slug=\"afk\" href=\"?term=afk\">AFK\u003c/a>. El modo de permisos es el dial: qué llamados corren libres, cuáles preguntan primero, idealmente con un \u003ca class=\"x\" data-slug=\"sandbox\" href=\"?term=sandbox\">sandbox\u003c/a> que haga seguro ampliar el conjunto libre.\u003c/p>\n\u003cdiv class=\"block\">\u003cp class=\"lbl\">Uso\u003c/p>\n\u003cp>&quot;Lleva diez minutos bloqueado en una solicitud de permiso, y yo estaba en una reunión.&quot;\u003c/p>\n\u003cp>&quot;Ese es el costo del human-in-the-loop. Pre-aprueba las \u003ca class=\"x\" data-slug=\"tool\" href=\"?term=tool\">tools\u003c/a> seguras para que la solicitud solo salte en los llamados de verdad riesgosos.&quot;\u003c/p>\n\n\u003c/div>","texto":"Lo que el harness le muestra al usuario antes de ejecutar un tool call no pre-aprobado. El mecanismo para meter a un humano en el loop. Lo que el harness le muestra al usuario antes de ejecutar un tool call que no está pre-aprobado. El modelo produce un tool call; en vez de correrlo de inmediato, el harness se detiene y pregunta. Si apruebas, corre; si rechazas, el harness le informa el rechazo al modelo como un tool result . Es el mecanismo con el que un harness mete a un humano en el loop para acciones riesgosas o sensibles. El ciclo de vida de una solicitud de permiso: Paso Quién Qué pasa 1 Modelo Produce un tool call 2 Harness Lo revisa contra el modo de permisos y cualquier aprobación guardada 3 Harness Si está pre-aprobado: lo ejecuta de inmediato. Si no: se detiene y muestra la solicitud 4 Usuario Aprueba una vez, aprueba para el resto de la sesión , o rechaza 5 Harness Ejecuta el llamado, o devuelve el rechazo como un tool result Rechazar una solicitud dirige al agente. El modelo lee el rechazo como cualquier otro tool result y reacciona: prueba otro enfoque, o pregunta qué prefieres. La mayoría de los harnesses te dejan agregar un mensaje al rechazo, lo que convierte la solicitud en un punto de dirección: así no, usa el script de migración cae justo cuando el modelo está decidiendo qué hacer después. El costo es que cada solicitud es una espera sincrónica sobre ti. El agente queda bloqueado hasta que respondes, lo cual está bien mientras estás mirando y es un problema cuando no lo estás: un agente que dispara solicitudes todo el rato no se puede dejar trabajando AFK . El modo de permisos es el dial: qué llamados corren libres, cuáles preguntan primero, idealmente con un sandbox que haga seguro ampliar el conjunto libre. Uso Lleva diez minutos bloqueado en una solicitud de permiso, y yo estaba en una reunión. Ese es el costo del human-in-the-loop. Pre-aprueba las tools seguras para que la solicitud solo salte en los llamados de verdad riesgosos.","salientes":["harness","tool-call","model","tool-result","human-in-the-loop","permission-mode","session","agent","afk","sandbox","tool"],"entrantes":1},{"termino":"Permission mode","slug":"permission-mode","seccion":"Sección 3 — Tools y entorno","descripcion":"La parte del modo agente que controla permisos: qué tool calls disparan una solicitud de permiso y cuáles corren solas.","html":"\u003cp>La parte del \u003ca class=\"x\" data-slug=\"agent-mode\" href=\"?term=agent-mode\">modo agente\u003c/a> que controla los permisos: qué \u003ca class=\"x\" data-slug=\"tool-call\" href=\"?term=tool-call\">tool calls\u003c/a> disparan una \u003ca class=\"x\" data-slug=\"permission-request\" href=\"?term=permission-request\">solicitud de permiso\u003c/a> y cuáles corren automáticamente. Es el propósito original de los sistemas de modos, antes de que los \u003ca class=\"x\" data-slug=\"harness\" href=\"?term=harness\">harnesses\u003c/a> empezaran a empaquetar encima instrucciones de comportamiento.\u003c/p>\n\u003cp>Los harnesses traen una escalera de estos modos:\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Modo\u003c/th>\n\u003cth>Lecturas\u003c/th>\n\u003cth>Escrituras y shell\u003c/th>\n\u003cth>Uso típico\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Solo lectura / plan\u003c/td>\n\u003ctd>Automático\u003c/td>\n\u003ctd>Bloqueado\u003c/td>\n\u003ctd>Investigar, planificar, revisar\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Por defecto\u003c/td>\n\u003ctd>Automático\u003c/td>\n\u003ctd>Pregunta\u003c/td>\n\u003ctd>Trabajo supervisado del día a día\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Auto-edit\u003c/td>\n\u003ctd>Automático\u003c/td>\n\u003ctd>Edits automáticas, shell pregunta\u003c/td>\n\u003ctd>Repos de confianza, cambios mecánicos\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>&quot;Yolo&quot; / full-auto\u003c/td>\n\u003ctd>Automático\u003c/td>\n\u003ctd>Automático\u003c/td>\n\u003ctd>\u003ca class=\"x\" data-slug=\"sandbox\" href=\"?term=sandbox\">Sandboxes\u003c/a>, corridas \u003ca class=\"x\" data-slug=\"afk\" href=\"?term=afk\">AFK\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Elegir un peldaño es un trade-off entre seguridad e interrupción, y los dos modos de falla se sienten. Demasiado apretado, y te conviertes en el cuello de botella: el \u003ca class=\"x\" data-slug=\"agent\" href=\"?term=agent\">agente\u003c/a> se detiene cada pocos segundos por lecturas inofensivas, apruebas en piloto automático, y las aprobaciones dejan de significar algo: sellar sin mirar es lo peor de los dos mundos, toda la interrupción sin nada de la protección. Demasiado suelto, y el agente edita archivos y corre comandos que hubieras querido ver antes.\u003c/p>\n\u003cp>El extremo suelto se defiende mejor dentro de un sandbox, donde el radio de daño de un mal llamado a una \u003ca class=\"x\" data-slug=\"tool\" href=\"?term=tool\">tool\u003c/a> queda contenido. Fuera de uno, la mayoría se acomoda en auto-aprobar lecturas y mantener el \u003ca class=\"x\" data-slug=\"human-in-the-loop\" href=\"?term=human-in-the-loop\">human-in-the-loop\u003c/a> para todo lo irreversible.\u003c/p>\n\u003cdiv class=\"block\">\u003cp class=\"lbl\">Uso\u003c/p>\n\u003cp>&quot;Se detuvo en cada grep: mató por completo la corrida AFK.&quot;\u003c/p>\n\u003cp>&quot;Afloja el modo de permisos para las tools de solo lectura, deja que siga preguntando en escrituras y shell. La mayoría de las solicitudes de permiso en una \u003ca class=\"x\" data-slug=\"session\" href=\"?term=session\">sesión\u003c/a> de investigación son ruido.&quot;\u003c/p>\n\n\u003c/div>","texto":"La parte del modo agente que controla permisos: qué tool calls disparan una solicitud de permiso y cuáles corren solas. La parte del modo agente que controla los permisos: qué tool calls disparan una solicitud de permiso y cuáles corren automáticamente. Es el propósito original de los sistemas de modos, antes de que los harnesses empezaran a empaquetar encima instrucciones de comportamiento. Los harnesses traen una escalera de estos modos: Modo Lecturas Escrituras y shell Uso típico Solo lectura / plan Automático Bloqueado Investigar, planificar, revisar Por defecto Automático Pregunta Trabajo supervisado del día a día Auto-edit Automático Edits automáticas, shell pregunta Repos de confianza, cambios mecánicos Yolo / full-auto Automático Automático Sandboxes , corridas AFK Elegir un peldaño es un trade-off entre seguridad e interrupción, y los dos modos de falla se sienten. Demasiado apretado, y te conviertes en el cuello de botella: el agente se detiene cada pocos segundos por lecturas inofensivas, apruebas en piloto automático, y las aprobaciones dejan de significar algo: sellar sin mirar es lo peor de los dos mundos, toda la interrupción sin nada de la protección. Demasiado suelto, y el agente edita archivos y corre comandos que hubieras querido ver antes. El extremo suelto se defiende mejor dentro de un sandbox, donde el radio de daño de un mal llamado a una tool queda contenido. Fuera de uno, la mayoría se acomoda en auto-aprobar lecturas y mantener el human-in-the-loop para todo lo irreversible. Uso Se detuvo en cada grep: mató por completo la corrida AFK. Afloja el modo de permisos para las tools de solo lectura, deja que siga preguntando en escrituras y shell. La mayoría de las solicitudes de permiso en una sesión de investigación son ruido.","salientes":["agent-mode","tool-call","permission-request","harness","sandbox","afk","agent","tool","human-in-the-loop","session"],"entrantes":5},{"termino":"Agent mode","slug":"agent-mode","seccion":"Sección 3 — Tools y entorno","descripcion":"Un preset que empaqueta un modo de permisos con instrucciones de comportamiento inyectadas en el system prompt. Cambia en plena sesión.","html":"\u003cp>Un preset que define cómo opera el \u003ca class=\"x\" data-slug=\"agent\" href=\"?term=agent\">agente\u003c/a> en tiempo de ejecución: empaqueta un \u003ca class=\"x\" data-slug=\"permission-mode\" href=\"?term=permission-mode\">modo de permisos\u003c/a> con instrucciones de comportamiento inyectadas en el \u003ca class=\"x\" data-slug=\"system-prompt\" href=\"?term=system-prompt\">system prompt\u003c/a>. Ejemplos: un modo por defecto que pregunta en los llamados riesgosos, un \u003cstrong>plan mode\u003c/strong> que bloquea las edits y encamina al agente hacia la investigación, un modo \u003cstrong>accept-edits\u003c/strong> que auto-aprueba las edits, un modo \u003cstrong>bypass permissions\u003c/strong> (coloquialmente \u003cstrong>YOLO mode\u003c/strong>) que auto-aprueba todo. Puede cambiar \u003ca class=\"x\" data-slug=\"session\" href=\"?term=session\">en plena sesión\u003c/a>.\u003c/p>\n\u003cp>El empaquetado es lo que distingue a un modo de un simple ajuste de permisos. Un modo de permisos es solo una compuerta: decide qué \u003ca class=\"x\" data-slug=\"tool-call\" href=\"?term=tool-call\">tool calls\u003c/a> pasan. Una compuerta sola produce un agente que quiere editar pero no puede: propone la escritura, queda bloqueado, y prueba otro camino. Las instrucciones inyectadas eliminan las ganas: el plan mode no solo bloquea las edits, le dice al agente que está en una fase de planificación, así que lee, pregunta y propone en vez de forcejear contra la compuerta. Compuerta e instrucción apuntan en la misma dirección.\u003c/p>\n\u003cp>En la práctica, cambias de modo a medida que cambia tu confianza a lo largo de una tarea. La misma tarea puede pasar por varios modos: plan mode mientras el enfoque todavía se está definiendo, el modo por defecto que pregunta para las primeras edits delicadas, accept-edits una vez que el agente demostró que entiende el cambio, bypass para una corrida \u003ca class=\"x\" data-slug=\"afk\" href=\"?term=afk\">AFK\u003c/a> dentro de un \u003ca class=\"x\" data-slug=\"sandbox\" href=\"?term=sandbox\">sandbox\u003c/a>. Cambiar de modo no te cuesta nada: la conversación sigue exactamente donde estaba, con nuevos permisos y nuevas instrucciones. Si te encuentras aprobando cada prompt sin leerlo, el modo está más apretado que tu confianza real; si sigues rechazando edits, está más suelto de lo que debería.\u003c/p>\n\u003cdiv class=\"block avoid\">\u003cp class=\"lbl\">Términos por proveedor\u003c/p>\u003cp>Claude Code los llama &quot;modos de permisos&quot;, Codex los llama &quot;modos de aprobación&quot;; los dos son anteriores al empaquetado de comportamiento.\u003c/p>\u003c/div>\n\u003cdiv class=\"block\">\u003cp class=\"lbl\">Uso\u003c/p>\n\u003cp>&quot;Sigue editando archivos cuando solo quiero un plan.&quot;\u003c/p>\n\u003cp>&quot;Cambia a plan mode: va a bloquear las escrituras y quedarse en investigación.&quot;\u003c/p>\n\u003cp>&quot;¿Y para la corrida AFK de después?&quot;\u003c/p>\n\u003cp>&quot;Bypass mode, pero solo dentro del sandbox.&quot;\u003c/p>\n\n\u003c/div>","texto":"Un preset que empaqueta un modo de permisos con instrucciones de comportamiento inyectadas en el system prompt. Cambia en plena sesión. Un preset que define cómo opera el agente en tiempo de ejecución: empaqueta un modo de permisos con instrucciones de comportamiento inyectadas en el system prompt . Ejemplos: un modo por defecto que pregunta en los llamados riesgosos, un plan mode que bloquea las edits y encamina al agente hacia la investigación, un modo accept-edits que auto-aprueba las edits, un modo bypass permissions (coloquialmente YOLO mode ) que auto-aprueba todo. Puede cambiar en plena sesión . El empaquetado es lo que distingue a un modo de un simple ajuste de permisos. Un modo de permisos es solo una compuerta: decide qué tool calls pasan. Una compuerta sola produce un agente que quiere editar pero no puede: propone la escritura, queda bloqueado, y prueba otro camino. Las instrucciones inyectadas eliminan las ganas: el plan mode no solo bloquea las edits, le dice al agente que está en una fase de planificación, así que lee, pregunta y propone en vez de forcejear contra la compuerta. Compuerta e instrucción apuntan en la misma dirección. En la práctica, cambias de modo a medida que cambia tu confianza a lo largo de una tarea. La misma tarea puede pasar por varios modos: plan mode mientras el enfoque todavía se está definiendo, el modo por defecto que pregunta para las primeras edits delicadas, accept-edits una vez que el agente demostró que entiende el cambio, bypass para una corrida AFK dentro de un sandbox . Cambiar de modo no te cuesta nada: la conversación sigue exactamente donde estaba, con nuevos permisos y nuevas instrucciones. Si te encuentras aprobando cada prompt sin leerlo, el modo está más apretado que tu confianza real; si sigues rechazando edits, está más suelto de lo que debería. Términos por proveedor Claude Code los llama modos de permisos , Codex los llama modos de aprobación ; los dos son anteriores al empaquetado de comportamiento. Uso Sigue editando archivos cuando solo quiero un plan. Cambia a plan mode: va a bloquear las escrituras y quedarse en investigación. ¿Y para la corrida AFK de después? Bypass mode, pero solo dentro del sandbox.","salientes":["agent","permission-mode","system-prompt","session","tool-call","afk","sandbox"],"entrantes":3},{"termino":"Sandbox","slug":"sandbox","seccion":"Sección 3 — Tools y entorno","descripcion":"Un entorno aislado donde corre el agente: contenedor, VM o shell restringido. Limita el radio de daño de sus acciones.","html":"\u003cp>Un \u003ca class=\"x\" data-slug=\"environment\" href=\"?term=environment\">entorno\u003c/a> aislado donde corre el \u003ca class=\"x\" data-slug=\"agent\" href=\"?term=agent\">agente\u003c/a>: un contenedor, una VM, un \u003ca class=\"x\" data-slug=\"filesystem\" href=\"?term=filesystem\">sistema de archivos\u003c/a> efímero, o un shell con permisos restringidos. Limita el radio de daño de las acciones del agente: aunque corra comandos destructivos o traiga algo malicioso, el daño queda contenido. Es el sustrato de seguridad que hace viable el trabajo \u003ca class=\"x\" data-slug=\"afk\" href=\"?term=afk\">AFK\u003c/a>.\u003c/p>\n\u003cp>El sandbox y el \u003ca class=\"x\" data-slug=\"permission-mode\" href=\"?term=permission-mode\">modo de permisos\u003c/a> resuelven el mismo problema desde extremos opuestos. Los permisos preguntan antes de que una acción corra; un sandbox limita hasta dónde puede llegar esa acción si de verdad corre. Los permisos te necesitan corriendo \u003ca class=\"x\" data-slug=\"human-in-the-loop\" href=\"?term=human-in-the-loop\">en el loop\u003c/a> (cada prompt es una interrupción), y una sesión que pregunta todo el rato apenas es autónoma. Un sandbox gasta infraestructura en vez de atención: mientras más fuerte el aislamiento, menos preguntas hacen falta.\u003c/p>\n\u003cp>El aislamiento viene en grados:\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Grado\u003c/th>\n\u003cth>Qué es\u003c/th>\n\u003cth>Qué contiene\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Shell restringido\u003c/td>\n\u003ctd>Confinamiento a nivel de sistema operativo alrededor de cada comando\u003c/td>\n\u003ctd>Escrituras fuera del proyecto, acceso a la red\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Contenedor\u003c/td>\n\u003ctd>Sistema de archivos nuevo, sin credenciales montadas, se descarta después\u003c/td>\n\u003ctd>Todo lo que el agente le haga a su propia máquina\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>VM / nube\u003c/td>\n\u003ctd>Una máquina completamente separada, muchas veces provista por el harness\u003c/td>\n\u003ctd>Todo, incluyendo escapes a nivel de kernel\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Lo que ningún sandbox contiene: las acciones que salen de él de forma legítima. Un agente con tus credenciales de git puede hacer push; uno con acceso a la red puede llamar a APIs de producción. Decide qué cruza el límite antes de decidir qué tan grueso hacerlo.\u003c/p>\n\u003cdiv class=\"block\">\u003cp class=\"lbl\">Uso\u003c/p>\n\u003cp>&quot;Quiero dejarlo corriendo en \u003ca class=\"x\" data-slug=\"agent-mode\" href=\"?term=agent-mode\">bypass-permissions\u003c/a> toda la noche, pero todavía no estoy listo para eso.&quot;\u003c/p>\n\u003cp>&quot;Mételo en un sandbox: contenedor nuevo, sin credenciales montadas, sin salida a la red. En el peor caso, destruye su propio sistema de archivos y descartas el contenedor.&quot;\u003c/p>\n\n\u003c/div>","texto":"Un entorno aislado donde corre el agente: contenedor, VM o shell restringido. Limita el radio de daño de sus acciones. Un entorno aislado donde corre el agente : un contenedor, una VM, un sistema de archivos efímero, o un shell con permisos restringidos. Limita el radio de daño de las acciones del agente: aunque corra comandos destructivos o traiga algo malicioso, el daño queda contenido. Es el sustrato de seguridad que hace viable el trabajo AFK . El sandbox y el modo de permisos resuelven el mismo problema desde extremos opuestos. Los permisos preguntan antes de que una acción corra; un sandbox limita hasta dónde puede llegar esa acción si de verdad corre. Los permisos te necesitan corriendo en el loop (cada prompt es una interrupción), y una sesión que pregunta todo el rato apenas es autónoma. Un sandbox gasta infraestructura en vez de atención: mientras más fuerte el aislamiento, menos preguntas hacen falta. El aislamiento viene en grados: Grado Qué es Qué contiene Shell restringido Confinamiento a nivel de sistema operativo alrededor de cada comando Escrituras fuera del proyecto, acceso a la red Contenedor Sistema de archivos nuevo, sin credenciales montadas, se descarta después Todo lo que el agente le haga a su propia máquina VM / nube Una máquina completamente separada, muchas veces provista por el harness Todo, incluyendo escapes a nivel de kernel Lo que ningún sandbox contiene: las acciones que salen de él de forma legítima. Un agente con tus credenciales de git puede hacer push; uno con acceso a la red puede llamar a APIs de producción. Decide qué cruza el límite antes de decidir qué tan grueso hacerlo. Uso Quiero dejarlo corriendo en bypass-permissions toda la noche, pero todavía no estoy listo para eso. Mételo en un sandbox: contenedor nuevo, sin credenciales montadas, sin salida a la red. En el peor caso, destruye su propio sistema de archivos y descartas el contenedor.","salientes":["environment","agent","filesystem","afk","permission-mode","human-in-the-loop","agent-mode"],"entrantes":7},{"termino":"Sycophancy","slug":"sycophancy","seccion":"Sección 4 — Modos de falla","descripcion":"Salida del modelo, adulona y segura de sí misma. La causa: un entrenamiento que premió las respuestas que a los humanos les gustaban.","html":"\u003cp>Salida del \u003ca class=\"x\" data-slug=\"model\" href=\"?term=model\">modelo\u003c/a> adulona y segura de sí misma. La causa está en el \u003ca class=\"x\" data-slug=\"training\" href=\"?term=training\">entrenamiento\u003c/a>: al modelo se lo moldeó para favorecer las respuestas que a los humanos les gustaban, y a los humanos les gusta más que estén de acuerdo con ellos que escuchar que se equivocaron. Así el modelo aprendió que estar de acuerdo se premia, aunque ese acuerdo sea incorrecto.\u003c/p>\n\u003cdiv class=\"block\">\u003cp class=\"lbl\">Se manifiesta como\u003c/p>\n\u003cul>\n\u003cli>\u003cem>Ceder ante la contrapregunta:\u003c/em> da vuelta una respuesta correcta apenas preguntas &quot;¿estás seguro?&quot;.\u003c/li>\n\u003cli>\u003cem>Elogiar un input malo:\u003c/em> dice que tu plan roto es brillante antes de analizarlo.\u003c/li>\n\u003cli>\u003cem>Encuadre sesgado:\u003c/em> la revisión sale positiva si le indicas que la escribiste tú, y negativa si le indicas que la escribió otra persona. Mismo artefacto, veredicto distinto.\u003c/li>\n\u003cli>\u003cem>Mímica:\u003c/em> te repite tus propios errores como si fueran una confirmación.\u003c/li>\n\u003c/ul>\n\u003c/div>\n\u003cdiv class=\"block avoid\">\u003cp class=\"lbl\">Prueba diagnóstica\u003c/p>\u003cp>¿el modelo habría dicho esto sin tu inducción? Si lo único que cambió fue tu tono o tu encuadre, es adulación, no un cambio real de análisis.\u003c/p>\u003c/div>\n\u003cdiv class=\"block avoid\">\u003cp class=\"lbl\">Arreglo\u003c/p>\u003cp>esconde tus preferencias. Redacta el prompt en neutro: &quot;revisa este código&quot;, no &quot;¿está bueno este código?&quot;.\u003c/p>\u003c/div>\n\u003cdiv class=\"block avoid\">\u003cp class=\"lbl\">Evita\u003c/p>\u003cp>usar &quot;adulación&quot; para cualquier respuesta equivocada que te resulte conveniente. Sin la prueba diagnóstica, el término no aporta más que decir &quot;está mal&quot;.\u003c/p>\u003c/div>\n\u003cdiv class=\"block\">\u003cp class=\"lbl\">Uso\u003c/p>\n\u003cp>&quot;Dijo que mi plan de refactor se veía genial, y cuando le pregunté &#39;¿estás seguro?&#39; se retractó de todo.&quot;\u003c/p>\n\u003cp>&quot;Adulación clásica: estuvo de acuerdo primero porque sonabas seguro, y cedió después porque sonabas con dudas. La calidad del plan no cambió, tu tono sí. \u003ca class=\"x\" data-slug=\"clearing\" href=\"?term=clearing\">Limpia\u003c/a> el contexto y vuelve a preguntar sin inclinar la balanza en ningún sentido.&quot;\u003c/p>\n\n\u003c/div>","texto":"Salida del modelo, adulona y segura de sí misma. La causa: un entrenamiento que premió las respuestas que a los humanos les gustaban. Salida del modelo adulona y segura de sí misma. La causa está en el entrenamiento : al modelo se lo moldeó para favorecer las respuestas que a los humanos les gustaban, y a los humanos les gusta más que estén de acuerdo con ellos que escuchar que se equivocaron. Así el modelo aprendió que estar de acuerdo se premia, aunque ese acuerdo sea incorrecto. Se manifiesta como Ceder ante la contrapregunta: da vuelta una respuesta correcta apenas preguntas ¿estás seguro? . Elogiar un input malo: dice que tu plan roto es brillante antes de analizarlo. Encuadre sesgado: la revisión sale positiva si le indicas que la escribiste tú, y negativa si le indicas que la escribió otra persona. Mismo artefacto, veredicto distinto. Mímica: te repite tus propios errores como si fueran una confirmación. Prueba diagnóstica ¿el modelo habría dicho esto sin tu inducción? Si lo único que cambió fue tu tono o tu encuadre, es adulación, no un cambio real de análisis. Arreglo esconde tus preferencias. Redacta el prompt en neutro: revisa este código , no ¿está bueno este código? . Evita usar adulación para cualquier respuesta equivocada que te resulte conveniente. Sin la prueba diagnóstica, el término no aporta más que decir está mal . Uso Dijo que mi plan de refactor se veía genial, y cuando le pregunté &#39;¿estás seguro?&#39; se retractó de todo. Adulación clásica: estuvo de acuerdo primero porque sonabas seguro, y cedió después porque sonabas con dudas. La calidad del plan no cambió, tu tono sí. Limpia el contexto y vuelve a preguntar sin inclinar la balanza en ningún sentido.","salientes":["model","training","clearing"],"entrantes":0},{"termino":"Hallucination","slug":"hallucination","seccion":"Sección 4 — Modos de falla","descripcion":"Salida equivocada pero segura del modelo. Dos variantes: factualidad (hechos inventados) y fidelidad (deriva del contexto cargado).","html":"\u003cp>Salida del \u003ca class=\"x\" data-slug=\"model\" href=\"?term=model\">modelo\u003c/a> equivocada pero segura de sí misma. Tiene dos variantes, con causas y arreglos distintos:\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Variante\u003c/th>\n\u003cth>Qué falla\u003c/th>\n\u003cth>Causa\u003c/th>\n\u003cth>Arreglo\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cem>Factualidad\u003c/em>\u003c/td>\n\u003ctd>Hechos inventados o equivocados sobre el mundo: una función que no existe, una firma de API equivocada, una cita falsa\u003c/td>\n\u003ctd>Vacíos en el \u003ca class=\"x\" data-slug=\"parametric-knowledge\" href=\"?term=parametric-knowledge\">conocimiento paramétrico\u003c/a>, a menudo posteriores a la \u003ca class=\"x\" data-slug=\"knowledge-cutoff\" href=\"?term=knowledge-cutoff\">fecha de corte del conocimiento\u003c/a>\u003c/td>\n\u003ctd>Cargar el \u003ca class=\"x\" data-slug=\"contextual-knowledge\" href=\"?term=contextual-knowledge\">conocimiento contextual\u003c/a> correcto\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cem>Fidelidad\u003c/em>\u003c/td>\n\u003ctd>La salida se aleja del conocimiento contextual cargado, de las instrucciones del usuario o del propio razonamiento previo del modelo\u003c/td>\n\u003ctd>\u003ca class=\"x\" data-slug=\"attention-degradation\" href=\"?term=attention-degradation\">Attention degradation\u003c/a>; empeora en la \u003ca class=\"x\" data-slug=\"smart-zone\" href=\"?term=smart-zone\">dumb zone\u003c/a>\u003c/td>\n\u003ctd>\u003ca class=\"x\" data-slug=\"clearing\" href=\"?term=clearing\">Limpiar\u003c/a> o \u003ca class=\"x\" data-slug=\"compaction\" href=\"?term=compaction\">compactar\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>La \u003ca class=\"x\" data-slug=\"next-token-prediction\" href=\"?term=next-token-prediction\">predicción del siguiente token\u003c/a> produce una salida fluida exista o no el hecho de fondo: el modelo no tiene ninguna señal interna de que no sabe algo, así que un método inventado llega con el mismo tono seguro que uno correcto. El código alucinado es plausible por construcción: es lo que la API \u003cem>tendría\u003c/em> si existiera, y justo eso es lo que le permite pasar una revisión superficial y fallar recién al ejecutarlo.\u003c/p>\n\u003cp>Necesitas saber qué variante tienes enfrente, porque el arreglo de una empeora la otra. Factualidad significa que falta conocimiento: el arreglo es agregar contexto (la documentación, las definiciones de tipos, el archivo). Fidelidad significa que el conocimiento está presente pero pierde la competencia por la atención: el arreglo es quitar contexto. Si confundes fidelidad con factualidad, terminas pegando más documentación, lo que agranda el contexto y empeora la deriva. Cuando el agente se equivoca en algo, revisa si la información correcta ya estaba en el contexto antes de decidir cuál de los dos problemas tienes.\u003c/p>\n\u003cdiv class=\"block avoid\">\u003cp class=\"lbl\">Evita\u003c/p>\u003cp>usar &quot;alucinación&quot; como sinónimo liso y llano de &quot;equivocado&quot;. Sin nombrar la variante, el término no tiene valor diagnóstico.\u003c/p>\u003c/div>\n\u003cdiv class=\"block\">\u003cp class=\"lbl\">Uso\u003c/p>\n\u003cp>&quot;Alucinó un método \u003ccode>parseAsync\u003c/code> en el schema.&quot;\u003c/p>\n\u003cp>&quot;¿Factualidad o fidelidad?&quot;\u003c/p>\n\u003cp>&quot;El método está en la documentación que pegué, lo que pasa es que dejó de leerla después del \u003ca class=\"x\" data-slug=\"turn\" href=\"?term=turn\">turno\u003c/a> cuarenta.&quot;\u003c/p>\n\u003cp>&quot;Entonces es fidelidad. Compacta y recarga, no pierdas el tiempo agregando más documentación.&quot;\u003c/p>\n\n\u003c/div>","texto":"Salida equivocada pero segura del modelo. Dos variantes: factualidad (hechos inventados) y fidelidad (deriva del contexto cargado). Salida del modelo equivocada pero segura de sí misma. Tiene dos variantes, con causas y arreglos distintos: Variante Qué falla Causa Arreglo Factualidad Hechos inventados o equivocados sobre el mundo: una función que no existe, una firma de API equivocada, una cita falsa Vacíos en el conocimiento paramétrico , a menudo posteriores a la fecha de corte del conocimiento Cargar el conocimiento contextual correcto Fidelidad La salida se aleja del conocimiento contextual cargado, de las instrucciones del usuario o del propio razonamiento previo del modelo Attention degradation ; empeora en la dumb zone Limpiar o compactar La predicción del siguiente token produce una salida fluida exista o no el hecho de fondo: el modelo no tiene ninguna señal interna de que no sabe algo, así que un método inventado llega con el mismo tono seguro que uno correcto. El código alucinado es plausible por construcción: es lo que la API tendría si existiera, y justo eso es lo que le permite pasar una revisión superficial y fallar recién al ejecutarlo. Necesitas saber qué variante tienes enfrente, porque el arreglo de una empeora la otra. Factualidad significa que falta conocimiento: el arreglo es agregar contexto (la documentación, las definiciones de tipos, el archivo). Fidelidad significa que el conocimiento está presente pero pierde la competencia por la atención: el arreglo es quitar contexto. Si confundes fidelidad con factualidad, terminas pegando más documentación, lo que agranda el contexto y empeora la deriva. Cuando el agente se equivoca en algo, revisa si la información correcta ya estaba en el contexto antes de decidir cuál de los dos problemas tienes. Evita usar alucinación como sinónimo liso y llano de equivocado . Sin nombrar la variante, el término no tiene valor diagnóstico. Uso Alucinó un método parseAsync en el schema. ¿Factualidad o fidelidad? El método está en la documentación que pegué, lo que pasa es que dejó de leerla después del turno cuarenta. Entonces es fidelidad. Compacta y recarga, no pierdas el tiempo agregando más documentación.","salientes":["model","parametric-knowledge","knowledge-cutoff","contextual-knowledge","attention-degradation","smart-zone","clearing","compaction","next-token-prediction","turn"],"entrantes":4},{"termino":"Parametric knowledge","slug":"parametric-knowledge","seccion":"Sección 4 — Modos de falla","descripcion":"Lo que el modelo sabe por su entrenamiento, guardado en sus parámetros. Congelado desde entonces. Contraparte del conocimiento contextual.","html":"\u003cp>Lo que el \u003ca class=\"x\" data-slug=\"model\" href=\"?term=model\">modelo\u003c/a> &quot;sabe&quot; por su \u003ca class=\"x\" data-slug=\"training\" href=\"?term=training\">entrenamiento\u003c/a>, guardado en sus \u003ca class=\"x\" data-slug=\"parameters\" href=\"?term=parameters\">parámetros\u003c/a>. Queda congelado desde ese momento: el modelo no puede ver sus propios parámetros ni actualizarlos. El detalle se pierde en el apriete: miles de millones de hechos se comprimen en una cantidad fija de parámetros, y los poco frecuentes se desdibujan. Es la fuente de la fluidez en temas comunes, y de la fabricación en los poco comunes. Contraparte del \u003ca class=\"x\" data-slug=\"contextual-knowledge\" href=\"?term=contextual-knowledge\">conocimiento contextual\u003c/a>.\u003c/p>\n\u003cp>El conocimiento paramétrico no se guarda como hechos. El entrenamiento nunca le da al modelo una base de datos donde buscar cosas; ajusta los parámetros hasta que el modelo predice bien el texto, y un modelo que predice bien el texto sobre un tema se comporta como si lo supiera. Qué tan confiable es ese conocimiento depende de cuántas veces apareció el tema en los datos de entrenamiento: uno con millones de ejemplos se reproduce con precisión, uno con solo un puñado hace que el modelo adivine a partir de lo que se parece a temas similares. Reproducir y adivinar son el mismo proceso para el modelo, así que no puede distinguir cuál de los dos está haciendo. Una respuesta fabricada llega con la misma fluidez que una correcta. La \u003ca class=\"x\" data-slug=\"hallucination\" href=\"?term=hallucination\">alucinación\u003c/a> es el modelo adivinando mal.\u003c/p>\n\u003cp>El conocimiento paramétrico también envejece. Los parámetros dejan de cambiar en la \u003ca class=\"x\" data-slug=\"knowledge-cutoff\" href=\"?term=knowledge-cutoff\">fecha de corte del conocimiento\u003c/a>, así que una librería lanzada o renombrada después de esa fecha no existe en ellos, y una API que cambió queda registrada en su forma antigua.\u003c/p>\n\u003cp>Para los dos vacíos (lo poco frecuente y lo demasiado reciente) el remedio es el mismo: ese conocimiento no se puede agregar a los parámetros, así que hay que entregarlo como conocimiento contextual.\u003c/p>\n\u003cdiv class=\"block\">\u003cp class=\"lbl\">Uso\u003c/p>\n\u003cp>&quot;Escribe React impecable, pero inventa métodos en nuestro SDK interno.&quot;\u003c/p>\n\u003cp>&quot;React es denso en el conocimiento paramétrico: millones de ejemplos de entrenamiento. Tu SDK no, así que el modelo rellena con formas que parecen plausibles. Carga la documentación del SDK en el \u003ca class=\"x\" data-slug=\"context\" href=\"?term=context\">contexto\u003c/a>.&quot;\u003c/p>\n\n\u003c/div>","texto":"Lo que el modelo sabe por su entrenamiento, guardado en sus parámetros. Congelado desde entonces. Contraparte del conocimiento contextual. Lo que el modelo sabe por su entrenamiento , guardado en sus parámetros . Queda congelado desde ese momento: el modelo no puede ver sus propios parámetros ni actualizarlos. El detalle se pierde en el apriete: miles de millones de hechos se comprimen en una cantidad fija de parámetros, y los poco frecuentes se desdibujan. Es la fuente de la fluidez en temas comunes, y de la fabricación en los poco comunes. Contraparte del conocimiento contextual . El conocimiento paramétrico no se guarda como hechos. El entrenamiento nunca le da al modelo una base de datos donde buscar cosas; ajusta los parámetros hasta que el modelo predice bien el texto, y un modelo que predice bien el texto sobre un tema se comporta como si lo supiera. Qué tan confiable es ese conocimiento depende de cuántas veces apareció el tema en los datos de entrenamiento: uno con millones de ejemplos se reproduce con precisión, uno con solo un puñado hace que el modelo adivine a partir de lo que se parece a temas similares. Reproducir y adivinar son el mismo proceso para el modelo, así que no puede distinguir cuál de los dos está haciendo. Una respuesta fabricada llega con la misma fluidez que una correcta. La alucinación es el modelo adivinando mal. El conocimiento paramétrico también envejece. Los parámetros dejan de cambiar en la fecha de corte del conocimiento , así que una librería lanzada o renombrada después de esa fecha no existe en ellos, y una API que cambió queda registrada en su forma antigua. Para los dos vacíos (lo poco frecuente y lo demasiado reciente) el remedio es el mismo: ese conocimiento no se puede agregar a los parámetros, así que hay que entregarlo como conocimiento contextual. Uso Escribe React impecable, pero inventa métodos en nuestro SDK interno. React es denso en el conocimiento paramétrico: millones de ejemplos de entrenamiento. Tu SDK no, así que el modelo rellena con formas que parecen plausibles. Carga la documentación del SDK en el contexto .","salientes":["model","training","parameters","contextual-knowledge","hallucination","knowledge-cutoff","context"],"entrantes":5},{"termino":"Knowledge cutoff","slug":"knowledge-cutoff","seccion":"Sección 4 — Modos de falla","descripcion":"Fecha límite del conocimiento paramétrico. Librerías y API posteriores son trampa de fabricación, salvo que cargues su documentación.","html":"\u003cp>Fecha después de la cual un \u003ca class=\"x\" data-slug=\"model\" href=\"?term=model\">modelo\u003c/a> no tiene \u003ca class=\"x\" data-slug=\"parametric-knowledge\" href=\"?term=parametric-knowledge\">conocimiento paramétrico\u003c/a>. Las librerías, las API y los eventos posteriores a esa fecha son trampas de fabricación, salvo que su documentación se cargue como \u003ca class=\"x\" data-slug=\"contextual-knowledge\" href=\"?term=contextual-knowledge\">conocimiento contextual\u003c/a>. Cada versión de modelo trae su propia fecha de corte.\u003c/p>\n\u003cp>Esta fecha existe por cómo se construyen los modelos: el \u003ca class=\"x\" data-slug=\"training\" href=\"?term=training\">entrenamiento\u003c/a> hornea una foto del texto dentro de los \u003ca class=\"x\" data-slug=\"parameters\" href=\"?term=parameters\">parámetros\u003c/a> del modelo, y después de eso los parámetros quedan congelados. El modelo no sabe que su conocimiento tiene un borde: si le preguntas por algo posterior a la fecha de corte, no se niega a responder, extrapola desde lo más cercano que sí conoce. Eso es lo que hace silenciosa la trampa: el código escrito contra una versión vieja de una librería se ve plausible, muchas veces compila, y falla solo en las partes que cambiaron.\u003c/p>\n\u003cp>El arreglo es siempre el mismo: meter información actualizada en el \u003ca class=\"x\" data-slug=\"context\" href=\"?term=context\">contexto\u003c/a>. Carga el changelog, apunta a las definiciones de tipos de la versión instalada, o haz que el agente lea la documentación desde la web. Cualquier cosa en el contexto le gana a la nada que hay en los parámetros.\u003c/p>\n\u003cdiv class=\"block\">\u003cp class=\"lbl\">Uso\u003c/p>\n\u003cp>&quot;Sigue escribiendo la sintaxis del SDK v3, y nosotros vamos en la v5.&quot;\u003c/p>\n\u003cp>&quot;La v5 salió después de la fecha de corte del conocimiento. Carga el changelog de la v5 como conocimiento contextual, si no va a seguir fabricando desde la versión paramétrica vieja.&quot;\u003c/p>\n\n\u003c/div>","texto":"Fecha límite del conocimiento paramétrico. Librerías y API posteriores son trampa de fabricación, salvo que cargues su documentación. Fecha después de la cual un modelo no tiene conocimiento paramétrico . Las librerías, las API y los eventos posteriores a esa fecha son trampas de fabricación, salvo que su documentación se cargue como conocimiento contextual . Cada versión de modelo trae su propia fecha de corte. Esta fecha existe por cómo se construyen los modelos: el entrenamiento hornea una foto del texto dentro de los parámetros del modelo, y después de eso los parámetros quedan congelados. El modelo no sabe que su conocimiento tiene un borde: si le preguntas por algo posterior a la fecha de corte, no se niega a responder, extrapola desde lo más cercano que sí conoce. Eso es lo que hace silenciosa la trampa: el código escrito contra una versión vieja de una librería se ve plausible, muchas veces compila, y falla solo en las partes que cambiaron. El arreglo es siempre el mismo: meter información actualizada en el contexto . Carga el changelog, apunta a las definiciones de tipos de la versión instalada, o haz que el agente lea la documentación desde la web. Cualquier cosa en el contexto le gana a la nada que hay en los parámetros. Uso Sigue escribiendo la sintaxis del SDK v3, y nosotros vamos en la v5. La v5 salió después de la fecha de corte del conocimiento. Carga el changelog de la v5 como conocimiento contextual, si no va a seguir fabricando desde la versión paramétrica vieja.","salientes":["model","parametric-knowledge","contextual-knowledge","training","parameters","context"],"entrantes":5},{"termino":"Contextual knowledge","slug":"contextual-knowledge","seccion":"Sección 4 — Modos de falla","descripcion":"Hechos que el agente puede leer directo del contexto ahora mismo. Contraparte del conocimiento paramétrico.","html":"\u003cp>Hechos que el \u003ca class=\"x\" data-slug=\"agent\" href=\"?term=agent\">agente\u003c/a> puede leer directo del \u003ca class=\"x\" data-slug=\"context\" href=\"?term=context\">contexto\u003c/a> ahora mismo: la tarea del usuario, archivos que el agente ya leyó, \u003ca class=\"x\" data-slug=\"tool-result\" href=\"?term=tool-result\">tool results\u003c/a>, el contenido de \u003ca class=\"x\" data-slug=\"agentsmd\" href=\"?term=agentsmd\">AGENTS.md\u003c/a> cargado al inicio de la \u003ca class=\"x\" data-slug=\"session\" href=\"?term=session\">sesión\u003c/a>. Contraparte del \u003ca class=\"x\" data-slug=\"parametric-knowledge\" href=\"?term=parametric-knowledge\">conocimiento paramétrico\u003c/a>: lo paramétrico se \u003cem>recuerda\u003c/em> desde los parámetros, lo contextual se \u003cem>lee\u003c/em> desde la \u003ca class=\"x\" data-slug=\"context-window\" href=\"?term=context-window\">ventana\u003c/a>. Las \u003ca class=\"x\" data-slug=\"hallucination\" href=\"?term=hallucination\">alucinaciones\u003c/a> son mucho menos frecuentes cuando el agente trabaja con conocimiento contextual: la respuesta está justo delante de él, no rescatada de una memoria borrosa.\u003c/p>\n\u003cp>De los dos tipos de conocimiento, solo el contextual está bajo tu control. Los parámetros están congelados, así que la única forma de darle al \u003ca class=\"x\" data-slug=\"model\" href=\"?term=model\">modelo\u003c/a> un conocimiento que le falta (un SDK interno, una librería lanzada después de la \u003ca class=\"x\" data-slug=\"knowledge-cutoff\" href=\"?term=knowledge-cutoff\">fecha de corte del conocimiento\u003c/a>, una decisión tomada ayer) es ponerlo en el contexto. Buena parte del trabajo práctico de \u003ca class=\"x\" data-slug=\"ai\" href=\"?term=ai\">programar con IA\u003c/a> se reduce a esto: poner los hechos correctos delante del modelo justo cuando los necesita.\u003c/p>\n\u003cp>Cuando el conocimiento contextual y el paramétrico entran en conflicto, suele ganar el contextual. Pega la documentación actual de la API y el modelo la sigue en vez de su memoria desactualizada de la API vieja, aunque la versión antigua igual puede filtrarse, sobre todo bien entrada una sesión larga. Si el agente insiste en volver a un patrón obsoleto a pesar de tener la documentación cargada, eso es el conocimiento paramétrico filtrándose por encima del contextual; ayuda repetir la corrección o acercarla al punto donde se está trabajando.\u003c/p>\n\u003cp>A diferencia del conocimiento paramétrico, el contextual cuesta algo usarlo. Todo lo que se carga en la ventana gasta \u003ca class=\"x\" data-slug=\"token\" href=\"?term=token\">tokens\u003c/a> y compite por el \u003ca class=\"x\" data-slug=\"attention-budget\" href=\"?term=attention-budget\">attention budget\u003c/a> del modelo, así que cargar más no es automáticamente mejor: el objetivo es tener los hechos relevantes en la ventana, no todos los hechos.\u003c/p>\n\u003cp>\u003cem>Recurre a este término\u003c/em> solo cuando lo contrastes con lo paramétrico; en cualquier otro caso di simplemente \u003cstrong>contexto\u003c/strong>.\u003c/p>\n\u003cdiv class=\"block avoid\">\u003cp class=\"lbl\">Evita\u003c/p>\u003cp>&quot;memoria de trabajo&quot;. El conocimiento contextual es lo que está en la ventana \u003cem>ahora\u003c/em>; un \u003ca class=\"x\" data-slug=\"memory-system\" href=\"?term=memory-system\">sistema de memoria\u003c/a> es lo que trae contenido de otras sesiones hasta esa ventana. Son escalas distintas, no las mezcles.\u003c/p>\u003c/div>\n\u003cdiv class=\"block\">\u003cp class=\"lbl\">Uso\u003c/p>\n\u003cp>&quot;¿Por qué acierta la API cuando le pego la documentación y la fabrica cuando no?&quot;\u003c/p>\n\u003cp>&quot;Con la documentación adentro, es conocimiento contextual: está leyendo directo de la página. Sin ella, es paramétrico y los endpoints poco frecuentes se desdibujan.&quot;\u003c/p>\n\n\u003c/div>","texto":"Hechos que el agente puede leer directo del contexto ahora mismo. Contraparte del conocimiento paramétrico. Hechos que el agente puede leer directo del contexto ahora mismo: la tarea del usuario, archivos que el agente ya leyó, tool results , el contenido de AGENTS.md cargado al inicio de la sesión . Contraparte del conocimiento paramétrico : lo paramétrico se recuerda desde los parámetros, lo contextual se lee desde la ventana . Las alucinaciones son mucho menos frecuentes cuando el agente trabaja con conocimiento contextual: la respuesta está justo delante de él, no rescatada de una memoria borrosa. De los dos tipos de conocimiento, solo el contextual está bajo tu control. Los parámetros están congelados, así que la única forma de darle al modelo un conocimiento que le falta (un SDK interno, una librería lanzada después de la fecha de corte del conocimiento , una decisión tomada ayer) es ponerlo en el contexto. Buena parte del trabajo práctico de programar con IA se reduce a esto: poner los hechos correctos delante del modelo justo cuando los necesita. Cuando el conocimiento contextual y el paramétrico entran en conflicto, suele ganar el contextual. Pega la documentación actual de la API y el modelo la sigue en vez de su memoria desactualizada de la API vieja, aunque la versión antigua igual puede filtrarse, sobre todo bien entrada una sesión larga. Si el agente insiste en volver a un patrón obsoleto a pesar de tener la documentación cargada, eso es el conocimiento paramétrico filtrándose por encima del contextual; ayuda repetir la corrección o acercarla al punto donde se está trabajando. A diferencia del conocimiento paramétrico, el contextual cuesta algo usarlo. Todo lo que se carga en la ventana gasta tokens y compite por el attention budget del modelo, así que cargar más no es automáticamente mejor: el objetivo es tener los hechos relevantes en la ventana, no todos los hechos. Recurre a este término solo cuando lo contrastes con lo paramétrico; en cualquier otro caso di simplemente contexto . Evita memoria de trabajo . El conocimiento contextual es lo que está en la ventana ahora ; un sistema de memoria es lo que trae contenido de otras sesiones hasta esa ventana. Son escalas distintas, no las mezcles. Uso ¿Por qué acierta la API cuando le pego la documentación y la fabrica cuando no? Con la documentación adentro, es conocimiento contextual: está leyendo directo de la página. Sin ella, es paramétrico y los endpoints poco frecuentes se desdibujan.","salientes":["agent","context","tool-result","agentsmd","session","parametric-knowledge","context-window","hallucination","model","knowledge-cutoff","ai","token","attention-budget","memory-system"],"entrantes":3},{"termino":"Attention relationship","slug":"attention-relationship","seccion":"Sección 4 — Modos de falla","descripcion":"El vínculo entre dos tokens: los pares con sentido se influyen más que los que no lo tienen. Un contexto de N tokens tiene ~N² de estos.","html":"\u003cp>Al predecir cada \u003ca class=\"x\" data-slug=\"token\" href=\"?term=token\">token\u003c/a>, el \u003ca class=\"x\" data-slug=\"model\" href=\"?term=model\">modelo\u003c/a> toma en cuenta todos los demás tokens del \u003ca class=\"x\" data-slug=\"context\" href=\"?term=context\">contexto\u003c/a>: a algunos les da mucho peso, a otros casi ninguno. El vínculo entre dos tokens es una \u003cstrong>attention relationship\u003c/strong>, y los pares con sentido (&quot;her&quot; con &quot;Sarah&quot;, o una llamada a \u003ccode>getUser()\u003c/code> con su definición \u003ccode>function getUser\u003c/code>) se influyen más entre sí que los que no tienen relación. Un contexto de N tokens tiene del orden de N² de estas relaciones.\u003c/p>\n\u003cp>En esos vínculos vive la comprensión aparente del modelo. Cuando resuelve un pronombre, es porque la attention relationship entre &quot;her&quot; y &quot;Sarah&quot; es fuerte. Cuando llama a una función con los argumentos correctos, es la relación entre el punto de llamada y la definición que leyó antes la que hace el trabajo. Nada de esto se busca en una tabla: se calcula de nuevo en cada \u003ca class=\"x\" data-slug=\"model-provider-request\" href=\"?term=model-provider-request\">petición al proveedor del modelo\u003c/a>, para cada par.\u003c/p>\n\u003cp>Vale la pena detenerse en la cifra N², porque crece más rápido de lo que la intuición sugiere:\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Tamaño del contexto\u003c/th>\n\u003cth>Pares (~N²)\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1.000 tokens\u003c/td>\n\u003ctd>~1 millón\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>10.000 tokens\u003c/td>\n\u003ctd>~100 millones\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>100.000 tokens\u003c/td>\n\u003ctd>~10.000 millones\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Cada vínculo, además, se calcula más de una vez. Los modelos tienen varias cabezas de atención (las cifras exactas de los modelos de punta no son públicas, pero cincuenta a cien es una estimación razonable) y cada cabeza calcula su propia versión de cada relación. Así que cada par de la tabla de arriba se duplica en cada cabeza. Son muchísimos pares.\u003c/p>\n\u003cp>Solo una fracción pequeña de estas relaciones importa para una tarea dada. El vínculo entre tu instrucción y el código que gobierna es uno de los pocos que cuentan; casi todo el resto de la masa es ruido. Y los dos crecen a ritmos distintos: las relaciones que importan se mantienen más o menos constantes, mientras que la masa total crece de forma cuadrática con el tamaño del contexto. Con 1.000 tokens, el par que te interesa es uno en un millón; con 100.000 tokens, es uno en diez mil millones. Esta es la aritmética detrás del \u003ca class=\"x\" data-slug=\"attention-budget\" href=\"?term=attention-budget\">attention budget\u003c/a>, y la \u003ca class=\"x\" data-slug=\"attention-degradation\" href=\"?term=attention-degradation\">attention degradation\u003c/a> es lo que se siente cuando las relaciones que importan se quedan con una porción demasiado delgada.\u003c/p>\n\u003cdiv class=\"block\">\u003cp class=\"lbl\">Uso\u003c/p>\n\u003cp>&quot;Sigue confundiendo los dos símbolos \u003ccode>user\u003c/code> en el diff. Suena a que estamos en la \u003ca class=\"x\" data-slug=\"smart-zone\" href=\"?term=smart-zone\">dumb zone\u003c/a>.&quot;\u003c/p>\n\u003cp>&quot;Sí, la attention relationship entre cada punto de llamada y su declaración está peleando con la otra: misma forma de token, distinto vínculo. Renombra uno y los pares se afilan.&quot;\u003c/p>\n\n\u003c/div>","texto":"El vínculo entre dos tokens: los pares con sentido se influyen más que los que no lo tienen. Un contexto de N tokens tiene ~N² de estos. Al predecir cada token , el modelo toma en cuenta todos los demás tokens del contexto : a algunos les da mucho peso, a otros casi ninguno. El vínculo entre dos tokens es una attention relationship , y los pares con sentido ( her con Sarah , o una llamada a getUser() con su definición function getUser ) se influyen más entre sí que los que no tienen relación. Un contexto de N tokens tiene del orden de N² de estas relaciones. En esos vínculos vive la comprensión aparente del modelo. Cuando resuelve un pronombre, es porque la attention relationship entre her y Sarah es fuerte. Cuando llama a una función con los argumentos correctos, es la relación entre el punto de llamada y la definición que leyó antes la que hace el trabajo. Nada de esto se busca en una tabla: se calcula de nuevo en cada petición al proveedor del modelo , para cada par. Vale la pena detenerse en la cifra N², porque crece más rápido de lo que la intuición sugiere: Tamaño del contexto Pares (~N²) 1.000 tokens ~1 millón 10.000 tokens ~100 millones 100.000 tokens ~10.000 millones Cada vínculo, además, se calcula más de una vez. Los modelos tienen varias cabezas de atención (las cifras exactas de los modelos de punta no son públicas, pero cincuenta a cien es una estimación razonable) y cada cabeza calcula su propia versión de cada relación. Así que cada par de la tabla de arriba se duplica en cada cabeza. Son muchísimos pares. Solo una fracción pequeña de estas relaciones importa para una tarea dada. El vínculo entre tu instrucción y el código que gobierna es uno de los pocos que cuentan; casi todo el resto de la masa es ruido. Y los dos crecen a ritmos distintos: las relaciones que importan se mantienen más o menos constantes, mientras que la masa total crece de forma cuadrática con el tamaño del contexto. Con 1.000 tokens, el par que te interesa es uno en un millón; con 100.000 tokens, es uno en diez mil millones. Esta es la aritmética detrás del attention budget , y la attention degradation es lo que se siente cuando las relaciones que importan se quedan con una porción demasiado delgada. Uso Sigue confundiendo los dos símbolos user en el diff. Suena a que estamos en la dumb zone . Sí, la attention relationship entre cada punto de llamada y su declaración está peleando con la otra: misma forma de token, distinto vínculo. Renombra uno y los pares se afilan.","salientes":["token","model","context","model-provider-request","attention-budget","attention-degradation","smart-zone"],"entrantes":2},{"termino":"Attention budget","slug":"attention-budget","seccion":"Sección 4 — Modos de falla","descripcion":"Cada token reparte una cantidad fija de influencia sobre el resto del contexto. Es por token: no crece cuando el contexto crece.","html":"\u003cp>Cada \u003ca class=\"x\" data-slug=\"token\" href=\"?term=token\">token\u003c/a> tiene una cantidad finita de influencia para repartir sobre el resto del \u003ca class=\"x\" data-slug=\"context\" href=\"?term=context\">contexto\u003c/a>. Si le da mucho peso a \u003ca class=\"x\" data-slug=\"attention-relationship\" href=\"?term=attention-relationship\">una relación\u003c/a>, le queda menos para las demás. El presupuesto es por token y no crece cuando el contexto crece, y por eso las \u003ca class=\"x\" data-slug=\"session\" href=\"?term=session\">sesiones\u003c/a> largas se diluyen.\u003c/p>\n\u003cp>Piénsalo como señal y ruido. Tu instrucción es una señal a volumen fijo; cada otro token de la \u003ca class=\"x\" data-slug=\"context-window\" href=\"?term=context-window\">ventana de contexto\u003c/a> es un sonido que compite. La instrucción nunca baja de volumen (sigue ahí, carácter por carácter), pero a medida que el contexto crece, la sala se pone más ruidosa alrededor de ella, y la relación señal-ruido cae. Una instrucción que era lo más fuerte con 10 mil tokens de contexto es apenas un murmullo de fondo con 150 mil. Este es el mecanismo detrás de la \u003ca class=\"x\" data-slug=\"attention-degradation\" href=\"?term=attention-degradation\">attention degradation\u003c/a>: el modelo no olvida, la señal se pierde en el ruido.\u003c/p>\n\u003cp>El síntoma se lee como desobediencia: el agente aceptó una restricción al principio y después se aleja de ella, y volver a pegarla ayuda solo un rato. La causa no es la instrucción, es todo lo demás en la ventana compitiendo con ella.\u003c/p>\n\u003cp>Lo que sí controlas es qué entra al contexto. El contenido que no sirve para la tarea no es neutro: es ruido sobre todo lo que sí sirve. Mantén la ventana chica, \u003ca class=\"x\" data-slug=\"clearing\" href=\"?term=clearing\">limpia\u003c/a> cuando el contexto acumulado deje de justificar su costo, y repite las restricciones que importan en vez de confiar en que su mención inicial se sostenga sola.\u003c/p>\n\u003cdiv class=\"block\">\u003cp class=\"lbl\">Uso\u003c/p>\n\u003cp>&quot;¿Por qué sigue ignorando el schema que pegué al principio?&quot;\u003c/p>\n\u003cp>&quot;Ya estamos bien metidos en la \u003ca class=\"x\" data-slug=\"smart-zone\" href=\"?term=smart-zone\">dumb zone\u003c/a>: el attention budget de cada token es fijo, pero el contexto siguió creciendo. La señal sobre el schema ahora compite con miles de tokens más nuevos.&quot;\u003c/p>\n\n\u003c/div>","texto":"Cada token reparte una cantidad fija de influencia sobre el resto del contexto. Es por token: no crece cuando el contexto crece. Cada token tiene una cantidad finita de influencia para repartir sobre el resto del contexto . Si le da mucho peso a una relación , le queda menos para las demás. El presupuesto es por token y no crece cuando el contexto crece, y por eso las sesiones largas se diluyen. Piénsalo como señal y ruido. Tu instrucción es una señal a volumen fijo; cada otro token de la ventana de contexto es un sonido que compite. La instrucción nunca baja de volumen (sigue ahí, carácter por carácter), pero a medida que el contexto crece, la sala se pone más ruidosa alrededor de ella, y la relación señal-ruido cae. Una instrucción que era lo más fuerte con 10 mil tokens de contexto es apenas un murmullo de fondo con 150 mil. Este es el mecanismo detrás de la attention degradation : el modelo no olvida, la señal se pierde en el ruido. El síntoma se lee como desobediencia: el agente aceptó una restricción al principio y después se aleja de ella, y volver a pegarla ayuda solo un rato. La causa no es la instrucción, es todo lo demás en la ventana compitiendo con ella. Lo que sí controlas es qué entra al contexto. El contenido que no sirve para la tarea no es neutro: es ruido sobre todo lo que sí sirve. Mantén la ventana chica, limpia cuando el contexto acumulado deje de justificar su costo, y repite las restricciones que importan en vez de confiar en que su mención inicial se sostenga sola. Uso ¿Por qué sigue ignorando el schema que pegué al principio? Ya estamos bien metidos en la dumb zone : el attention budget de cada token es fijo, pero el contexto siguió creciendo. La señal sobre el schema ahora compite con miles de tokens más nuevos.","salientes":["token","context","attention-relationship","session","context-window","attention-degradation","clearing","smart-zone"],"entrantes":7},{"termino":"Attention degradation","slug":"attention-degradation","seccion":"Sección 4 — Modos de falla","descripcion":"Cuando una sesión crece, el attention budget de cada token se reparte entre más competidores y la señal sobre lo que importa se achica.","html":"\u003cp>A medida que una \u003ca class=\"x\" data-slug=\"session\" href=\"?term=session\">sesión\u003c/a> crece, cada \u003ca class=\"x\" data-slug=\"token\" href=\"?term=token\">token\u003c/a> reparte su \u003ca class=\"x\" data-slug=\"attention-budget\" href=\"?term=attention-budget\">attention budget\u003c/a> entre más competidores. La señal sobre cualquier \u003ca class=\"x\" data-slug=\"attention-relationship\" href=\"?term=attention-relationship\">relación con sentido\u003c/a> se achica; el ruido del \u003ca class=\"x\" data-slug=\"context\" href=\"?term=context\">contexto\u003c/a> irrelevante se mete de por medio. Mismo \u003ca class=\"x\" data-slug=\"model\" href=\"?term=model\">modelo\u003c/a>, mismos \u003ca class=\"x\" data-slug=\"parameters\" href=\"?term=parameters\">parámetros\u003c/a>: solo hay más bocas comiendo del mismo plato. Es la causa del efecto \u003ca class=\"x\" data-slug=\"smart-zone\" href=\"?term=smart-zone\">smart zone / dumb zone\u003c/a>.\u003c/p>\n\u003cp>Se presenta como el modelo empeorando a mitad de sesión: restricciones que siguió durante una hora empiezan a fallar, vuelve a preguntar cosas que ya se le dijeron, escribe código que ignora un archivo que leyó antes. No cambió nada en el modelo; la única variable es cuánto contexto está atendiendo ahora.\u003c/p>\n\u003cp>Es gradual, y por eso es difícil detectarlo desde dentro de la sesión. No hay error ni umbral: cada \u003ca class=\"x\" data-slug=\"turn\" href=\"?term=turn\">turno\u003c/a> es apenas un poco peor que el anterior, y para cuando los tropiezos son evidentes ya llevas un buen rato en la dumb zone.\u003c/p>\n\u003cp>Se recupera quitando contexto, no agregando más. Volver a pegar la instrucción ignorada solo suma otro competidor a la misma ventana saturada, y ayuda apenas un rato. Lo que funciona: \u003ca class=\"x\" data-slug=\"clearing\" href=\"?term=clearing\">limpiar\u003c/a> y recargar solo lo que la tarea necesita, \u003ca class=\"x\" data-slug=\"compaction\" href=\"?term=compaction\">compactar\u003c/a>, o hacer un \u003ca class=\"x\" data-slug=\"handoff\" href=\"?term=handoff\">handoff\u003c/a> a una sesión nueva. Trata la caída en el seguimiento de instrucciones como una señal sobre el largo del contexto, no sobre el modelo.\u003c/p>\n\u003cdiv class=\"block\">\u003cp class=\"lbl\">Uso\u003c/p>\n\u003cp>&quot;Está metido en la dumb zone: inventa genéricos que no están en el archivo de tipos.&quot;\u003c/p>\n\u003cp>&quot;Attention degradation. Las definiciones de tipos siguen en el contexto, pero la señal sobre ellas está enterrada bajo todo lo que agregamos desde entonces. Limpia y recarga.&quot;\u003c/p>\n\n\u003c/div>","texto":"Cuando una sesión crece, el attention budget de cada token se reparte entre más competidores y la señal sobre lo que importa se achica. A medida que una sesión crece, cada token reparte su attention budget entre más competidores. La señal sobre cualquier relación con sentido se achica; el ruido del contexto irrelevante se mete de por medio. Mismo modelo , mismos parámetros : solo hay más bocas comiendo del mismo plato. Es la causa del efecto smart zone / dumb zone . Se presenta como el modelo empeorando a mitad de sesión: restricciones que siguió durante una hora empiezan a fallar, vuelve a preguntar cosas que ya se le dijeron, escribe código que ignora un archivo que leyó antes. No cambió nada en el modelo; la única variable es cuánto contexto está atendiendo ahora. Es gradual, y por eso es difícil detectarlo desde dentro de la sesión. No hay error ni umbral: cada turno es apenas un poco peor que el anterior, y para cuando los tropiezos son evidentes ya llevas un buen rato en la dumb zone. Se recupera quitando contexto, no agregando más. Volver a pegar la instrucción ignorada solo suma otro competidor a la misma ventana saturada, y ayuda apenas un rato. Lo que funciona: limpiar y recargar solo lo que la tarea necesita, compactar , o hacer un handoff a una sesión nueva. Trata la caída en el seguimiento de instrucciones como una señal sobre el largo del contexto, no sobre el modelo. Uso Está metido en la dumb zone: inventa genéricos que no están en el archivo de tipos. Attention degradation. Las definiciones de tipos siguen en el contexto, pero la señal sobre ellas está enterrada bajo todo lo que agregamos desde entonces. Limpia y recarga.","salientes":["session","token","attention-budget","attention-relationship","context","model","parameters","smart-zone","turn","clearing","compaction","handoff"],"entrantes":5},{"termino":"Smart zone","slug":"smart-zone","seccion":"Sección 4 — Modos de falla","descripcion":"Al inicio de una sesión el agente está agudo y enfocado. Al crecer deriva a una dumb zone: más descuidado, olvidadizo, con más errores.","html":"\u003cp>Al inicio de una \u003ca class=\"x\" data-slug=\"session\" href=\"?term=session\">sesión\u003c/a>, el \u003ca class=\"x\" data-slug=\"agent\" href=\"?term=agent\">agente\u003c/a> está en una &quot;smart zone&quot;: agudo, enfocado, con buena capacidad de recordar. A medida que la sesión crece, deriva hacia una &quot;dumb zone&quot;: más descuidado, olvidadizo, con más errores, y más \u003ca class=\"x\" data-slug=\"hallucination\" href=\"?term=hallucination\">alucinaciones\u003c/a> de fidelidad. Mismo \u003ca class=\"x\" data-slug=\"model\" href=\"?term=model\">modelo\u003c/a>, mismo \u003ca class=\"x\" data-slug=\"harness\" href=\"?term=harness\">harness\u003c/a>: solo hay más \u003ca class=\"x\" data-slug=\"context\" href=\"?term=context\">contexto\u003c/a>. Es el efecto que se siente de la \u003ca class=\"x\" data-slug=\"attention-degradation\" href=\"?term=attention-degradation\">attention degradation\u003c/a>. En los modelos de punta, la dumb zone suele empezar alre
