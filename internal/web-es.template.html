<title>Diccionario de AI Coding</title>
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap"
/>
<style>
  :root {
    --ground: #f7f8f8;
    --surface: #ffffff;
    --surface-sunk: #eef1f1;
    --ink: #1b2327;
    --ink-soft: #5a686e;
    --ink-faint: #8d9a9f;
    --line: #dfe4e5;
    --line-soft: #ebeeee;
    --accent: #38484e;
    --mark: #c12637;
    --hit: #fbe6c9;
    --nodo: #7d8f97;
    --nodo-tenue: #d3dadc;

    --sans: "IBM Plex Sans", -apple-system, "Segoe UI", system-ui, sans-serif;
    --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
    --mono: "IBM Plex Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #14191c;
      --surface: #1b2226;
      --surface-sunk: #101517;
      --ink: #e6ebec;
      --ink-soft: #a3b0b5;
      --ink-faint: #74838a;
      --line: #2c363b;
      --line-soft: #232c30;
      --accent: #8fa8b2;
      --mark: #e4586a;
      --hit: #4a3a1c;
      --nodo: #7c9099;
      --nodo-tenue: #2b3639;
    }
  }

  :root[data-theme="dark"] {
    --ground: #14191c;
    --surface: #1b2226;
    --surface-sunk: #101517;
    --ink: #e6ebec;
    --ink-soft: #a3b0b5;
    --ink-faint: #74838a;
    --line: #2c363b;
    --line-soft: #232c30;
    --accent: #8fa8b2;
    --mark: #e4586a;
    --hit: #4a3a1c;
    --nodo: #7c9099;
    --nodo-tenue: #2b3639;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- barra superior ---------- */

  .top {
    display: flex;
    align-items: center;
    gap: 18px;
    height: 56px;
    padding: 0 18px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    z-index: 5;
  }

  .top .name {
    display: flex;
    align-items: baseline;
    gap: 9px;
    flex: none;
  }
  .top .name b {
    font-size: 14.5px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .top .name span {
    font-size: 11.5px;
    color: var(--ink-faint);
    font-variant-numeric: tabular-nums;
  }

  .find {
    position: relative;
    flex: 1;
    max-width: 420px;
  }
  .find input {
    width: 100%;
    font: inherit;
    font-size: 14px;
    color: var(--ink);
    background: var(--surface-sunk);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 7px 34px 7px 30px;
  }
  .find input::placeholder {
    color: var(--ink-faint);
  }
  .find input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  .find svg {
    position: absolute;
    left: 9px;
    top: 8px;
    width: 14px;
    height: 14px;
    color: var(--ink-faint);
    pointer-events: none;
  }
  .find .tally {
    position: absolute;
    right: 10px;
    top: 8px;
    font-size: 11px;
    color: var(--ink-faint);
    font-variant-numeric: tabular-nums;
    pointer-events: none;
  }

  .views {
    display: flex;
    gap: 2px;
    background: var(--surface-sunk);
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 2px;
    margin-left: auto;
    flex: none;
  }
  .views button {
    font: inherit;
    font-size: 12.5px;
    color: var(--ink-soft);
    background: none;
    border: 0;
    border-radius: 5px;
    padding: 4px 12px;
    cursor: pointer;
  }
  .views button[aria-pressed="true"] {
    background: var(--surface);
    color: var(--ink);
    font-weight: 500;
  }
  .views button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  /* ---------- armazon ---------- */

  .app {
    display: grid;
    grid-template-columns: 292px minmax(0, 1fr);
    height: calc(100vh - 56px);
  }

  .graph {
    display: none;
    position: relative;
    min-width: 0;
    background: var(--ground);
  }
  .graph canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  .graph .pista {
    position: absolute;
    left: 20px;
    bottom: 16px;
    margin: 0;
    font-size: 11.5px;
    color: var(--ink-faint);
    pointer-events: none;
  }

  body[data-vista="mapa"] .app {
    grid-template-columns: minmax(0, 1fr) 468px;
  }
  body[data-vista="mapa"] .side {
    display: none;
  }
  body[data-vista="mapa"] .graph {
    display: block;
  }
  body[data-vista="mapa"] .main {
    border-left: 1px solid var(--line);
    background: var(--surface);
    padding: 0 30px 60px;
  }
  body[data-vista="mapa"] .entry,
  body[data-vista="mapa"] .home {
    max-width: none;
    padding-top: 30px;
  }
  body[data-vista="mapa"] .entry > h2 {
    font-size: 30px;
  }
  body[data-vista="mapa"] .block {
    background: var(--surface-sunk);
  }
  body[data-vista="mapa"] .secs .top2 {
    display: none;
  }
  body[data-vista="mapa"] .secs > div {
    padding: 11px 14px;
  }

  .side {
    background: var(--surface);
    border-right: 1px solid var(--line);
    overflow-y: auto;
    padding: 10px 12px 28px;
  }

  .main {
    overflow-y: auto;
    padding: 0 40px 96px;
    min-width: 0;
  }

  /* ---------- lista ---------- */

  .grp {
    margin-bottom: 14px;
  }
  .grp > h2 {
    margin: 0;
    padding: 8px 8px 6px;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }
  .side button {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
    width: 100%;
    text-align: left;
    font: inherit;
    font-size: 13.5px;
    color: var(--ink-soft);
    background: none;
    border: 0;
    border-left: 2px solid transparent;
    border-radius: 0 5px 5px 0;
    padding: 5px 8px;
    cursor: pointer;
  }
  .side button:hover {
    background: var(--surface-sunk);
    color: var(--ink);
  }
  .side button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: -2px;
  }
  .side button[aria-current="true"] {
    background: var(--surface-sunk);
    border-left-color: var(--mark);
    color: var(--ink);
    font-weight: 500;
  }
  .side button .n {
    font-size: 10.5px;
    color: var(--ink-faint);
    font-variant-numeric: tabular-nums;
    flex: none;
  }
  .empty {
    padding: 10px 8px;
    font-size: 13px;
    color: var(--ink-faint);
  }

  /* ---------- lectura ---------- */

  .entry {
    max-width: 68ch;
    margin-inline: auto;
    padding-top: 44px;
  }

  .eyebrow {
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin: 0 0 8px;
  }

  .entry > h2 {
    font-size: 34px;
    line-height: 1.12;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin: 0;
    text-wrap: balance;
  }

  .lede {
    font-family: var(--serif);
    font-size: 17px;
    line-height: 1.5;
    color: var(--ink-soft);
    margin: 10px 0 0;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--line);
  }

  .body {
    font-family: var(--serif);
    font-size: 16.5px;
    line-height: 1.62;
  }
  .body p {
    margin: 18px 0;
  }
  .body strong {
    font-weight: 600;
  }
  .body code {
    font-family: var(--mono);
    font-size: 0.86em;
    background: var(--surface-sunk);
    border: 1px solid var(--line-soft);
    border-radius: 4px;
    padding: 1px 4px;
  }

  .body .tw {
    overflow-x: auto;
    margin: 22px 0;
  }
  .body table {
    border-collapse: collapse;
    font-family: var(--sans);
    font-size: 13.5px;
    width: 100%;
  }
  .body th,
  .body td {
    text-align: left;
    vertical-align: top;
    padding: 8px 14px 8px 0;
    border-bottom: 1px solid var(--line-soft);
  }
  .body th {
    font-weight: 600;
    color: var(--ink-faint);
    font-size: 11px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    border-bottom-color: var(--line);
  }

  a.x {
    color: var(--ink);
    text-decoration: underline;
    text-decoration-color: var(--line);
    text-underline-offset: 3px;
    text-decoration-thickness: 1.5px;
    cursor: pointer;
  }
  a.x:hover {
    text-decoration-color: var(--accent);
  }
  a.x:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 2px;
  }

  .block {
    margin: 24px 0;
    padding: 16px 18px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
  }
  .block > .lbl {
    font-family: var(--sans);
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin: 0 0 8px;
  }
  .block p {
    margin: 8px 0;
  }
  .block p:last-child {
    margin-bottom: 0;
  }
  .avoid {
    font-family: var(--serif);
  }
  .avoid > .lbl {
    color: var(--mark);
  }

  .also {
    margin-top: 34px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
  }
  .also h3 {
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin: 0 0 10px;
  }
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .chips button {
    font: inherit;
    font-size: 12.5px;
    color: var(--ink-soft);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 3px 11px;
    cursor: pointer;
  }
  .chips button:hover {
    border-color: var(--accent);
    color: var(--ink);
  }
  .chips button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  /* ---------- portada ---------- */

  .home {
    max-width: 72ch;
    margin-inline: auto;
    padding-top: 44px;
  }
  .home > h2 {
    font-size: 30px;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin: 0 0 10px;
    text-wrap: balance;
  }
  .home > p {
    font-family: var(--serif);
    font-size: 16.5px;
    line-height: 1.6;
    color: var(--ink-soft);
    margin: 0 0 8px;
    max-width: 62ch;
  }
  .home .keys {
    font-family: var(--sans);
    font-size: 13px;
    color: var(--ink-faint);
    margin-top: 18px;
  }
  kbd {
    font-family: var(--mono);
    font-size: 11.5px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-bottom-width: 2px;
    border-radius: 4px;
    padding: 1px 5px;
    color: var(--ink-soft);
  }
  .secs {
    display: grid;
    gap: 1px;
    background: var(--line-soft);
    border: 1px solid var(--line-soft);
    border-radius: 8px;
    overflow: hidden;
    margin-top: 26px;
  }
  .secs > div {
    background: var(--surface);
    padding: 13px 16px;
    display: flex;
    align-items: baseline;
    gap: 12px;
  }
  .secs .t {
    font-size: 13.5px;
    font-weight: 500;
    flex: 1;
  }
  .secs .c {
    font-size: 11.5px;
    color: var(--ink-faint);
    font-variant-numeric: tabular-nums;
  }
  .secs .top2 {
    font-size: 12px;
    color: var(--ink-faint);
  }

  .foot {
    max-width: 68ch;
    margin-top: 56px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    font-size: 11.5px;
    line-height: 1.6;
    color: var(--ink-faint);
  }
  .foot a {
    color: var(--ink-soft);
  }

  mark {
    background: var(--hit);
    color: inherit;
    border-radius: 2px;
  }

  .movil {
    display: none;
    font: inherit;
    font-size: 12.5px;
    color: var(--ink);
    background: var(--surface-sunk);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 5px 11px;
    cursor: pointer;
    flex: none;
  }

  /* ---------- angosto ---------- */

  @media (max-width: 900px) {
    .app,
    body[data-vista="mapa"] .app {
      grid-template-columns: 1fr;
    }
    .views {
      display: none;
    }
    body[data-vista="mapa"] .graph {
      display: none;
    }
    body[data-vista="mapa"] .main {
      border-left: 0;
      background: transparent;
      padding: 0 20px 80px;
    }
    .side {
      display: none;
    }
    body.abierto .side {
      display: block;
      position: fixed;
      inset: 56px 0 0;
      z-index: 4;
    }
    .top .name span {
      display: none;
    }
    .movil {
      display: inline-flex;
    }
    .main {
      padding: 0 20px 80px;
    }
    .entry,
    .home {
      padding-top: 26px;
    }
    .entry > h2 {
      font-size: 27px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    * {
      animation: none !important;
      transition: none !important;
    }
  }
</style>

<header class="top">
  <div class="name"><b>Diccionario de AI Coding</b><span id="sub"></span></div>
  <div class="find">
    <svg
      viewBox="0 0 16 16"
      fill="none"
      stroke="currentColor"
      stroke-width="1.6"
      aria-hidden="true"
    >
      <circle cx="7" cy="7" r="4.5"></circle>
      <path d="M10.5 10.5 14 14"></path>
    </svg>
    <input
      id="q"
      type="search"
      placeholder="Buscar término o definición"
      autocomplete="off"
      spellcheck="false"
      aria-label="Buscar"
    />
    <span class="tally" id="tally"></span>
  </div>
  <button class="movil" id="movil" type="button">Términos</button>
  <div class="views" role="group" aria-label="Vista">
    <button id="vLista" type="button" aria-pressed="true">Lista</button>
    <button id="vMapa" type="button" aria-pressed="false">Mapa</button>
  </div>
</header>

<div class="app">
  <div class="graph" id="graph">
    <canvas id="lienzo"></canvas>
    <p class="pista" id="pista"></p>
  </div>
  <aside class="side" id="side">
    <nav id="list" aria-label="Términos"></nav>
  </aside>
  <main class="main" id="main"></main>
</div>

<script>
  const DATOS = /*__DATOS__*/ null;

  const $ = (s) => document.querySelector(s);
  const list = $("#list"),
    main = $("#main"),
    q = $("#q"),
    tally = $("#tally");
  const lienzo = $("#lienzo"),
    ctx = lienzo.getContext("2d"),
    pista = $("#pista");

  const plano = (s) =>
    s
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .toLowerCase();

  DATOS.entradas.forEach((e, i) => {
    e.k = plano(e.termino + " " + e.texto);
    e.kt = plano(e.termino);
    e.i = i;
  });
  const porSlug = new Map(DATOS.entradas.map((e) => [e.slug, e]));

  let activo = null,
    filtradas = DATOS.entradas,
    marcado = -1,
    encima = -1;

  $("#sub").textContent =
    DATOS.entradas.length +
    " términos · " +
    DATOS.aristas.length +
    " conexiones";

  function esc(s) {
    return String(s).replace(
      /[&<>"]/g,
      (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]
    );
  }

  /* ---------- lista ---------- */

  function pintarLista() {
    const vis = new Set(filtradas.map((e) => e.slug));
    list.innerHTML = "";
    if (!filtradas.length) {
      const d = document.createElement("p");
      d.className = "empty";
      d.textContent =
        "Sin resultados. Prueba con otra palabra, o con el término en inglés.";
      list.appendChild(d);
      return;
    }
    DATOS.secciones.forEach((sec) => {
      const suyos = sec.terminos
        .map((t) => porSlug.get(t))
        .filter((e) => e && vis.has(e.slug));
      if (!suyos.length) return;
      const g = document.createElement("div");
      g.className = "grp";
      const h = document.createElement("h2");
      h.textContent = sec.titulo;
      g.appendChild(h);
      suyos.forEach((e) => {
        const b = document.createElement("button");
        b.type = "button";
        b.dataset.slug = e.slug;
        if (activo && e.slug === activo.slug)
          b.setAttribute("aria-current", "true");
        const n = document.createElement("span");
        n.textContent = e.termino;
        const c = document.createElement("span");
        c.className = "n";
        c.textContent = e.entrantes || "";
        c.title = e.entrantes + " entradas la referencian";
        b.append(n, c);
        b.addEventListener("click", () => abrir(e.slug, true));
        g.appendChild(b);
      });
      list.appendChild(g);
    });
  }

  function buscar() {
    const t = plano(q.value.trim());
    marcado = -1;
    if (!t) {
      filtradas = DATOS.entradas;
      tally.textContent = "";
    } else {
      filtradas = DATOS.entradas.filter((e) => e.k.includes(t));
      filtradas.sort(
        (a, b) => (b.kt.includes(t) ? 1 : 0) - (a.kt.includes(t) ? 1 : 0)
      );
      tally.textContent = String(filtradas.length);
    }
    pintarLista();
    dibujar();
  }

  /* ---------- lectura ---------- */

  function pie() {
    return '<p class="foot">Traducción al español de <a href="https://github.com/mattpocock/dictionary-of-ai-coding" target="_blank" rel="noopener">dictionary-of-ai-coding</a>, de Matt Pocock. Los términos técnicos se mantienen en inglés según el glosario de la edición. Uso interno.</p>';
  }

  function portada() {
    activo = null;
    document.title = "Diccionario de AI Coding";
    const top = [...DATOS.entradas]
      .sort((a, b) => b.entrantes - a.entrantes)
      .slice(0, 3)
      .map((e) => e.termino)
      .join(" · ");
    const filas = DATOS.secciones
      .map((s) => {
        const suyos = s.terminos.map((t) => porSlug.get(t)).filter(Boolean);
        const cab = [...suyos]
          .sort((a, b) => b.entrantes - a.entrantes)
          .slice(0, 3)
          .map((e) => e.termino)
          .join(" · ");
        return (
          '<div><span class="t">' +
          esc(s.titulo) +
          '</span><span class="top2">' +
          esc(cab) +
          '</span><span class="c">' +
          suyos.length +
          "</span></div>"
        );
      })
      .join("");
    main.innerHTML =
      '<div class="home"><h2>El vocabulario del AI coding, en español</h2>' +
      "<p>Los títulos se mantienen en inglés a propósito: es la palabra que vas a encontrar en la documentación y en tu harness, así que es la llave con la que vas a buscar. El buscador mira también el cuerpo de las definiciones, así que escribir <em>ventana</em> encuentra <em>Context window</em>.</p>" +
      "<p>Los términos más referenciados por el resto del diccionario son " +
      esc(top) +
      ". Buen lugar para partir, o abre el <b>Mapa</b> para ver con qué se conecta cada uno.</p>" +
      '<div class="secs">' +
      filas +
      "</div>" +
      '<p class="keys"><kbd>/</kbd> buscar · <kbd>↑</kbd><kbd>↓</kbd> recorrer · <kbd>Enter</kbd> abrir · <kbd>Esc</kbd> limpiar</p>' +
      pie() +
      "</div>";
    dibujar();
  }

  function abrir(slug, cerrar) {
    const e = porSlug.get(slug);
    if (!e) return portada();
    activo = e;
    document.title = e.termino + " · Diccionario de AI Coding";
    const chips = e.salientes.map((s) => porSlug.get(s)).filter(Boolean);
    main.innerHTML =
      '<article class="entry"><p class="eyebrow">' +
      esc(e.seccion) +
      "</p>" +
      "<h2>" +
      esc(e.termino) +
      "</h2>" +
      '<p class="lede">' +
      esc(e.descripcion) +
      "</p>" +
      '<div class="body">' +
      e.html +
      "</div>" +
      (chips.length
        ? '<div class="also"><h3>Conecta con</h3><div class="chips">' +
          chips
            .map(
              (c) =>
                '<button type="button" data-slug="' +
                esc(c.slug) +
                '">' +
                esc(c.termino) +
                "</button>"
            )
            .join("") +
          "</div></div>"
        : "") +
      pie() +
      "</article>";
    main.querySelectorAll("[data-slug]").forEach((el) =>
      el.addEventListener("click", (ev) => {
        ev.preventDefault();
        abrir(el.dataset.slug, true);
      })
    );
    const u = new URL(location.href);
    u.searchParams.set("term", slug);
    history.replaceState(null, "", u);
    pintarLista();
    main.scrollTop = 0;
    if (cerrar) document.body.classList.remove("abierto");
    dibujar();
  }

  /* ---------- mapa ---------- */

  const css = (n) =>
    getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  let T = { s: 1, ox: 0, oy: 0 };

  function radio(e) {
    return Math.min(15, 3.2 + Math.sqrt(e.entrantes) * 1.75);
  }

  function medir() {
    const r = lienzo.parentElement.getBoundingClientRect();
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    lienzo.width = Math.max(1, Math.round(r.width * dpr));
    lienzo.height = Math.max(1, Math.round(r.height * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const pad = 56;
    T.s = Math.max(10, Math.min(r.width - pad * 2, r.height - pad * 2));
    T.ox = (r.width - T.s) / 2;
    T.oy = (r.height - T.s) / 2;
  }

  const px = (e) => T.ox + e.x * T.s;
  const py = (e) => T.oy + e.y * T.s;

  function dibujar() {
    if (document.body.dataset.vista !== "mapa") return;
    const r = lienzo.parentElement.getBoundingClientRect();
    ctx.clearRect(0, 0, r.width, r.height);

    const hayBusqueda = q.value.trim().length > 0;
    const enBusqueda = new Set(filtradas.map((e) => e.i));
    const barrio = activo ? new Set([activo.i, ...activo.vecinos]) : null;

    const cLinea = css("--nodo-tenue");
    const cNodo = css("--nodo");
    const cInk = css("--ink");
    const cFaint = css("--ink-faint");
    const cMark = css("--mark");
    const sans = css("--sans");

    for (const [a, b] of DATOS.aristas) {
      const A = DATOS.entradas[a],
        B = DATOS.entradas[b];
      const viva = barrio ? barrio.has(a) && barrio.has(b) : false;
      ctx.beginPath();
      ctx.moveTo(px(A), py(A));
      ctx.lineTo(px(B), py(B));
      ctx.strokeStyle = viva ? cNodo : cLinea;
      ctx.globalAlpha = viva ? 0.9 : barrio ? 0.3 : 0.6;
      ctx.lineWidth = viva ? 1.3 : 0.8;
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    for (const e of DATOS.entradas) {
      const esActivo = activo && e.i === activo.i;
      const esVecino = barrio ? barrio.has(e.i) : false;
      const apagado =
        (barrio && !esVecino) || (hayBusqueda && !enBusqueda.has(e.i));
      ctx.beginPath();
      ctx.arc(px(e), py(e), radio(e) * (esActivo ? 1.3 : 1), 0, Math.PI * 2);
      ctx.fillStyle = esActivo ? cMark : apagado ? cLinea : cNodo;
      ctx.globalAlpha = apagado ? 0.45 : 1;
      ctx.fill();
      if (e.i === encima && !esActivo) {
        ctx.globalAlpha = 1;
        ctx.lineWidth = 2;
        ctx.strokeStyle = cInk;
        ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;

    const rotulados = barrio
      ? [...barrio].map((i) => DATOS.entradas[i])
      : hayBusqueda
        ? filtradas.slice(0, 14)
        : [...DATOS.entradas]
            .sort((a, b) => b.entrantes - a.entrantes)
            .slice(0, 14);
    if (encima >= 0) rotulados.push(DATOS.entradas[encima]);

    ctx.textAlign = "center";
    ctx.textBaseline = "bottom";
    for (const e of rotulados) {
      const esActivo = activo && e.i === activo.i;
      ctx.font = (esActivo ? "600 13px " : "400 11.5px ") + sans;
      ctx.fillStyle = esActivo ? cInk : cFaint;
      ctx.fillText(e.termino, px(e), py(e) - radio(e) - 5);
    }

    pista.textContent = activo
      ? activo.termino + " · " + activo.vecinos.length + " conexiones"
      : "Clic en un nodo. El tamaño es cuántas entradas lo referencian.";
  }

  function nodoEn(cx, cy) {
    let mejor = -1,
      mejorD = 16;
    for (const e of DATOS.entradas) {
      const d = Math.hypot(px(e) - cx, py(e) - cy) - radio(e);
      if (d < mejorD) {
        mejorD = d;
        mejor = e.i;
      }
    }
    return mejor;
  }

  lienzo.addEventListener("mousemove", (ev) => {
    const r = lienzo.getBoundingClientRect();
    const i = nodoEn(ev.clientX - r.left, ev.clientY - r.top);
    if (i !== encima) {
      encima = i;
      lienzo.style.cursor = i >= 0 ? "pointer" : "default";
      dibujar();
    }
  });
  lienzo.addEventListener("mouseleave", () => {
    if (encima !== -1) {
      encima = -1;
      dibujar();
    }
  });
  lienzo.addEventListener("click", (ev) => {
    const r = lienzo.getBoundingClientRect();
    const i = nodoEn(ev.clientX - r.left, ev.clientY - r.top);
    if (i >= 0) abrir(DATOS.entradas[i].slug, false);
  });

  /* ---------- vistas ---------- */

  function vista(v) {
    document.body.dataset.vista = v;
    $("#vLista").setAttribute("aria-pressed", String(v === "lista"));
    $("#vMapa").setAttribute("aria-pressed", String(v === "mapa"));
    const u = new URL(location.href);
    if (v === "mapa") u.searchParams.set("vista", "mapa");
    else u.searchParams.delete("vista");
    history.replaceState(null, "", u);
    if (v === "mapa") {
      medir();
      dibujar();
    }
  }

  $("#vLista").addEventListener("click", () => vista("lista"));
  $("#vMapa").addEventListener("click", () => vista("mapa"));
  $("#movil").addEventListener("click", () =>
    document.body.classList.toggle("abierto")
  );

  new ResizeObserver(() => {
    if (document.body.dataset.vista === "mapa") {
      medir();
      dibujar();
    }
  }).observe($("#graph"));
  matchMedia("(prefers-color-scheme: dark)").addEventListener(
    "change",
    dibujar
  );

  q.addEventListener("input", buscar);

  document.addEventListener("keydown", (ev) => {
    if (ev.key === "/" && document.activeElement !== q) {
      ev.preventDefault();
      q.focus();
      q.select();
      return;
    }
    if (ev.key === "Escape") {
      q.value = "";
      buscar();
      q.blur();
      return;
    }
    if (document.activeElement !== q) return;
    if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
      ev.preventDefault();
      if (!filtradas.length) return;
      marcado =
        ev.key === "ArrowDown"
          ? Math.min(marcado + 1, filtradas.length - 1)
          : Math.max(marcado - 1, 0);
      const b = list.querySelector(
        '[data-slug="' + CSS.escape(filtradas[marcado].slug) + '"]'
      );
      if (b) {
        b.focus();
        b.scrollIntoView({ block: "nearest" });
      }
    }
    if (ev.key === "Enter" && filtradas.length) {
      ev.preventDefault();
      abrir(filtradas[marcado >= 0 ? marcado : 0].slug, true);
    }
  });

  const par = new URLSearchParams(location.search);
  document.body.dataset.vista = "lista";
  buscar();
  const inicial = par.get("term");
  if (inicial && porSlug.has(inicial)) abrir(inicial, false);
  else portada();
  if (par.get("vista") === "mapa") vista("mapa");
</script>
